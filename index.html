ad" href="/assets/routes-DlnIFZee.js"><link rel="modulepreload" href="/assets/PostList-Drlf0OL8.js"><link rel="modulepreload" href="/assets/InlineMarkdown-DlegkRhL.js"><link rel="modulepreload" href="/assets/RenderHTML-DSRG-qOh.js"><link rel="modulepreload" href="/assets/PostCategories-DmRrosox.js"><link rel="modulepreload" href="/assets/PostTags-DKwO4KeQ.js"><link rel="modulepreload" href="/assets/format-DFJQmLUz.js"><template id="0010070c"><!--!$--><header _hk=0010070c00310001 class="pb-9 text-left"><a href="/" class="inline-block transition-opacity hover:opacity-80"><h1 class="text-3xl font-bold tracking-wide md:text-[2.1rem]">Zero Calorie Drink Shop</h1><p class="mt-2 text-sm tracking-[0.35em] text-ink-soft">零卡路里饮料店</p></a><p class="mt-6 text-sm text-ink-faint md:text-[0.95rem] font-lxgw">陋室空堂，当年笏满床；衰草枯杨，曾为歌舞场。</p></header><div _hk=0010070c00310002 class="flex flex-col"><article _hk=0010070c0031000300 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2026-08-11-%E4%B8%BA%E4%BB%80%E4%B9%88nixos%E5%8F%AF%E8%83%BD%E6%88%90%E4%B8%BAai%E6%97%B6%E4%BB%A3%E6%9C%80%E9%80%82%E5%90%88%E5%B0%8F%E7%99%BD%E7%9A%84linux%E7%B3%BB%E7%BB%9F"><span _hk=0010070c00310003030 class="">为什么NixOS可能成为AI时代最适合小白的Linux系统</span></a></h2><!--$--><div _hk=0010070c00310003060 class="markdown-body mt-2 text-ink-soft"><p>对，我指的是真小白：没有任何Linux使用经验的人。甚至，我觉得没有任何Linux使用经验的人比已有使用经验者<em lang="zh">更适合</em>一上来就使用NixOS。</p>
<p>这个结论听起来可能很离谱，毕竟NixOS在Linux圈子里一直以极客而闻名。Nix社区内部也完全不推荐、乃至劝退小白入门使用NixOS。我之所以下定这个结论，是因为AI的发展已经超出了许多老东西（？）对Nix学习难度的印象。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2026/08/11</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c003100030d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c003100030d100><a class="transition-colors hover:text-ink" href="/tags/AI">#<!--$-->AI<!--/--></a></li><li _hk=0010070c003100030d110><a class="transition-colors hover:text-ink" href="/tags/Nix">#<!--$-->Nix<!--/--></a></li><li _hk=0010070c003100030d120><a class="transition-colors hover:text-ink" href="/tags/Linux">#<!--$-->Linux<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c0031000310 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2026-06-22-%E4%BB%8E%E5%8D%9A%E5%AE%A2%E7%BE%8E%E5%8C%96%E5%BC%80%E5%A7%8B%E7%9A%84%E6%8E%92%E7%89%88%E5%AD%A6%E7%AC%94%E8%AE%B0"><span _hk=0010070c00310003130 class="">从博客美化开始的排版学笔记</span></a></h2><!--$--><div _hk=0010070c00310003160 class="markdown-body mt-2 text-ink-soft"><p>近期对我的博客进行了进一步的风格优化。为此，阅读了 <a href="https://practicaltypography.com/">Butterick’s Practical Typography</a>（下文简称书本）。尽管我的审美水平一言难尽，也没有进行过任何专业的美术训练，但我仍希望尝试编写一些我读和美化博客下的感悟，并希望自己在之后也能继续记得这些。</p>

</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/09/18</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><ul _hk=0010070c003100037a0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-ink-faint"><li _hk=0010070c003100037a100><a class="transition-colors hover:text-accent" href="/categories/Practical%20Foundations%20for%20Programming%20Languages">Practical Foundations for Programming Languages</a></li></ul><!--/--><!--$--><!--/--></div></div></article><article _hk=0010070c0031000380 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-09-04-pfpl-note-10"><span _hk=0010070c00310003830 class="">PFPL 笔记 - X Exceptions and Continuations</span></a></h2><!--$--><div _hk=0010070c00310003860 class="markdown-body mt-2 text-ink-soft"><p>笔记 10 异常和 continuations</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/09/04</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><ul _hk=0010070c003100038a0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-ink-faint"><li _hk=0010070c003100038a100><a class="transition-colors hover:text-accent" href="/categories/Practical%20Foundations%20for%20Programming%20Languages">Practical Foundations for Programming Languages</a></li></ul><!--/--><!--$--><!--/--></div></div></article><article _hk=0010070c0031000390 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-07-21-unsafe-rust-is-not-same-as-c"><span _hk=0010070c00310003930 class="">Unsafe Rust 并不和 C 语言一样：从 Aliasing 谈起</span></a></h2><!--$--><div _hk=0010070c00310003960 class="markdown-body mt-2 text-ink-soft"><p>在社区中你可能听到一种说法：在 <code>unsafe</code> 块里你可以像 C<sup><a href="#user-content-fn-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85" id="user-content-fnref-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85" data-footnote-ref aria-describedby="footnote-label">1</a></sup> 语言那样写。然而事实并不是这样，C 语言的约束太差，事实上给了程序员太多“宽松”的东西。而在 Rust 里，unsafe 真的很 unsafe —— 当你要接管编译器为你做的安全保证，危险就暗藏在其中。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/07/21</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c003100039d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c003100039d100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c003100039d110><a class="transition-colors hover:text-ink" href="/tags/Rust">#<!--$-->Rust<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003a0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-06-14-win11-stuttering-solution"><span _hk=0010070c00310003a30 class="">Windows 11 Chromium 渲染卡住的解决方案</span></a></h2><!--$--><div _hk=0010070c00310003a60 class="markdown-body mt-2 text-ink-soft"><p>注册表打开：HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Dwm 新增一个 OverlayTestMode 的 DWORD 项，值为 5 重启即可</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/06/14</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003ad0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003ad100><a class="transition-colors hover:text-ink" href="/tags/Windows">#<!--$-->Windows<!--/--></a></li><li _hk=0010070c00310003ad110><a class="transition-colors hover:text-ink" href="/tags/Solution">#<!--$-->Solution<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003b0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-06-01-pointfree-thinks"><span _hk=0010070c00310003b30 class="">Point-free Style 思考</span></a></h2><!--$--><div _hk=0010070c00310003b60 class="markdown-body mt-2 text-ink-soft"><blockquote>
<p>Point-free style can (clearly) lead to Obfuscation when used unwisely. As higher-order functions are chained together, it can become harder to mentally infer the types of expressions. The mental cues to an expression's type (explicit function arguments, and the number of arguments) go missing.</p>
</blockquote>
<p><a href="https://wiki.haskell.org/Pointfree">https://wiki.haskell.org/Pointfree</a></p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/06/01</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003bd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003bd100><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li><li _hk=0010070c00310003bd110><a class="transition-colors hover:text-ink" href="/tags/Haskell">#<!--$-->Haskell<!--/--></a></li><li _hk=0010070c00310003bd120><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003c0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-05-30-sml-intro"><span _hk=0010070c00310003c30 class="">Standard ML 尝旧</span></a></h2><!--$--><div _hk=0010070c00310003c60 class="markdown-body mt-2 text-ink-soft"><p>Standard ML（SML），是一个函数式、指令式、模块化的通用的编程语言，具有编译时间类型检查和类型推论。它流行于编译器作者和编程语言研究者和自动定理证明研究者之中。</p>
<p>虽然这玩意是 1983 年的老登了，但是还能看到许多比较现代的东西——不得不感叹 PL 与工程语言的割裂。1972 年 C 语言被发明，1973 年 ML 被发明，一边是 <code>void*</code> 满天飞的弱类型语言，一边已经是用了 Hindley-Milner 类型推论的 sound 的语言了。</p>
<p>总而言之读了一下 <a href="https://www.cs.cmu.edu/~rwh/isml/book.pdf">Programing in Standard ML</a> (又是你啊， Robert Harper) ，写写对 Standard ML 的主观感受</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/05/30</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003cd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003cd100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003cd110><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li><li _hk=0010070c00310003cd120><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003d0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-05-21-suisuinian"><span _hk=0010070c00310003d30 class="">碎碎念</span></a></h2><!--$--><div _hk=0010070c00310003d60 class="markdown-body mt-2 text-ink-soft"><style>

  display: none;

<div class="suisuinian">
<p>本来不想在博客写这些的，不过算了写写吧。</p>

</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/05/16</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><ul _hk=0010070c00310003ea0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-ink-faint"><li _hk=0010070c00310003ea100><a class="transition-colors hover:text-accent" href="/categories/Practical%20Foundations%20for%20Programming%20Languages">Practical Foundations for Programming Languages</a></li></ul><!--/--><!--$--><!--/--></div></div></article><article _hk=0010070c00310003f0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-05-12-algebraic-effect"><span _hk=0010070c00310003f30 class="">简单接触 Algebraic Effects</span></a></h2><!--$--><div _hk=0010070c00310003f60 class="markdown-body mt-2 text-ink-soft"><p>TL;DR：简而言之，代数效应是一种机制，允许在不破坏函数式编程纯度的前提下，更加结构化和组合化地处理副作用。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/05/12</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003fd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003fd100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003fd110><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li><li _hk=0010070c00310003fd120><a class="transition-colors hover:text-ink" href="/tags/Algebraic%20Effects">#<!--$-->Algebraic Effects<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003g0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-05-07-cpp-blackmagic-memorize"><span _hk=0010070c00310003g30 class="">C++ 黑魔法习题：memorize</span></a></h2><!--$--><div _hk=0010070c00310003g60 class="markdown-body mt-2 text-ink-soft"><p>习题来自 <a href="https://bartoszmilewski.com/2014/11/24/types-and-functions/">https://bartoszmilewski.com/2014/11/24/types-and-functions/</a></p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/05/07</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003gd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003gd100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003gd110><a class="transition-colors hover:text-ink" href="/tags/C%2B%2B">#<!--$-->C++<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003h0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-05-05-idris2-test"><span _hk=0010070c00310003h30 class="">试试 idris2</span></a></h2><!--$--><div _hk=0010070c00310003h60 class="markdown-body mt-2 text-ink-soft"><p>唉早知道就不折腾这种全世界都找不出一万个人在用的东西了.txt</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/05/05</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003hd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003hd100><a class="transition-colors hover:text-ink" href="/tags/Idris">#<!--$-->Idris<!--/--></a></li><li _hk=0010070c00310003hd110><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003hd120><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li><li _hk=0010070c00310003hd130><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003i0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-04-20-traps-of-vue-layouts"><span _hk=0010070c00310003i30 class="">vite-plugin-vue-layouts 使用记</span></a></h2><!--$--><div _hk=0010070c00310003i60 class="markdown-body mt-2 text-ink-soft"><p>前言： <a href="https://uvr.esm.is/">unplugin-vue-router</a> 是 unplugin 的一款插件，旨在在 <code>src/pages</code> 等目录下使用文件驱动的 routing 来避免手写 vue-router 配置带来的麻烦与潜在的失误，是约定优于配置的一个展现。</p>
<p><a href="https://github.com/JohnCampionJr/vite-plugin-vue-layouts">vite-plugin-vue-layouts</a> 是与 unplugin-vue-router 非常般配的一款插件，旨在为 views 指定共享的 layout，在复杂前端工程上或许非常有用。</p>
<p>二者是 <a href="https://vuetifyjs.com/">vuetify</a> 前端框架推荐使用的插件。</p>
<p><del>然后就被它的【刻意的设计】坑了一把</del></p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/04/20</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003id0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003id100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003id110><a class="transition-colors hover:text-ink" href="/tags/Frontend">#<!--$-->Frontend<!--/--></a></li><li _hk=0010070c00310003id120><a class="transition-colors hover:text-ink" href="/tags/Vue">#<!--$-->Vue<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003j0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-04-13-pfpl-note-7"><span _hk=0010070c00310003j30 class="">PFPL 笔记 - VI Dynamic Types</span></a></h2><!--$--><div _hk=0010070c00310003j60 class="markdown-body mt-2 text-ink-soft"><p>笔记 7</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/04/13</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><ul _hk=0010070c00310003ja0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-ink-faint"><li _hk=0010070c00310003ja100><a class="transition-colors hover:text-accent" href="/categories/Practical%20Foundations%20for%20Programming%20Languages">Practical Foundations for Programming Languages</a></li></ul><!--/--><!--$--><!--/--></div></div></article><article _hk=0010070c00310003k0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-04-13-lean4-parser-combinator"><span _hk=0010070c00310003k30 class="">学习在 Lean4 中使用 Parser Combinator</span></a></h2><!--$--><div _hk=0010070c00310003k60 class="markdown-body mt-2 text-ink-soft"><p>此时对于我那幽默的《编译原理》课程还在用 C 语言写编译器的不满达到了顶峰。</p>
<blockquote>
<p>你说得对，但是《编译原理》是由 Alfred V. Aho, Monica S. Lam, Ravi Sethi 和 Jeffrey D. Ullman 等人自主研发的一款全旧计算机世界编程游戏。游戏发生在一个被称作「C-‌-」的简化语言，在这里，选择这门课的人将被迫享受「GCC 7.5.0」，没有一点 5202 年该有的体验。玩家将扮演一位名为「C 程序员」的神秘角色，在自由的编码中邂逅各种各样、时机诡异的 Segment Fault 们，和他们一起泄露内存，感受 C 语言的恶心之处——同时，逐步发掘「都 5202 年了这帮人还在拿 39 年前的书教文法分析」的真相。</p>
</blockquote>
<p>但跑远了。总而言之这里介绍一种叫 parser combinator —— 解析器组合子的函数式手段，为您带来哪怕是手写递归下降也很舒适的体验（并非）</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/04/13</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003kd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003kd100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003kd110><a class="transition-colors hover:text-ink" href="/tags/Lean">#<!--$-->Lean<!--/--></a></li><li _hk=0010070c00310003kd120><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003l0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-04-08-lean4-json"><span _hk=0010070c00310003l30 class="">很难不承认 Lean4 真香 —— 然后写了一个简单的 JSON 解析器</span></a></h2><!--$--><div _hk=0010070c00310003l60 class="markdown-body mt-2 text-ink-soft"><p>在之前的文章中我尝试了一下 Lean4 定理证明器——然后我是在并非干这个方向的所以后面就抛在脑后了</p>
<p>后面因为学习函数式语言于是又捡起了 Lean4 函数式编程，然后……好吧我真的不得不说真香啊</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2025/04/08</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003ld0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003ld100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003ld110><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li><li _hk=0010070c00310003ld120><a class="transition-colors hover:text-ink" href="/tags/Lean">#<!--$-->Lean<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003m0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2025-04-07-strong-typed"><span _hk=0010070c00310003m30 class="">一千个计算机人有一千个强类型</span></a></h2><!--$--><div _hk=0010070c00310003m60 class="markdown-body mt-2 text-ink-soft"><p>所以不要再说强类型了啊！！</p>

</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/12/24</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003zd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003zd100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003zd110><a class="transition-colors hover:text-ink" href="/tags/C%2B%2B">#<!--$-->C++<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A100 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-12-22-write-your-own-std-optional-universal-ref-in-c"><span _hk=0010070c00310003A1030 class="">DIY <code>std::optional</code>: Using Universal References in C++</span></a></h2><!--$--><div _hk=0010070c00310003A1060 class="markdown-body mt-2 text-ink-soft"><p>This blog was written entirely because of the item <a href="https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item27.html"><em>Familiarize yourself with alternatives to overloading on universal references</em></a> in Effcetive Morden C++. We start with a practical problem trying to emulate <code>std::optional</code> in C++14, because optional monads are a good paradigm for expressing values ​​that may be null, rather than assuming everything is maybe null which can easily break through the type system.
写下这篇文章完全是因为看到了 Effcetive Morden C++ 中的<a href="https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item27.html">熟悉通用引用重载的替代方法</a>。我们从一个现实的问题开始，即在 C++14 尝试模拟 std::optional，因为 optional 是表达可能为空的值的时候一个很好的范式，而不是假定一切都可能为 null 并轻易击穿类型系统。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/12/22</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A10d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A10d100><a class="transition-colors hover:text-ink" href="/tags/Note">#<!--$-->Note<!--/--></a></li><li _hk=0010070c00310003A10d110><a class="transition-colors hover:text-ink" href="/tags/C%2B%2B">#<!--$-->C++<!--/--></a></li><li _hk=0010070c00310003A10d120><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003A10d130><a class="transition-colors hover:text-ink" href="/tags/%E5%8F%8C%E8%AF%AD">#<!--$-->双语<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A110 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-12-18-pass-test-joke"><span _hk=0010070c00310003A1130 class="">Introduction to Pass Principles</span></a></h2><!--$--><div _hk=0010070c00310003A1160 class="markdown-body mt-2 text-ink-soft"><div hidden class="author hidden-until-post">
<p><strong>Linca Insania<sup>†</sup>    My Cat<sup>†</sup>    No one</strong>
XYN University
<font face="monospace">{me,cat,none}@joke.fake.email</font>
<font face="monospace">lhcfl.github.io</font></p>
</div>
<div class="abstract">
<p><strong>Abstract:</strong> Passness is part of the terminology of transition. Passness is the degree of likelihood that a transgender person is socially identified as the gender they identify with, and is a core part of pass theory, which is crucial to the quality of life of transgender people. However, distinguishing passness is not an easy task, and existing theories cannot address this issue well. There are several reasons. First, most known descriptions of passness are non-theoretical and cannot be accurately described by mathematical language. Second, there is a lack of rigorous specifications as a reference to classify a test trans as pass. Third, passness is stateful, and stateful pass testing remains challenging due to the large input space.
In this paper, we propose several new passness testing systems called CBA to address the above challenges related to passness testing.</p>
</div>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/12/18</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A11d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A11d100><a class="transition-colors hover:text-ink" href="/tags/Joke">#<!--$-->Joke<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A120 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-12-08-programing-language-impressions"><span _hk=0010070c00310003A1230 class="">Programming Language Impressions</span></a></h2><!--$--><div _hk=0010070c00310003A1260 class="markdown-body mt-2 text-ink-soft"><p>Impressions of the programming languages I have come across</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/12/08</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A12d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A12d100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A130 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-11-28-%E7%B1%BB%E5%9E%8B%E4%BD%93%E6%93%8D%E5%85%A5%E9%97%A8slice"><span _hk=0010070c00310003A1330 class="">类型体操入门：Slice</span></a></h2><!--$--><div _hk=0010070c00310003A1360 class="markdown-body mt-2 text-ink-soft"><p>Extreme 难度的 Slice 过关了，终于可以自称类型体操入门了（喜）</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/11/28</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A13d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A13d100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A140 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-11-25-package-manager-the-history"><span _hk=0010070c00310003A1430 class="">Package Manager: The History</span></a></h2><!--$--><div _hk=0010070c00310003A1460 class="markdown-body mt-2 text-ink-soft"><p>This blog post was inspired by my classmate who encountered pip's dependencies hell when configuring machine learning python code. Yeah, for my academics-immersed amateur of industy, environment configuration and package managers are very unfamiliar things. It's not strange to crash into hell.</p>
<blockquote>
<p>Sometimes it’s simply impossible to find a combination of package versions that do not conflict. Welcome to <a href="https://en.wikipedia.org/wiki/Dependency_hell">dependency hell</a>.</p>
</blockquote>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/11/25</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A14d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A14d100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A150 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-11-18-random-sentence-generator-and-wasm"><span _hk=0010070c00310003A1530 class="">随机句子生成器与一场有趣的WASM尝试</span></a></h2><!--$--><div _hk=0010070c00310003A1560 class="markdown-body mt-2 text-ink-soft"><p>一时兴起想写一个随机句子生成器。正巧在学上下文无关语言 (Context-Free Language, <strong>CFL</strong>)，意识到句子的结构很大程度上是一个上下文无关语法。查阅<a href="https://zh.wikipedia.org/wiki/X-bar%E7%90%86%E8%AE%BA"> X-bar 理论</a>得到也确实类似如此。</p>
<p>同时正好在学 Rust，所以试了一下拿 Rust 编写这个生成器，并<a href="https://developer.mozilla.org/zh-CN/docs/WebAssembly/Rust_to_Wasm">编译到 WebAssembly (<strong>WASM</strong>)</a>。效果很成功！</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/11/18</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A15d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A15d100><a class="transition-colors hover:text-ink" href="/tags/Rust">#<!--$-->Rust<!--/--></a></li><li _hk=0010070c00310003A15d110><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003A15d120><a class="transition-colors hover:text-ink" href="/tags/Frontend">#<!--$-->Frontend<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A160 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-11-13-so-simple"><span _hk=0010070c00310003A1630 class="">一晚上搓出的 So Simple 博客主题</span></a></h2><!--$--><div _hk=0010070c00310003A1660 class="markdown-body mt-2 text-ink-soft"><p>花了几个小时写下了 <a href="https://github.com/Lhcfl/hexo-theme-sosimple">So Simple</a>.</p>
<p><img src="/images/sosimple_screenshot.png" alt="Screenshot of example website of SoSimple theme"></p>
<p>这是一个致力于“尽可能少写 CSS”的主题。实际上也确实，整个主题几乎全部是裸的 HTML。排列从上到下，没有什么值得插入的元素，就像在读报纸一样。</p>
<p>这个主题是返璞归真的一次尝试。希望它能让我满意。</p></div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/11/13</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A16d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A16d100><a class="transition-colors hover:text-ink" href="/tags/Hexo">#<!--$-->Hexo<!--/--></a></li><li _hk=0010070c00310003A16d110><a class="transition-colors hover:text-ink" href="/tags/Blog">#<!--$-->Blog<!--/--></a></li><li _hk=0010070c00310003A16d120><a class="transition-colors hover:text-ink" href="/tags/Frontend">#<!--$-->Frontend<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A170 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-09-07-reindex-misskey"><span _hk=0010070c00310003A1730 class="">为 Misskey 开启 Meilisearch 后，重新索引过去的帖子</span></a></h2><!--$--><div _hk=0010070c00310003A1760 class="markdown-body mt-2 text-ink-soft"><p>一篇简短的笔记，为 Misskey 开启 Meilisearch 后，重新索引过去的帖子。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/09/07</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A17d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A17d100><a class="transition-colors hover:text-ink" href="/tags/Misskey">#<!--$-->Misskey<!--/--></a></li><li _hk=0010070c00310003A17d110><a class="transition-colors hover:text-ink" href="/tags/Fediverse">#<!--$-->Fediverse<!--/--></a></li><li _hk=0010070c00310003A17d120><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A180 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-09-05-sayonara-firefish"><span _hk=0010070c00310003A1830 class="">再见 Firefish (Firefish 迁移 Sharkey 指北)</span></a></h2><!--$--><div _hk=0010070c00310003A1860 class="markdown-body mt-2 text-ink-soft"><p>我是去年的 11 月知道的 <a href="https://web.archive.org/web/20240102075130/https://joinfirefish.org/">Firefish</a>。它是我当时找到的最美丽的联邦宇宙软件，相比于死板的 <a href="https://joinmastodon.org/">Mastodon</a>，过于倾向于日语又太娱乐的 <a href="https://misskey-hub.net/en/">Misskey</a>，它同时兼具美观大方与功能丰富。管理员可以自由配置最大帖子长度，Nodejs 的后端也让它比 Ruby on Rails 编写的 Mastodon 对性能要求更低。我欣然安装上了它，并把它作为自己的主要联邦宇宙软件。</p>
<p>可惜，当时我还不知道它的状态已经岌岌可危。就在当时，原有的主要贡献者大多已经离开，panos 和 namekuji 离开了这摊烂摊子开启了新项目 <a href="https://codeberg.org/catodon/catodon">Catodon</a>。数个月后，Firefish 的 maintainer Kainoa 就直接撒手不管，在没有事先告知的情况下将 maintainer 更改给 naskya。naskya 非常负责且具有热爱，在伊的代理下 Firefish 回光返照了一段时间 —— 我也是那个时候尝试了为 Firefish 进行贡献。</p>
<p>可惜 maintainer 的名头为伊带来了巨大的压力与恶心的网络骚扰者。 naskya 的身体和精神状态都无法负担这样的项目，不到一年之后，<a href="https://info.firefish.dev/notes/9xsukr38m3komd63">Firefish 再次被抛弃</a>。这次，大约再也没人能救 Firefish 了。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/09/05</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A18d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A18d100><a class="transition-colors hover:text-ink" href="/tags/Fediverse">#<!--$-->Fediverse<!--/--></a></li><li _hk=0010070c00310003A18d110><a class="transition-colors hover:text-ink" href="/tags/Misskey">#<!--$-->Misskey<!--/--></a></li><li _hk=0010070c00310003A18d120><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003A18d130><a class="transition-colors hover:text-ink" href="/tags/Backend">#<!--$-->Backend<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A190 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-09-04-renewhexo"><span _hk=0010070c00310003A1930 class="">在 Hexo 老瓶装新酒</span></a></h2><!--$--><div _hk=0010070c00310003A1960 class="markdown-body mt-2 text-ink-soft"><p>我在 2018 年建立这个博客以后，就一直没有换过其它博客平台。试过 Wordpress，也试过 Writefreely，总还是没有 Hexo 之类的静态站点生成器来得又快又好。当然现在似乎更流行别的结构了，Hugo，vuepress，毕竟 Hexo 已经是个有十来岁的老家伙了。在前端，十年足以发生翻天覆地的变化，而 Hexo 已经被远远的甩在后头。</p>
<p>实际上，我对 Hexo 多少有一点恋旧情绪，毕竟它是我第一次尝试自建博客，也是我第一次尝试 Contribute 到开源项目。截至我写的时候，这个博客使用的主题 Anatolo 还是我 Star 数最高的个人项目。</p>
<p>但 Hexo 的确是老了。正如我的朋友所说，<a href="https://blog.yunyi.beiyan.us/posts/removeHexo/">Hexo 的表演该落幕了，让它退场吧</a>。 Hexo 大多数主题都是用的是裸的 <code>&#x3C;script></code> 标签引入前端库，少有主题加入代码压缩，几乎没有主题使用过 typescript。 文档也疏于维护， <code>hexo-utils</code> 更是<a href="https://lhcfl.github.io/2024/09/03/make-blog-support-lean/#Step-3-%E6%8A%8A-hexo-utils-%E7%9A%84%E8%AF%AD%E8%A8%80%E5%AE%9A%E4%B9%89%E6%96%87%E4%BB%B6%E9%87%8C%E6%B7%BB%E5%8A%A0%E4%B8%8A-Lean">代码奇奇怪怪</a> 。</p>
<p>但我还是不忍心彻底放弃 Hexo。因此，我花了一个晚上的时间，对我博客的 Client 进行了重写。同时也是为了探索，像 Hexo 这样的老东西还可不可能与现代化的前端技术相集成。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/09/04</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A19d0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A19d100><a class="transition-colors hover:text-ink" href="/tags/Hexo">#<!--$-->Hexo<!--/--></a></li><li _hk=0010070c00310003A19d110><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1a0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-09-03-make-blog-support-lean"><span _hk=0010070c00310003A1a30 class="">使 Hexo 支持高亮 Lean</span></a></h2><!--$--><div _hk=0010070c00310003A1a60 class="markdown-body mt-2 text-ink-soft"><p>说真的，Hexo 这么烂下去我真要换 Hugo 了——为什么它甚至不支持给 hljs 添加语言插件？</p>
<p>好吧，这篇博客讲述如何让你的 Hexo 博客支持高亮 Lean，并且是后端渲染。</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/09/03</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1ad0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1ad100><a class="transition-colors hover:text-ink" href="/tags/Lean">#<!--$-->Lean<!--/--></a></li><li _hk=0010070c00310003A1ad110><a class="transition-colors hover:text-ink" href="/tags/Hexo">#<!--$-->Hexo<!--/--></a></li><li _hk=0010070c00310003A1ad120><a class="transition-colors hover:text-ink" href="/tags/Blog">#<!--$-->Blog<!--/--></a></li><li _hk=0010070c00310003A1ad130><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1b0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-09-03-lean4-intro"><span _hk=0010070c00310003A1b30 class="">Lean 初见笔记</span></a></h2><!--$--><div _hk=0010070c00310003A1b60 class="markdown-body mt-2 text-ink-soft"><p>Lean 4 是一个功能强大的交互式定理证明器和编程语言，结合了逻辑推理与编程，主要用于形式化验证、数学证明以及高可靠性软件开发。Lean 4 提供了一个灵活的类型系统和高性能的编译器，使其在理论研究和实际应用中都有出色表现。 —— GPT 说的。</p>
<p>F*ck 我为什么要去看这种东西啊（悲） —— 我说的</p>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/09/03</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1bd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1bd100><a class="transition-colors hover:text-ink" href="/tags/Math">#<!--$-->Math<!--/--></a></li><li _hk=0010070c00310003A1bd110><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li><li _hk=0010070c00310003A1bd120><a class="transition-colors hover:text-ink" href="/tags/Lean">#<!--$-->Lean<!--/--></a></li><li _hk=0010070c00310003A1bd130><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c00310003A1bd140><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1c0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-07-08-%E6%A8%A1%E6%8B%9F%E4%B8%80%E4%B8%AAvue%E7%9A%84%E5%93%8D%E5%BA%94%E5%BC%8F%E6%93%8D%E4%BD%9C"><span _hk=0010070c00310003A1c30 class="">试着复刻一个vue的计算属性</span></a></h2><!--$--><div _hk=0010070c00310003A1c60 class="markdown-body mt-2 text-ink-soft"><p>之前对于 Vue 的响应式封装（这里主要思考的是 computed），主要是用用，其实是懒得思考背后的原理的。毕竟原理其实可以用一句话说明：计算属性对别的属性产生有向的依赖关系，这个依赖关系构成一个有向无环图（DAG），图上的某个节点更新后重新计算其所有后置节点即可。</p>
<p>但是仔细想来，内部其实有一些时间复杂度的问题。显然，我们不能暴力调用回调函数（会卡出指数级时间复杂度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mi>n</mi></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(2^n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> 下面会详细解释）。同时朴素的做法很难解决这样的问题：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> a</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> ref</span><span style="color:#005cc5">(</span><span style="color:#e36209">[</span><span style="color:#e36209">]</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> b</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> computed</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> a.</span><span style="color:#6F42C1">join</span><span style="color:#e36209">(</span><span style="color:#032F62">","</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">for</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">let</span><span style="color:#24292E"> i </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">; i </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">=</span><span style="color:#24292E"> n; i</span><span style="color:#D73A49">++</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  a.value </span><span style="color:#D73A49">=</span><span style="color:#24292E"> a.value.</span><span style="color:#6F42C1">concat</span><span style="color:#e36209">(</span><span style="color:#5a32a3">[</span><span style="color:#24292E">i</span><span style="color:#5a32a3">]</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>注意到对于一个网页而言，我们实际上期望 <code>b</code> 能在整个宏任务跑完以后才更新。所以实际上<code>a.value</code> 的 setter 触发的更新必须要进行推迟。</p>
<p>这篇文章讲讲我怎么在思考这些的过程中试着复刻一个 vue 的计算属性 <code>computed</code> 的</p>

</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/07/02</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1dd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1dd100><a class="transition-colors hover:text-ink" href="/tags/Latex">#<!--$-->Latex<!--/--></a></li><li _hk=0010070c00310003A1dd110><a class="transition-colors hover:text-ink" href="/tags/Math">#<!--$-->Math<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1e0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-06-13-%E9%9D%99%E6%80%81%E7%89%88rubycrystal%E8%AF%AD%E8%A8%80%E8%AF%95%E7%94%A8"><span _hk=0010070c00310003A1e30 class="">静态版Ruby？Crystal语言试用</span></a></h2><!--$--><div _hk=0010070c00310003A1e60 class="markdown-body mt-2 text-ink-soft"><p>前几天在思考，Python 和 JS 都拥抱了类型检查（类型注释），但是 Ruby 却只能用 Sorbet 这样的影响性能的类型检查器（Ruby 没有官方的类型检查工具，引入静态类型检查的 gem 反而降低了性能），在搜索中找到了 Crystal 这门语言。</p>
<p><a href="https://crystal-lang.org/">https://crystal-lang.org/</a></p>
<p>看描述我就惊艳到了：作为一个<strong>静态语言</strong>，Crystal 居然长得这么像 Ruby，于是本着不妨玩玩的想法，我进行了 Crystal 的初试。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6A737D"># A very basic HTTP server</span></span>
<span class="line"><span style="color:#D73A49">require</span><span style="color:#032F62"> "http/server"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">server </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> HTTP</span><span style="color:#24292E">::</span><span style="color:#005CC5">Server</span><span style="color:#24292E">.new </span><span style="color:#D73A49">do </span><span style="color:#24292E">|</span><span style="color:#D73A49">context</span><span style="color:#24292E">|</span></span>
<span class="line"><span style="color:#D73A49">  context</span><span style="color:#24292E">.response.content_type </span><span style="color:#D73A49">=</span><span style="color:#032F62"> "text/plain"</span></span>
<span class="line"><span style="color:#D73A49">  context</span><span style="color:#24292E">.response.print </span><span style="color:#032F62">"Hello world, got </span><span style="color:#032F62">#</span><span style="color:#005cc5">{</span><span style="color:#D73A49">context</span><span style="color:#032F62">.</span><span style="color:#24292E">request</span><span style="color:#032F62">.</span><span style="color:#24292E">path</span><span style="color:#005cc5">}</span><span style="color:#032F62">!"</span></span>
<span class="line"><span style="color:#D73A49">end</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">address </span><span style="color:#D73A49">=</span><span style="color:#24292E"> server.</span><span style="color:#6F42C1">bind_tcp</span><span style="color:#005cc5">(</span><span style="color:#005CC5">8080</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#005CC5">puts</span><span style="color:#032F62"> "Listening on http://</span><span style="color:#032F62">#</span><span style="color:#005cc5">{</span><span style="color:#24292E">address</span><span style="color:#005cc5">}</span><span style="color:#032F62">"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D"># This call blocks until the process is terminated</span></span>
<span class="line"><span style="color:#24292E">server.listen</span></span></code></pre>
</div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/06/13</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1ed0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1ed100><a class="transition-colors hover:text-ink" href="/tags/Crystal">#<!--$-->Crystal<!--/--></a></li><li _hk=0010070c00310003A1ed110><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li><li _hk=0010070c00310003A1ed120><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1f0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2024-05-28-%E6%9F%A5%E7%9C%8B%E4%BD%A0%E7%9A%84misskey%E5%AD%98%E6%A1%A3"><span _hk=0010070c00310003A1f30 class="">查看你的Misskey存档！</span></a></h2><!--$--><div _hk=0010070c00310003A1f60 class="markdown-body mt-2 text-ink-soft"><p>简而言之，我写了一个可以查看Misskey/Firefish/Sharkey/...等Misskey系软件导出帖子存档的工具！</p>
<p>网址： <a href="https://lhcfl.github.io/misskey-archive-viewer-web">https://lhcfl.github.io/misskey-archive-viewer-web</a></p>
<p>源代码： <a href="https://github.com/Lhcfl/misskey-archive-viewer">https://github.com/Lhcfl/misskey-archive-viewer</a></p></div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2024/05/28</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1fd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1fd100><a class="transition-colors hover:text-ink" href="/tags/Tools">#<!--$-->Tools<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1g0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2023-10-18-gotofediverse"><span _hk=0010070c00310003A1g30 class="">从中心化平台跑路：迁移到联邦宇宙（Fediverse）</span></a></h2><!--$--><div _hk=0010070c00310003A1g60 class="markdown-body mt-2 text-ink-soft"><p>2023年10月18日， X (Twitter) 发布了一则公告，宣布他们在进行一项“测试”：在新西兰和菲律宾注册的新用户必须支付 $1 的年费才能在 X (twitter) 上和人互动。并且“在此测试中，现有用户不受影响”。<br>这促使我写下这篇文章：早该跑路了！如果之前的 Twitter 还努力营造一种“为了所有人”的印象，重视用户的黏性，Elon Musk的肆意妄为无疑是宣告 Twitter 终究是一个由公司掌握的营利性平台，而任何这样的大型中心化平台都不可避免的被少数人控制。国内平台尤甚，The big brother可以随意获取你的隐私，审查你的言论 (censorship)，无需理由就能禁言、封禁你的账户，随意关闭任何回答的评论区。<b>你真的愿意让你使用社交平台的权利被拿捏在它们手中吗？</b></p></div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2023/10/18</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1gd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1gd100><a class="transition-colors hover:text-ink" href="/tags/Decentralized">#<!--$-->Decentralized<!--/--></a></li><li _hk=0010070c00310003A1gd110><a class="transition-colors hover:text-ink" href="/tags/Fediverse">#<!--$-->Fediverse<!--/--></a></li><li _hk=0010070c00310003A1gd120><a class="transition-colors hover:text-ink" href="/tags/Community">#<!--$-->Community<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1h0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2023-10-15-mastodon-monoculture-problem"><span _hk=0010070c00310003A1h30 class="">Mastodon的单一文化问题</span></a></h2><!--$--><div _hk=0010070c00310003A1h60 class="markdown-body mt-2 text-ink-soft"><p>Mastodon 非营利组织的首席执行官兼 Mastodon 软件的首席开发者 Eugen Rochko（在联邦宇宙上被称为 Gargron）最近的举动让一些人担心 Mastodon（该软件项目和该非盈利组织）对 Fediverse 的其余部分造成的巨大影响。是的。我们的确应该担心。</p></div><!--/--><div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 font-sans"><time class="text-xs tabular-nums text-ink-faint">2023/10/15</time><div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><!--$--><!--/--><!--$--><ul _hk=0010070c00310003A1hd0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent"><li _hk=0010070c00310003A1hd100><a class="transition-colors hover:text-ink" href="/tags/Decentralized">#<!--$-->Decentralized<!--/--></a></li><li _hk=0010070c00310003A1hd110><a class="transition-colors hover:text-ink" href="/tags/Fediverse">#<!--$-->Fediverse<!--/--></a></li><li _hk=0010070c00310003A1hd120><a class="transition-colors hover:text-ink" href="/tags/Mastodon">#<!--$-->Mastodon<!--/--></a></li><li _hk=0010070c00310003A1hd130><a class="transition-colors hover:text-ink" href="/tags/Community">#<!--$-->Community<!--/--></a></li></ul><!--/--></div></div></article><article _hk=0010070c00310003A1i0 class="border-t border-rule py-8"><h2 class="text-xl font-bold leading-snug md:text-[1.35rem]"><a class="transition-colors hover:text-accent" href="/blog/2023-10-13-anatolo-math-support"><span _hk=0010070c00310003A1i30 class="">Hexo 博客添加数学支持</span></a></h2><!--$--><div _hk=0010070c00310003A1i60 class="markdown-body mt-2 text-ink-soft"><p><span class="katex"><spa
