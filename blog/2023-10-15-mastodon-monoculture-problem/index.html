lass="w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#正如-ostatus-宇宙所示" class="text-ink-soft hover:text-accent">正如 OStatus 宇宙所示</a></li><li _hk=0010070l110 class="" style="padding-left:24px"><a href="#identipocalypse-identi-的末日" class="text-ink-soft hover:text-accent">Identipocalypse (identi 的末日)</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#做大的代价" class="text-ink-soft hover:text-accent">做大的代价</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#明显的单一文化" class="text-ink-soft hover:text-accent">明显的单一文化</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#更好的方式" class="text-ink-soft hover:text-accent">更好的方式</a></li><li _hk=0010070l150 class="" style="padding-left:24px"><a href="#必要的更改" class="text-ink-soft hover:text-accent">必要的更改</a></li><li _hk=0010070l160 class="" style="padding-left:24px"><a href="#我能做什么" class="text-ink-soft hover:text-accent">我能做什么？</a></li><li _hk=0010070l170 class="" style="padding-left:12px"><a href="#结束语" class="text-ink-soft hover:text-accent">结束语</a></li></ul></nav></aside></div></div></body></html><script>($R[22]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"Mastodon的单一文化问题",date:"2023-10-15T20:17:41",tags:$R[11]=["Decentralized","Fediverse","Mastodon","Community"],copyright:"CC BY-SA 4.0",author:"Michal rysiek Wozniak, source: \x3Ca href=\"https://rys.io/en/168.html\">https://rys.io/en/168.html\x3C/a> 翻译：Lhc_fl",summary:"Mastodon 非营利组织的首席执行官兼 Mastodon 软件的首席开发者 Eugen Rochko（在联邦宇宙上被称为 Gargron）最近的举动让一些人担心 Mastodon（该软件项目和该非盈利组织）对 Fediverse 的其余部分造成的巨大影响。是的。我们的确应该担心。",toc:!0,categories:$R[12]=[]},titleHtml:"Mastodon的单一文化问题",html:"\x3Cblockquote>\n\x3Cp>\x3Cstrong>译者注：\x3C/strong>\x3C/p>\n\x3Cp>本文是 \x3Ca href=\"https://mstdn.social/@rysiek\">Michał \"rysiek\" Woźniak\x3C/a> 的博客 Mastodon monoculture problem 的翻译。 source: \x3Ca href=\"https://rys.io/en/168.html\">https://rys.io/en/168.html\x3C/a>\x3C/p>\n\x3Cp>对于不太懂文中的名词的人，译者额外做出一些解释：\x3C/p>\n\x3Cul>\n\x3Cli>\x3Cstrong>联邦宇宙\x3C/strong>：Fediverse，是使用一些协议彼此链接的一系列网站/服务（被称为“实例”）的总称。在联邦宇宙，你在任何一个实例上拥有账号，你就能访问几乎整个联邦宇宙的所有内容——实例有特殊规则的时候除外。\x3C/li>\n\x3Cli>\x3Cstrong>实例\x3C/strong>：联邦宇宙上的单独一个网站/服务。\x3C/li>\n\x3Cli>\x3Cstrong>实例软件\x3C/strong>：运行实例使用的软件，比如 Mastodon。用一种实例软件可以搭建很多个实例。\x3C/li>\n\x3Cli>\x3Cstrong>ActivityPub 协议\x3C/strong>：一种旨在让不同的实例之间可以互相连接，共通账号的协议。联邦宇宙实例很多使用的就是 ActivityPub 协议。\x3C/li>\n\x3Cli>\x3Cstrong>Mastodon\x3C/strong>：连接到联邦宇宙的一个微博类社交媒体软件，有类似 Twitter 的设计。\x3C/li>\n\x3C/ul>\n\x3Cp>依照 \x3Ca href=\"https://mstdn.social/@rysiek\">Michał \"rysiek\" Woźniak\x3C/a> 的原文 (\x3Ca href=\"https://rys.io/en/168.html)%EF%BC%8C%E6%9C%AC%E6%96%87%E4%BB%A5\">https://rys.io/en/168.html)，本文以\x3C/a> \x3Ca href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans\">CC-BY-SA 4.0\x3C/a> 协议发布。您可以自由地共享、演绎本作品，但是必须署名、以相同方式共享 - 如果您再混合、转换或者基于本作品进行创作，您必须基于与原先许可协议相同的许可协议分发您贡献的作品。\x3C/p>\n\x3C/blockquote>\n\x3Chr>\n\x3Cp>\x3Ca href=\"https://joinmastodon.org/about\">Mastodon 非营利组织\x3C/a>的首席执行官兼 \x3Ca href=\"https://github.com/mastodon/mastodon\">Mastodon 软件\x3C/a>的首席开发者 Eugen Rochko（在联邦宇宙上被称为 Gargron）最近的举动让一些人\x3Ca href=\"https://mstdn.social/@atomicpoet@mastodon.social/110300834063046929\">担心\x3C/a> Mastodon 该软件项目，同时也是该非盈利组织对联邦宇宙的其余部分造成的\x3Ca href=\"https://mstdn.social/@feditips/110260432218416976\">巨大影响\x3C/a>。\x3C/p>\n\x3Cp>确实。我们就是应该担心。\x3C/p>\n\x3Cp>到目前为止，联邦宇宙上大多数人都在使用 Mastodon 软件。 截至撰写本文时，最大的实例 \x3Ca href=\"https://mastodon.social\">\x3Ccode>mastodon.social\x3C/code>\x3C/a> 拥有超过 200,000 个活跃帐户。 这意味着这单独一个实例上涵括了\x3Ca href=\"https://the-federation.info/\">整个联邦宇宙\x3C/a>的大约 1/10。 更糟糕的是，Mastodon 软件经常被认为是整个社交网络，这掩盖了一个真相： \x3Ca href=\"https://axbom.com/fediverse/\">Fediverse 是一个由更多样化的软件们组成的更广泛的系统\x3C/a>。\x3C/p>\n\x3Cp>现在它就已经产生了糟糕的后果，而且以后可能会更糟。 让我困扰的还有，我以前也见过这样的情况：\x3C/p>\n\x3Ch2 id=\"正如-ostatus-宇宙所示\">\x3Ca href=\"#正如-ostatus-宇宙所示\">正如 OStatus 宇宙所示\x3C/a>\x3C/h2>\n\x3Cp>几年前，我在联邦宇宙的前身有一个账户。 它主要基于 StatusNet 软件（后来更名为 \x3Ca href=\"https://en.wikipedia.org/wiki/GNU_social\">GNU Social\x3C/a>）和 \x3Ca href=\"https://en.wikipedia.org/wiki/OStatus\">OStatus 协议\x3C/a>。 最大的实例是 \x3Ca href=\"https://identi.ca\">\x3Ccode>identi.ca\x3C/code>\x3C/a> ——笔者在那里拥有自己的账户。 同时还有很多其他实例、其他软件项目也实现了 OStatus 协议——例如 \x3Ca href=\"https://friendi.ca/\">Friendica\x3C/a>。\x3C/p>\n\x3Cp>出于本博文的需要，我们将该社交网络称为“OStatus 宇宙”。\x3C/p>\n\x3Cp>与今天的联邦宇宙相比，OStatus 宇宙是微不足道的。 我没有具体的数字，但我的粗略估计是，即使在最活跃的时候，也只有大约 100,000 到 200,000 个活跃帐户（如果你有实际数字，\x3Ca href=\"https://rys.io/en/about.html\">请告诉我\x3C/a>，我将很乐意更新这篇博客）。 我也没有 \x3Ca href=\"https://identi.ca\">\x3Ccode>identi.ca\x3C/code>\x3C/a> 上用户数目的确切数字，但我粗略估计它有 10,000 到 20,000 个活跃帐户。\x3C/p>\n\x3Cp>对，刚好也是整个社交网络的 1/10。\x3C/p>\n\x3Cp>OStatus 宇宙虽小但很活跃。我们在上面有讨论、线程回复（threads）和话题标签（hashtags）。 它早在 Mastodon 软件项目实现 Group 的十年前就实现了群组。它有桌面应用程序——我仍然怀念 \x3Ca href=\"https://choqok.kde.org/\">Choqok\x3C/a> 的可用性！ 甚至经过一番唠叨后，我还说服了波兰的一个政府部门在那里设立\x3Ca href=\"https://web.archive.org/web/20121122021505/http://identi.ca/maic\">官方办事处\x3C/a>。 据我所知，这是最早的政府机构在自由软件驱动的去中心化社交网络上拥有官方账户的例子。\x3C/p>\n\x3Ch3 id=\"identipocalypse-identi-的末日\">\x3Ca href=\"#identipocalypse-identi-的末日\">Identipocalypse (identi 的末日)\x3C/a>\x3C/h3>\n\x3Cp>然后有一天，\x3Ca href=\"https://identi.ca\">\x3Ccode>identi.ca\x3C/code>\x3C/a> 的管理员（也是 StatusNet 软件的原始创建者）Evan Prodromou \x3Ca href=\"https://lwn.net/Articles/544347/\">决定将其重构为一项新服务\x3C/a>，即 \x3Ca href=\"https://pump.io\">\x3Ccode>pump.io\x3C/code>\x3C/a>。 他们希望新软件\x3Ca href=\"https://opensource.com/life/13/7/pump-io\">更好、更精简\x3C/a>。 他们创建了一个新协议，因为 OStatus 协议有非常现实的限制。\x3C/p>\n\x3Cp>只有一个问题：新协议与 OStatus 宇宙的其它部分不兼容。它把这个社交网络撕碎了。\x3C/p>\n\x3Cp>拥有 \x3Ccode>identi.ca\x3C/code> 帐户的用户与所有其他 OStatus 实例失去了连接。 在其它实例上拥有帐户的人与 \x3Ccode>identi.ca\x3C/code> 上的人失去了联系，并且其中一些人在 OStatus 宇宙中非常受欢迎（听起来很熟悉？..）。\x3C/p>\n\x3Cp>事实证明，如果一个实例占据了整个社交网络的 1/10，那么它就会承载太多的社交联系。尽管的确存在其他实例，但突然间大量活跃用户消失了。一些群组瞬间就变得安安静静。 即使有人在不同的实例上有一个帐户，并且在其他实例上有联系人，很多熟悉的面孔也会消失。 于是此后不久我就停止使用它了。\x3C/p>\n\x3Cp>从笔者的角度来看，就这么一项行为，就使得我们在推广去中心化社交媒体方面至少倒退了五年甚至十年。 \x3Ca href=\"https://identi.ca\">\x3Ccode>identi.ca\x3C/code>\x3C/a> 的重构不仅在社交关系意义上破坏了 OStatus 宇宙，而且在协议和开发者社区意义上也是。 正如 \x3Ca href=\"https://mastodon.acc.umu.se/@pettter\">Pettter\x3C/a>，一位 OStatus 资深人士所说：\x3C/p>\n\x3Cblockquote>\n\x3Cp>我认为，这个巨变带来的影响是，它不仅切断了社交联系，还导致了协议变得支离破碎，一次又一次地让重建联合社交网络的基本架构的努力付诸东流。 也许这是他们重新聚集在一起设计 ActivityPub 的必要步骤，但我个人不这么认为。\x3C/p>\n\x3C/blockquote>\n\x3Cp>当然，Evan 完全有权利这样做，毕竟这是他用自己的钱、按照自己的条款无偿经营的一项服务。 但这并不能改变它割裂了 OStatus 宇宙的事实。\x3C/p>\n\x3Cp>我认为我们需要从这段历史中吸取教训。\x3Ca href=\"https://social.lol/@mcg/110302174281035077\">我们应该担心 \x3Ccode>mastodon.social\x3C/code> 的庞大规模\x3C/a>。 我们应该为联邦宇宙上 Mastodon 软件明显的单一文化感到担忧。 我们还应该担心将整个联邦宇宙与“Mastodon”等同起来。\x3C/p>\n\x3Ch2 id=\"做大的代价\">\x3Ca href=\"#做大的代价\">做大的代价\x3C/a>\x3C/h2>\n\x3Cp>发展到像 \x3Ca href=\"https://mastodon.social\">\x3Ccode>mastodon.social\x3C/code>\x3C/a> 这样的规模，需要付出相当的成本和风险。 这些成本，尤其是那些风险，既针对该实例本身，也针对更广泛的 Fediverse。\x3C/p>\n\x3Cp>Fediverse 上的审核很大程度上以实例为中心。 单个巨大的实例\x3Ca href=\"https://mastodon.social/@Gargron/109383947978442853\">很难有效地管理\x3C/a>，特别是如果它开放注册（就像 \x3Ca href=\"https://mastodon.social\">\x3Ccode>mastodon.social\x3C/code>\x3C/a> 目前所做的那样）。 作为直接在官方移动应用程序中推广的旗舰实例，它吸引了大量新注册，其中包括\x3Ca href=\"https://tech.lgbt/@asahi95/110310499987010451\">不少不太友好的用户\x3C/a>。\x3C/p>\n\x3Cp>同时，这也使得其他实例的管理员和版主更难以做出有关 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 的审核决定。\x3C/p>\n\x3Cp>如果其它实例的管理员认为 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 出于某种原因缺乏管理，他们是否应该静音该实例，甚至将其屏蔽（显然，有些人已经这样做了），代价是让本站的用户无法联络许多在 \x3Ccode>mastodon.social\x3C/code> 有账户的受欢迎的人？或者、他们就应该冒着让自己的社区面临潜在有害行为的风险，保留这种联络的可能性吗？\x3C/p>\n\x3Cp>\x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 的庞大规模使得任何其他实例的管理决策成为了一件大事。 这是某种形式上的特权：“当然，如果您不喜欢我们的管理方式，您可以封掉我们，但如果您实例上的用户无法访问整个联邦宇宙的 1/10，那将是一种耻辱！” 正如 \x3Ca href=\"https://gotosocial.org/\">GoToSocial 网站所说\x3C/a>：\x3C/p>\n\x3Cblockquote>\n\x3Cp>我们也不认为拥有成千上万用户的旗舰实例对联邦宇宙来说很有好处，因为它们会导致中心化，并且很容易变得“太大而不敢屏蔽”。\x3C/p>\n\x3C/blockquote>\n\x3Cp>请注意，我并不是说这种权力动态是有意识地、有目的地利用的！ 但不可否认，它是存在的。\x3C/p>\n\x3Cp>作为一个巨大的旗舰实例也意味着 \x3Ca href=\"https://mastodon.social\">\x3Ccode>mastodon.social\x3C/code>\x3C/a> 更有可能成为恶意行为的目标。 例如，在过去几个月中，它多次\x3Ca href=\"https://mastodon.social/@Gargron/109781490892884305\">受到 DDoS 攻击\x3C/a>，并且好几次都因为这个而\x3Ca href=\"https://status.mastodon.social/clf5ti6d818413wsobkvn2zruj\">无法访问\x3C/a>。 联邦系统的可靠性依赖于消除大的故障点，而 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 现在已经是一个巨大的故障点了。\x3C/p>\n\x3Cp>该实例的规模让它成为了一个诱人的攻击目标，这也意味着它需要做出某些艰难的选择。 例如，由于经常成为 DDoS 的目标，它现在由 Fastly 保护。 从隐私角度和互联网基础设施中心化的角度，\x3Ca href=\"https://spheron.medium.com/the-fastly-internet-outage-shows-the-fallibility-of-leaving-so-much-power-in-the-hands-of-so-few-a234a1bd9fe1\">这是一个问题\x3C/a>。 这也是较小的实例完全避免的一个问题，因为它们很小，很少有人会无聊到 DDoS 攻击它们。\x3C/p>\n\x3Cp>\x3Csmall>（译者注：这方面译者非常存疑，事实上小实例也经常受到随机的 DDoS 攻击。）\x3C/small>\x3C/p>\n\x3Ch2 id=\"明显的单一文化\">\x3Ca href=\"#明显的单一文化\">明显的单一文化\x3C/a>\x3C/h2>\n\x3Cp>虽然联邦宇宙并不完全是单一文化，但它太接近单一文化了，令人感到不舒服。 Mastodon 非营利组织对整个联邦机构有着巨大的影响力。 这让使用社交网络的人、Mastodon 软件和其他实例软件项目的开发人员以及实例管理员感到紧张。\x3C/p>\n\x3Cp>Mastodon 既不是联邦宇宙上唯一的平台软件，也不是第一个。 例如，\x3Ca href=\"https://friendi.ca/\">Friendica\x3C/a> 已经存在了十五年了，早在 Mastodon 软件的第一次 git 提交之前就已经存在。一些现在的联邦宇宙中运行着的 Friendica 实例（例如 pirati.ca）在十年前曾是 OStatus 宇宙的一部分！\x3C/p>\n\x3Cp>但是很多人在将整个联邦宇宙称为“Mastodon”，说的跟 Fediverse 上只存在 Mastodon 软件一样。 这导致人们经常要求 Mastodon 实现一些新功能，但其实这些功能已经由其他实例软件实现了。 \x3Ca href=\"https://calckey.org/\">Calckey\x3C/a> 已经有\x3Ca href=\"https://i.calckey.cloud/notes/994oo646qk\">引用嘟文（带评转发）\x3C/a>功能了。 Friendica 也早就有\x3Ca href=\"https://friendi.ca/about/features/\">线程对话和富文本\x3C/a>。\x3C/p>\n\x3Cp>将 Mastodon 与整个联邦宇宙等同起来对于 Mastodon 软件开发人员来说也是不利的。 这导致他们面临着被要求实现不完全适合 Mastodon 软件的功能的压力。 或者，有时候他们不得不两群吵吵囔囔的用户打交道，一群人想要某个功能，另一群人又觉得这个功能太大，实现不了。通过清楚地划出一条界限，并引导人们使用可能更适合他们的用例的其他实例软件，许多此类情况可能会更容易处理。\x3C/p>\n\x3Cp>最后，Mastodon 是目前为止（按活跃用户和实例数量衡量）最流行的 ActivityPub 协议实现。 每个实现都有其自己的特性。 随着时间的推移和新功能的实现，Mastodon 的实现可能会进一步偏离严格的规范。 毕竟，这很诱人：如果你怎么弄都是龙头老大，为什么要艰难的去实现标准协议呢？\x3C/p>\n\x3Cp>如果这真的发生了，其他所有实现是否都必须跟随它，从而变得随波逐流，没有对于事实标准的话语权？ 这是否会在 Mastodon 软件开发人员和其他实例软件项目的开发人员之间造成更多紧张关系？\x3C/p>\n\x3Cp>“Mastodon 错过了 XX 功能”的最优解并不总是“Mastodon 应该实现 XX 功能”。 通常来说，最好使用更适合特定任务或社区的不同实例软件。或者开发一个扩展协议，允许尽可能多的实例可靠地实现特别流行的功能。\x3C/p>\n\x3Cp>\x3Ca href=\"https://mstdn.social/@rysiek/109543826226766974\">但这只有在每个人都清楚 Mastodon 只是更大的社交网络：联邦宇宙 的一部分的情况下才有效\x3C/a>。 而且，对实例软件、单个实例以及移动应用程序而言，我们现在本来就有很多选择。\x3C/p>\n\x3Cp>遗憾的是，这似乎与 Eugen 最近的决定背道而驰：它们打算导向自上而下（不是完全垂直整合，但倾向于垂直整合）的官方 Mastodon 移动应用程序模型，以推广他们最大的 \x3Ca href=\"https://mastodon.social\">\x3Ccode>mastodon.social\x3C/code>\x3C/a> 实例。 在我看来，这很值得担忧。\x3C/p>\n\x3Ch2 id=\"更好的方式\">\x3Ca href=\"#更好的方式\">更好的方式\x3C/a>\x3C/h2>\n\x3Cp>我想澄清的是，我在这里并不是主张停止 Mastodon 的开发并且从不实现任何新功能。 我也同意注册流程需要比以前更好、更简化，我也同意需要实施大量 UI/UX 更改。 但所有这一切都可以并且理应以提高联邦宇宙弹性的方式进行，而不是破坏它。\x3C/p>\n\x3Ch3 id=\"必要的更改\">\x3Ca href=\"#必要的更改\">必要的更改\x3C/a>\x3C/h3>\n\x3Cp>我觉得 Mastodon 和联邦宇宙必须要更改的地方是：\x3C/p>\n\x3Col>\n\x3Cli>\x3Cstrong>现在关闭 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 上的注册\x3C/strong>\n对于联邦宇宙的其他部分来说，这个实例已经太大了，所带来的风险也太大了。\x3C/li>\n\x3Cli>\x3Cstrong>使用户迁移更加容易，甚至可以跨实例迁移\x3C/strong>\n\x3Ca href=\"https://docs.joinmastodon.org/user/moving/\">在 Mastodon 上，个人资料迁移目前仅移动关注者\x3C/a>。 您关注的人、收藏夹、屏蔽和隐藏列表都可以手动移动。 帖子和列表无法移动——这对很多人来说都是一个很大的问题，因此他们就被和他们注册的第一个实例绑在了一起。 这并不是无法克服的——笔者已经迁移了两次个人账户，感觉也很不错。但这种阻力还是太大了。 值得庆幸的是，其他一些实例软件项目也正在努力允许帖子迁移。 但这不会是一个快速而简单的解决方案，因为 ActivityPub 的设计使得在实例之间移动帖子变得非常困难。\x3Csmall>（译注：Sharkey 和 Firefish 实现了这项功能）\x3C/small>\x3C/li>\n\x3Cli>\x3Cstrong>默认情况下，官方应用程序应该随机从一些可信的实例中选一个推荐给新用户注册\x3C/strong>\n至少其中一些实例不应由 Mastodon 非营利组织控制。 理想情况下，某些实例应该运行\x3Cem lang=\"zh\">不同的实例软件\x3C/em>，只要它使用兼容的客户端 API。\x3C/li>\n\x3C/ol>\n\x3Ch3 id=\"我能做什么\">\x3Ca href=\"#我能做什么\">我能做什么？\x3C/a>\x3C/h3>\n\x3Cp>作为联邦宇宙的一员，我们可以做以下事情：\x3C/p>\n\x3Col>\n\x3Cli>\x3Cstrong>如果您在 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 上有帐户，请考虑迁移走\x3C/strong>\n的确这是有点艰难的一大步，但也是你可以做的最直接有助于解决问题的事情。 几年前，我\x3Ca href=\"https://mastodon.social/@rysiek\">从 mastodon.social \x3C/a> 迁移过来，再也没回去过。\x3C/li>\n\x3Cli>\x3Cstrong>考虑使用基于不同软件项目的实例\x3C/strong>\n越多的人迁移到使用 Mastodon 软件以外的其他实例软件的实例，我们的联邦宇宙就越平衡越有弹性。 例如，我听说很多人都觉得 \x3Ca href=\"https://calckey.social/\">Calckey\x3C/a> 不错。 \x3Ca href=\"https://gotosocial.org/\">GoToSocial\x3C/a> 看起来也很有趣。\x3C/li>\n\x3Cli>\x3Cstrong>请记住，联邦宇宙不仅仅是 Mastodon\x3C/strong>\n语言很重要。 当谈论联邦宇宙时，称其为“Mastodon”只会让我上面提到的问题更难处理。\x3C/li>\n\x3Cli>\x3Cstrong>如果可以的话，支持 Mastodon 官方项目以外的项目\x3C/strong>\n至此，Mastodon 软件项目已经拥有众多的贡献者、稳定的开发团队以及足够雄厚的资金，可以安全地持续很长一段时间。这那太棒了！但是，对于其他与联邦宇宙相关的项目，包括独立的移动应用程序或实例软件，它们没有那么受到关注。为了拥有一个多元化、有弹性的联邦宇宙，我们需要确保这些项目也在各个方面得到支持，比如金钱上。\x3C/li>\n\x3C/ol>\n\x3Ch2 id=\"结束语\">\x3Ca href=\"#结束语\">结束语\x3C/a>\x3C/h2>\n\x3Cp>首先，联邦宇宙是一个比任何中心化的孤岛更有弹性、更长期可行、更安全、更民主化的社交网络。 即使存在 Mastodon 单一文化问题，它仍然不是（并且\x3Ca href=\"https://www.pcmag.com/opinions/whats-happening-to-twitter-could-never-happen-to-mastodon\">不可能\x3C/a> ）由任何单一公司或个人拥有或控制。 我也觉得它比\x3Ca href=\"https://rys.io/en/167.html\">只是在 cosplay 去中心化的社交网络，比如 BlueSky\x3C/a> 是一个更好、更安全的选择。\x3C/p>\n\x3Cp>从某种意义上来说，OStatus 宇宙可以说是联邦宇宙的早期版本； 如前所述，当时属于其中的一些实例仍在运行，并且今天已成为联邦宇宙的一部分。 换句话说，联邦宇宙已经存在了十五年了，尽管它受到了严重的伤害，但它仍然在 identi.ca 的灾难中“幸存下来”，同时见证了 \x3Ca href=\"https://rys.io/en/162.html\">Google+ 的诞生和过早的消逝\x3C/a>。\x3C/p>\n\x3Cp>我确实相信如今的联邦宇宙比 identi.ca 重新部署之前的 OStatus 宇宙更具弹性。 就用户群而言，联邦宇宙至少要多十倍，有数十个不同的实例软件项目和数以万计的活跃实例。还有一些认真的\x3Ca href=\"https://social.network.europa.eu/explore\">机构\x3C/a>对其未来进行了投资。 我们不应该对我上面写的一切感到恐慌。 但我确实认为我们应该防患于未来。\x3C/p>\n\x3Cp>我不会将恶意归因于 Eugen 最近的行为（比如让官方 Mastodon 应用程序将新人引向 \x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a>），也不会归因于 Evan 过去的行为（在 pump.io 上重新部署 identi.ca ）。 我认为任何人都不应该这样做。 做好这件事很难，我们都在边走边学，并努力利用有限的时间和有限的资源去做到最好。\x3C/p>\n\x3Cp>Evan 后来成为 \x3Ca href=\"https://www.w3.org/TR/activitypub/\">ActivityPub\x3C/a>（联邦宇宙运行的协议）的主要创建者之一。 Eugen 发起了 Mastodon 软件项目，我坚信这个项目让联邦宇宙蓬勃发展到了今天的样子。 我真的很欣赏他们的工作，并认识到如果没有人发表意见，在社交媒体空间中做任何事情都是不可能的。\x3C/p>\n\x3Cp>然而，这并不意味着我们不能仔细思考这些决定，也不应该对此有这些意见。\x3C/p>\n\x3Chr>\n\x3Cp>更新：我（原作者）犯了一个傻傻的错误，\x3Ca href=\"https://mastodon.social\">mastodon.social\x3C/a> 由 Fastly 提供保护，我以为是 CloudFlare。修复了，感谢指出这个错误的人！\x3C/p>\n\x3Cp>更新 2：衷心感谢 \x3Ca href=\"https://hispagatos.space/@jorgesumle\">Jorge Maldonado Ventura\x3C/a> 提供了这篇博文的\x3Ca href=\"https://freakspot.net/el-problema-monocultural-de-mastodon/\">西班牙语翻译\x3C/a>，并在 \x3Ca href=\"https://creativecommons.org/licenses/by-sa/4.0/deed.es\">CC BY-SA 4.0\x3C/a> 下发布。 谢谢！\x3C/p>",headings:$R[13]=[$R[14]={depth:2,slug:"正如-ostatus-宇宙所示",text:"正如 OStatus 宇宙所示"},$R[15]={depth:3,slug:"identipocalypse-identi-的末日",text:"Identipocalypse (identi 的末日)"},$R[16]={depth:2,slug:"做大的代价",text:"做大的代价"},$R[17]={depth:2,slug:"明显的单一文化",text:"明显的单一文化"},$R[18]={depth:2,slug:"更好的方式",text:"更好的方式"},$R[19]={depth:3,slug:"必要的更改",text:"必要的更改"},$R[20]={depth:3,slug:"我能做什么",text:"我能做什么？"},$R[21]={depth:2,slug:"结束语",text:"结束语"}]});$R[22]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[23]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.querySelector("title"))?n.hasAttribute("data-dh")||n.setAttribute("data-dhf",n.textContent):(n=document.createElement("title"),document.head.appendChild(n)),n.textContent=e[1],n.setAttribute("da " href="/assets/GitalkComments-L-_uAc3p.css" onload="$dfc('0010070c')" onerror="$dfc('0010070c')"><template id="0010070c"><!--!$--><p _hk=0010070c0031000320 class="mb-2 flex flex-wrap items-baseline font-sans text-xs text-ink-faint"><!--!$--><a _hk=0010070c0031000321030 class="transition-colors hover:text-accent" href="/blog">Blog</a></p><article _hk=0010070c0031000361><header class="mb-8 border-b border-rule pb-7"><!--$--><!--/--><h1 class="text-2xl font-bold leading-snug text-balance md:text-3xl"><span _hk=0010070c00310003670 class="">Mastodon的单一文化问题</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><blockquote>
<p><strong>译者注：</strong></p>
<p>本文是 <a href="https://mstdn.social/@rysiek">Michał "rysiek" Woźniak</a> 的博客 Mastodon monoculture problem 的翻译。 source: <a href="https://rys.io/en/168.html">https://rys.io/en/168.html</a></p>
<p>对于不太懂文中的名词的人，译者额外做出一些解释：</p>
<ul>
<li><strong>联邦宇宙</strong>：Fediverse，是使用一些协议彼此链接的一系列网站/服务（被称为“实例”）的总称。在联邦宇宙，你在任何一个实例上拥有账号，你就能访问几乎整个联邦宇宙的所有内容——实例有特殊规则的时候除外。</li>
<li><strong>实例</strong>：联邦宇宙上的单独一个网站/服务。</li>
<li><strong>实例软件</strong>：运行实例使用的软件，比如 Mastodon。用一种实例软件可以搭建很多个实例。</li>
<li><strong>ActivityPub 协议</strong>：一种旨在让不同的实例之间可以互相连接，共通账号的协议。联邦宇宙实例很多使用的就是 ActivityPub 协议。</li>
<li><strong>Mastodon</strong>：连接到联邦宇宙的一个微博类社交媒体软件，有类似 Twitter 的设计。</li>
</ul>
<p>依照 <a href="https://mstdn.social/@rysiek">Michał "rysiek" Woźniak</a> 的原文 (<a href="https://rys.io/en/168.html)%EF%BC%8C%E6%9C%AC%E6%96%87%E4%BB%A5">https://rys.io/en/168.html)，本文以</a> <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans">CC-BY-SA 4.0</a> 协议发布。您可以自由地共享、演绎本作品，但是必须署名、以相同方式共享 - 如果您再混合、转换或者基于本作品进行创作，您必须基于与原先许可协议相同的许可协议分发您贡献的作品。</p>
</blockquote>
<hr>
<p><a href="https://joinmastodon.org/about">Mastodon 非营利组织</a>的首席执行官兼 <a href="https://github.com/mastodon/mastodon">Mastodon 软件</a>的首席开发者 Eugen Rochko（在联邦宇宙上被称为 Gargron）最近的举动让一些人<a href="https://mstdn.social/@atomicpoet@mastodon.social/110300834063046929">担心</a> Mastodon 该软件项目，同时也是该非盈利组织对联邦宇宙的其余部分造成的<a href="https://mstdn.social/@feditips/110260432218416976">巨大影响</a>。</p>
<p>确实。我们就是应该担心。</p>
<p>到目前为止，联邦宇宙上大多数人都在使用 Mastodon 软件。 截至撰写本文时，最大的实例 <a href="https://mastodon.social"><code>mastodon.social</code></a> 拥有超过 200,000 个活跃帐户。 这意味着这单独一个实例上涵括了<a href="https://the-federation.info/">整个联邦宇宙</a>的大约 1/10。 更糟糕的是，Mastodon 软件经常被认为是整个社交网络，这掩盖了一个真相： <a href="https://axbom.com/fediverse/">Fediverse 是一个由更多样化的软件们组成的更广泛的系统</a>。</p>
<p>现在它就已经产生了糟糕的后果，而且以后可能会更糟。 让我困扰的还有，我以前也见过这样的情况：</p>
<h2 id="正如-ostatus-宇宙所示"><a href="#正如-ostatus-宇宙所示">正如 OStatus 宇宙所示</a></h2>
<p>几年前，我在联邦宇宙的前身有一个账户。 它主要基于 StatusNet 软件（后来更名为 <a href="https://en.wikipedia.org/wiki/GNU_social">GNU Social</a>）和 <a href="https://en.wikipedia.org/wiki/OStatus">OStatus 协议</a>。 最大的实例是 <a href="https://identi.ca"><code>identi.ca</code></a> ——笔者在那里拥有自己的账户。 同时还有很多其他实例、其他软件项目也实现了 OStatus 协议——例如 <a href="https://friendi.ca/">Friendica</a>。</p>
<p>出于本博文的需要，我们将该社交网络称为“OStatus 宇宙”。</p>
<p>与今天的联邦宇宙相比，OStatus 宇宙是微不足道的。 我没有具体的数字，但我的粗略估计是，即使在最活跃的时候，也只有大约 100,000 到 200,000 个活跃帐户（如果你有实际数字，<a href="https://rys.io/en/about.html">请告诉我</a>，我将很乐意更新这篇博客）。 我也没有 <a href="https://identi.ca"><code>identi.ca</code></a> 上用户数目的确切数字，但我粗略估计它有 10,000 到 20,000 个活跃帐户。</p>
<p>对，刚好也是整个社交网络的 1/10。</p>
<p>OStatus 宇宙虽小但很活跃。我们在上面有讨论、线程回复（threads）和话题标签（hashtags）。 它早在 Mastodon 软件项目实现 Group 的十年前就实现了群组。它有桌面应用程序——我仍然怀念 <a href="https://choqok.kde.org/">Choqok</a> 的可用性！ 甚至经过一番唠叨后，我还说服了波兰的一个政府部门在那里设立<a href="https://web.archive.org/web/20121122021505/http://identi.ca/maic">官方办事处</a>。 据我所知，这是最早的政府机构在自由软件驱动的去中心化社交网络上拥有官方账户的例子。</p>
<h3 id="identipocalypse-identi-的末日"><a href="#identipocalypse-identi-的末日">Identipocalypse (identi 的末日)</a></h3>
<p>然后有一天，<a href="https://identi.ca"><code>identi.ca</code></a> 的管理员（也是 StatusNet 软件的原始创建者）Evan Prodromou <a href="https://lwn.net/Articles/544347/">决定将其重构为一项新服务</a>，即 <a href="https://pump.io"><code>pump.io</code></a>。 他们希望新软件<a href="https://opensource.com/life/13/7/pump-io">更好、更精简</a>。 他们创建了一个新协议，因为 OStatus 协议有非常现实的限制。</p>
<p>只有一个问题：新协议与 OStatus 宇宙的其它部分不兼容。它把这个社交网络撕碎了。</p>
<p>拥有 <code>identi.ca</code> 帐户的用户与所有其他 OStatus 实例失去了连接。 在其它实例上拥有帐户的人与 <code>identi.ca</code> 上的人失去了联系，并且其中一些人在 OStatus 宇宙中非常受欢迎（听起来很熟悉？..）。</p>
<p>事实证明，如果一个实例占据了整个社交网络的 1/10，那么它就会承载太多的社交联系。尽管的确存在其他实例，但突然间大量活跃用户消失了。一些群组瞬间就变得安安静静。 即使有人在不同的实例上有一个帐户，并且在其他实例上有联系人，很多熟悉的面孔也会消失。 于是此后不久我就停止使用它了。</p>
<p>从笔者的角度来看，就这么一项行为，就使得我们在推广去中心化社交媒体方面至少倒退了五年甚至十年。 <a href="https://identi.ca"><code>identi.ca</code></a> 的重构不仅在社交关系意义上破坏了 OStatus 宇宙，而且在协议和开发者社区意义上也是。 正如 <a href="https://mastodon.acc.umu.se/@pettter">Pettter</a>，一位 OStatus 资深人士所说：</p>
<blockquote>
<p>我认为，这个巨变带来的影响是，它不仅切断了社交联系，还导致了协议变得支离破碎，一次又一次地让重建联合社交网络的基本架构的努力付诸东流。 也许这是他们重新聚集在一起设计 ActivityPub 的必要步骤，但我个人不这么认为。</p>
</blockquote>
<p>当然，Evan 完全有权利这样做，毕竟这是他用自己的钱、按照自己的条款无偿经营的一项服务。 但这并不能改变它割裂了 OStatus 宇宙的事实。</p>
<p>我认为我们需要从这段历史中吸取教训。<a href="https://social.lol/@mcg/110302174281035077">我们应该担心 <code>mastodon.social</code> 的庞大规模</a>。 我们应该为联邦宇宙上 Mastodon 软件明显的单一文化感到担忧。 我们还应该担心将整个联邦宇宙与“Mastodon”等同起来。</p>
<h2 id="做大的代价"><a href="#做大的代价">做大的代价</a></h2>
<p>发展到像 <a href="https://mastodon.social"><code>mastodon.social</code></a> 这样的规模，需要付出相当的成本和风险。 这些成本，尤其是那些风险，既针对该实例本身，也针对更广泛的 Fediverse。</p>
<p>Fediverse 上的审核很大程度上以实例为中心。 单个巨大的实例<a href="https://mastodon.social/@Gargron/109383947978442853">很难有效地管理</a>，特别是如果它开放注册（就像 <a href="https://mastodon.social"><code>mastodon.social</code></a> 目前所做的那样）。 作为直接在官方移动应用程序中推广的旗舰实例，它吸引了大量新注册，其中包括<a href="https://tech.lgbt/@asahi95/110310499987010451">不少不太友好的用户</a>。</p>
<p>同时，这也使得其他实例的管理员和版主更难以做出有关 <a href="https://mastodon.social">mastodon.social</a> 的审核决定。</p>
<p>如果其它实例的管理员认为 <a href="https://mastodon.social">mastodon.social</a> 出于某种原因缺乏管理，他们是否应该静音该实例，甚至将其屏蔽（显然，有些人已经这样做了），代价是让本站的用户无法联络许多在 <code>mastodon.social</code> 有账户的受欢迎的人？或者、他们就应该冒着让自己的社区面临潜在有害行为的风险，保留这种联络的可能性吗？</p>
<p><a href="https://mastodon.social">mastodon.social</a> 的庞大规模使得任何其他实例的管理决策成为了一件大事。 这是某种形式上的特权：“当然，如果您不喜欢我们的管理方式，您可以封掉我们，但如果您实例上的用户无法访问整个联邦宇宙的 1/10，那将是一种耻辱！” 正如 <a href="https://gotosocial.org/">GoToSocial 网站所说</a>：</p>
<blockquote>
<p>我们也不认为拥有成千上万用户的旗舰实例对联邦宇宙来说很有好处，因为它们会导致中心化，并且很容易变得“太大而不敢屏蔽”。</p>
</blockquote>
<p>请注意，我并不是说这种权力动态是有意识地、有目的地利用的！ 但不可否认，它是存在的。</p>
<p>作为一个巨大的旗舰实例也意味着 <a href="https://mastodon.social"><code>mastodon.social</code></a> 更有可能成为恶意行为的目标。 例如，在过去几个月中，它多次<a href="https://mastodon.social/@Gargron/109781490892884305">受到 DDoS 攻击</a>，并且好几次都因为这个而<a href="https://status.mastodon.social/clf5ti6d818413wsobkvn2zruj">无法访问</a>。 联邦系统的可靠性依赖于消除大的故障点，而 <a href="https://mastodon.social">mastodon.social</a> 现在已经是一个巨大的故障点了。</p>
<p>该实例的规模让它成为了一个诱人的攻击目标，这也意味着它需要做出某些艰难的选择。 例如，由于经常成为 DDoS 的目标，它现在由 Fastly 保护。 从隐私角度和互联网基础设施中心化的角度，<a href="https://spheron.medium.com/the-fastly-internet-outage-shows-the-fallibility-of-leaving-so-much-power-in-the-hands-of-so-few-a234a1bd9fe1">这是一个问题</a>。 这也是较小的实例完全避免的一个问题，因为它们很小，很少有人会无聊到 DDoS 攻击它们。</p>
<p><small>（译者注：这方面译者非常存疑，事实上小实例也经常受到随机的 DDoS 攻击。）</small></p>
<h2 id="明显的单一文化"><a href="#明显的单一文化">明显的单一文化</a></h2>
<p>虽然联邦宇宙并不完全是单一文化，但它太接近单一文化了，令人感到不舒服。 Mastodon 非营利组织对整个联邦机构有着巨大的影响力。 这让使用社交网络的人、Mastodon 软件和其他实例软件项目的开发人员以及实例管理员感到紧张。</p>
<p>Mastodon 既不是联邦宇宙上唯一的平台软件，也不是第一个。 例如，<a href="https://friendi.ca/">Friendica</a> 已经存在了十五年了，早在 Mastodon 软件的第一次 git 提交之前就已经存在。一些现在的联邦宇宙中运行着的 Friendica 实例（例如 pirati.ca）在十年前曾是 OStatus 宇宙的一部分！</p>
<p>但是很多人在将整个联邦宇宙称为“Mastodon”，说的跟 Fediverse 上只存在 Mastodon 软件一样。 这导致人们经常要求 Mastodon 实现一些新功能，但其实这些功能已经由其他实例软件实现了。 <a href="https://calckey.org/">Calckey</a> 已经有<a href="https://i.calckey.cloud/notes/994oo646qk">引用嘟文（带评转发）</a>功能了。 Friendica 也早就有<a href="https://friendi.ca/about/features/">线程对话和富文本</a>。</p>
<p>将 Mastodon 与整个联邦宇宙等同起来对于 Mastodon 软件开发人员来说也是不利的。 这导致他们面临着被要求实现不完全适合 Mastodon 软件的功能的压力。 或者，有时候他们不得不两群吵吵囔囔的用户打交道，一群人想要某个功能，另一群人又觉得这个功能太大，实现不了。通过清楚地划出一条界限，并引导人们使用可能更适合他们的用例的其他实例软件，许多此类情况可能会更容易处理。</p>
<p>最后，Mastodon 是目前为止（按活跃用户和实例数量衡量）最流行的 ActivityPub 协议实现。 每个实现都有其自己的特性。 随着时间的推移和新功能的实现，Mastodon 的实现可能会进一步偏离严格的规范。 毕竟，这很诱人：如果你怎么弄都是龙头老大，为什么要艰难的去实现标准协议呢？</p>
<p>如果这真的发生了，其他所有实现是否都必须跟随它，从而变得随波逐流，没有对于事实标准的话语权？ 这是否会在 Mastodon 软件开发人员和其他实例软件项目的开发人员之间造成更多紧张关系？</p>
<p>“Mastodon 错过了 XX 功能”的最优解并不总是“Mastodon 应该实现 XX 功能”。 通常来说，最好使用更适合特定任务或社区的不同实例软件。或者开发一个扩展协议，允许尽可能多的实例可靠地实现特别流行的功能。</p>
<p><a href="https://mstdn.social/@rysiek/109543826226766974">但这只有在每个人都清楚 Mastodon 只是更大的社交网络：联邦宇宙 的一部分的情况下才有效</a>。 而且，对实例软件、单个实例以及移动应用程序而言，我们现在本来就有很多选择。</p>
<p>遗憾的是，这似乎与 Eugen 最近的决定背道而驰：它们打算导向自上而下（不是完全垂直整合，但倾向于垂直整合）的官方 Mastodon 移动应用程序模型，以推广他们最大的 <a href="https://mastodon.social"><code>mastodon.social</code></a> 实例。 在我看来，这很值得担忧。</p>
<h2 id="更好的方式"><a href="#更好的方式">更好的方式</a></h2>
<p>我想澄清的是，我在这里并不是主张停止 Mastodon 的开发并且从不实现任何新功能。 我也同意注册流程需要比以前更好、更简化，我也同意需要实施大量 UI/UX 更改。 但所有这一切都可以并且理应以提高联邦宇宙弹性的方式进行，而不是破坏它。</p>
<h3 id="必要的更改"><a href="#必要的更改">必要的更改</a></h3>
<p>我觉得 Mastodon 和联邦宇宙必须要更改的地方是：</p>
<ol>
<li><strong>现在关闭 <a href="https://mastodon.social">mastodon.social</a> 上的注册</strong>
对于联邦宇宙的其他部分来说，这个实例已经太大了，所带来的风险也太大了。</li>
<li><strong>使用户迁移更加容易，甚至可以跨实例迁移</strong>
<a href="https://docs.joinmastodon.org/user/moving/">在 Mastodon 上，个人资料迁移目前仅移动关注者</a>。 您关注的人、收藏夹、屏蔽和隐藏列表都可以手动移动。 帖子和列表无法移动——这对很多人来说都是一个很大的问题，因此他们就被和他们注册的第一个实例绑在了一起。 这并不是无法克服的——笔者已经迁移了两次个人账户，感觉也很不错。但这种阻力还是太大了。 值得庆幸的是，其他一些实例软件项目也正在努力允许帖子迁移。 但这不会是一个快速而简单的解决方案，因为 ActivityPub 的设计使得在实例之间移动帖子变得非常困难。<small>（译注：Sharkey 和 Firefish 实现了这项功能）</small></li>
<li><strong>默认情况下，官方应用程序应该随机从一些可信的实例中选一个推荐给新用户注册</strong>
至少其中一些实例不应由 Mastodon 非营利组织控制。 理想情况下，某些实例应该运行<em lang="zh">不同的实例软件</em>，只要它使用兼容的客户端 API。</li>
</ol>
<h3 id="我能做什么"><a href="#我能做什么">我能做什么？</a></h3>
<p>作为联邦宇宙的一员，我们可以做以下事情：</p>
<ol>
<li><strong>如果您在 <a href="https://mastodon.social">mastodon.social</a> 上有帐户，请考虑迁移走</strong>
的确这是有点艰难的一大步，但也是你可以做的最直接有助于解决问题的事情。 几年前，我<a href="https://mastodon.social/@rysiek">从 mastodon.social </a> 迁移过来，再也没回去过。</li>
<li><strong>考虑使用基于不同软件项目的实例</strong>
越多的人迁移到使用 Mastodon 软件以外的其他实例软件的实例，我们的联邦宇宙就越平衡越有弹性。 例如，我听说很多人都觉得 <a href="https://calckey.social/">Calckey</a> 不错。 <a href="https://gotosocial.org/">GoToSocial</a> 看起来也很有趣。</li>
<li><strong>请记住，联邦宇宙不仅仅是 Mastodon</strong>
语言很重要。 当谈论联邦宇宙时，称其为“Mastodon”只会让我上面提到的问题更难处理。</li>
<li><strong>如果可以的话，支持 Mastodon 官方项目以外的项目</strong>
至此，Mastodon 软件项目已经拥有众多的贡献者、稳定的开发团队以及足够雄厚的资金，可以安全地持续很长一段时间。这那太棒了！但是，对于其他与联邦宇宙相关的项目，包括独立的移动应用程序或实例软件，它们没有那么受到关注。为了拥有一个多元化、有弹性的联邦宇宙，我们需要确保这些项目也在各个方面得到支持，比如金钱上。</li>
</ol>
<h2 id="结束语"><a href="#结束语">结束语</a></h2>
<p>首先，联邦宇宙是一个比任何中心化的孤岛更有弹性、更长期可行、更安全、更民主化的社交网络。 即使存在 Mastodon 单一文化问题，它仍然不是（并且<a href="https://www.pcmag.com/opinions/whats-happening-to-twitter-could-never-happen-to-mastodon">不可能</a> ）由任何单一公司或个人拥有或控制。 我也觉得它比<a href="https://rys.io/en/167.html">只是在 cosplay 去中心化的社交网络，比如 BlueSky</a> 是一个更好、更安全的选择。</p>
<p>从某种意义上来说，OStatus 宇宙可以说是联邦宇宙的早期版本； 如前所述，当时属于其中的一些实例仍在运行，并且今天已成为联邦宇宙的一部分。 换句话说，联邦宇宙已经存在了十五年了，尽管它受到了严重的伤害，但它仍然在 identi.ca 的灾难中“幸存下来”，同时见证了 <a href="https://rys.io/en/162.html">Google+ 的诞生和过早的消逝</a>。</p>
<p>我确实相信如今的联邦宇宙比 identi.ca 重新部署之前的 OStatus 宇宙更具弹性。 就用户群而言，联邦宇宙至少要多十倍，有数十个不同的实例软件项目和数以万计的活跃实例。还有一些认真的<a href="https://social.network.europa.eu/explore">机构</a>对其未来进行了投资。 我们不应该对我上面写的一切感到恐慌。 但我确实认为我们应该防患于未来。</p>
<p>我不会将恶意归因于 Eugen 最近的行为（比如让官方 Mastodon 应用程序将新人引向 <a href="https://mastodon.social">mastodon.social</a>），也不会归因于 Evan 过去的行为（在 pump.io 上重新部署 identi.ca ）。 我认为任何人都不应该这样做。 做好这件事很难，我们都在边走边学，并努力利用有限的时间和有限的资源去做到最好。</p>
<p>Evan 后来成为 <a href="https://www.w3.org/TR/activitypub/">ActivityPub</a>（联邦宇宙运行的协议）的主要创建者之一。 Eugen 发起了 Mastodon 软件项目，我坚信这个项目让联邦宇宙蓬勃发展到了今天的样子。 我真的很欣赏他们的工作，并认识到如果没有人发表意见，在社交媒体空间中做任何事情都是不可能的。</p>
<p>然而，这并不意味着我们不能仔细思考这些决定，也不应该对此有这些意见。</p>
