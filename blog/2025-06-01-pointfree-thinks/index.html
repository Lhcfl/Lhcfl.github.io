transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#从猫头鹰运算符说起" class="text-ink-soft hover:text-accent">从猫头鹰运算符说起……</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#喂喂你-pointless-了" class="text-ink-soft hover:text-accent">喂喂你 Pointless 了！</a></li></ul></nav></aside></div></div></body></html><script>($R[16]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"Point-free Style 思考",date:"2025-06-01T23:21:32",tags:$R[11]=["Functional","Haskell","Code"],copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"Point-free Style 思考",html:"\x3Cblockquote>\n\x3Cp>Point-free style can (clearly) lead to Obfuscation when used unwisely. As higher-order functions are chained together, it can become harder to mentally infer the types of expressions. The mental cues to an expression's type (explicit function arguments, and the number of arguments) go missing.\x3C/p>\n\x3C/blockquote>\n\x3Cp>\x3Ca href=\"https://wiki.haskell.org/Pointfree\">https://wiki.haskell.org/Pointfree\x3C/a>\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"从猫头鹰运算符说起\">\x3Ca href=\"#从猫头鹰运算符说起\">从猫头鹰运算符说起……\x3C/a>\x3C/h2>\n\x3Cp>The owl \x3Ccode>((.)$(.))\x3C/code> has type \x3Ccode>(a -> b -> c) -> a -> (a1 -> b) -> a1 -> c\x3C/code>, and in pointful style can be written as \x3Ccode>\\a b c d -> a b (c d)\x3C/code>.\x3C/p>\n\x3Cp>Example\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>> ((.)$(.)) (==) 1 (1+) 0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>True\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>相信大家看到这个抽象东西第一反应是 “什么勾八玩意” 吧！但是其实它还是挺好理解的，只要知道\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> f g x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> f \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">g x\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">$\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> id\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>所以这个运算符其实是 \x3Ccode>id (.) (.)\x3C/code>\x3C/p>\n\x3Cp>也就是 \x3Ccode>(.) (.)\x3C/code> \x3Cdel>这个是不是叫奶子运算符\x3C/del>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> $ \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b     =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">   -- 补充两个被省略的参数\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c d =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">c d\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> -- 补充两个被省略的参数\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c d =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> a b \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">c d\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">   -- 消去冗余括号\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>猫头鹰还有一个进阶版本：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>((.).(.))\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>它也可以用类似的方式推导\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a       =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> a\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">     -- 补充一个被省略的参数\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c   =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> a\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> b c -- 补充两个被省略的参数\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c   =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> a\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b c\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">   -- 一次消去\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c   =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b c\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">     -- 冗余括号消去\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c d =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b c\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> d   -- 再补个参数\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c d =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b c\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> d\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">     -- 消去\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  = λ a b c d =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b c d\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">       -- 消去冗余括号\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch2 id=\"喂喂你-pointless-了\">\x3Ca href=\"#喂喂你-pointless-了\">喂喂你 Pointless 了！\x3C/a>\x3C/h2>\n\x3Cp>Point-free 当然不全是这样的奇技淫巧 —— 当然这个也称不上多奇技淫巧，简单的 β-规约 而已\x3C/p>\n\x3Cp>Point-free 虽然看上去眼花缭乱，但是它其实是培养你对于函数是一等公民，以及函数是一个整体，并且是一个可以用于构建更复杂函数的基本单位的这样一种认知。这在组合子里面非常有用。\x3C/p>\n\x3Cp>当然大家还是一般不会用 \x3Ccode>(.).(.)\x3C/code> 这么抽象的东西的……这样写就真的 Pointless 了\x3C/p>\n\x3Cp>当你写下\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">sum' xs \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> foldr \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">+\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3Cspan style=\"color:#24292E\"> xs\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>的时候，应该能很容易意识到\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">sum \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> foldr \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">+\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这件事，因为 \x3Ccode>foldr (+) 0\x3C/code> 实际上组合出了 sum 的逻辑。而一个熟练的函数式写手，应该对后者更熟悉而不是前者。\x3C/p>\n\x3Cp>拿 Parser Combinator 举例子，我在\x3Ca href=\"/blog/2025-04-13-lean4-parser-combinator\">学习在 Lean4 中使用 Parser Combinator\x3C/a> 中很自然而然地写下了 pointfree 的逻辑，因为只要你把 parser 的函数看成可以组合的积木，而不需要关心它的实际参数来源的话，pointfree 写法就是最自然的：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">mutual\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  partial\x3C/span>\x3Cspan style=\"color:#D73A49\"> def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseArray\x3C/span>\x3Cspan style=\"color:#24292E\"> : Parser Json := \x3C/span>\x3Cspan style=\"color:#D73A49\">do\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    _ ← char \x3C/span>\x3Cspan style=\"color:#032F62\">'['\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    _ ← whitespaces\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#24292E\"> elems ← sepBy parseJson \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">char \x3C/span>\x3Cspan style=\"color:#032F62\">','\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    _ ← whitespaces\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    _ ← char \x3C/span>\x3Cspan style=\"color:#032F62\">']'\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#24292E\"> Json.arr elems\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\ pan _hk=0010070c00310003670 class="">Point-free Style 思考</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><blockquote>
<p>Point-free style can (clearly) lead to Obfuscation when used unwisely. As higher-order functions are chained together, it can become harder to mentally infer the types of expressions. The mental cues to an expression's type (explicit function arguments, and the number of arguments) go missing.</p>
</blockquote>
<p><a href="https://wiki.haskell.org/Pointfree">https://wiki.haskell.org/Pointfree</a></p>

<h2 id="从猫头鹰运算符说起"><a href="#从猫头鹰运算符说起">从猫头鹰运算符说起……</a></h2>
<p>The owl <code>((.)$(.))</code> has type <code>(a -> b -> c) -> a -> (a1 -> b) -> a1 -> c</code>, and in pointful style can be written as <code>\a b c d -> a b (c d)</code>.</p>
<p>Example</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>> ((.)$(.)) (==) 1 (1+) 0</span></span>
<span class="line"><span>True</span></span></code></pre>
<p>相信大家看到这个抽象东西第一反应是 “什么勾八玩意” 吧！但是其实它还是挺好理解的，只要知道</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">(</span><span style="color:#6F42C1">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> f g x </span><span style="color:#D73A49">=</span><span style="color:#24292E"> f </span><span style="color:#005cc5">(</span><span style="color:#24292E">g x</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#005cc5">(</span><span style="color:#6F42C1">$</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> id</span></span></code></pre>
<p>所以这个运算符其实是 <code>id (.) (.)</code></p>
<p>也就是 <code>(.) (.)</code> <del>这个是不是叫奶子运算符</del></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> $ </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  = </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  = λ a b     =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a b</span><span style="color:#005cc5">)</span><span style="color:#24292E">   -- 补充两个被省略的参数</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c d =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">c d</span><span style="color:#005cc5">)</span><span style="color:#24292E"> -- 补充两个被省略的参数</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c d =</span><span style="color:#24292E">></span><span style="color:#24292E"> a b </span><span style="color:#005cc5">(</span><span style="color:#24292E">c d</span><span style="color:#005cc5">)</span><span style="color:#24292E">   -- 消去冗余括号</span></span></code></pre>
<p>猫头鹰还有一个进阶版本：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>((.).(.))</span></span></code></pre>
<p>它也可以用类似的方式推导</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#24292E">.</span><span style="color:#e36209">)</span><span style="color:#24292E">.</span><span style="color:#e36209">(</span><span style="color:#24292E">.</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  = λ a       =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#24292E">.</span><span style="color:#e36209">)</span><span style="color:#24292E"> a</span><span style="color:#005cc5">)</span><span style="color:#24292E">     -- 补充一个被省略的参数</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c   =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#24292E">.</span><span style="color:#e36209">)</span><span style="color:#24292E"> a</span><span style="color:#005cc5">)</span><span style="color:#24292E"> b c -- 补充两个被省略的参数</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c   =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#24292E">.</span><span style="color:#e36209">)</span><span style="color:#24292E"> a</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">b c</span><span style="color:#005cc5">)</span><span style="color:#24292E">   -- 一次消去</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c   =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> a </span><span style="color:#005cc5">(</span><span style="color:#24292E">b c</span><span style="color:#005cc5">)</span><span style="color:#24292E">     -- 冗余括号消去</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c d =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.</span><span style="color:#005cc5">)</span><span style="color:#24292E"> a </span><span style="color:#005cc5">(</span><span style="color:#24292E">b c</span><span style="color:#005cc5">)</span><span style="color:#24292E"> d   -- 再补个参数</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c d =</span><span style="color:#24292E">></span><span style="color:#24292E"> a </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#24292E">b c</span><span style="color:#e36209">)</span><span style="color:#24292E"> d</span><span style="color:#005cc5">)</span><span style="color:#24292E">     -- 消去</span></span>
<span class="line"><span style="color:#24292E">  = λ a b c d =</span><span style="color:#24292E">></span><span style="color:#24292E"> a </span><span style="color:#005cc5">(</span><span style="color:#24292E">b c d</span><span style="color:#005cc5">)</span><span style="color:#24292E">       -- 消去冗余括号</span></span></code></pre>
<h2 id="喂喂你-pointless-了"><a href="#喂喂你-pointless-了">喂喂你 Pointless 了！</a></h2>
<p>Point-free 当然不全是这样的奇技淫巧 —— 当然这个也称不上多奇技淫巧，简单的 β-规约 而已</p>
<p>Point-free 虽然看上去眼花缭乱，但是它其实是培养你对于函数是一等公民，以及函数是一个整体，并且是一个可以用于构建更复杂函数的基本单位的这样一种认知。这在组合子里面非常有用。</p>
<p>当然大家还是一般不会用 <code>(.).(.)</code> 这么抽象的东西的……这样写就真的 Pointless 了</p>
<p>当你写下</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">sum' xs </span><span style="color:#D73A49">=</span><span style="color:#24292E"> foldr </span><span style="color:#005cc5">(</span><span style="color:#6F42C1">+</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005CC5">0</span><span style="color:#24292E"> xs</span></span></code></pre>
<p>的时候，应该能很容易意识到</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">sum </span><span style="color:#D73A49">=</span><span style="color:#24292E"> foldr </span><span style="color:#005cc5">(</span><span style="color:#6F42C1">+</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005CC5">0</span></span></code></pre>
<p>这件事，因为 <code>foldr (+) 0</code> 实际上组合出了 sum 的逻辑。而一个熟练的函数式写手，应该对后者更熟悉而不是前者。</p>
