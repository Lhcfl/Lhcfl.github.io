span style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;operator\x3C/span>\x3Cspan style=\"color:#6F42C1\">=\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> _None_t\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    has_val \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> false\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#005CC5\">this\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>The correctness of this is obvious, but it is not guaranteed to always compile. Obviously, \x3Ccode>T\x3C/code> may have to be initialized with a meaningful parameter. This makes it impossible for our \x3Ccode>option&#x3C;T>\x3C/code> to be \x3Ccode>None\x3C/code> in this case.\n这样做的正确性当然是显然的，但是它不保证总是能编译。显然，\x3Ccode>T\x3C/code> 有可能必须要一个有意义的参数来初始化。这使得对于这种情况，我们的 \x3Ccode>option&#x3C;T>\x3C/code> 根本无法为 \x3Ccode>None\x3C/code>。\x3C/p>\n\x3Cp>To solve this situation, we naturally think of pointers. A pointer can always be \x3Ccode>nullptr\x3C/code> unless it is allocated with a real value, so we can rewrite our \x3Ccode>option&#x3C;T>\x3C/code> as a alias of \x3Ccode>std::unique_ptr&#x3C;T>\x3C/code>, adding an additional function \x3Ccode>has_value() const\x3C/code> to check if it is \x3Ccode>nullptr\x3C/code>, and a copy constructor. Such a class is easy to write, but it obviously still has disadvantages. The biggest disadvantage is that it needs to dynamically allocate memory, and on the heap, which seriously slows down our \x3Ccode>option&#x3C;T>\x3C/code>.\n为了解决这个情况，我们自然会想到指针。指针在除非它被赋予一个真正的值之前可以一直是 \x3Ccode>nullptr\x3C/code>，因此我们可以重写我们的 \x3Ccode>option&#x3C;T>\x3C/code> 为一个 \x3Ccode>std::unique_ptr&#x3C;T>\x3C/code> 的重命名，添加了一个额外的函数 \x3Ccode>has_value() const\x3C/code> 判断它是不是 \x3Ccode>nullptr\x3C/code>，并添加复制构造。这样的类很容易写出，但是它显然仍然有缺点。最大的缺点是它需要动态分配内存，而且是在堆上，这严重拖慢了我们的 \x3Ccode>option&#x3C;T>\x3C/code> 的速度。\x3C/p>\n\x3Cp>To solve this problem, we will use \x3Ccode>union\x3C/code>, a keyword inherited from C that allows multiple different types to coexist in the same memory position. But here \x3Ccode>union\x3C/code> has another use: shielding the constructor and destructor of \x3Ccode>T\x3C/code> and letting us manage it ourselves.\n为了解决这个问题我们会使用 \x3Ccode>union\x3C/code>，这个继承自 C 的关键字可以将多个不同类型共存于同一块内存空间。但在这里 \x3Ccode>union\x3C/code> 另一个用途：屏蔽 \x3Ccode>T\x3C/code> 的构造函数和析构函数，让我们自己托管它。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">template\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">typename\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">class\x3C/span>\x3Cspan style=\"color:#6F42C1\"> option\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  union\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    T\x3C/span>\x3Cspan style=\"color:#24292E\"> val;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  bool\x3C/span>\x3Cspan style=\"color:#24292E\"> has_val;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>In the above definition we put \x3Ccode>T\x3C/code> in a \x3Ccode>union\x3C/code>, which disables the constructor and destructor of \x3Ccode>T\x3C/code>. Next, when we need to make sure that \x3Ccode>option\x3C/code> actually has a \x3Ccode>T\x3C/code>, we use \x3Ca href=\"https://en.cppreference.com/w/cpp/language/new\">placement new\x3C/a> to construct \x3Ccode>T\x3C/code> in place.\n在上面的定义中我们把 \x3Ccode>T\x3C/code> 放在 \x3Ccode>union\x3C/code> 中，这禁用了 \x3Ccode>T\x3C/code> 的构造和析构函数。接下来，当我们需要让 \x3Ccode>option\x3C/code> 里面真的有 \x3Ccode>T\x3C/code> 的时候，我们用 \x3Ca href=\"https://zh.cppreference.com/w/cpp/language/new\">placement new\x3C/a> 原地构造 \x3Ccode>T\x3C/code>。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">T \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">move\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan an>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.val\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>This looks perfect. In fact, it does roughly meet our needs, but is that enough? Suppose we have a custom class that needs to use \x3Ccode>string\x3C/code> as a constructor. A \x3Ccode>string\x3C/code> can certainly be constructed with \x3Ccode>const char*\x3C/code>, so we naturally try to construct it with a string literal, like this. But does it really work as we wish? Guess if the following code will compile?\n这看上去非常完美。实际上，它也确实能很大程度上满足了我们的需求，但是让我们精益求精。假如我们有一个自定义类，需要用到 \x3Ccode>string\x3C/code> 作为构造函数。一个 \x3Ccode>string\x3C/code> 当然可以用 \x3Ccode>const char*\x3C/code> 来构造，所以我们自然而然地尝试用字符串字面量来构造它，就像这样。但是它真的能如我所愿吗？猜猜下面的代码会不会通过编译？\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">struct\x3C/span>\x3Cspan style=\"color:#6F42C1\"> StringWrapper\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">string\x3C/span>\x3Cspan style=\"color:#24292E\"> s;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  StringWrapper\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">string\x3C/span>\x3Cspan style=\"color:#E36209\"> str\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">s\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">move\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">StringWrapper\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">test\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"123\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // opt_test.cpp: In function 'int main()':\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // opt_test.cpp:123:45: error: no matching function for call to 'option&#x3C;StringWrapper>::option(const char [4])'\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>The answer is no! You need to explicitly construct a \x3Ccode>StringWrapper\x3C/code> object to call the \x3Ccode>option&#x3C;StringWrapper>\x3C/code> constructor, because the \x3Ccode>option&#x3C;StringWrapper>\x3C/code> call function does not accept \x3Ccode>const char [4]\x3C/code> as a parameter. C++ will not automatically \"forward\" it.\n答案是否定的！你需要显式构造一个 \x3Ccode>StringWrapper\x3C/code> 对象才能调用 \x3Ccode>option&#x3C;StringWrapper>\x3C/code> 的构造函数，因为 \x3Ccode>option&#x3C;StringWrapper>\x3C/code> 的调用函数并不能接受 \x3Ccode>const char [4]\x3C/code> 作为参数。C++ s 不会自动“转发”它。\x3C/p>\n\x3Ch2 id=\"universal-referances\">\x3Ca href=\"#universal-referances\">Universal Referances\x3C/a>\x3C/h2>\n\x3Cp>\x3Cstrong>通用引用\x3C/strong>\x3C/p>\n\x3Cp>In order to forward the arguments to \x3Ccode>T\x3C/code>'s constructor, as if our \x3Ccode>option&#x3C;T>\x3C/code> is actually \x3Ccode>T\x3C/code>, we need to use perfect forwarding and universal references.\n为了转发参数到 T 的构造函数，就像我们的 \x3Ccode>option&#x3C;T>\x3C/code> 实际上是 \x3Ccode>T\x3C/code> 一样，我们需要用到完美转发和通用引用。\x3C/p>\n\x3Cblockquote>\n\x3Cp>In fact, “T&#x26;&#x26;” has two different meanings. One is rvalue reference, of course. Such references behave exactly the way you expect: they bind only to rvalues, and their primary raison d’être is to identify objects that may be moved from.\n事实上，“T&#x26;&#x26;”有两种不同的意思。第一种，当然是右值引用。这种引用表现得正如你所期待的那样：它们只绑定到右值上，并且它们主要的存在原因就是为了识别可以移动操作的对象。\nThe other meaning for “T&#x26;&#x26;” is either rvalue reference or lvalue reference. Such references look like rvalue references in the source code (i.e., “T&#x26;&#x26;”), but they can behave as if they were lvalue references (i.e., “T&#x26;”). Their dual nature permits them to bind to rvalues (like rvalue references) as well as lvalues (like lvalue references). Furthermore, they can bind to const or non-const objects, to volatile or non-volatile objects, even to objects that are both const and volatile. They can bind to virtually anything. Such unprecedentedly flexible references deserve a name of their own. I call them universal references.\n“T&#x26;&#x26;”的另一种意思是，它既可以是右值引用，也可以是左值引用。这种引用在源码里看起来像右值引用（即“T&#x26;&#x26;”），但是它们可以表现得像是左值引用（即“T&#x26;”）。它们的二重性使它们既可以绑定到右值上（就像右值引用），也可以绑定到左值上（就像左值引用）。 此外，它们还可以绑定到 const 或者 non-const 的对象上，也可以绑定到 volatile 或者 non-volatile 的对象上，甚至可以绑定到既 const 又 volatile 的对象上。它们可以绑定到几乎任何东西。这种空前灵活的引用值得拥有自己的名字。我把它叫做通用引用（universal references）。\n\x3Ca href=\"https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item24.html\">https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item24.html\x3C/a>\x3C/p>\n\x3C/blockquote>\n\x3Cp>Assuming that everyone already understands how to write perfect forwarding, or you can also read the relevant description in Effective Morden C++, I won't go into details here. The only problem with perfect forwarding is that it is not convenient to overload. It is easy to write a perfect forwarding constructor:\n关于完美转发的写法假定大家都已经懂了，不懂的也可以看 Effective Morden C++ 相关的描述，这里不用多说了。完美转发唯一的问题是，它并不方便重载。我们很容易写出一个完美转发的构造函数：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  template\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">typename\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Arg\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">Arg \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">forward\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">Arg\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#6F42C1\">has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">true\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#6A737D\">  // &#x3C;---- Perfect forwarding\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#24292E\"> option \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    if\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">has_val\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">      new\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.val\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">option \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    if\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.has_val\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">      new\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">move\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b.val\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>But these two overloads do not work as we expect. Compiling the following code will produce a compiler error:\n但是这两个重载并不会像我们想象的那样工作。编译以下代码，它会产生编译器错误：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">struct\x3C/span>\x3Cspan style=\"color:#6F42C1\"> StringWrapper\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">string\x3C/span>\x3Cspan style=\"color:#24292E\"> s;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  StringWrapper\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">string\x3C/span>\x3Cspan style=\"color:#E36209\"> str\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">s\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">move\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">StringWrapper\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> test1;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">StringWrapper\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">test2\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">test1\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // In instantiation of 'option&#x3C;T>::option(Arg&#x26;&#x26;) [with Arg = option&#x3C;StringWrapper>&#x26;; T = StringWrapper]':\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  //    required from here\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  //  11 |   option&#x3C;StringWrapper> test2(test1);\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  //     |                                    ^\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // error: no matching function for call to 'StringWrapper::StringWrapper(option&#x3C;StringWrapper>&#x26;)'\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  //  23 |   option(Arg &#x26;&#x26;f) : val(std::forward&#x3C;Arg>(f)), has_val(true) {}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>How could that be! We did clearly declared \x3Ccode>option(const option &#x26;b)\x3C/code>! But the overloading is not in this order. For more information on why the compiler overloads in this way, please see \x3Ca href=\"https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item26.html\">\x3Cem>Avoid overloading on universal references\x3C/em>\x3C/a>, which I will not go into here. In short, when encountering \x3Ccode>option&#x3C;T>\x3C/code>, the compiler will expand the universal reference above to:\n怎么会呢！明明我们声明了 \x3Ccode>option(const option &#x26;b)\x3C/code>! 但是重载并不是按这个顺序来的。关于编译器为什么会这样重载，请看 \x3Ca href=\"https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item26.html\">Avoid overloading on universal references\x3C/a>，这里不赘述。总而言之，遇到 \x3Ccode>option&#x3C;T>\x3C/code> 的时候，编译器会将上面那个通用引用展开为：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // template &#x3C;typename Arg> // &#x3C;-- Arg = option&#x26;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">option \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#6F42C1\">has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">true\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>Obviously it is a better match than the copy constructor of \x3Ccode>const option&#x26;\x3C/code>, so the compiler chooses it.\n显然这相比于 \x3Ccode>const option&#x26;\x3C/code> 的复制构造函数是一个更好的匹配，因此，编译器选择了它。\x3C/p>\n\x3Ch3 id=\"use-enable_if\">\x3Ca href=\"#use-enable_if\">Use \x3Ccode>enable_if\x3C/code>\x3C/a>\x3C/h3>\n\x3Cp>\x3Cstrong>使用 \x3Ccode>std::enable_if\x3C/code>\x3C/strong>\x3C/p>\n\x3Cp>(Of course, C++20 introduces better practices, namely concepts, but let's use the features of C++14 to build our \x3Ccode>option&#x3C;T>\x3C/code>.)\n（当然，C++20 引入了更好的做法即 concepts，但是我们这里先用 C++14 就有的功能来构建我们的 \x3Ccode>option&#x3C;T>\x3C/code>。）\x3C/p>\n\x3Cblockquote>\n\x3Cp>\x3Ccode>std::enable_if\x3C/code> gives you a way to force compilers to behave as if a particular template didn’t exist. Such templates are said to be disabled. By default, all templates are enabled, but a template using \x3Ccode>std::enable_if\x3C/code> is enabled only if the condition specified by \x3Ccode>std::enable_if\x3C/code> is satisfied.\n\x3Ccode>std::enable_if\x3C/code> 可以给你提供一种强制编译器执行行为的方法，像是特定模板不存在一样。这种模板被称为被禁止（disabled）。默认情况下，所有模板是启用的（enabled），但是使用 \x3Ccode>std::enable_if\x3C/code> 可以使得仅在 \x3Ccode>std::enable_if\x3C/code> 指定的条件满足时模板才启用。\x3C/p>\n\x3C/blockquote>\n\x3Cp>I am not going to explain the syntax of \x3Ccode>enable_if\x3C/code> here. In short, after introducing \x3Ccode>enable_if\x3C/code>, our constructors become like this;\n这里不打算解释 \x3Ccode>enable_if\x3C/code> 的语法。总而言之，引入 \x3Ccode>enable_if\x3C/code> 后，我们的构造函数变成了这样；\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  template\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">typename\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Arg\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">            typename\x3C/span>\x3Cspan style=\"color:#6F42C1\"> std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">enable_if\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">expression\x3C/span>\x3Cspan style=\"color:#24292E\"> , \x3C/span>\x3Cspan style=\"color:#D73A49\">bool\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">type\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#D73A49\"> true\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  option\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">Arg \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">std\x3C/span>\x3Cspan style=\"color:#24292E\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">forward\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">Arg\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">f\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#6F42C1\">has_val\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">true\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>Where the \x3Cem>expression\x3C/em> is an expression that only when it is true will the overloaded function be called. Obviously, it is appropriate to call perfect forwarding only when \x3Ccode>Args\x3C/code> can be used to construct \x3Ccode>T\x3C/code> (for convenience, we do not consider meaningless duplicate types like \x3Ccode>option&#x3C;option&#x3C;T>>\x3C/code>). Therefore, the expanded code becomes obvious (to highlight the type traits, I use \x3Ccode>not\x3C/code> instead of \x3Ccode>!\x3C/code>):\n其中 \x3Cem>expression\x3C/em> 是某个表达式，只有在它成立的时候，这个重载函数才会被调用。显然，我们只有在 \x3Ccode>Args\x3C/code> 可以用来构造 \x3Ccode>T\x3C/code> 的时候调用完美转发是合适的（为了方便，我们不考虑像 \x3Ccode>option&#x3C;option&#x3C;T>>\x3C/code> 这样无意义的重复类型）因此，详细的写法就变得显然了（为了突出 type traits 的关系，我使用了 \x3Ccode>not\x3C/code> 代替 \x3Ccode>!\x3C/code>）：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// ...\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  template\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">typename\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Arg\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3C/span>\n\x3Cspan class=\"l v _hk=0010070c003100036a0 class="markdown-body"><p>This blog was written entirely because of the item <a href="https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item27.html"><em>Familiarize yourself with alternatives to overloading on universal references</em></a> in Effcetive Morden C++. We start with a practical problem trying to emulate <code>std::optional</code> in C++14, because optional monads are a good paradigm for expressing values ​​that may be null, rather than assuming everything is maybe null which can easily break through the type system.
写下这篇文章完全是因为看到了 Effcetive Morden C++ 中的<a href="https://cntransgroup.github.io/EffectiveModernCppChinese/5.RRefMovSemPerfForw/item27.html">熟悉通用引用重载的替代方法</a>。我们从一个现实的问题开始，即在 C++14 尝试模拟 std::optional，因为 optional 是表达可能为空的值的时候一个很好的范式，而不是假定一切都可能为 null 并轻易击穿类型系统。</p>

<h2 id="simplest-approach"><a href="#simplest-approach">Simplest Approach</a></h2>
<p><strong>最简单的方法</strong></p>
<p>Obviously, a <code>std::optional&#x3C;T></code> is just a wrapper around two things: a <code>T</code> and a <code>bool</code> indicating whether <code>T</code> makes sense. We can easily write code like this:</p>
<p>显然，一个 <code>std::optional&#x3C;T></code> 就是两个东西的包装：一个 <code>T</code> 和一个 <code>bool</code>，指示 T 是否有意义。我们可以很容易写下类似这样的代码：</p>

<span class="line"></span>

<p>To solve this situation, we naturally think of pointers. A pointer can always be <code>nullptr</code> unless it is allocated with a real value, so we can rewrite our <code>option&#x3C;T></code> as a alias of <code>std::unique_ptr&#x3C;T></code>, adding an additional function <code>has_value() const</code> to check if it is <code>nullptr</code>, and a copy constructor. Such a class is easy to write, but it obviously still has disadvantages. The biggest disadvantage is that it needs to dynamically allocate memory, and on the heap, which seriously slows down our <code>option&#x3C;T></code>.

<p>To solve this problem, we will use <code>union</code>, a keyword inherited from C that allows multiple different types to coexist in the same memory position. But here <code>union</code> has another use: shielding the constructor and destructor of <code>T</code> and letting us manage it ourselves.

答案是否定的！你需要显式构造一个 <code>StringWrapper</code> 对象才能调用 <code>option&#x3C;StringWrapper></code> 的构造函数，因为 <code>option&#x3C;StringWrapper></code> 的调用函数并不能接受 <code>const char [4]</code> 作为参数。C++ s 不会自动“转发”它。</p>
<h2 id="universal-referances"><a href="#universal-referances">Universal Referances</a></h2>
<p><strong>通用引用</strong></p>
<p>In order to forward the arguments to <code>T</code>'s constructor, as if our <code>option&#x3C;T></code> is actually <code>T</code>, we need to use perfect forwarding and universal references.
为了转发参数到 T 的构造函数，就像我们的 <code>option&#x3C;T></code> 实际上是 <code>T</code> 一样，我们需要用到完美转发和通用引用。</p>
<blockquote>
<p>In fact, “T&#x26;&#x26;” has two different meanings. One is rvalue reference, of course. Such references behave exactly the way you expect: they bind only to rvalues, and their primary raison d’être is to identify objects that may be moved from.
事实上，“T&#x26;&#x26;”有两种不同的意思。第一种，当然是右值引用。这种引用表现得正如你所期待的那样：它们只绑定到右值上，并且它们主要的存在原因就是为了识别可以移动操作的对象。
The other meaning for “T&#x26;&#x26;” is either rvalue reference or lvalue reference. Such references look like rvalue references in the source code (i.e., “T&#x26;&#x26;”), but they can behave as if they were lvalue references (i.e., “T&#x26;”). Their dual nature permits them to bind to rvalues (like rvalue references) as well as lvalues (like lvalue references). Furthermore, they can bind to const or non-const objects, to volatile or non-volatile objects, even to objects that are both const and volatile. They can bind to virtually anything. Such unprecedentedly flexible references deserve a name of their own. I call them universal references.
“T&#x26;&#x26;”的另一种意思是，它既可以是右值引用，也可以是左值引用。这种引用在源码里看起来像右值引用（即“T&#x26;&#x26;”），但是它们可以表现得像是左值引用（即“T&#x26;”）。它们的二重性使它们既可以绑定到右值上（就像右值引用），也可以绑定到左值上（就像左值引用）。 此外，它们还可以绑定到 const 或者 non-const 的对象上，也可以绑定到 volatile 或者 non-volatile 的对象上，甚至可以绑定到既 const 又 volatile 的对象上。它们可以绑定到几乎任何东西。这种空前灵活的引用值得拥有自己的名字。我把它叫做通用引用（universal references）。
