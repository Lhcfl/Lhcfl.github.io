w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#step-1-安装-highlightjs-lean" class="text-ink-soft hover:text-accent">Step 1. 安装 highlightjs-lean</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#step-2-将-lean-语言支持添加到-hljs" class="text-ink-soft hover:text-accent">Step 2. 将 Lean 语言支持添加到 hljs</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#step-3-把-hexo-utils-的语言定义文件里添加上-lean" class="text-ink-soft hover:text-accent">Step 3. 把 hexo-utils 的语言定义文件里添加上 Lean</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#或者" class="text-ink-soft hover:text-accent">或者……</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#成果展示" class="text-ink-soft hover:text-accent">成果展示</a></li></ul></nav></aside></div></div></body></html><script>($R[19]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"使 Hexo 支持高亮 Lean",date:"2024-09-03T21:03:03",tags:$R[11]=["Lean","Hexo","Blog","Code"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"使 Hexo 支持高亮 Lean",html:"\x3Cp>说真的，Hexo 这么烂下去我真要换 Hugo 了——为什么它甚至不支持给 hljs 添加语言插件？\x3C/p>\n\x3Cp>好吧，这篇博客讲述如何让你的 Hexo 博客支持高亮 Lean，并且是后端渲染。\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"step-1-安装-highlightjs-lean\">\x3Ca href=\"#step-1-安装-highlightjs-lean\">Step 1. 安装 highlightjs-lean\x3C/a>\x3C/h2>\n\x3Cp>问题的起因就是 hljs 并不默认支持 lean，因此必须手动安装之。在你的 hexo 博客根目录进行：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">npm\x3C/span>\x3Cspan style=\"color:#032F62\"> install\x3C/span>\x3Cspan style=\"color:#032F62\"> highlightjs-lean\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\"># 或者 yarn add highlightjs-lean\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch2 id=\"step-2-将-lean-语言支持添加到-hljs\">\x3Ca href=\"#step-2-将-lean-语言支持添加到-hljs\">Step 2. 将 Lean 语言支持添加到 hljs\x3C/a>\x3C/h2>\n\x3Cp>你需要创建一个简单的 hexo 插件做这件事情。在你的 hexo 博客根目录新建 \x3Ccode>scripts\x3C/code> 文件夹，随意新建一个 javascript 文件，名字自取，例如 \x3Ccode>add-lean.js\x3C/code>\x3C/p>\n\x3Cp>在该 js 文件中写入以下内容：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> hljs\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> require\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"highlight.js\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> leanHljs\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> require\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"highlightjs-lean\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">hljs.\x3C/span>\x3Cspan style=\"color:#6F42C1\">registerLanguage\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"lean\"\x3C/span>\x3Cspan style=\"color:#24292E\">, leanHljs\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这样就注册了 lean 的语言支持\x3C/p>\n\x3Ch2 id=\"step-3-把-hexo-utils-的语言定义文件里添加上-lean\">\x3Ca href=\"#step-3-把-hexo-utils-的语言定义文件里添加上-lean\">Step 3. 把 hexo-utils 的语言定义文件里添加上 Lean\x3C/a>\x3C/h2>\n\x3Cp>如果你做了上述操作，恭喜你，至少 autodetect 能尝试识别 Lean 了。但是 hljs 的 autodetect 众所周知的不准确，于是你尝试在代码块中指定语言为 \x3Ccode>lean\x3C/code>，嘿，hexo 反而自动给你转成 plaintext 了~\x3C/p>\n\x3Cp>\x3Ca href=\"https://github.com/hexojs/hexo-util/blob/313dee34cafd88c08bfa491dfdbbc78a6a50cf8b/lib/highlight.ts#L128-L130\">在这三行中\x3C/a>揭示了原因。 hexo-utils 使用了一个 hard-coded 的 \x3Ccode>highlight_alias.json\x3C/code> 文件，任何不在这个 \x3Ccode>json\x3C/code> 文件中的语言都会直接被视作 \x3Ccode>plaintext\x3C/code>， 我不懂它为什么要这样干，hljs 明明提供了 api 让你获得 available 的语言，但它就是这么干了。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> alias\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> require\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">'../highlight_alias.json'\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> highlight\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">str\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#005CC5\"> string\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#E36209\">options\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Options\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:rgba(255, 18, 18, 0.8)\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  //...\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  if\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">!\x3C/span>\x3Cspan style=\"color:#24292E\">lang \x3C/span>\x3Cspan style=\"color:#D73A49\">||\x3C/span>\x3Cspan style=\"color:#D73A49\"> !\x3C/span>\x3Cspan style=\"color:#24292E\">alias.aliases\x3C/span>\x3Cspan style=\"color:#5a32a3\">[\x3C/span>\x3Cspan style=\"color:#24292E\">lang\x3C/span>\x3Cspan style=\"color:#5a32a3\">]\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    lang \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#032F62\"> 'plaintext'\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>由于这个文件是硬编码的，你甚至不能更改它。所以插件在这里有些苍白无力。你不得不写一个 不是插件的脚本（比如 \x3Ccode>pre-deploy.js\x3C/code>），在每次 deploy 前把该文件修改一下：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> fs\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> require\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"fs\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> alias\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#005CC5\"> JSON\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">parse\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  fs.\x3C/span>\x3Cspan style=\"color:#6F42C1\">readFileSync\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"node_modules/hexo-util/highlight_alias.json\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">toString\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">alias.aliases\x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#032F62\">\"lean\"\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#032F62\"> \"lean\"\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">alias.languages.\x3C/span>\x3Cspan style=\"color:#6F42C1\">push\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"lean\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">fs.\x3C/span>\x3Cspan style=\"color:#6F42C1\">writeFileSync\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#032F62\">  \"node_modules/hexo-util/highlight_alias.json\"\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005CC5\">  JSON\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">stringify\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">alias\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>然后在你每次 deploy 前，需要执行一下\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">node\x3C/span>\x3Cspan style=\"color:#032F62\"> pre-deploy.js\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>把该文件修改后，hexo 终于支持了 lean 语言的高亮。\x3C/p>\n\x3Ch2 id=\"或者\">\x3Ca href=\"#或者\">或者……\x3C/a>\x3C/h2>\n\x3Cp>不跟你 hexo 的 markdown 渲染器玩辣！\x3C/p>\n\x3Cp>安装 markdown-it-highlightjs，作为 markdown-it 的插件，关掉 hexo 的 highlight 处理。现在 Step3 的所有内容直接可以不看，Lean 4 高亮已经好了。\x3C/p>\n\x3Ch2 id=\"成果展示\">\x3Ca href=\"#成果展示\">成果展示\x3C/a>\x3C/h2>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> MIL.Common\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">open\x3C/span>\x3Cspan style=\"color:#24292E\"> Nat\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">-- These are pieces of data.\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#check\x3C/span>\x3Cspan style=\"color:#005CC5\"> 2\x3C/span>\x3Cspan style=\"color:#24292E\"> + \x3C/spa rticle _hk=0010070c0031000361><header class="mb-8 border-b border-rule pb-7"><!--$--><!--/--><h1 class="text-2xl font-bold leading-snug text-balance md:text-3xl"><span _hk=0010070c00310003670 class="">使 Hexo 支持高亮 Lean</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>说真的，Hexo 这么烂下去我真要换 Hugo 了——为什么它甚至不支持给 hljs 添加语言插件？</p>
<p>好吧，这篇博客讲述如何让你的 Hexo 博客支持高亮 Lean，并且是后端渲染。</p>

<h2 id="step-1-安装-highlightjs-lean"><a href="#step-1-安装-highlightjs-lean">Step 1. 安装 highlightjs-lean</a></h2>
<p>问题的起因就是 hljs 并不默认支持 lean，因此必须手动安装之。在你的 hexo 博客根目录进行：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">npm</span><span style="color:#032F62"> install</span><span style="color:#032F62"> highlightjs-lean</span></span>
<span class="line"><span style="color:#6A737D"># 或者 yarn add highlightjs-lean</span></span></code></pre>
<h2 id="step-2-将-lean-语言支持添加到-hljs"><a href="#step-2-将-lean-语言支持添加到-hljs">Step 2. 将 Lean 语言支持添加到 hljs</a></h2>
<p>你需要创建一个简单的 hexo 插件做这件事情。在你的 hexo 博客根目录新建 <code>scripts</code> 文件夹，随意新建一个 javascript 文件，名字自取，例如 <code>add-lean.js</code></p>
<p>在该 js 文件中写入以下内容：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> hljs</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> require</span><span style="color:#005cc5">(</span><span style="color:#032F62">"highlight.js"</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> leanHljs</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> require</span><span style="color:#005cc5">(</span><span style="color:#032F62">"highlightjs-lean"</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">hljs.</span><span style="color:#6F42C1">registerLanguage</span><span style="color:#005cc5">(</span><span style="color:#032F62">"lean"</span><span style="color:#24292E">, leanHljs</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>这样就注册了 lean 的语言支持</p>
<h2 id="step-3-把-hexo-utils-的语言定义文件里添加上-lean"><a href="#step-3-把-hexo-utils-的语言定义文件里添加上-lean">Step 3. 把 hexo-utils 的语言定义文件里添加上 Lean</a></h2>
<p>如果你做了上述操作，恭喜你，至少 autodetect 能尝试识别 Lean 了。但是 hljs 的 autodetect 众所周知的不准确，于是你尝试在代码块中指定语言为 <code>lean</code>，嘿，hexo 反而自动给你转成 plaintext 了~</p>
<p><a href="https://github.com/hexojs/hexo-util/blob/313dee34cafd88c08bfa491dfdbbc78a6a50cf8b/lib/highlight.ts#L128-L130">在这三行中</a>揭示了原因。 hexo-utils 使用了一个 hard-coded 的 <code>highlight_alias.json</code> 文件，任何不在这个 <code>json</code> 文件中的语言都会直接被视作 <code>plaintext</code>， 我不懂它为什么要这样干，hljs 明明提供了 api 让你获得 available 的语言，但它就是这么干了。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> alias</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> require</span><span style="color:#005cc5">(</span><span style="color:#032F62">'../highlight_alias.json'</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> highlight</span><span style="color:#005cc5">(</span><span style="color:#E36209">str</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> string</span><span style="color:#24292E">, </span><span style="color:#E36209">options</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> Options</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:rgba(255, 18, 18, 0.8)">{</span></span>
<span class="line"><span style="color:#6A737D">  //...</span></span>
<span class="line"><span style="color:#D73A49">  if</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#D73A49">!</span><span style="color:#24292E">lang </span><span style="color:#D73A49">||</span><span style="color:#D73A49"> !</span><span style="color:#24292E">alias.aliases</span><span style="color:#5a32a3">[</span><span style="color:#24292E">lang</span><span style="color:#5a32a3">]</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#24292E">    lang </span><span style="color:#D73A49">=</span><span style="color:#032F62"> 'plaintext'</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span></code></pre>
<p>由于这个文件是硬编码的，你甚至不能更改它。所以插件在这里有些苍白无力。你不得不写一个 不是插件的脚本（比如 <code>pre-deploy.js</code>），在每次 deploy 前把该文件修改一下：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> fs</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> require</span><span style="color:#005cc5">(</span><span style="color:#032F62">"fs"</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> alias</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> JSON</span><span style="color:#24292E">.</span><span style="color:#6F42C1">parse</span><span style="color:#005cc5">(</span></span>
<span class="line"><span style="color:#24292E">  fs.</span><span style="color:#6F42C1">readFileSync</span><span style="color:#e36209">(</span><span style="color:#032F62">"node_modules/hexo-util/highlight_alias.json"</span><span style="color:#e36209">)</span><span style="color:#24292E">.</span><span style="color:#6F42C1">toString</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">alias.aliases</span><span style="color:#005cc5">[</span><span style="color:#032F62">"lean"</span><span style="color:#005cc5">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#032F62"> "lean"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">alias.languages.</span><span style="color:#6F42C1">push</span><span style="color:#005cc5">(</span><span style="color:#032F62">"lean"</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">fs.</span><span style="color:#6F42C1">writeFileSync</span><span style="color:#005cc5">(</span></span>
<span class="line"><span style="color:#032F62">  "node_modules/hexo-util/highlight_alias.json"</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005CC5">  JSON</span><span style="color:#24292E">.</span><span style="color:#6F42C1">stringify</span><span style="color:#e36209">(</span><span style="color:#24292E">alias</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>然后在你每次 deploy 前，需要执行一下</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">node</span><span style="color:#032F62"> pre-deploy.js</span></span></code></pre>
<p>把该文件修改后，hexo 终于支持了 lean 语言的高亮。</p>
<h2 id="或者"><a href="#或者">或者……</a></h2>
<p>不跟你 hexo 的 markdown 渲染器玩辣！</p>
<p>安装 markdown-it-highlightjs，作为 markdown-it 的插件，关掉 hexo 的 highlight 处理。现在 Step3 的所有内容直接可以不看，Lean 4 高亮已经好了。</p>

xt</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">在 Hexo 老瓶装新酒</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[19]($R[3],!0);</script>
