"w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#0-介绍" class="text-ink-soft hover:text-accent">0. 介绍</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#1-抽象" class="text-ink-soft hover:text-accent">1. 抽象</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#2-实践json-解析器" class="text-ink-soft hover:text-accent">2. 实践：JSON 解析器</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#3-扩展用在不那么方便的语言上" class="text-ink-soft hover:text-accent">3. 扩展：用在不那么方便的语言上？</a></li></ul></nav></aside></div></div></body></html><script>($R[18]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"学习在 Lean4 中使用 Parser Combinator",date:"2025-04-13T01:19:40",tags:$R[11]=["Code","Lean","Functional"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"学习在 Lean4 中使用 Parser Combinator",html:"\x3Cp>此时对于我那幽默的《编译原理》课程还在用 C 语言写编译器的不满达到了顶峰。\x3C/p>\n\x3Cblockquote>\n\x3Cp>你说得对，但是《编译原理》是由 Alfred V. Aho, Monica S. Lam, Ravi Sethi 和 Jeffrey D. Ullman 等人自主研发的一款全旧计算机世界编程游戏。游戏发生在一个被称作「C-‌-」的简化语言，在这里，选择这门课的人将被迫享受「GCC 7.5.0」，没有一点 5202 年该有的体验。玩家将扮演一位名为「C 程序员」的神秘角色，在自由的编码中邂逅各种各样、时机诡异的 Segment Fault 们，和他们一起泄露内存，感受 C 语言的恶心之处——同时，逐步发掘「都 5202 年了这帮人还在拿 39 年前的书教文法分析」的真相。\x3C/p>\n\x3C/blockquote>\n\x3Cp>但跑远了。总而言之这里介绍一种叫 parser combinator —— 解析器组合子的函数式手段，为您带来哪怕是手写递归下降也很舒适的体验（并非）\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"0-介绍\">\x3Ca href=\"#0-介绍\">0. 介绍\x3C/a>\x3C/h2>\n\x3Cp>Parser combinator（解析器组合子）是一种函数式编程中的技术，用于构建复杂语法分析器的工具。它的核心思想是：用小的、可组合的解析器函数构建更复杂的解析器。\x3C/p>\n\x3Cp>一个 parser combinator 就是一个函数，它接受一些解析器作为输入，返回一个新的、更复杂的解析器。它是一种“组合模式”，非常适合处理递归文法。\x3C/p>\n\x3Cp>一个经典的 Parser 可以是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">abbrev\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Parser\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := List Char → Option \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>也就是说，一个 parser 就是是一个函数，接受 List Char 作为参数，如果解析成功，返回 \x3Ccode>.some (α × List Char)\x3C/code> 为解析结果和剩余内容。如果失败，返回 \x3Ccode>.none\x3C/code>.\x3C/p>\n\x3Cp>在这里，为了一步到位地解决报错，我们把返回类型改成 Except\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">abbrev\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Parser\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := List Char → Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这样，如果报错就能看到一个字符串作为错误信息。\x3C/p>\n\x3Cp>对于不熟悉函数式写法的人，这是它的类似的 Rust 代码（懒得配平生命周期了）：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">#!\x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">feature\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">type_alias_impl_trait\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">struct\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Parser\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">Box\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">dyn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> FnOnce\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">'\x3C/span>\x3Cspan style=\"color:#6F42C1\">static\x3C/span>\x3Cspan style=\"color:#6F42C1\"> str\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Result\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">'\x3C/span>\x3Cspan style=\"color:#6F42C1\">static\x3C/span>\x3Cspan style=\"color:#6F42C1\"> str\x3C/span>\x3Cspa le=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a, rest\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> ← parser input\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">      f a rest\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>实现了 monad 的特征以后，我们就能方便的使用 do-记号，如\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> symbol\x3C/span>\x3Cspan style=\"color:#24292E\"> : Parser $ Int :=\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  fun\x3C/span>\x3Cspan style=\"color:#24292E\"> input =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    match\x3C/span>\x3Cspan style=\"color:#24292E\"> input \x3C/span>\x3Cspan style=\"color:#D73A49\">with\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    | \x3C/span>\x3Cspan style=\"color:#032F62\">'+'\x3C/span>\x3Cspan style=\"color:#24292E\"> :: xs =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> .ok \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, xs\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    | \x3C/span>\x3Cspan style=\"color:#032F62\">'-'\x3C/span>\x3Cspan style=\"color:#24292E\"> :: xs =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> .ok \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">-\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, xs\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/spa <blockquote>
<p>你说得对，但是《编译原理》是由 Alfred V. Aho, Monica S. Lam, Ravi Sethi 和 Jeffrey D. Ullman 等人自主研发的一款全旧计算机世界编程游戏。游戏发生在一个被称作「C-‌-」的简化语言，在这里，选择这门课的人将被迫享受「GCC 7.5.0」，没有一点 5202 年该有的体验。玩家将扮演一位名为「C 程序员」的神秘角色，在自由的编码中邂逅各种各样、时机诡异的 Segment Fault 们，和他们一起泄露内存，感受 C 语言的恶心之处——同时，逐步发掘「都 5202 年了这帮人还在拿 39 年前的书教文法分析」的真相。</p>
</blockquote>
<p>但跑远了。总而言之这里介绍一种叫 parser combinator —— 解析器组合子的函数式手段，为您带来哪怕是手写递归下降也很舒适的体验（并非）</p>
<!-- more -->
<h2 id="0-介绍"><a href="#0-介绍">0. 介绍</a></h2>
<p>Parser combinator（解析器组合子）是一种函数式编程中的技术，用于构建复杂语法分析器的工具。它的核心思想是：用小的、可组合的解析器函数构建更复杂的解析器。</p>
<p>一个 parser combinator 就是一个函数，它接受一些解析器作为输入，返回一个新的、更复杂的解析器。它是一种“组合模式”，非常适合处理递归文法。</p>
<p>一个经典的 Parser 可以是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">abbrev</span><span style="color:#6F42C1"> Parser</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">α : </span><span style="color:#D73A49">Type</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := List Char → Option </span><span style="color:#005cc5">(</span><span style="color:#24292E">α × List Char</span><span style="color:#005cc5">)</span></span></code></pre>
<p>也就是说，一个 parser 就是是一个函数，接受 List Char 作为参数，如果解析成功，返回 <code>.some (α × List Char)</code> 为解析结果和剩余内容。如果失败，返回 <code>.none</code>.</p>
<p>在这里，为了一步到位地解决报错，我们把返回类型改成 Except</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">abbrev</span><span style="color:#6F42C1"> Parser</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">α : </span><span style="color:#D73A49">Type</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := List Char → Except String </span><span style="color:#005cc5">(</span><span style="color:#24292E">α × List Char</span><span style="color:#005cc5">)</span></span></code></pre>
<p>这样，如果报错就能看到一个字符串作为错误信息。</p>

<p>其中，<code>chain</code> 就是一个 combinator，它用两个小的 parser 合成了一个大的 parser。</p>
<h2 id="1-抽象"><a href="#1-抽象">1. 抽象</a></h2>
<p>让我们再次请出万能的 Monad 来。关于 Monad 是什么，不妨看看<a href="/blog/2025-03-27-learn-monads">所以这个 Monads 到底是什么啊之让我学学</a></p>
<p>一个 parser 的合成过程经常需要前面的 parse 都 ok，一旦其中某一个不是 ok 的了，就短路返回 error。这是典型的 monad 行为</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">instance</span><span style="color:#24292E"> : Monad Parser </span><span style="color:#D73A49">where</span></span>
<span class="line"><span style="color:#24292E">  pure := </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> a =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, input</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  bind := </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> parser f =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">      let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, rest</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parser input</span></span>
<span class="line"><span style="color:#24292E">      f a rest</span></span></code></pre>
<p>实现了 monad 的特征以后，我们就能方便的使用 do-记号，如</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> symbol</span><span style="color:#24292E"> : Parser $ Int :=</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    match</span><span style="color:#24292E"> input </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">    | </span><span style="color:#032F62">'+'</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">    | </span><span style="color:#032F62">'-'</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">-</span><span style="color:#005CC5">1</span><span style="color:#24292E">, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">    | xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> digits</span><span style="color:#24292E"> : Parser $ List Char :=</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#24292E">    .ok $ input.span </span><span style="color:#005cc5">(</span><span style="color:#24292E">·.isDigit</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseInt</span><span style="color:#24292E"> : Parser Json := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> symbol ← symbol</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> numStr ← digits</span></span>
<span class="line"><span style="color:#D73A49">  match</span><span style="color:#24292E"> numStr.asString.toInt? </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">  | some n =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E"> Json.int $ symbol * n</span></span>
<span class="line"><span style="color:#24292E">  | none   =</span><span style="color:#24292E">></span><span style="color:#24292E"> fail </span><span style="color:#032F62">"expected an integer, but got non-digit characters"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseInt </span><span style="color:#032F62">"12345abced12345"</span><span style="color:#24292E">.data</span></span>
<span class="line"><span style="color:#24292E">-- Except.ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.int </span><span style="color:#005CC5">12345</span><span style="color:#24292E">, </span><span style="color:#e36209">[</span><span style="color:#032F62">'a'</span><span style="color:#24292E">, </span><span style="color:#032F62">'b'</span><span style="color:#24292E">, </span><span style="color:#032F62">'c'</span><span style="color:#24292E">, </span><span style="color:#032F62">'e'</span><span style="color:#24292E">, </span><span style="color:#032F62">'d'</span><span style="color:#24292E">, </span><span style="color:#032F62">'1'</span><span style="color:#24292E">, </span><span style="color:#032F62">'2'</span><span style="color:#24292E">, </span><span style="color:#032F62">'3'</span><span style="color:#24292E">, </span><span style="color:#032F62">'4'</span><span style="color:#24292E">, </span><span style="color:#032F62">'5'</span><span style="color:#e36209">]</span><span style="color:#005cc5">)</span></span></code></pre>
<p>其次，一个 parser 还能实现 <code>Alternative</code>（选择子）。字面意义上地，</p>
<blockquote>
<p>An <code>Alternative</code> functor is an <code>Applicative</code> functor that can "fail" or be "empty" and a binary operation <code>&#x3C;|></code> that “collects values” or finds the “left-most success”.</p>
<p>Important instances include</p>
<ul>
<li><code>Option</code>, where <code>failure := none</code> and <code>&#x3C;|></code> returns the left-most <code>some</code>.</li>
<li>Parser combinators typically provide an <code>Applicative</code> instance for error-handling and backtracking.</li>
</ul>
<p>Error recovery and state can interact subtly. For example, the implementation of <code>Alternative</code> for <code>OptionT (StateT σ Id)</code> keeps modifications made to the state while recovering from failure, while <code>StateT σ (OptionT Id)</code> discards them.</p>
</blockquote>
<p>关于函子 functor 的概念我推荐阅读<a href="https://sxyz.blog/functors-applicatives-and-monads-in-pictures/">图解 Functor、Applicative、Monad</a>。这样，我们用</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">parser1 </span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">|</span><span style="color:#24292E">></span><span style="color:#24292E"> parser2</span></span></code></pre>
<p>就能描述“第一个解析成功的 parser”。</p>
<p>或许 parser 还适用一些别的抽象，但我也是刚学，想到写什么就放些什么了（）总而言之，让我们又双叒叕开启愉快的 JSON 解析之旅。</p>
<h2 id="2-实践json-解析器"><a href="#2-实践json-解析器">2. 实践：JSON 解析器</a></h2>
<p>还是熟悉的 JSON</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">inductive</span><span style="color:#6F42C1"> Json</span><span style="color:#D73A49"> where</span></span>
<span class="line"><span style="color:#24292E">  | null</span></span>
<span class="line"><span style="color:#24292E">  | bool </span><span style="color:#005cc5">(</span><span style="color:#24292E">x: Bool</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | int  </span><span style="color:#005cc5">(</span><span style="color:#24292E">x: Int</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | float</span><span style="color:#005cc5">(</span><span style="color:#24292E">x: Float</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | str  </span><span style="color:#005cc5">(</span><span style="color:#24292E">x: String</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | arr  </span><span style="color:#005cc5">(</span><span style="color:#24292E">x: List Json</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | obj  </span><span style="color:#005cc5">(</span><span style="color:#24292E">x: List </span><span style="color:#e36209">(</span><span style="color:#24292E">String × Json</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">deriving</span><span style="color:#24292E"> Repr</span></span></code></pre>
<p>这次我们要正确地解析数字，所以引入了 int 和 float 类型。然后是准备工作：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">abbrev</span><span style="color:#6F42C1"> Parser</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">α : </span><span style="color:#D73A49">Type</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := List Char → Except String </span><span style="color:#005cc5">(</span><span style="color:#24292E">α × List Char</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fail</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">reason : String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Parser α :=</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> _ =</span><span style="color:#24292E">></span><span style="color:#24292E"> .error reason</span></span>
<span class="line"><span style="color:#24292E">-- 无论如何总是返回失败原因的函数</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">instance</span><span style="color:#24292E"> : Monad Parser </span><span style="color:#D73A49">where</span></span>
<span class="line"><span style="color:#24292E">  pure := </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> a =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, input</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  bind := </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> p f =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">      let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, rest</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← p input</span></span>
<span class="line"><span style="color:#24292E">      f a rest</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">instance</span><span style="color:#24292E"> : Alternative Parser </span><span style="color:#D73A49">where</span></span>
<span class="line"><span style="color:#24292E">  failure := fail </span><span style="color:#032F62">"unknown error"</span></span>
<span class="line"><span style="color:#24292E">  orElse p₁ p₂ := </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">      match</span><span style="color:#24292E"> p₁ input </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">      | .ok    r =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok r</span></span>
<span class="line"><span style="color:#24292E">      | .error _ =</span><span style="color:#24292E">></span><span style="color:#24292E"> p₂ </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> input</span></span></code></pre>
<p>接下来可以实践写几个辅助函数</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">-- 返回一个拿一个 char 的 parser</span></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> char</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">c : Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Parser Char :=</span></span>
<span class="line"><span style="color:#D73A49">   fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>

<span class="line"><span style="color:#D73A49">      if</span><span style="color:#24292E"> x == c </span><span style="color:#D73A49">then</span></span>
<span class="line"><span style="color:#24292E">        .ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">c, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">      else</span><span style="color:#24292E"> .error </span><span style="color:#D73A49">s!</span><span style="color:#032F62">"Expected '</span><span style="color:#D73A49">{</span><span style="color:#032F62">c</span><span style="color:#D73A49">}</span><span style="color:#032F62">', got '</span><span style="color:#D73A49">{</span><span style="color:#032F62">x</span><span style="color:#D73A49">}</span><span style="color:#032F62">'"</span></span>
<span class="line"><span style="color:#24292E">    | </span><span style="color:#005cc5">[</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> .error </span><span style="color:#D73A49">s!</span><span style="color:#032F62">"Unexpected EOF, expected character '</span><span style="color:#D73A49">{</span><span style="color:#032F62">c</span><span style="color:#D73A49">}</span><span style="color:#032F62">'"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">-- 返回一个拿走前面的 whitespace 的 parser</span></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> whitespaces</span><span style="color:#24292E"> : Parser Unit :=</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#24292E">    .ok </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">, input.dropWhile </span><span style="color:#e36209">(</span><span style="color:#24292E">·.isWhitespace</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">-- 返回一个拿一个 + 或者 - 符号的 parser</span></span>

<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>

<span class="line"><span style="color:#24292E">    | </span><span style="color:#032F62">'-'</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#24292E">-</span><span style="color:#005CC5">1</span><span style="color:#24292E">, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">    | xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> .ok </span><span style="color:#005cc5">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, xs</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">-- 返回一个拿数字的 parser</span></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> digits</span><span style="color:#24292E"> : Parser $ List Char :=</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#24292E"> input =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#24292E">    .ok $ input.span </span><span style="color:#005cc5">(</span><span style="color:#24292E">·.isDigit</span><span style="color:#005cc5">)</span></span>

<p>这样， number 的 parse 工作就变得很简单，只需要分两种情况：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseInt</span><span style="color:#24292E"> : Parser Json := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> symbol ← symbol</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> numStr ← digits</span></span>
<span class="line"><span style="color:#D73A49">  match</span><span style="color:#24292E"> numStr.asString.toInt? </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">  | some n =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E"> Json.int $ symbol * n</span></span>
<span class="line"><span style="color:#24292E">  | none   =</span><span style="color:#24292E">></span><span style="color:#24292E"> fail </span><span style="color:#032F62">"expected an integer, but got non-digit characters"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> toFloat</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">num : List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">fraction : List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Option Float := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> num ← num.asString.toNat?</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> fra ← fraction.asString.toNat?</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> exp := </span><span style="color:#005CC5">0</span><span style="color:#24292E">.</span><span style="color:#005CC5">1</span><span style="color:#24292E"> ^ fraction.length.toFloat</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> num.toFloat + </span><span style="color:#005cc5">(</span><span style="color:#24292E">fra.toFloat * exp</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseFloat</span><span style="color:#24292E"> : Parser Json := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> symbol ← symbol</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> num ← digits</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> _ ← char </span><span style="color:#032F62">'.'</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> fraction ← digits</span></span>
<span class="line"><span style="color:#D73A49">  match</span><span style="color:#24292E"> toFloat num fraction </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">  | .some num =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E"> Json.float $ </span><span style="color:#D73A49">if</span><span style="color:#24292E"> symbol == -</span><span style="color:#005CC5">1</span><span style="color:#D73A49"> then</span><span style="color:#24292E"> -num </span><span style="color:#D73A49">else</span><span style="color:#24292E"> num</span></span>
<span class="line"><span style="color:#24292E">  | .none =</span><span style="color:#24292E">></span><span style="color:#24292E"> fail </span><span style="color:#032F62">"expected a float"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseNumber</span><span style="color:#24292E"> : Parser Json := </span><span style="color:#D73A49">do</span></span>

<p>随后我们一鼓作气，把几个简单的 parser 写掉。先写字符串：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>def quotedString : Parser $ List Char := do</span></span>

<p>显然，所有人都看得出来， parser combinator 的做法非常简洁明了，可读性极强。</p>
