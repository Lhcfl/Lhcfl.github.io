odulepreload" href="/assets/Layout-DgnKrTKS.js"><link rel="modulepreload" href="/assets/RenderHTML-DSRG-qOh.js"><link rel="modulepreload" href="/assets/Comment-CagAvPCO.js"><link rel="modulepreload" href="/assets/PostTags-DKwO4KeQ.js"><link rel="modulepreload" href="/assets/format-DFJQmLUz.js"><script type="module" src="/assets/virtual_solid-ssr-entry-client-BSrm4xPG.js" async></script></head><body><div _hk=00100701 class="min-h-screen"><!--$--><!--/--><div class="_layout_zrvho_2"><!--$--><aside _hk=00100703 class="_col_zrvho_13 _left_zrvho_40"><nav class="grid gap-2.5 italic"><a _hk=0010070400 href="/" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Home</a><a _hk=0010070410 href="/archives" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Archives</a><a _hk=0010070420 href="/notes" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Notes</a><a _hk=0010070430 href="/tags" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Tags</a><a _hk=0010070440 href="/categories" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Categories</a><a _hk=0010070450 href="/about" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">About</a><a _hk=0010070460 href="/links" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Friends</a><a _hk=0010070470 href="/search" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Search</a></nav></aside><!--/--><div class="min-w-0"><!--$--><header _hk=00100706 class="sticky top-0 z-10 -mx-5 border-b border-rule bg-[color:var(--paper)]/92 px-5 py-3 backdrop-blur-sm md:-mx-6 md:px-6 mb-4 _header_zrvho_19"><nav class="flex gap-2.5 font-sans text-sm items-center"><!--$--><a _hk=0010070700 href="/" class="w-fit transition-colors text-ink-soft hover:text-ink">Home</a><a _hk=0010070710 href="/notes" class="w-fit transition-colors text-ink-soft hover:text-ink">Notes</a><a _hk=0010070720 href="/about" class="w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#context-free-language" class="text-ink-soft hover:text-accent">Context Free Language</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#cfg-of-natural-language-grammar" class="text-ink-soft hover:text-accent">CFG of natural language grammar</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#implement-by-rust" class="text-ink-soft hover:text-accent">Implement by Rust</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#wasm" class="text-ink-soft hover:text-accent">WASM</a></li></ul></nav></aside></div></div></body></html><script>($R[18]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"随机句子生成器与一场有趣的WASM尝试",date:"2024-11-18T21:30:04",tags:$R[11]=["Rust","Code","Frontend"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"随机句子生成器与一场有趣的WASM尝试",html:"\x3Cp>一时兴起想写一个随机句子生成器。正巧在学上下文无关语言 (Context-Free Language, \x3Cstrong>CFL\x3C/strong>)，意识到句子的结构很大程度上是一个上下文无关语法。查阅\x3Ca href=\"https://zh.wikipedia.org/wiki/X-bar%E7%90%86%E8%AE%BA\"> X-bar 理论\x3C/a>得到也确实类似如此。\x3C/p>\n\x3Cp>同时正好在学 Rust，所以试了一下拿 Rust 编写这个生成器，并\x3Ca href=\"https://developer.mozilla.org/zh-CN/docs/WebAssembly/Rust_to_Wasm\">编译到 WebAssembly (\x3Cstrong>WASM\x3C/strong>)\x3C/a>。效果很成功！\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"context-free-language\">\x3Ca href=\"#context-free-language\">Context Free Language\x3C/a>\x3C/h2>\n\x3Cp>A context-free grammar is a notation for describing languages.\nIt is more powerful than finite automata or RE’s, but still cannot define all possible languages.\nUseful for nested structures, e.g., parentheses in programming languages. But it also works for natural language.\x3C/p>\n\x3Cp>The basic idea of CFL to use “variables” to stand for sets of strings (i.e., languages). These variables are defined recursively, in terms of one another. The recursive rules (“productions”) involve only concatenation.\x3C/p>\n\x3Cp>Lets start with a example. Consider these productions:\x3C/p>\n\x3Cul>\n\x3Cli>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>S\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmn>01\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S \\to 01\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6444em;\">\x3C/span>\x3Cspan class=\"mord\">01\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/li>\n\x3Cli>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>S\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmn>0\x3C/mn>\x3Cmi>S\x3C/mi>\x3Cmn>1\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S \\to 0S1\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord\">0\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mord\">1\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/li>\n\x3C/ul>\n\x3Cp>It means \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmn>01\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">01\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6444em;\">\x3C/span>\x3Cspan class=\"mord\">01\x3C/span>\x3C/span>\x3C/span>\x3C/span> is in the language. And recursively, if \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>w\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">w\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w\x3C/span>\x3C/span>\x3C/span>\x3C/span> is in the language, then so is \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmn>0\x3C/mn>\x3Cmi>w\x3C/mi>\x3Cmn>1\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">0w1\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6444em;\">\x3C/span>\x3Cspan class=\"mord\">0\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w\x3C/span>\x3Cspan class=\"mord\">1\x3C/span>\x3C/span>\x3C/span>\x3C/span>.\x3C/p>\n\x3Cp>Definations:\x3C/p>\n\x3Cul>\n\x3Cli>\x3Cstrong>Terminals\x3C/strong>: symbols of the alphabet of the language being defined.\x3C/li>\n\x3Cli>\x3Cstrong>Variables\x3C/strong> (nonterminals): a finite set of other symbols, each of which represents a language.\x3C/li>\n\x3Cli>\x3Cstrong>Start symbol\x3C/strong>: the variable whose language is the one being defined.\x3C/li>\n\x3C/ul>\n\x3Cp>A \x3Cem>production\x3C/em> has the form \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmtext>variable (head)\x3C/mtext>\x3Cmo>→\x3C/mo>\x3Cmtext>string of variables and terminals (body)\x3C/mtext>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\text{variable (head)} \\to \\text{string of variables and terminals (body)}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">variable (head)\x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">string of variables and terminals (body)\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>. Then we \x3Cem>derive\x3C/em> strings in the language of a CFG by starting with the start symbol, and repeatedly replacing some variable \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>A\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">A\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">A\x3C/span>\x3C/span>\x3C/span>\x3C/span> by the body of one of its productions.\x3C/p>\n\x3Cp>For example,\x3C/p>\n\x3Cp>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>S\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmn>0\x3C/mn>\x3Cmi>S\x3C/mi>\x3Cmn>1\x3C/mn>\x3Cmo>→\x3C/mo>\x3Cmn>00\x3C/mn>\x3Cmi>S\x3C/mi>\x3Cmn>11\x3C/mn>\x3Cmo>→\x3C/mo>\x3Cmn>000\x3C/mn>\x3Cmi>S\x3C/mi>\x3Cmn>111\x3C/mn>\x3Cmo>→\x3C/mo>\x3Cmn>00001111\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S \\to 0S1 \\to 00S11 \\to 000S111 \\to 00001111\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord\">0\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mord\">1\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord\">00\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mord\">11\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord\">000\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mord\">111\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6444em;\">\x3C/span>\x3Cspan class=\"mord\">00001111\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>We are not going to introduce CFL in detail, so let's talk about how does it related to natural language. Let us consider a classic subject-verb-object structure (SVO), where a sentence consists of a subject, a verb, and an object in that order.\x3C/p>\n\x3Cul>\n\x3Cli>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmsub>\x3Cmi>S\x3C/mi>\x3Cmtext>sentence\x3C/mtext>\x3C/msub>\x3Cmo>→\x3C/mo>\x3Cmi>S\x3C/mi>\x3Cmi>V\x3C/mi>\x3Cmi>O\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S_\\text{sentence} \\to SVO\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspa <p>同时正好在学 Rust，所以试了一下拿 Rust 编写这个生成器，并<a href="https://developer.mozilla.org/zh-CN/docs/WebAssembly/Rust_to_Wasm">编译到 WebAssembly (<strong>WASM</strong>)</a>。效果很成功！</p>
<!-- more -->
<h2 id="context-free-language"><a href="#context-free-language">Context Free Language</a></h2>
<p>A context-free grammar is a notation for describing languages.
It is more powerful than finite automata or RE’s, but still cannot define all possible languages.
Useful for nested structures, e.g., parentheses in programming languages. But it also works for natural language.</p>
<p>The basic idea of CFL to use “variables” to stand for sets of strings (i.e., languages). These variables are defined recursively, in terms of one another. The recursive rules (“productions”) involve only concatenation.</p>
<p>Lets start with a example. Consider these productions:</p>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>→</mo><mn>01</mn></mrow><annotation encoding="application/x-tex">S \to 01</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">01</span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>→</mo><mn>0</mn><mi>S</mi><mn>1</mn></mrow><annotation encoding="application/x-tex">S \to 0S1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">0</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord">1</span></span></span></span></li>
</ul>
<p>It means <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>01</mn></mrow><annotation encoding="application/x-tex">01</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">01</span></span></span></span> is in the language. And recursively, if <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span></span></span></span> is in the language, then so is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mi>w</mi><mn>1</mn></mrow><annotation encoding="application/x-tex">0w1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mord">1</span></span></span></span>.</p>
<p>Definations:</p>
<ul>
<li><strong>Terminals</strong>: symbols of the alphabet of the language being defined.</li>
<li><strong>Variables</strong> (nonterminals): a finite set of other symbols, each of which represents a language.</li>
<li><strong>Start symbol</strong>: the variable whose language is the one being defined.</li>
</ul>
<p>A <em>production</em> has the form <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>variable (head)</mtext><mo>→</mo><mtext>string of variables and terminals (body)</mtext></mrow><annotation encoding="application/x-tex">\text{variable (head)} \to \text{string of variables and terminals (body)}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">variable (head)</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">string of variables and terminals (body)</span></span></span></span></span>. Then we <em>derive</em> strings in the language of a CFG by starting with the start symbol, and repeatedly replacing some variable <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span> by the body of one of its productions.</p>
<p>For example,</p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>→</mo><mn>0</mn><mi>S</mi><mn>1</mn><mo>→</mo><mn>00</mn><mi>S</mi><mn>11</mn><mo>→</mo><mn>000</mn><mi>S</mi><mn>111</mn><mo>→</mo><mn>00001111</mn></mrow><annotation encoding="application/x-tex">S \to 0S1 \to 00S11 \to 000S111 \to 00001111</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">0</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">00</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord">11</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">000</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord">111</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">00001111</span></span></span></span></p>
<p>We are not going to introduce CFL in detail, so let's talk about how does it related to natural language. Let us consider a classic subject-verb-object structure (SVO), where a sentence consists of a subject, a verb, and an object in that order.</p>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>S</mi><mtext>sentence</mtext></msub><mo>→</mo><mi>S</mi><mi>V</mi><mi>O</mi></mrow><annotation encoding="application/x-tex">S_\text{sentence} \to SVO</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord text mtight"><span class="mord mtight">sentence</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>→</mo><mtext>我</mtext></mrow><annotation encoding="application/x-tex">S \to 我</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">我</span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>V</mi><mo>→</mo><mtext>打</mtext></mrow><annotation encoding="application/x-tex">V \to 打</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">打</span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo>→</mo><mtext>宿傩</mtext></mrow><annotation encoding="application/x-tex">O \to 宿傩</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">宿傩</span></span></span></span></li>
</ul>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>S</mi><mtext>sentence</mtext></msub><mo>→</mo><mi>S</mi><mi>V</mi><mi>O</mi><mo>→</mo><mtext>我</mtext><mi>V</mi><mi>O</mi><mo>→</mo><mtext>我打</mtext><mi>O</mi><mo>→</mo><mtext>我打宿傩</mtext></mrow><annotation encoding="application/x-tex">S_\text{sentence} \to SVO \to 我VO \to 我打O \to 我打宿傩</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord text mtight"><span class="mord mtight">sentence</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">我</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">我打</span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">我打宿傩</span></span></span></span></p>
<h2 id="cfg-of-natural-language-grammar"><a href="#cfg-of-natural-language-grammar">CFG of natural language grammar</a></h2>
<p>现在继续考虑自然语言。我们只考虑最简单的句子结构，不考虑时态、时体的话，可以构造这样一个 CFG</p>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>→</mo><msub><mi>N</mi><mi>P</mi></msub><msub><mi>V</mi><mi>P</mi></msub><mspace width="2em"></mspace></mrow><annotation encoding="application/x-tex">S \to N_PV_P \qquad</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:2em;"></span></span></span></span> (句子 → 名词短语 + 动词短语)</li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>N</mi><mi>P</mi></msub><mo>→</mo><mi>N</mi><mspace width="2em"></mspace></mrow><annotation encoding="application/x-tex">N_P \to N \qquad</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:2em;"></span></span></span></span> (纯名词)</li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>N</mi><mi>P</mi></msub><mo>→</mo><msub><mi>A</mi><mrow><mi>a</mi><mi>d</mi><mi>j</mi></mrow></msub><mi>N</mi><mspace width="2em"></mspace></mrow><annotation encoding="application/x-tex">N_P \to A_{adj}N \qquad</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">a</span><span class="mord mathnormal mtight">d</span><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span <li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>V</mi><mi>P</mi></msub><mo>→</mo><mi>V</mi><mspace width="2em"></mspace></mrow><annotation encoding="application/x-tex">V_P \to V \qquad</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mspace" style="margin-right:2em;"></span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>V</mi><mi>P</mi></msub><mo>→</mo><msub><mi>A</mi><mrow><mi>a</mi><mi>d</mi><mi>v</mi></mrow></msub><mi>V</mi><mspace width="2em"></mspace></mrow><annotation encoding="application/x-tex">V_P \to A_{adv}V \qquad</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">a</span><span class="mord mathnormal mtight">d</span><span class="mord mathnormal mtight" style="margin-right:0.0359em;">v</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span <h2 id="implement-by-rust"><a href="#implement-by-rust">Implement by Rust</a></h2>
<p>现在已经有了 CFG，需要考虑的是如何实现它。显而易见的，我们可以用一个 <code>enum</code> 存放可能出现的 Variables，并用 <code>match</code> 匹配 terminals. 因此我们能写出类似这样的代码：</p>

<span class="line"><span style="color:#6F42C1">    Sentence</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005CC5">    NP</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005CC5">    VP</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    N</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    VInt</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    VTra</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    VDit</span><span style="color:#24292E">,</span></span>

<span class="line"><span style="color:#6F42C1">    Some</span><span style="color:#e36209">(</span><span style="color:#D73A49">match</span><span style="color:#24292E"> symbol </span><span style="color:#5a32a3">{</span></span>
<span class="line"><span style="color:#6F42C1">        N</span><span style="color:#D73A49"> =</span><span style="color:#D73A49">></span><span style="color:#D73A49"> &#x26;</span><span style="color:#005cc5">[</span><span style="color:#032F62">"小豆泥"</span><span style="color:#24292E">, </span><span style="color:#032F62">"薯条"</span><span style="color:#24292E">, </span><span style="color:#032F62">"葡萄"</span><span style="color:#24292E">, </span><span style="color:#032F62">"咖啡"</span><span style="color:#005cc5">]</span><span style="color:#24292E">,</span></span>
