=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmtext>num str\x3C/mtext>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal L \\{\\text{num str}\\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mopen\">{\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">num str\x3C/span>\x3C/span>\x3Cspan class=\"mclose\">}\x3C/span>\x3C/span>\x3C/span>\x3C/span> 中引入函数。\x3C/p>\n\x3Cp>首先尝试引入 First order 函数。我们直接引入两个 expression \x3Ccode>call[f](e)\x3C/code> 和 \x3Ccode>fun[t1;t2](x1.e2; f.e)\x3C/code> 分别为 call 和 defination\x3C/p>\n\x3Cp>容易发现这样的定义并没有什么必要，为了将函数排除到 type 之外引入了不必要的额外的替换工作。所以引入 Higher Order Functions （箭头）\x3C/p>\n\x3Cp>\x3Ccode>type arr(t1, t2)\x3C/code> 记为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmsub>\x3Cmi>τ\x3C/mi>\x3Cmn>1\x3C/mn>\x3C/msub>\x3Cmo>→\x3C/mo>\x3Cmsub>\x3Cmi>τ\x3C/mi>\x3Cmn>2\x3C/mn>\x3C/msub>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\tau_1 \\to \\tau_2\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.5806em;vertical-align:-0.15em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t vlist-t2\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.3011em;\">\x3Cspan style=\"top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizi =\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">:\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3Cspan class=\"mord mathnormal\">e\x3C/span>\x3C/span>\x3C/span>\x3C/span> 为 abstraction\x3C/p>\n\x3Cp>新的语言记做 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmtext>num str\x3C/mtext>\x3Cmo>→\x3C/mo>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal L \\{\\text{num str} \\to\\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mopen\">{\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">num str\x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mclose\">}\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/Pasted%20image%2020250302224503.png\" alt=\"\">\x3C/p>\n\x3Ch2 id=\"chapter-9-godels-t\">\x3Ca href=\"#chapter-9-godels-t\">Chapter 9 Godel's T\x3C/a>\x3C/h2>\n\x3Cp>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmtext>nat\x3C/mtext>\x3Cmo>→\x3C/mo>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal L \\{\\text{nat} \\to\\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mopen\">{\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">nat\x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mclose\">}\x3C/span>\x3C/span>\x3C/span>\x3C/span> 哥德尔的 System T 为函数引入了递归的可能性。这个递归非常类似于数学归纳法：所有递归都是有限的。\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/Pasted%20image%2020250302224740.png\" alt=\"\">\x3C/p>\n\x3Cp>表达式 \x3Ccode>rec(e;e0;x.y.e1)\x3C/code> 称为原始递归。\x3C/p>\n\x3Cp>Godel's T 和之前介绍的语言都必定停机。\x3C/p>\n\x3Ch2 id=\"chapter-10-plotkins-pcf\">\x3Ca href=\"#chapter-10-plotkins-pcf\">Chapter 10 Plotkin's PCF\x3C/a>\x3C/h2>\n\x3Cp>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmtext>nat\x3C/mtext>\x3Cmo>⇀\x3C/mo>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal L \\{\\text{nat} \\rightharpoonup \\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mopen\">{\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">nat\x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-righ ypes</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>Practical Foundations for Programming Languages 是 Robert Harper 的一本书，而这是我写的笔记 3</p>

<h2 id="chapter-8-function-definations-and-values"><a href="#chapter-8-function-definations-and-values">Chapter 8 Function Definations and Values</a></h2>
<p>这一章我们尝试往 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mo stretchy="false">{</mo><mtext>num str</mtext><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\mathcal L \{\text{num str}\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal">L</span><span class="mopen">{</span><span class="mord text"><span class="mord">num str</span></span><span class="mclose">}</span></span></span></span> 中引入函数。</p>
<p>首先尝试引入 First order 函数。我们直接引入两个 expression <code>call[f](e)</code> 和 <code>fun[t1;t2](x1.e2; f.e)</code> 分别为 call 和 defination</p>
<p>容易发现这样的定义并没有什么必要，为了将函数排除到 type 之外引入了不必要的额外的替换工作。所以引入 Higher Order Functions （箭头）</p>
<p><code>type arr(t1, t2)</code> 记为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>τ</mi><mn>1</mn></msub><mo>→</mo><msub><mi>τ</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\tau_1 \to \tau_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 为函数类型</p>
<p><code>exp lam[\tau](x,e)</code>计为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi><mo stretchy="false">(</mo><mi>x</mi><mo>:</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>e</mi></mrow><annotation encoding="application/x-tex">\lambda(x:\tau)e</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">λ</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="mclose">)</span><span class="mord mathnormal">e</span></span></span></span> 为 abstraction</p>
<p>新的语言记做 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mo stretchy="false">{</mo><mtext>num str</mtext><mo>→</mo><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\mathcal L \{\text{num str} \to\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal">L</span><span class="mopen">{</span><span class="mord text"><span class="mord">num str</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mclose">}</span></span></span></span></p>
<p><img src="/images/Pasted%20image%2020250302224503.png" alt=""></p>
<h2 id="chapter-9-godels-t"><a href="#chapter-9-godels-t">Chapter 9 Godel's T</a></h2>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mo stretchy="false">{</mo><mtext>nat</mtext><mo>→</mo><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\mathcal L \{\text{nat} \to\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal">L</span><span class="mopen">{</span><span class="mord text"><span class="mord">nat</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mclose">}</span></span></span></span> 哥德尔的 System T 为函数引入了递归的可能性。这个递归非常类似于数学归纳法：所有递归都是有限的。</p>
<p><img src="/images/Pasted%20image%2020250302224740.png" alt=""></p>
<p>表达式 <code>rec(e;e0;x.y.e1)</code> 称为原始递归。</p>
<p>Godel's T 和之前介绍的语言都必定停机。</p>
<h2 id="chapter-10-plotkins-pcf"><a href="#chapter-10-plotkins-pcf">Chapter 10 Plotkin's PCF</a></h2>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mo stretchy="false">{</mo><mtext>nat</mtext><mo>⇀</mo><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\mathcal L \{\text{nat} \rightharpoonup \}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal">L</span><span class="mopen">{</span><span class="mord text"><span class="mord">nat</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇀</span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mclose">}</span></span></span></span> 是 Plotkin's PCF。引入了一个 fix 操作，允许函数无限制的自我递归。</p>
<p>Plotkin's PCF 是图灵完备的。</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en">CC BY-NC-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">March 2, 2025</time><!--$--><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-02-09-cuthair20250209"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent">2025-02-09-cuthair20250209</span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-03-07-pfpl-note-4"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">PFPL 笔记 - IV Finite Data Types</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[17]($R[3],!0);</script>
