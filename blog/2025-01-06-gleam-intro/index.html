ition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#immutable" class="text-ink-soft hover:text-accent">Immutable</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#pipeline" class="text-ink-soft hover:text-accent">Pipeline</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#pattern-matching" class="text-ink-soft hover:text-accent">Pattern matching</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#只有递归" class="text-ink-soft hover:text-accent">只有递归</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#use-sugar" class="text-ink-soft hover:text-accent">Use sugar</a></li><li _hk=0010070l150 class="" style="padding-left:12px"><a href="#实战写个-json-parser" class="text-ink-soft hover:text-accent">实战：写个 JSON Parser</a></li><li _hk=0010070l160 class="" style="padding-left:12px"><a href="#还有一些缺陷" class="text-ink-soft hover:text-accent">还有一些缺陷</a></li><li _hk=0010070l170 class="" style="padding-left:12px"><a href="#总结" class="text-ink-soft hover:text-accent">总结</a></li></ul></nav></aside></div></div></body></html><script>($R[23]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"仿生电子锈会梦到自己变成纯函数式吗：gleam 语言初见",date:"2025-01-06T10:36:24",tags:$R[11]=["Code","Gleam","Functional","PL"],comments:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"仿生电子锈会梦到自己变成纯函数式吗：gleam 语言初见",html:"\x3Cp>\x3Cem>Gleam is a friendly language for building type-safe systems that scale!\x3C/em> —— \x3Ca href=\"https://gleam.run/\">https://gleam.run/\x3C/a>\x3C/p>\n\x3Cp>虽然我倒不觉得纯函数式语言能有多 friendly……\x3C/p>\n\x3C!-- more -->\n\x3Cp>事情的起因是刷到知乎提问如何评价 gleam 语言，然后有人说在 rust 和 go 之间应该有一门中间态的语言 balabala\x3C/p>\n\x3Cp>于是就跑过去看了，最开始看语法如此像 rust，再加上安利的描述，还以为是 GC 的过程式语言加点函数式糖，直到看到 Gleam is an immutable language 才发现啊被骗了怎么是纯函数式（）\x3C/p>\n\x3Cp>先来看看 hello world：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> gleam\x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\">io\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">println\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"Hello, world!\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>非常好懂（点头\x3C/p>\n\x3Ch2 id=\"immutable\">\x3Ca href=\"#immutable\">Immutable\x3C/a>\x3C/h2>\n\x3Cp>虽然 immutable 比过程式语言通常写起来更容易遇到一些不得不搞一些奇怪的递归函数的情况，但是也是一个不错的选择。\x3C/p>\n\x3Cp>Gleam 会编译到 Erlang（可以编译到 js，但是因为语言特性很容易爆递归），听说过 Erlang 的人大概都知道这个传闻：写 Erlang/Elixir 的人习以为常地开几万甚至几十万个进程\x3Csup>\x3Ca href=\"#user-content-fn-elixir%20%E7%9A%84%E8%BF%9B%E7%A8%8B%E6%98%AF%20erlang%20%E8%99%9A%E6%8B%9F%E6%9C%BA%E6%8F%90%E4%BE%9B%E7%9A%84%E2%80%9C%E8%BD%BB%E9%87%8F%E7%BA%A7%E2%80%9D%E8%BF%9B%E7%A8%8B%EF%BC%8C%E7%94%9A%E8%87%B3%E6%AF%94%E4%B8%80%E8%88%AC%E8%AF%AD%E8%A8%80%E7%9A%84%E7%BA%BF%E7%A8%8B%E8%BF%98%E8%BD%BB%E9%87%8F\" id=\"user-content-fnref-elixir%20%E7%9A%84%E8%BF%9B%E7%A8%8B%E6%98%AF%20erlang%20%E8%99%9A%E6%8B%9F%E6%9C%BA%E6%8F%90%E4%BE%9B%E7%9A%84%E2%80%9C%E8%BD%BB%E9%87%8F%E7%BA%A7%E2%80%9D%E8%BF%9B%E7%A8%8B%EF%BC%8C%E7%94%9A%E8%87%B3%E6%AF%94%E4%B8%80%E8%88%AC%E8%AF%AD%E8%A8%80%E7%9A%84%E7%BA%BF%E7%A8%8B%E8%BF%98%E8%BD%BB%E9%87%8F\" data-footnote-ref aria-describedby=\"footnote-label\">1\x3C/a>\x3C/sup>，这也是得益于 immutable 的特性让并发操作变得非常简单好写\x3C/p>\n\x3Cp>对于 mutable 的语言，需要担忧一块内存空间被并发地同时读和写，进而引出了一堆的互斥锁/原子操作之类的概念，而 immutable 根本不需要担心这个问题，因为你根本没有编写“覆写”一块内存区域的代码，（虽然 Erlang 虚拟机可能会优化这个操作，从而实际上覆写），所有的变量都是只读的。\x3C/p>\n\x3Cp>这也是大多数 immutable 函数式语言共享的优势，许多纯函数连状态都没有，自然也就不存在状态不一致的问题。对于函数式而言并发、scale 都是天然的事情。\x3C/p>\n\x3Ch2 id=\"pipeline\">\x3Ca href=\"#pipeline\">Pipeline\x3C/a>\x3C/h2>\n\x3Cp>Gleam 支持 pipeline 操作\x3C/p>\n\x3Cp>我是链式调用狂热粉丝（？）所以非常需要这个！对我来说一个语言能吸引我的一个重要的 sugar 就是类似 pipeline 的机制 i.e.\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">|\x3C/span>\x3Cspan style=\"color:#6F42C1\">>\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\"> ::\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> b\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">|\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> f \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> f x\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这意味着任何一个 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>f\x3C/mi>\x3Cmo>:\x3C/mo>\x3Cmi>a\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmi>b\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">f: a \\to b\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1076em;\">f\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">:\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3C/span>\x3C/span>\x3C/span> 都能 pipeline 一个 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>a\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">a\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3C/span>\x3C/span>\x3C/span> 进去得到 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>b\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">b\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3C/span>\x3C/span>\x3C/span>，非常好用，因为很多现实世界的操作本来就是串联起来的\x3C/p>\n\x3Cp>比如你可以在 gleam 中写这样的：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> gleam\x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\">io\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> gleam\x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\">string\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // Without the pipe operator\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">debug\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">drop_start\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">drop_end\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"Hello, Joe!\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">7\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Joe\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // With the pipe operator\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#032F62\">  \"Hello, Mike!\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">drop_end\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">drop_start\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">7\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> io.debug \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Mike\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  // Changing order with function capturing\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#032F62\">  \"1\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">append\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"2\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> string.\x3C/span>\x3Cspan style=\"color:#6F42C1\">append\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"3\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#6A737D\">_\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  |\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> io.debug  \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"312\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>中缀表示法 \x3Ccode>a f b\x3C/code> 就是比前缀表示法 \x3Ccode>f a b\x3C/code> 在链式调用下好看多了！这或许是一种比 Ruby 的 Open Class 更好的方案来给对象添加“成员函数”，因为实际上成员函数就是一个 \x3Ccode>fn(self, ...)\x3C/code>\x3C/p>\n\x3Ch2 id=\"pattern-matching\">\x3Ca href=\"#pattern-matching\">Pattern matching\x3C/a>\x3C/h2>\n\x3Cp>说到函数式语言最重要的特色当然是 Pattern matching！\x3C/p>\n\x3Cp>Gleam 的 Pattern matching 基本上就是 rust 的形状，不过更强大，和大多数其它函数式语言一样可以匹配一些内置运算：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> gleam\x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\">io\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">debug\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">get_name\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"Hello, Joe\"\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">            \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Joe\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">debug\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">get_name\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"Hello, Mike\"\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">           \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Mike\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">debug\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">get_name\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"System still working?\"\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Unknown\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> get_name\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">x: \x3C/span>\x3Cspan style=\"color:#6F42C1\">String\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> String\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  case\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#032F62\">    \"Hello, \"\x3C/span>\x3Cspan style=\"color:#D73A49\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> name \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> name\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">    _\x3C/span>\x3Cspan style=\"color:#D73A49\"> -\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#032F62\"> \"Unknown\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>Gleam 也能写类似 Rust 的 \x3Ccode>let\x3C/code>，但是 Gleam 不存在 \x3Ccode>if\x3C/code> 所以没法写 \x3Ccode>if let\x3C/code> 也没有 \x3Ccode>let mut\x3C/code> 这些东西，let 就是一个纯的 irrefutable 的 pattern matching 而已。当然更多的时候可以用来给变量“赋值”（）\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> gleam\x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\">io\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Teacher\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  Teacher\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#E36209\">name: \x3C/span>\x3Cspan style=\"color:#6F42C1\">String\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#E36209\">subject: \x3C/span>\x3Cspan style=\"color:#6F42C1\">String\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  let\x3C/span>\x3Cspan style=\"color:#24292E\"> teacher \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Teacher\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"Mr Schofield\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"Physics\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  let\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Teacher\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">tname, \x3C/span>\x3Cspan style=\"color:#6A737D\">_\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> teacher\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  io.\x3C/span>\x3Cspan style=\"color:#6F42C1\">debug\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">tname\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6A737D\">// \"Mr Schofield\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch2 id=\"只有递归\">\x3Ca href=\"#只有递归\">只有递归\x3C/a>\x3C/h2>\n\x3Cp>和很多纯函数式语言一样，Gleam 没有循环结构只有递归，老实说我不觉得这很好，因为这让一些简单的事情变得更复杂……\x3C/p>\n\x3Cp>经典的 list 求 sum 可以写这样的函数\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> sum_list\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">list: \x3C/span>\x3Cspan style=\"color:#6F42C1\">List\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">Int\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Int\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  case\x3C/span>\x3Cspan style=\"color:#24292E\"> list \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#5a32a3\">[\x3C/span>\x3Cspan style=\"color:#24292E\">first, \x3C/span>\x3Cspan style=\"color:#D73A49\">..\x3C/span>\x3Cspan style=\"color:#24292E\">rest\x3C/span>\x3Cspan style=\"color:#5a32a3\">]\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> first \x3C/span>\x3Cspan style=\"color:#D73A49\">+\x3C/span>\x3Cspan style=\"color:#6F42C1\"> sum_list\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">rest\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#5a32a3\">[\x3C/span>\x3Cspan style=\"color:#5a32a3\">]\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#005CC5\"> 0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>有过函数式经验的人应该非常好理解，也就是每次取第一位递归地加末尾。写成 haskell 就是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">sumlist\x3C/span>\x3Cspan style=\"color:#D73A49\"> ::\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#D73A49\">Int\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> Int\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">sumlist \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#005CC5\"> 0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">sumlist \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#24292E\">xs\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">+\x3C/span>\x3Cspan style=\"color:#24292E\"> sumlist xs\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>看上去 gleam 还更长一点，没有 haskell 的韵味 xd\x3C/p>\n\x3Ch2 id=\"use-sugar\">\x3Ca href=\"#use-sugar\">Use sugar\x3C/a>\x3C/h2>\n\x3Cp>比较喜欢的是 Gleam 的 use sugar，类似 Javascript 的 \x3Ccode>async/await\x3C/code> 一样，负责简化嵌套层级。\x3C/p>\n\x3Cblockquote>\n\x3Cp>Gleam's use expression helps out here by enabling us to write code that uses callbacks in an unindented style, as shown in the code window.\nGleam 的 use 表达式使我们能够编写以未缩进样式使用回调的代码，从而在此处提供帮助，如代码窗口中所示。\x3C/p>\n\x3Cp>The higher order function being called goes on the right hand side of the &#x3C;- operator. It must take a callback function as its final argument.\n被调用的高阶函数位于 &#x3C;- 运算符的右侧。它必须将回调函数作为其最终参数。\x3C/p>\n\x3Cp>The argument names for the callback function go on the left hand side of the &#x3C;- operator. The function can take any number of arguments, including zero.\n回调函数的参数名称位于 &#x3C;- 运算符的左侧。该函数可以接受任意数量的参数，包括零。\x3C/p>\n\x3Cp>All the remaining code in the enclosing {} block becomes the body of the callback function.\n <p>虽然我倒不觉得纯函数式语言能有多 friendly……</p>
<!-- more -->
<p>事情的起因是刷到知乎提问如何评价 gleam 语言，然后有人说在 rust 和 go 之间应该有一门中间态的语言 balabala</p>
<p>于是就跑过去看了，最开始看语法如此像 rust，再加上安利的描述，还以为是 GC 的过程式语言加点函数式糖，直到看到 Gleam is an immutable language 才发现啊被骗了怎么是纯函数式（）</p>
<p>先来看看 hello world：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">import</span><span style="color:#24292E"> gleam</span><span style="color:#D73A49">/</span><span style="color:#24292E">io</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> fn</span><span style="color:#6F42C1"> main</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  io.</span><span style="color:#6F42C1">println</span><span style="color:#e36209">(</span><span style="color:#032F62">"Hello, world!"</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>非常好懂（点头</p>
<h2 id="immutable"><a href="#immutable">Immutable</a></h2>
<p>虽然 immutable 比过程式语言通常写起来更容易遇到一些不得不搞一些奇怪的递归函数的情况，但是也是一个不错的选择。</p>
<p>Gleam 会编译到 Erlang（可以编译到 js，但是因为语言特性很容易爆递归），听说过 Erlang 的人大概都知道这个传闻：写 Erlang/Elixir 的人习以为常地开几万甚至几十万个进程<sup><a href="#user-content-fn-elixir%20%E7%9A%84%E8%BF%9B%E7%A8%8B%E6%98%AF%20erlang%20%E8%99%9A%E6%8B%9F%E6%9C%BA%E6%8F%90%E4%BE%9B%E7%9A%84%E2%80%9C%E8%BD%BB%E9%87%8F%E7%BA%A7%E2%80%9D%E8%BF%9B%E7%A8%8B%EF%BC%8C%E7%94%9A%E8%87%B3%E6%AF%94%E4%B8%80%E8%88%AC%E8%AF%AD%E8%A8%80%E7%9A%84%E7%BA%BF%E7%A8%8B%E8%BF%98%E8%BD%BB%E9%87%8F" id="user-content-fnref-elixir%20%E7%9A%84%E8%BF%9B%E7%A8%8B%E6%98%AF%20erlang%20%E8%99%9A%E6%8B%9F%E6%9C%BA%E6%8F%90%E4%BE%9B%E7%9A%84%E2%80%9C%E8%BD%BB%E9%87%8F%E7%BA%A7%E2%80%9D%E8%BF%9B%E7%A8%8B%EF%BC%8C%E7%94%9A%E8%87%B3%E6%AF%94%E4%B8%80%E8%88%AC%E8%AF%AD%E8%A8%80%E7%9A%84%E7%BA%BF%E7%A8%8B%E8%BF%98%E8%BD%BB%E9%87%8F" data-footnote-ref aria-describedby="footnote-label">1</a></sup>，这也是得益于 immutable 的特性让并发操作变得非常简单好写</p>
<p>对于 mutable 的语言，需要担忧一块内存空间被并发地同时读和写，进而引出了一堆的互斥锁/原子操作之类的概念，而 immutable 根本不需要担心这个问题，因为你根本没有编写“覆写”一块内存区域的代码，（虽然 Erlang 虚拟机可能会优化这个操作，从而实际上覆写），所有的变量都是只读的。</p>
<p>这也是大多数 immutable 函数式语言共享的优势，许多纯函数连状态都没有，自然也就不存在状态不一致的问题。对于函数式而言并发、scale 都是天然的事情。</p>
<h2 id="pipeline"><a href="#pipeline">Pipeline</a></h2>
<p>Gleam 支持 pipeline 操作</p>
<p>我是链式调用狂热粉丝（？）所以非常需要这个！对我来说一个语言能吸引我的一个重要的 sugar 就是类似 pipeline 的机制 i.e.</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">(</span><span style="color:#6F42C1">|</span><span style="color:#6F42C1">></span><span style="color:#005cc5">)</span><span style="color:#D73A49"> ::</span><span style="color:#24292E"> a </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> b</span></span>
<span class="line"><span style="color:#24292E">x </span><span style="color:#D73A49">|</span><span style="color:#D73A49">></span><span style="color:#24292E"> f </span><span style="color:#D73A49">=</span><span style="color:#24292E"> f x</span></span></code></pre>
<p>这意味着任何一个 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>:</mo><mi>a</mi><mo>→</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">f: a \to b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span> 都能 pipeline 一个 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span> 进去得到 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span>，非常好用，因为很多现实世界的操作本来就是串联起来的</p>
<p>比如你可以在 gleam 中写这样的：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">import</span><span style="color:#24292E"> gleam</span><span style="color:#D73A49">/</span><span style="color:#24292E">io</span></span>
<span class="line"><span style="color:#D73A49">import</span><span style="color:#24292E"> gleam</span><span style="color:#D73A49">/</span><span style="color:#24292E">string</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> fn</span><span style="color:#6F42C1"> main</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#6A737D">  // Without the pipe operator</span></span>
<span class="line"><span style="color:#24292E">  io.</span><span style="color:#6F42C1">debug</span><span style="color:#e36209">(</span><span style="color:#24292E">string.</span><span style="color:#6F42C1">drop_start</span><span style="color:#5a32a3">(</span><span style="color:#24292E">string.</span><span style="color:#6F42C1">drop_end</span><span style="color:#005cc5">(</span><span style="color:#032F62">"Hello, Joe!"</span><span style="color:#24292E">, </span><span style="color:#005CC5">1</span><span style="color:#005cc5">)</span><span style="color:#24292E">, </span><span style="color:#005CC5">7</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#6A737D">// "Joe"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">  // With the pipe operator</span></span>
<span class="line"><span style="color:#032F62">  "Hello, Mike!"</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.</span><span style="color:#6F42C1">drop_end</span><span style="color:#e36209">(</span><span style="color:#005CC5">1</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.</span><span style="color:#6F42C1">drop_start</span><span style="color:#e36209">(</span><span style="color:#005CC5">7</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> io.debug </span><span style="color:#6A737D">// "Mike"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">  // Changing order with function capturing</span></span>
<span class="line"><span style="color:#032F62">  "1"</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.</span><span style="color:#6F42C1">append</span><span style="color:#e36209">(</span><span style="color:#032F62">"2"</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.</span><span style="color:#6F42C1">append</span><span style="color:#e36209">(</span><span style="color:#032F62">"3"</span><span style="color:#24292E">, </span><span style="color:#6A737D">_</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#D73A49">  |</span><span style="color:#D73A49">></span><span style="color:#24292E"> io.debug  </span><span style="color:#6A737D">// "312"</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>中缀表示法 <code>a f b</code> 就是比前缀表示法 <code>f a b</code> 在链式调用下好看多了！这或许是一种比 Ruby 的 Open Class 更好的方案来给对象添加“成员函数”，因为实际上成员函数就是一个 <code>fn(self, ...)</code></p>
<h2 id="pattern-matching"><a href="#pattern-matching">Pattern matching</a></h2>
<p>说到函数式语言最重要的特色当然是 Pattern matching！</p>
<p>Gleam 的 Pattern matching 基本上就是 rust 的形状，不过更强大，和大多数其它函数式语言一样可以匹配一些内置运算：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">import</span><span style="color:#24292E"> gleam</span><span style="color:#D73A49">/</span><span style="color:#24292E">io</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> fn</span><span style="color:#6F42C1"> main</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  io.</span><span style="color:#6F42C1">debug</span><span style="color:#e36209">(</span><span style="color:#6F42C1">get_name</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"Hello, Joe"</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">            </span><span style="color:#6A737D">// "Joe"</span></span>
<span class="line"><span style="color:#24292E">  io.</span><span style="color:#6F42C1">debug</span><span style="color:#e36209">(</span><span style="color:#6F42C1">get_name</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"Hello, Mike"</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">           </span><span style="color:#6A737D">// "Mike"</span></span>
<span class="line"><span style="color:#24292E">  io.</span><span style="color:#6F42C1">debug</span><span style="color:#e36209">(</span><span style="color:#6F42C1">get_name</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"System still working?"</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#6A737D">// "Unknown"</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> get_name</span><span style="color:#005cc5">(</span><span style="color:#E36209">x: </span><span style="color:#6F42C1">String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> String</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  case</span><span style="color:#24292E"> x </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#032F62">    "Hello, "</span><span style="color:#D73A49"> </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> name </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> name</span></span>
<span class="line"><span style="color:#6A737D">    _</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#032F62"> "Unknown"</span></span>

<p>Gleam 也能写类似 Rust 的 <code>let</code>，但是 Gleam 不存在 <code>if</code> 所以没法写 <code>if let</code> 也没有 <code>let mut</code> 这些东西，let 就是一个纯的 irrefutable 的 pattern matching 而已。当然更多的时候可以用来给变量“赋值”（）</p>

<h2 id="只有递归"><a href="#只有递归">只有递归</a></h2>
<p>和很多纯函数式语言一样，Gleam 没有循环结构只有递归，老实说我不觉得这很好，因为这让一些简单的事情变得更复杂……</p>
<p>经典的 list 求 sum 可以写这样的函数</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> sum_list</span><span style="color:#005cc5">(</span><span style="color:#E36209">list: </span><span style="color:#6F42C1">List</span><span style="color:#e36209">(</span><span style="color:#6F42C1">Int</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Int</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  case</span><span style="color:#24292E"> list </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#5a32a3">[</span><span style="color:#24292E">first, </span><span style="color:#D73A49">..</span><span style="color:#24292E">rest</span><span style="color:#5a32a3">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> first </span><span style="color:#D73A49">+</span><span style="color:#6F42C1"> sum_list</span><span style="color:#5a32a3">(</span><span style="color:#24292E">rest</span><span style="color:#5a32a3">)</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#5a32a3">[</span><span style="color:#5a32a3">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#005CC5"> 0</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>有过函数式经验的人应该非常好理解，也就是每次取第一位递归地加末尾。写成 haskell 就是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">sumlist</span><span style="color:#D73A49"> ::</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#D73A49">Int</span><span style="color:#005cc5">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#D73A49"> Int</span></span>
<span class="line"><span style="color:#24292E">sumlist </span><span style="color:#005cc5">[</span><span style="color:#005cc5">]</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> 0</span></span>
<span class="line"><span style="color:#24292E">sumlist </span><span style="color:#005cc5">(</span><span style="color:#24292E">x</span><span style="color:#D73A49">:</span><span style="color:#24292E">xs</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> x </span><span style="color:#D73A49">+</span><span style="color:#24292E"> sumlist xs</span></span></code></pre>
<p>看上去 gleam 还更长一点，没有 haskell 的韵味 xd</p>
<h2 id="use-sugar"><a href="#use-sugar">Use sugar</a></h2>
<p>比较喜欢的是 Gleam 的 use sugar，类似 Javascript 的 <code>async/await</code> 一样，负责简化嵌套层级。</p>
<blockquote>
<p>Gleam's use expression helps out here by enabling us to write code that uses callbacks in an unindented style, as shown in the code window.
Gleam 的 use 表达式使我们能够编写以未缩进样式使用回调的代码，从而在此处提供帮助，如代码窗口中所示。</p>
<p>The higher order function being called goes on the right hand side of the &#x3C;- operator. It must take a callback function as its final argument.
被调用的高阶函数位于 &#x3C;- 运算符的右侧。它必须将回调函数作为其最终参数。</p>
<p>The argument names for the callback function go on the left hand side of the &#x3C;- operator. The function can take any number of arguments, including zero.
回调函数的参数名称位于 &#x3C;- 运算符的左侧。该函数可以接受任意数量的参数，包括零。</p>
<p>All the remaining code in the enclosing {} block becomes the body of the callback function.
封闭的 {} 块中的所有剩余代码都成为回调函数的主体。</p>
</blockquote>

<h2 id="实战写个-json-parser"><a href="#实战写个-json-parser">实战：写个 JSON Parser</a></h2>
<p>其实本来是想在 rust 里写 json parser 的但是看到有这么像 rust 的 gleam 以后就干脆拿 gleam 了（</p>
<p>由于 parse number 比较复杂这又是个玩具就不写 number parser 了</p>
<p>首先定义节点的类型，长得很像 rust 的语法（整个语言都很像啊喂！）</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> type</span><span style="color:#6F42C1"> Node</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#6F42C1">  Nul</span></span>
<span class="line"><span style="color:#6F42C1">  Bol</span><span style="color:#e36209">(</span><span style="color:#E36209">val: </span><span style="color:#6F42C1">Bool</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#6F42C1">  Num</span><span style="color:#e36209">(</span><span style="color:#E36209">val: </span><span style="color:#6F42C1">Int</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#6F42C1">  Str</span><span style="color:#e36209">(</span><span style="color:#E36209">val: </span><span style="color:#6F42C1">String</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#6F42C1">  Arr</span><span style="color:#e36209">(</span><span style="color:#E36209">val: </span><span style="color:#6F42C1">List</span><span style="color:#5a32a3">(</span><span style="color:#6F42C1">Node</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#6F42C1">  Obj</span><span style="color:#e36209">(</span><span style="color:#E36209">val: </span><span style="color:#24292E">dict.</span><span style="color:#6F42C1">Dict</span><span style="color:#5a32a3">(</span><span style="color:#6F42C1">String</span><span style="color:#24292E">, </span><span style="color:#6F42C1">Node</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span></span>

<h2 id="还有一些缺陷"><a href="#还有一些缺陷">还有一些缺陷</a></h2>
<p>可能是我不会用的原因，gleam 莫名不能 production build……build 的产物全是在 dev 文件夹下的，令人担忧它实际的能力</p>
<p>gleam 也不能随便找个文件夹就开始编写单文件代码然后直接 build 一个可执行文件，必须新建一个 project</p>
<h2 id="总结"><a href="#总结">总结</a></h2>
<p>Gleam 是一个长得很像 rust 的纯函数式语言。由于我不怎么写函数式，写起来还是略微费劲了一点（）</p>
<p>像下面 ⬇️ 这样的代码片段显得 gleam 很有魅力，但是因为没有 if，遇到只有两个的情况还不得不 case match 就有点令人抓狂了</p>
