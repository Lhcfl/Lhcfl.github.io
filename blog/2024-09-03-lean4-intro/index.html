ition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#假装这是前言" class="text-ink-soft hover:text-accent">假装这是前言</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#preparation" class="text-ink-soft hover:text-accent">Preparation</a></li><li _hk=0010070l120 class="" style="padding-left:24px"><a href="#install" class="text-ink-soft hover:text-accent">Install</a></li><li _hk=0010070l130 class="" style="padding-left:24px"><a href="#the-book" class="text-ink-soft hover:text-accent">The book</a></li><li _hk=0010070l140 class="" style="padding-left:24px"><a href="#basics" class="text-ink-soft hover:text-accent">Basics</a></li><li _hk=0010070l150 class="" style="padding-left:24px"><a href="#tactic" class="text-ink-soft hover:text-accent">Tactic</a></li></ul></nav></aside></div></div></body></html><script>($R[20]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"Lean 初见笔记",date:"2024-09-03T18:01:21",tags:$R[11]=["Math","PL","Lean","Code","Functional"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"Lean 初见笔记",html:"\x3Cp>Lean 4 是一个功能强大的交互式定理证明器和编程语言，结合了逻辑推理与编程，主要用于形式化验证、数学证明以及高可靠性软件开发。Lean 4 提供了一个灵活的类型系统和高性能的编译器，使其在理论研究和实际应用中都有出色表现。 —— GPT 说的。\x3C/p>\n\x3Cp>F*ck 我为什么要去看这种东西啊（悲） —— 我说的\x3C/p>\n\x3C!-- more -->\n\x3Cstyle>\n@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');\n.post-content { \n  font-family: \"Open sans\", Arial;\n}\n\x3C/style>\n\x3Ch2 id=\"假装这是前言\">\x3Ca href=\"#假装这是前言\">假装这是前言\x3C/a>\x3C/h2>\n\x3Cp>\\senioria/\x3C/p>\n\x3Cp>这篇博客我会尝试用英语写。\x3C/p>\n\x3Ch2 id=\"preparation\">\x3Ca href=\"#preparation\">Preparation\x3C/a>\x3C/h2>\n\x3Ch3 id=\"install\">\x3Ca href=\"#install\">Install\x3C/a>\x3C/h3>\n\x3Cp>Follow the guide at \x3Ca href=\"https://leanprover-community.github.io/get_started.html\">https://leanprover-community.github.io/get_started.html\x3C/a>\x3C/p>\n\x3Ch3 id=\"the-book\">\x3Ca href=\"#the-book\">The book\x3C/a>\x3C/h3>\n\x3Cp>I'm firstly reading \x3Ca href=\"https://leanprover-community.github.io/mathematics_in_lean/C01_Introduction.html\">Mathematics in Lean\x3C/a> to start. It is the standard mathematics-oriented reference is Mathematics in Lean, recommended by Lean Community. Unlike other popular languages, you may need a high perspective of math to learn Lean.\x3C/p>\n\x3Cul>\n\x3Cli>Senioria: linca 这种动态语言迷居然觉得 lean 爽 x（超小声（\x3C/li>\n\x3Cli>Me: no 我是在用它作为定理证明 （看上去就好坐牢\x3C/li>\n\x3C/ul>\n\x3Cp>（……真的有人会用 Lean 这种语言去写代码吗……学术代码例外）\x3C/p>\n\x3Cp>Unlike other languages, in general, if you just open a single \x3Ccode>.lean\x3C/code> file in your text editor and try to compile it, you'll get a bunch of confusing errors.\x3C/p>\n\x3Cp>Thus, you should \x3Cstrong>\x3Cem>strictly\x3C/em>\x3C/strong> follow \x3Ca href=\"https://leanprover-community.github.io/install/project.html#working-on-an-existing-project\">the guide\x3C/a>, if you're a starter. I suggest this because I messed up my environment just by swapping a step (oh...), that's my personal experience.\x3C/p>\n\x3Cp>如果你是初学者，你应该严格的遵守安装指南。这是我的亲身体会，你只需要交换一个看上去微不足道的步骤就能搞坏你的环境。（毕竟初学者）\x3C/p>\n\x3Cp>Every non-trivial piece of Lean code needs to live inside a Lean project (sometimes also called a Lean package). A \"Lean project\" is more than just a folder that you've named \"My Lean stuff\". Rather, it's a folder containing some very specific things: in particular, a git repository and a file lakefile.lean that gathers information about dependencies of the project, including for instance the version of Lean that should be used.\x3C/p>\n\x3Ch3 id=\"basics\">\x3Ca href=\"#basics\">Basics\x3C/a>\x3C/h3>\n\x3Cp>Learn requires us to justify \x3Cstrong>each\x3C/strong> step in a calculation. For example:\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">example\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a b c : ℝ\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : a * b * c = b * \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a * c\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := \x3C/span>\x3Cspan style=\"color:#D73A49\">by\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">mul_comm a b\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">mul_assoc b a c\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>The \x3Ccode>rw\x3C/code> means \"rewrite\". And the \x3Ccode>mul_comm\x3C/code> here means Commutative property of multiplication（乘法交换律）. So, \x3Ccode>rw [mul_comm a b]\x3C/code> means \"rewrite patterns match \x3Ccode>(a * b)\x3C/code> to \x3Ccode>(b * a)\x3C/code>\".\x3C/p>\n\x3Cp>You can see the replaced formula in VSCode here:\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/mul_comm_20240903184037.png\" alt=\"mul_comm_20240903184037.png\">\x3C/p>\n\x3Cp>And \x3Ccode>\\l\x3C/code> (\x3Ccode>←\x3C/code>) stands for right-to-left equation replacement. For example:\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">example\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a b c : ℝ\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : b * \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a * c\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> = a * b * c := \x3C/span>\x3Cspan style=\"color:#D73A49\">by\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">← mul_assoc b a c\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">← mul_comm a b\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>It is the reverse of the previous proof.\x3C/p>\n\x3Ch3 id=\"tactic\">\x3Ca href=\"#tactic\">Tactic\x3C/a>\x3C/h3>\n\x3Cp>It will be annoying to write duplicated basic formulas, for example if we are proving this:\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">example\x3C/span>\x3Cspan style=\"color:#24292E\"> : g + a + d + e + b + h + f + c = a + b + c + d + e + f + g + h := \x3C/span>\x3Cspan style=\"color:#D73A49\">by\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_comm g\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc a, add_comm g, ← add_assoc\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + d\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_comm g, ← add_assoc\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + d + e\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_comm g, ← add_assoc\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + d + e + b\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc a, add_comm \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">d + e\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, ← add_assoc a\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + b + \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">d + e\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_comm \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">g + h\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + b + \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">d + e\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_comm \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">f + \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">g + h\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, ← add_assoc\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">add_assoc \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a + b\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, add_comm \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">d + e\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  rw \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">← add_assoc, ← add_assoc, ← add_assoc, ← add_assoc\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>We reordered the items tediously, but this is something that a human would know is correct at first glance. In fact, Lean requires a rigorous proof, so this is essential, but we can let the computer do this boring work for us. We need to introduce a magic: \x3Cem>Tactic\x3C/em>\x3C/p>\n\x3Cblockquote>\n\x3Cp>The \x3Ccode>ring\x3C/code> tactic is imported indirectly when we import \x3Ccode>Mathlib.Data.Real.Basic\x3C/code>, but we will see in the next section that it can be used for calculations on structures other than the real numbers. It can be imported explicitly with the command \x3Ccode>import Mathlib.Tactic\x3C/code>. We will see there are similar tactics for other common kind of algebraic structures.\x3C/p>\n\x3C/blockquote>\n\x3Cp>The \x3Ccode>ring\x3C/code> tactic is designed to prove identities in any commutative ring as long as they follow purely from the ring axioms, without using any local assumption. So we can rewrite the tedious proof above, with only one line:\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">example\x3C/span>\x3Cspan style=\"color:#24292E\"> : g + a + d + e + b + h + f + c = a + b + c + d + e + f <h2 id="preparation"><a href="#preparation">Preparation</a></h2>
<h3 id="install"><a href="#install">Install</a></h3>
<p>Follow the guide at <a href="https://leanprover-community.github.io/get_started.html">https://leanprover-community.github.io/get_started.html</a></p>
<h3 id="the-book"><a href="#the-book">The book</a></h3>
<p>I'm firstly reading <a href="https://leanprover-community.github.io/mathematics_in_lean/C01_Introduction.html">Mathematics in Lean</a> to start. It is the standard mathematics-oriented reference is Mathematics in Lean, recommended by Lean Community. Unlike other popular languages, you may need a high perspective of math to learn Lean.</p>
<ul>
<li>Senioria: linca 这种动态语言迷居然觉得 lean 爽 x（超小声（</li>
<li>Me: no 我是在用它作为定理证明 （看上去就好坐牢</li>
</ul>
<p>（……真的有人会用 Lean 这种语言去写代码吗……学术代码例外）</p>
<p>Unlike other languages, in general, if you just open a single <code>.lean</code> file in your text editor and try to compile it, you'll get a bunch of confusing errors.</p>
<p>Thus, you should <strong><em>strictly</em></strong> follow <a href="https://leanprover-community.github.io/install/project.html#working-on-an-existing-project">the guide</a>, if you're a starter. I suggest this because I messed up my environment just by swapping a step (oh...), that's my personal experience.</p>
<p>如果你是初学者，你应该严格的遵守安装指南。这是我的亲身体会，你只需要交换一个看上去微不足道的步骤就能搞坏你的环境。（毕竟初学者）</p>
<p>Every non-trivial piece of Lean code needs to live inside a Lean project (sometimes also called a Lean package). A "Lean project" is more than just a folder that you've named "My Lean stuff". Rather, it's a folder containing some very specific things: in particular, a git repository and a file lakefile.lean that gathers information about dependencies of the project, including for instance the version of Lean that should be used.</p>
<h3 id="basics"><a href="#basics">Basics</a></h3>
<p>Learn requires us to justify <strong>each</strong> step in a calculation. For example:</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">example</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a b c : ℝ</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : a * b * c = b * </span><span style="color:#005cc5">(</span><span style="color:#24292E">a * c</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#D73A49">by</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">mul_comm a b</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">mul_assoc b a c</span><span style="color:#005cc5">]</span></span></code></pre>
<p>The <code>rw</code> means "rewrite". And the <code>mul_comm</code> here means Commutative property of multiplication（乘法交换律）. So, <code>rw [mul_comm a b]</code> means "rewrite patterns match <code>(a * b)</code> to <code>(b * a)</code>".</p>
<p>You can see the replaced formula in VSCode here:</p>
<p><img src="/images/mul_comm_20240903184037.png" alt="mul_comm_20240903184037.png"></p>
<p>And <code>\l</code> (<code>←</code>) stands for right-to-left equation replacement. For example:</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">example</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a b c : ℝ</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : b * </span><span style="color:#005cc5">(</span><span style="color:#24292E">a * c</span><span style="color:#005cc5">)</span><span style="color:#24292E"> = a * b * c := </span><span style="color:#D73A49">by</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">← mul_assoc b a c</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">← mul_comm a b</span><span style="color:#005cc5">]</span></span></code></pre>
<p>It is the reverse of the previous proof.</p>
<h3 id="tactic"><a href="#tactic">Tactic</a></h3>
<p>It will be annoying to write duplicated basic formulas, for example if we are proving this:</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">example</span><span style="color:#24292E"> : g + a + d + e + b + h + f + c = a + b + c + d + e + f + g + h := </span><span style="color:#D73A49">by</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_comm g</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc a, add_comm g, ← add_assoc</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + d</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_comm g, ← add_assoc</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + d + e</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_comm g, ← add_assoc</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + d + e + b</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a</span><span style="color:#e36209">)</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc a, add_comm </span><span style="color:#e36209">(</span><span style="color:#24292E">d + e</span><span style="color:#e36209">)</span><span style="color:#24292E">, ← add_assoc a</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + b + </span><span style="color:#5a32a3">(</span><span style="color:#24292E">d + e</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_comm </span><span style="color:#e36209">(</span><span style="color:#24292E">g + h</span><span style="color:#e36209">)</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + b + </span><span style="color:#5a32a3">(</span><span style="color:#24292E">d + e</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_comm </span><span style="color:#e36209">(</span><span style="color:#24292E">f + </span><span style="color:#5a32a3">(</span><span style="color:#24292E">g + h</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">, ← add_assoc</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">add_assoc </span><span style="color:#e36209">(</span><span style="color:#24292E">a + b</span><span style="color:#e36209">)</span><span style="color:#24292E">, add_comm </span><span style="color:#e36209">(</span><span style="color:#24292E">d + e</span><span style="color:#e36209">)</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">  rw </span><span style="color:#005cc5">[</span><span style="color:#24292E">← add_assoc, ← add_assoc, ← add_assoc, ← add_assoc</span><span style="color:#005cc5">]</span></span></code></pre>
<p>We reordered the items tediously, but this is something that a human would know is correct at first glance. In fact, Lean requires a rigorous proof, so this is essential, but we can let the computer do this boring work for us. We need to introduce a magic: <em>Tactic</em></p>
<blockquote>
<p>The <code>ring</code> tactic is imported indirectly when we import <code>Mathlib.Data.Real.Basic</code>, but we will see in the next section that it can be used for calculations on structures other than the real numbers. It can be imported explicitly with the command <code>import Mathlib.Tactic</code>. We will see there are similar tactics for other common kind of algebraic structures.</p>
</blockquote>
<p>The <code>ring</code> tactic is designed to prove identities in any commutative ring as long as they follow purely from the ring axioms, without using any local assumption. So we can rewrite the tedious proof above, with only one line:</p>
