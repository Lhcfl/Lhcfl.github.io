x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>分析测试数据可以发现，在 16 和 256 的 int 数据这样极小的数据中，已知迭代器的擦写 \x3Ccode>vector&#x3C;int>\x3C/code> 甚至可以比 \x3Ccode>deque&#x3C;int>\x3C/code> 还快，更别提 cache miss 吃满的 \x3Ccode>list&#x3C;int>\x3C/code>。\x3C/p>\n\x3Cp>但是在 \x3Ccode>std::string\x3C/code> 的容器中，由于 \x3Ccode>string\x3C/code> 移动常数明显地比 \x3Ccode>int\x3C/code> 大很多，即使是 16 这样的小容器也是 vector 更慢一些。\x3C/p>\n\x3Cp>对于常用的 先 find 再 remove （即，remove-if）的过程，更是很难说有什么不用 vector 的理由。直到 4096 这样的数字，vector 随机删除会移动后续所有元素的性质才开始与 deque 拉开距离。\x3Ccode>deque&#x3C;int>\x3C/code> 在 256 的时候随机删除仍然不如 \x3Ccode>vector&#x3C;int>\x3C/code>\x3C/p>\n\x3Cp>而链表，顺序迭代的速度更是费拉不堪，比 \x3Ccode>vector\x3C/code> 和 \x3Ccode>deque\x3C/code> 可能慢 3 倍有余。\x3C/p>\n\x3Cblockquote>\n\x3Cp>链表在工程上已经失去了绝大多数的用武之地。\x3C/p>\n\x3C/blockquote>\n\x3Cp>或许只有你需要保持迭代器的有效性的同时，还要在已知迭代器的情况下进行随机删除的时候 \x3Ccode>std::list\x3C/code> 是一个不错的选择。\x3C/p>\n\x3Chr>\n\x3Cp>版权声明： CC BY-SA 4.0\x3C/p>",headings:$R[13]=[]});$R[14]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[15]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.querySelector("title"))?n.hasAttribute("data-dh")||n.setAttribute("data-dhf",n.textContent):(n=document.createElement("title"),document.head.appendChild(n)),n.textContent=e[1],n.setAttribute("data-dh","title")):"r"==e[0]?$dhr(e[1]):(n=document.createElement(e[2]),Object.keys(e[3]).forEach(function(a){n.setAttribute(a,e[3][a])}),null!=e[4]&&(n.textContent=e[4]),n.setAttribute("data-dh",e[1]),document.head.appendChild(n))}function $dhr(v,l,i){for(l=document.head.querySelectorAll("[data-dh]"),i=0;i<l.length;i++)l[i].getAttribute("data-dh")==v&&l[i].remove()}function $dh(o){_$HY.h?_$HY.h(o):$dha(o)}(_$HY.hp=_$HY.hp||{})["0010070c"]=[["t","小数据的时候 `std::vector\u003Cint>` 删除首元素比 deque 和 list 还快 · Zero Calorie Drink Shop"]];function $df(e){retur 010070c00310003670 class="">小数据的时候 <code>std::vector&#x3C;int></code> 删除首元素比 deque 和 list 还快</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>链表可以当成双端队列来使用——至少在渐进时空复杂度上，它们是相同的。</p>

<span class="line"><span style="color:#24292E">test final for std::deque</span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">std::string</span><span style="color:#24292E">></span><span style="color:#24292E"> with count: </span><span style="color:#005CC5">256</span></span>
<span class="line"><span style="color:#24292E">        time_init = 5600ns</span></span>
<span class="line"><span style="color:#24292E">        time_pop_front = 758500ns</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">====================================================</span></span>
<span class="line"><span style="color:#24292E">test final for std::vector</span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">std::string</span><span style="color:#24292E">></span><span style="color:#24292E"> with count: </span><span style="color:#005CC5">8192</span></span>
<span class="line"><span style="color:#24292E">        time_init = 254700ns</span></span>
<span class="line"><span style="color:#24292E">        time_pop_front = 1175939400ns</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292E">====================================================</span></span>
<span class="line"><span style="color:#24292E">test final for std::list</span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">std::string</span><span style="color:#24292E">></span><span style="color:#24292E"> with count: </span><span style="color:#005CC5">8192</span></span>
<span class="line"><span style="color:#24292E">        time_init = 303600ns</span></span>

<span class="line"></span>

<span class="line"><span style="color:#24292E">test final for std::list</span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">std::string</span><span style="color:#24292E">></span><span style="color:#24292E"> with count: </span><span style="color:#005CC5">32768</span></span>

<span class="line"><span style="color:#24292E">test final for std::deque</span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">std::string</span><span style="color:#24292E">></span><span style="color:#24292E"> with count: </span><span style="color:#005CC5">32768</span></span>
<span class="line"><span style="color:#24292E">        time_init = 639600ns</span></span>
<span class="line"><span style="color:#24292E">        time_pop_front = 712600ns</span></span></code></pre>
<p>分析测试数据可以发现，在 16 和 256 的 int 数据这样极小的数据中，已知迭代器的擦写 <code>vector&#x3C;int></code> 甚至可以比 <code>deque&#x3C;int></code> 还快，更别提 cache miss 吃满的 <code>list&#x3C;int></code>。</p>
<p>但是在 <code>std::string</code> 的容器中，由于 <code>string</code> 移动常数明显地比 <code>int</code> 大很多，即使是 16 这样的小容器也是 vector 更慢一些。</p>
<p>对于常用的 先 find 再 remove （即，remove-if）的过程，更是很难说有什么不用 vector 的理由。直到 4096 这样的数字，vector 随机删除会移动后续所有元素的性质才开始与 deque 拉开距离。<code>deque&#x3C;int></code> 在 256 的时候随机删除仍然不如 <code>vector&#x3C;int></code></p>
<p>而链表，顺序迭代的速度更是费拉不堪，比 <code>vector</code> 和 <code>deque</code> 可能慢 3 倍有余。</p>
<blockquote>
<p>链表在工程上已经失去了绝大多数的用武之地。</p>
</blockquote>
<p>或许只有你需要保持迭代器的有效性的同时，还要在已知迭代器的情况下进行随机删除的时候 <code>std::list</code> 是一个不错的选择。</p>
