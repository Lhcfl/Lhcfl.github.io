ation context 的栈\x3C/p>\n\x3Cp>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3Cmo>▹\x3C/mo>\x3Cmi>e\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k \\triangleright e\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">▹\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">e\x3C/span>\x3C/span>\x3C/span>\x3C/span> 表示当前栈 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3C/span>\x3C/span>\x3C/span> 将要计算一个表达式 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>e\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">e\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">e\x3C/span>\x3C/span>\x3C/span>\x3C/span>, 而 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3Cmo>◃\x3C/mo>\x3Cmi>v\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k \\triangleleft v\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">◃\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v\x3C/span>\x3C/span>\x3C/span>\x3C/span> 表示当前栈 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3C/span>\x3C/span>\x3C/span> 将要返回一个值 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>v\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">v\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v\x3C/span>\x3C/span>\x3C/span>\x3C/span>.\x3C/p>\n\x3Ch2 id=\"exceptions\">\x3Ca href=\"#exceptions\">Exceptions\x3C/a>\x3C/h2>\n\x3Cp>Exceptions 被定义为一种特殊的 value，当一个 exception 被抛出时，当前的 control stack 会被一路弹栈，并且寻找最近的 handler 来处理这个 exception.\x3C/p>\n\x3Ch2 id=\"continuation\">\x3Ca href=\"#continuation\">Continuation\x3C/a>\x3C/h2>\n\x3Cp>Continuation 是允许我们直接捕获和复制当前的 control stack，把 stack \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3C/span>\x3C/span>\x3C/span> 变成一个 first-class 的值 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>k\x3C/mi>\x3Cmtext>cont\x3C/mtext>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">k \\text{cont}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0315em;\">k\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">cont\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>.\x3C/p>\n\x3Ch3 id=\"callcc\">\x3Ca href=\"#callcc\">\x3Ccode>call/cc\x3C/code>\x3C/a>\x3C/h3>\n\x3Cp>\x3Ccode>call/cc\x3C/code> 是一个高阶函数，接受一个函数作为参数，这个函数接受一个 continuation 作为参数，并且返回一个值.\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">call/cc\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">lambda\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#E36209\">k\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> e\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>\x3Ccode>call/cc\x3C/code> 本质上就是书中介绍的 \x3Ccode>letcc k in e\x3C/code>，它会把当前的 control stack 捕获并且传递给参数函数.\x3C/p>",headings:$R[13]=[$R[14]={depth:2,slug:"control-stack",text:"Control Stack"},$R[15]={depth:2,slug:"exceptions",text:"Exceptions"},$R[16]={depth:2,slug:"continuation",text:"Continuation"},$R[17]={depth:3,slug:"callcc",text:"call/cc"}]});$R[18]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[19]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.querySelector("title"))?n.hasAttribute("data-dh")||n.setAttribute("data-dhf",n.textContent):(n=document.createElement("title"),document.head.appendChild(n)),n.textContent=e[1],n.setAttribute("data-dh","title")):"r"==e[0]?$dhr(e[1]):(n=document.createElement(e[2]),Object.keys(e[3]).forEach(function(a){n.setAttribute(a,e[3][a])}),null!=e[4]&&(n.textContent=e[4]),n.setAttribute("data-dh",e[1]),document.head.appendChild(n))}function $dhr(v,l,i){for(l=document.head.querySelectorAll("[data-dh]"),i=0;i<l.length;i++)l[i].getAttribute("data-dh")==v&&l[i].remove()}function $dh(o){_$HY.h?_$HY.h(o):$dha(o)}(_$HY.hp=_$HY.hp||{})["0010070c"]=[["t","PFPL 笔记 - X Exceptions and Continuations · Zero Calorie Drink Shop"]];function $df(e){return _$HY.f?_$HY.f(e):$dfr(e)}function $dfr(e,n,o,t){if(!(n=document.getElementById(e)))return 0;if(!(o=document.getElementById("pl-"+e)))return(_$HY.dq=_$HY.dq||{})[e]=1,0;for(;o&&(8!==o.nodeType||o.nodeValue!=="pl-"+e);)t=o.nextSibling,o.remove(),o=t;t=o.parentNode,o.replaceWith(n.content),n.remove(),(_$HY.v=_$HY.v||{})[e]=1,_$HY.fe(e,t),_$HY.hp&&_$HY.hp[e]&&($dh(_$H <p>第一章给出了 Control Stack 的概念，记录当前 evaluation context 的栈</p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi><mo>▹</mo><mi>e</mi></mrow><annotation encoding="application/x-tex">k \triangleright e</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">▹</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">e</span></span></span></span> 表示当前栈 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> 将要计算一个表达式 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi></mrow><annotation encoding="application/x-tex">e</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">e</span></span></span></span>, 而 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi><mo>◃</mo><mi>v</mi></mrow><annotation encoding="application/x-tex">k \triangleleft v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">◃</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> 表示当前栈 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> 将要返回一个值 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span>.</p>
<h2 id="exceptions"><a href="#exceptions">Exceptions</a></h2>
<p>Exceptions 被定义为一种特殊的 value，当一个 exception 被抛出时，当前的 control stack 会被一路弹栈，并且寻找最近的 handler 来处理这个 exception.</p>
<h2 id="continuation"><a href="#continuation">Continuation</a></h2>
<p>Continuation 是允许我们直接捕获和复制当前的 control stack，把 stack <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> 变成一个 first-class 的值 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi><mtext>cont</mtext></mrow><annotation encoding="application/x-tex">k \text{cont}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord text"><span class="mord">cont</span></span></span></span></span>.</p>
<h3 id="callcc"><a href="#callcc"><code>call/cc</code></a></h3>
<p><code>call/cc</code> 是一个高阶函数，接受一个函数作为参数，这个函数接受一个 continuation 作为参数，并且返回一个值.</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">(</span><span style="color:#005CC5">call/cc</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#D73A49">lambda</span><span style="color:#24292E"> </span><span style="color:#5a32a3">(</span><span style="color:#E36209">k</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> e</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span></code></pre>
<p><code>call/cc</code> 本质上就是书中介绍的 <code>letcc k in e</code>，它会把当前的 control stack 捕获并且传递给参数函数.</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en">CC BY-NC-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">September 4, 2025</time><!--$--><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-07-21-unsafe-rust-is-not-same-as-c"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">Unsafe Rust 并不和 C 语言一样：从 Aliasing 谈起</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-09-18-pfpl-note-11"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">PFPL 笔记 - XI Types and Propositions</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[18]($R[3],!0);</script>
