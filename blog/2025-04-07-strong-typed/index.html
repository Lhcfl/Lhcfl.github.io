sition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#q-什么是强类型" class="text-ink-soft hover:text-accent">Q: 什么是强类型？</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#一千个计算机人有一千个强类型" class="text-ink-soft hover:text-accent">一千个计算机人有一千个强类型</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#不要再说强弱类型语言了" class="text-ink-soft hover:text-accent">不要再说强/弱类型语言了</a></li></ul></nav></aside></div></div></body></html><script>($R[17]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"一千个计算机人有一千个强类型",date:"2025-04-07T10:31:12",tags:$R[11]=["Code"],copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"一千个计算机人有一千个强类型",html:"\x3Cp>所以不要再说强类型了啊！！\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"q-什么是强类型\">\x3Ca href=\"#q-什么是强类型\">Q: 什么是强类型？\x3C/a>\x3C/h2>\n\x3Cblockquote>\n\x3Cp>强类型意味着不会发生隐式类型转换（所以 Rust 是强类型）\n—— 某 Rust 课教师\x3C/p>\n\x3C/blockquote>\n\x3Cp>你好，Rust 有 \x3Ccode>&#x26;String\x3C/code> 到 \x3Ccode>&#x26;str\x3C/code> 的隐式类型转换\x3C/p>\n\x3Cblockquote>\n\x3Cp>可以绕过类型系统的限制说明是强类型\n—— \x3Ca href=\"https://stackoverflow.com/questions/2690544/what-is-the-difference-between-a-strongly-typed-language-and-a-statically-typed\">https://stackoverflow.com/questions/2690544/what-is-the-difference-between-a-strongly-typed-language-and-a-statically-typed\x3C/a>\x3C/p>\n\x3C/blockquote>\n\x3Cp>坏了，带 unsafe 的东西基本都能拿指针强制 reinterpret 绕过类型系统的限制，这下 Rust 成弱类型了\x3C/p>\n\x3Cblockquote>\n\x3Cp>不同类型的对象可以相加就是弱类型！\n——不知道哪来的野鸡教程\x3C/p>\n\x3C/blockquote>\n\x3Cp>能重载加法运算符的语言多了去了，这下全变成弱类型了，Rust 也是弱类型，Haskell 也是弱类型，C++也是弱类型，Python 也是弱类型\x3C/p>\n\x3Cblockquote>\n\x3Cp>如果编译器的类型系统检查通过就不会在运行时发生类型错误，那就是强类型的\n—— 某编译原理课教师\x3C/p>\n\x3C/blockquote>\n\x3Cp>……有没有一种可能这个定义是 type safety，以及只要是能造出某种 \x3Ccode>std::any\x3C/code> 的都可以在运行时发生类型错误，这下全变成弱类型语言了。哦还有那些做不到 null safe 的语言也全变成弱类型了\x3C/p>\n\x3Cblockquote>\n\x3Cp>强类型意味着在该语言的实现下，归类为某种类型的对象是否都能携带对应信息以决定其类型。\n—— 某知乎答主\x3C/p>\n\x3C/blockquote>\n\x3Cp>这下所有动态语言全部变成强类型了，毕竟动态语言必须要在对象上存储它的类型信息\x3C/p>\n\x3Ch2 id=\"一千个计算机人有一千个强类型\">\x3Ca href=\"#一千个计算机人有一千个强类型\">一千个计算机人有一千个强类型\x3C/a>\x3C/h2>\n\x3Cp>总结以后你会发现，一般来说公认地，C 是弱类型语言，JavaScript 是弱类型语言，Rust、Haskell 这样的是强类型语言，剩下的语言都是有争议的。有的人觉得 C++ 到处是隐式类型转换怎么就是强类型了，有的人觉得 C++ 所有东西都要写明类型很强啊，有的人觉得 Python 倾向于不进行隐式类型转换就是强类型语言。很多人完全不分辨 static/dynamic typed 与 strong/weak typed，所以有人觉得 C 也是强类型，甚至还有一些当老师的人原地混淆强类型与类型安全。坏消息是，动态语言在某种意义上比含有 \x3Ccode>void*\x3C/code> 或者 \x3Ccode>transmute\x3C/code> / \x3Ccode>reinterpret_cast\x3C/code> 这种操作的语言更加“类型安全”得多了，毕竟遇到错误的类型动态语言直接抛一个 \x3Ccode>TypeError\x3C/code> 至少不会 panic，控制了错误的范围，而允许你 reinterpret_cast 的语言要是 cast 出了问题直接就是一个 undefined behavior 上来了鬼知道会不会在 114514 层调用链后造成点缓冲区溢出之类的安全漏洞。\x3C/p>\n\x3Cp>浏览大家的回答，会发现那些还在区分强弱类型的人根本就没吵出一个严谨的定义来。\x3C/p>\n\x3Cul>\n\x3Cli>JavaScript: 几乎都认为它是弱的\x3C/li>\n\x3Cli>C: 很多人认为它是弱的，一些人觉得是强的\x3C/li>\n\x3Cli>C++: 有人觉得强，有人觉得弱\x3C/li>\n\x3Cli>Java: 有人觉得强，有人觉得弱\x3C/li>\n\x3Cli>Python: 很多人觉得弱，不少觉得强\x3C/li>\n\x3Cli>Rust: 几乎都认为它是强的\x3C/li>\n\x3Cli>Haskell: 几乎都认为它是强的\x3C/li>\n\x3C/ul>\n\x3Cp>\x3Cstrong>强/弱类型根本就没有一个公认的、well-defined 的定义。\x3C/strong> 这比“面向对象的语言”还严重，OOP 虽然争议比较多，起码能来个自我解释，比如说“impl 封装继承多态 ←→ OOP”之类的。\x3C/p>\n\x3Ch2 id=\"不要再说强弱类型语言了\">\x3Ca href=\"#不要再说强弱类型语言了\">不要再说强/弱类型语言了\x3C/a>\x3C/h2>\n\x3Cp>如果你想说的是静态类型和动态类型，which 我们可以不规范的定义为\x3C/p>\n\x3Cul>\n\x3Cli>静态类型语言：不是动态类型语言的语言\x3C/li>\n\x3Cli>动态类型语言：所有 value 有统一的 type \x3Ccode>dyn\x3C/code>，一切类型检查都是通过运行时打上的类型标记的语言\x3C/li>\n\x3C/ul>\n\x3Cp>去说静态类型/动态类型，而不是强/弱类型。\x3C/p>\n\x3Cp>如果你想说的是类型安全与类型不安全，which 我们可以不规范的定义为：\x3C/p>\n\x3Cul>\n\x3Cli>类型安全的：如果在静态检查中通过的代码永远不会发生未定义的类型错误，它是类型安全的\x3C/li>\n\x3Cli>类型不安全：不是类型安全的语言\x3C/li>\n\x3C/ul>\n\x3Cp>去说类型安全/不安全，而不是强/弱类型。\x3C/p>\n\x3Cp>（进一步的，在严谨的讨论中，我们会用 sound, complete, total 这样的词来形容类型系统）\x3C/p>\n\x3Cul>\n\x3Cli>sound: 如果类型系统认为程序是合法的（类型正确的），那么运行时就不会出现类型错误\x3C/li>\n\x3Cli>complete: 所有在运行时不会出错的程序，类型系统都能通过它们。\x3C/li>\n\x3Cli>total: 类型检查算法总能在有限步骤内完成\x3C/li>\n\x3C/ul>\n\x3Cp>如果你想讨论的是隐式类型转换，which 我们可以不规范的定义为\x3C/p>\n\x3Cul>\n\x3Cli>语言充斥着/很少出现 许多隐式的行为，这些行为允许自动地将一个值从一个类型转换到另一个类型，以匹配定义好的操作\x3C/li>\n\x3C/ul>\n\x3Cp>那就去说隐式类型转换，而不是强/弱类型\x3C/p>\n\x3Chr>\n\x3Cp>强/弱类型被说了这么久，甚至连一个公认的定义都没有。不管你以前怎么理解强/弱类型的赶快把这个词扔进垃圾堆吧.\x3C/p>",headings:$R[13]=[$R[14]={depth:2,slug:"q-什么是强类型",text:"Q: 什么是强类型？"},$R[15]={depth:2,slug:"一千个计算机人有一千个强类型",text:"一千个计算机人有一千个强类型"},$R[16]={depth:2,slug:"不要再说强弱类型语言了",text:"不要再说强/弱类型语言了"}]});$R[17]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[18]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.querySelector("title"))?n.hasAttribute("data-dh")||n.setAttribute("data-dhf",n.textContent):(n=document.createElement("title"),document.head.appendChild(n)),n.textContent=e[1],n.setAttribute("data-dh","title")):"r"==e[0]?$dhr(e[1]):(n=document.createElement(e[2]),Object.keys(e[3]).forEach(function(a){n.setAttribute(a,e[3][a])}),null!=e[4]&&(n.textContent=e[4]),n.setAttribute("data-dh",e[1]),document.head.appendChild(n))}function $dhr(v,l,i){for(l=document.head.querySelectorAll("[data-dh]"),i=0;i<l.length;i++)l[i].getAttribute("data-dh")==v&&l[i].remove()}function $dh(o){_$HY.h?_$HY.h(o):$dh der-rule pb-7"><!--$--><!--/--><h1 class="text-2xl font-bold leading-snug text-balance md:text-3xl"><span _hk=0010070c00310003670 class="">一千个计算机人有一千个强类型</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>所以不要再说强类型了啊！！</p>
<!-- more -->
<h2 id="q-什么是强类型"><a href="#q-什么是强类型">Q: 什么是强类型？</a></h2>
<blockquote>
<p>强类型意味着不会发生隐式类型转换（所以 Rust 是强类型）
—— 某 Rust 课教师</p>
</blockquote>
<p>你好，Rust 有 <code>&#x26;String</code> 到 <code>&#x26;str</code> 的隐式类型转换</p>
<blockquote>
<p>可以绕过类型系统的限制说明是强类型
—— <a href="https://stackoverflow.com/questions/2690544/what-is-the-difference-between-a-strongly-typed-language-and-a-statically-typed">https://stackoverflow.com/questions/2690544/what-is-the-difference-between-a-strongly-typed-language-and-a-statically-typed</a></p>
</blockquote>
<p>坏了，带 unsafe 的东西基本都能拿指针强制 reinterpret 绕过类型系统的限制，这下 Rust 成弱类型了</p>
<blockquote>
<p>不同类型的对象可以相加就是弱类型！
——不知道哪来的野鸡教程</p>
</blockquote>
<p>能重载加法运算符的语言多了去了，这下全变成弱类型了，Rust 也是弱类型，Haskell 也是弱类型，C++也是弱类型，Python 也是弱类型</p>
<blockquote>
<p>如果编译器的类型系统检查通过就不会在运行时发生类型错误，那就是强类型的
—— 某编译原理课教师</p>
</blockquote>
<p>……有没有一种可能这个定义是 type safety，以及只要是能造出某种 <code>std::any</code> 的都可以在运行时发生类型错误，这下全变成弱类型语言了。哦还有那些做不到 null safe 的语言也全变成弱类型了</p>
<blockquote>
<p>强类型意味着在该语言的实现下，归类为某种类型的对象是否都能携带对应信息以决定其类型。
—— 某知乎答主</p>
</blockquote>
<p>这下所有动态语言全部变成强类型了，毕竟动态语言必须要在对象上存储它的类型信息</p>
<h2 id="一千个计算机人有一千个强类型"><a href="#一千个计算机人有一千个强类型">一千个计算机人有一千个强类型</a></h2>
<p>总结以后你会发现，一般来说公认地，C 是弱类型语言，JavaScript 是弱类型语言，Rust、Haskell 这样的是强类型语言，剩下的语言都是有争议的。有的人觉得 C++ 到处是隐式类型转换怎么就是强类型了，有的人觉得 C++ 所有东西都要写明类型很强啊，有的人觉得 Python 倾向于不进行隐式类型转换就是强类型语言。很多人完全不分辨 static/dynamic typed 与 strong/weak typed，所以有人觉得 C 也是强类型，甚至还有一些当老师的人原地混淆强类型与类型安全。坏消息是，动态语言在某种意义上比含有 <code>void*</code> 或者 <code>transmute</code> / <code>reinterpret_cast</code> 这种操作的语言更加“类型安全”得多了，毕竟遇到错误的类型动态语言直接抛一个 <code>TypeError</code> 至少不会 panic，控制了错误的范围，而允许你 reinterpret_cast 的语言要是 cast 出了问题直接就是一个 undefined behavior 上来了鬼知道会不会在 114514 层调用链后造成点缓冲区溢出之类的安全漏洞。</p>
<p>浏览大家的回答，会发现那些还在区分强弱类型的人根本就没吵出一个严谨的定义来。</p>
<ul>
<li>JavaScript: 几乎都认为它是弱的</li>
<li>C: 很多人认为它是弱的，一些人觉得是强的</li>
<li>C++: 有人觉得强，有人觉得弱</li>
<li>Java: 有人觉得强，有人觉得弱</li>
<li>Python: 很多人觉得弱，不少觉得强</li>
<li>Rust: 几乎都认为它是强的</li>
<li>Haskell: 几乎都认为它是强的</li>
</ul>
<p><strong>强/弱类型根本就没有一个公认的、well-defined 的定义。</strong> 这比“面向对象的语言”还严重，OOP 虽然争议比较多，起码能来个自我解释，比如说“impl 封装继承多态 ←→ OOP”之类的。</p>
<h2 id="不要再说强弱类型语言了"><a href="#不要再说强弱类型语言了">不要再说强/弱类型语言了</a></h2>
<p>如果你想说的是静态类型和动态类型，which 我们可以不规范的定义为</p>
<ul>
<li>静态类型语言：不是动态类型语言的语言</li>
<li>动态类型语言：所有 value 有统一的 type <code>dyn</code>，一切类型检查都是通过运行时打上的类型标记的语言</li>
</ul>
<p>去说静态类型/动态类型，而不是强/弱类型。</p>
<p>如果你想说的是类型安全与类型不安全，which 我们可以不规范的定义为：</p>
<ul>
<li>类型安全的：如果在静态检查中通过的代码永远不会发生未定义的类型错误，它是类型安全的</li>
<li>类型不安全：不是类型安全的语言</li>
</ul>
<p>去说类型安全/不安全，而不是强/弱类型。</p>
<p>（进一步的，在严谨的讨论中，我们会用 sound, complete, total 这样的词来形容类型系统）</p>
<ul>
<li>sound: 如果类型系统认为程序是合法的（类型正确的），那么运行时就不会出现类型错误</li>
<li>complete: 所有在运行时不会出错的程序，类型系统都能通过它们。</li>
<li>total: 类型检查算法总能在有限步骤内完成</li>
</ul>
<p>如果你想讨论的是隐式类型转换，which 我们可以不规范的定义为</p>
<ul>
<li>语言充斥着/很少出现 许多隐式的行为，这些行为允许自动地将一个值从一个类型转换到另一个类型，以匹配定义好的操作</li>
</ul>
<p>那就去说隐式类型转换，而不是强/弱类型</p>
<hr>
<p>强/弱类型被说了这么久，甚至连一个公认的定义都没有。不管你以前怎么理解强/弱类型的赶快把这个词扔进垃圾堆吧.</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">April 7, 2025</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-03-30-pop-front-list-compare-vec"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">小数据的时候 <code>std::vector&#x3C;int></code> 删除首元素比 deque 和 list 还快</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-04-08-lean4-json"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">很难不承认 Lean4 真香 —— 然后写了一个简单的 JSON 解析器</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[17]($R[3],!0);</script>
