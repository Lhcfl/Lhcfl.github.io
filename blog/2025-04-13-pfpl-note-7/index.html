ition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#girards-system-f" class="text-ink-soft hover:text-accent">Girard's System F</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#abstract-types" class="text-ink-soft hover:text-accent">Abstract Types</a></li><li _hk=0010070l120 class="" style="padding-left:24px"><a href="#existential-types" class="text-ink-soft hover:text-accent">Existential Types</a></li><li _hk=0010070l130 class="" style="padding-left:36px"><a href="#bisimilar" class="text-ink-soft hover:text-accent">Bisimilar</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#constructors-and-kinds" class="text-ink-soft hover:text-accent">Constructors and Kinds</a></li><li _hk=0010070l150 class="" style="padding-left:24px"><a href="#我们是否要支持-type-上的计算" class="text-ink-soft hover:text-accent">我们是否要支持 type 上的计算？</a></li></ul></nav></aside></div></div></body></html><script>($R[20]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"PFPL 笔记 - VI Dynamic Types",date:"2025-04-13T23:34:46",tags:$R[11]=[],categories:$R[12]=["Practical Foundations for Programming Languages"],copyright:"CC BY-NC-SA 4.0"},titleHtml:"PFPL 笔记 - VI Dynamic Types",html:"\x3Cp>笔记 7\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"girards-system-f\">\x3Ca href=\"#girards-system-f\">Girard's System F\x3C/a>\x3C/h2>\n\x3Cp>之前我们讨论的语言都非常地单态，每个表达式都有独立的一个类型，不支持多态。\x3C/p>\n\x3Cp>这一章讲了通过 System F i.e. polymorphic typed lambda calculus 如何实现多态的。\x3C/p>\n\x3Cp>引入一种全称类型，\x3Ccode>∀ t . τ\x3C/code>\x3C/p>\n\x3Cp>\x3Ccode>Λ t . e\x3C/code> 是一个泛型函数，它的类型是一个 \x3Ccode>∀ t . τ\x3C/code>\x3C/p>\n\x3Cp>比如\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>Λ t . λ (x : t) ↦ x\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>是一个 polymorphic identity function 具有类型\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>∀ t . t ↦ t\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>我们自然的可以把它叫作 unit， 而上面那个函数其实就是 \x3Ccode>⟨ ⟩\x3C/code> 它完全就是 null tuple 因为它是这个类型的唯一个元素\x3C/p>\n\x3Cp>二元组也能被很好的定义，和 Chapter 17 untyped lambda calculus 一样：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>τ₁ × τ₂  ≝ ∀ r . (τ₁ → τ₂ → r) → r\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>⟨e₁, e₂⟩ ≝ Λ r . λ (x : τ₁ → τ₂ → r) ↦ x e₁ e₂\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>e.l      ≝ e[τ₁] λ (x : τ₁) (y: τ₂) ↦ x\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>e.l      ≝ e[τ₂] λ (x : τ₁) (y: τ₂) ↦ y\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>容易看出这就是 17 章定义的 pair 加上了泛型类型。\x3C/p>\n\x3Cp>sum type 也是容易定义的，只需要看出来 sum type 可以看作一个函数链，其中只有一个函数是能被调的\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/systemf_binary_sum.png\" alt=\"\">\x3C/p>\n\x3Cp>还有自然数。容易把自然数看成对于泛型 t 的\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>t -> (t -> t) -> t\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>比如\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>zero :: t -> (t -> t) -> t\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>zero z s = z\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>succ :: nat -> nat\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>succ e z s = s(e z s)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>由此可知， \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmrow>\x3Cmo>→\x3C/mo>\x3Cmi mathvariant=\"normal\">∀\x3C/mi>\x3C/mrow>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal{L}{\\rightarrow \\forall}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mord\">∀\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span> 至少具有和 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"script\">L\x3C/mi>\x3Cmrow>\x3Cmtext>nat \x3C/mtext>\x3Cmo>→\x3C/mo>\x3C/mrow>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\mathcal{L}{\\text{nat }\\rightarrow}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathcal\">L\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">nat \x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span> 一样的表达力。事实上，它的表达力更强。\x3C/p>\n\x3Cp>System F 可以表达 Godel's T 的 evaluate function，但是 Godel's T 没法表达自己的。当然二者都不是完备的，无法表达自己\x3C/p>\n\x3Cp>注意到，多态性仅靠类型就能一定程度上推断出行为。例如对于类型 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"normal\">∀\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>t\x3C/mi>\x3Cmi mathvariant=\"normal\">.\x3C/mi>\x3Cmi>t\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmi>t\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\forall (t. t \\to t)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord\">∀\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mord\">.\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 因为我们没有任何关于 t 的信息，为了总是能成立，它只能是 identity function \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"normal\">Λ\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>t\x3C/mi>\x3Cmi mathvariant=\"normal\">.\x3C/mi>\x3Cmi>λ\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>x\x3C/mi>\x3Cmo>:\x3C/mo>\x3Cmi>t\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3Cmi>x\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\Lambda (t. \\lambda (x:t) x)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord\">Λ\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mord\">.\x3C/span>\x3Cspan class=\"mord mathnormal\">λ\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">:\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>（题外话：上面的东西很直观，但我没理解如何证明的，但从我之前在知乎上看的东西看，似乎在范畴论里可以证出来 ∀ t → t 只有 ident function？）\x3C/p>\n\x3Cp>参数化理论意味着，我们能够仅凭程序类型推导出关于程序行为的定理。这类定理有时被称为自由定理，因为它们是类型推导的“免费”结果，无需程序分析或验证即可推导。这些定理支撑了多态语言的卓越体验，即类型良好的程序在执行时往往能按预期运行。也就是说，满足类型检查器是正确性的充分条件。参数化对程序行为的限制非常严格，以至于只有相对较少的同类型程序会表现出非预期的行为，从而排除了编写代码时经常出现的一大类错误\x3C/p>\n\x3Ch2 id=\"abstract-types\">\x3Ca href=\"#abstract-types\">Abstract Types\x3C/a>\x3C/h2>\n\x3Ch3 id=\"existential-types\">\x3Ca href=\"#existential-types\">Existential Types\x3C/a>\x3C/h3>\n\x3Cp>有了 forall 类型当然就有 exist 类型对吧。\x3C/p>\n\x3Cp>据说 existential type 在 rust 里的对应是 \x3Ccode>dyn Trait\x3C/code> —— 你不知道具体是什么类型 但是保证了这里存在一个类型 T 满足 Trait. 或者说，存在类型对应一个 trait 而它的一个实例对应一个 impl\x3C/p>\n\x3Cp>比如\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> get_animal\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> impl\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Animal\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>你不知道具体返回的是哪个 animal，可能是 Cat 或者 Dog，但是它保证了会返回一个 Animal，它其实是\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>get_animal : () → ∃ (t . ⟨ Animal ⟩ )\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>所以\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/existential_type.png\" alt=\"\">\x3C/p>\n\x3Cp>其实 pack 就是构造了一个存在类型\x3C/p>\n\x3Cp>\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>ρ\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\rho\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">ρ\x3C/span>\x3C/span>\x3C/span>\x3C/span> 是 e2 的类型其实\x3C/p>\n\x3Cp>Main idea of data abstracton is to introduce a \x3Cstrong>interface\x3C/strong>\x3C/p>\n\x3Cp>抽象类型一个重大的动力是实现一个抽象的接口，客户端不需要关注具体实现，只要二者都满足相同的接口和一个（后面我们会讲得性质（？））\x3C/p>\n\x3Cp>Existential type 可以用 System F 表示：\x3C/p>\n\x3Cp>∃ t . τ == ∀ u . (∀ t. τ → u ) → u\x3C/p>\n\x3Cp>这意味着如果给定了 (∀ t. τ → u )，也就是存在类型最后的那个 client 我们都当然能构造出 u ，这也是 ∃ 类型用 ∀ 类型 的解释\x3C/p>\n\x3Ch4 id=\"bisimilar\">\x3Ca href=\"#bisimilar\">Bisimilar\x3C/a>\x3C/h4>\n\x3Cp>// todo\x3C/p>\n\x3Ch2 id=\"constructors-and-kinds\">\x3Ca href=\"#constructors-and-kinds\">Constructors and Kinds\x3C/a>\x3C/h2>\n\x3Cp>注意到 nat → nat 和 nat list 可以被思考为\x3C/p>\n\x3Cul>\n\x3Cli>(→) 构造子作用在 nat 和 nat 上\x3C/li>\n\x3Cli>list 作用在 nat 上\x3C/li>\n\x3C/ul>\n\x3Cp>（就像函数那样）\x3C/p>\n\x3Ch3 id=\"我们是否要支持-type-上的计算\">\x3Ca href=\"#我们是否要支持-type-上的计算\">我们是否要支持 type 上的计算？\x3C/a>\x3C/h3>\n\x3Cp>比如考虑 ⟨ t₁ , t₂ ⟩ . l 似乎它等价于 t₁ 那么 ⟨ t₁ , t₂ ⟩ . l 的表达式也应该具有 t₁ 类型？\x3C/p>\n\x3Cp>需要引入 definational equality of constructor 的概念，并且要求我们设计一个算法看它是否等价（甚至对于太强的类型系统可能遇到图灵完备问题？）\x3C/p>\n\x3Cp>另一种方案：禁止这种 constructors 这样等价就只有完全长得一模一样的概念了\n这个方案的问题是会让 substitution 的定义变得困难\x3C/p>\n\x3Cp>这里新书选择了第一种方案，旧书选择了第二种\x3C/p>\n\x3Cp>目前已经有了许多检查 type equality 的方式\x3C/p>",headings:$R[13]=[$R[14]={depth:2,slug:"girards-system-f",text:"Girard's System F"},$R[15]={depth:2,slug:"abstract-types",text:"Abstract Types"},$R[16]={depth:3,slug:"existential-types",text:"Existential Types"},$R[17]={depth:4,slug:"bisimilar",text:"Bisimilar"},$R[18]={depth:2,slug:"constructors-and-kinds",text:"Constructors and Kinds"},$R[19]={depth:3,slug:"我们是否要支持-type-上的计算",text:"我们是否要支持 type 上的计算？"}]});$R[20]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[21]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.querySelector("title"))?n.hasAttribute("data-dh")||n.setAttribute("data-dhf",n.textContent):(n=document.createElement("title"),document.head.appendChild(n)),n.textContent=e[1],n.setAttribute("data-dh","title")):"r"==e[0]?$dhr(e[1]):(n=document.createElement(e[2]),Object.keys(e[3]).forEach(function(a){n.setAttribute(a,e[3][a])}),null!=e[4]&&(n.textContent=e[4]),n.setAttribute("data-dh",e[1]),document.head.appendChild(n))}function $dhr(v,l,i){for(l=document.head.querySelectorAll("[data-dh]"),i=0;i<l.length;i++)l[i].getAttribute("data-dh")==v&&l[i].remove()}function $dh(o){_$HY.h?_$HY.h(o):$dha(o)}(_$HY.hp=_$HY.hp||{})["0010070c"]=[["t","PFPL 笔记 - VI Dynamic Types · Zero Calorie Drink Shop"]];function $df(e){return _$HY.f?_$HY.f(e):$dfr(e)}function $dfr(e,n,o,t){if(!(n=document.getElementById(e)))return 0;if(!(o=document.getEle <h2 id="girards-system-f"><a href="#girards-system-f">Girard's System F</a></h2>
<p>之前我们讨论的语言都非常地单态，每个表达式都有独立的一个类型，不支持多态。</p>
<p>这一章讲了通过 System F i.e. polymorphic typed lambda calculus 如何实现多态的。</p>
<p>引入一种全称类型，<code>∀ t . τ</code></p>
<p><code>Λ t . e</code> 是一个泛型函数，它的类型是一个 <code>∀ t . τ</code></p>
<p>比如</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>Λ t . λ (x : t) ↦ x</span></span></code></pre>
<p>是一个 polymorphic identity function 具有类型</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>∀ t . t ↦ t</span></span></code></pre>
<p>我们自然的可以把它叫作 unit， 而上面那个函数其实就是 <code>⟨ ⟩</code> 它完全就是 null tuple 因为它是这个类型的唯一个元素</p>
<p>二元组也能被很好的定义，和 Chapter 17 untyped lambda calculus 一样：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>τ₁ × τ₂  ≝ ∀ r . (τ₁ → τ₂ → r) → r</span></span>
<span class="line"><span>⟨e₁, e₂⟩ ≝ Λ r . λ (x : τ₁ → τ₂ → r) ↦ x e₁ e₂</span></span>
<span class="line"><span>e.l      ≝ e[τ₁] λ (x : τ₁) (y: τ₂) ↦ x</span></span>
<span class="line"><span>e.l      ≝ e[τ₂] λ (x : τ₁) (y: τ₂) ↦ y</span></span></code></pre>
<p>容易看出这就是 17 章定义的 pair 加上了泛型类型。</p>
<p>sum type 也是容易定义的，只需要看出来 sum type 可以看作一个函数链，其中只有一个函数是能被调的</p>
<p><img src="/images/systemf_binary_sum.png" alt=""></p>
<p>还有自然数。容易把自然数看成对于泛型 t 的</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>t -> (t -> t) -> t</span></span></code></pre>
<p>比如</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>zero :: t -> (t -> t) -> t</span></span>
<span class="line"><span>zero z s = z</span></span>
<span class="line"><span>succ :: nat -> nat</span></span>
<span class="line"><span>succ e z s = s(e z s)</span></span></code></pre>
<p>由此可知， <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mrow><mo>→</mo><mi mathvariant="normal">∀</mi></mrow></mrow><annotation encoding="application/x-tex">\mathcal{L}{\rightarrow \forall}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathcal">L</span><span class="mord"><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord">∀</span></span></span></span></span> 至少具有和 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">L</mi><mrow><mtext>nat </mtext><mo>→</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{L}{\text{nat }\rightarrow}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal">L</span><span class="mord"><span class="mord text"><span class="mord">nat </span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span></span></span></span></span> 一样的表达力。事实上，它的表达力更强。</p>
<p>System F 可以表达 Godel's T 的 evaluate function，但是 Godel's T 没法表达自己的。当然二者都不是完备的，无法表达自己</p>
<p>注意到，多态性仅靠类型就能一定程度上推断出行为。例如对于类型 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∀</mi><mo stretchy="false">(</mo><mi>t</mi><mi mathvariant="normal">.</mi><mi>t</mi><mo>→</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\forall (t. t \to t)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∀</span><span class="mopen">(</span><span class="mord mathnormal">t</span><span class="mord">.</span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">t</span><span class="mclose">)</span></span></span></span> 因为我们没有任何关于 t 的信息，为了总是能成立，它只能是 identity function <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Λ</mi><mo stretchy="false">(</mo><mi>t</mi><mi mathvariant="normal">.</mi><mi>λ</mi><mo stretchy="false">(</mo><mi>x</mi><mo>:</mo><mi>t</mi><mo stretchy="false">)</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\Lambda (t. \lambda (x:t) x)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">Λ</span><span class="mopen">(</span><span class="mord mathnormal">t</span><span class="mord">.</span><span class="mord mathnormal">λ</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">t</span><span class="mclose">)</span><span class="mord mathnormal">x</span><span class="mclose">)</span></span></span></span></p>
<p>（题外话：上面的东西很直观，但我没理解如何证明的，但从我之前在知乎上看的东西看，似乎在范畴论里可以证出来 ∀ t → t 只有 ident function？）</p>
<p>参数化理论意味着，我们能够仅凭程序类型推导出关于程序行为的定理。这类定理有时被称为自由定理，因为它们是类型推导的“免费”结果，无需程序分析或验证即可推导。这些定理支撑了多态语言的卓越体验，即类型良好的程序在执行时往往能按预期运行。也就是说，满足类型检查器是正确性的充分条件。参数化对程序行为的限制非常严格，以至于只有相对较少的同类型程序会表现出非预期的行为，从而排除了编写代码时经常出现的一大类错误</p>
<h2 id="abstract-types"><a href="#abstract-types">Abstract Types</a></h2>
<h3 id="existential-types"><a href="#existential-types">Existential Types</a></h3>
<p>有了 forall 类型当然就有 exist 类型对吧。</p>
<p>据说 existential type 在 rust 里的对应是 <code>dyn Trait</code> —— 你不知道具体是什么类型 但是保证了这里存在一个类型 T 满足 Trait. 或者说，存在类型对应一个 trait 而它的一个实例对应一个 impl</p>
<p>比如</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> get_animal</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#D73A49"> impl</span><span style="color:#6F42C1"> Animal</span><span style="color:#24292E">;</span></span></code></pre>
<p>你不知道具体返回的是哪个 animal，可能是 Cat 或者 Dog，但是它保证了会返回一个 Animal，它其实是</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>get_animal : () → ∃ (t . ⟨ Animal ⟩ )</span></span></code></pre>
<p>所以</p>
<p><img src="/images/existential_type.png" alt=""></p>
<p>其实 pack 就是构造了一个存在类型</p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding="application/x-tex">\rho</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ρ</span></span></span></span> 是 e2 的类型其实</p>
<p>Main idea of data abstracton is to introduce a <strong>interface</strong></p>
<p>抽象类型一个重大的动力是实现一个抽象的接口，客户端不需要关注具体实现，只要二者都满足相同的接口和一个（后面我们会讲得性质（？））</p>
<p>Existential type 可以用 System F 表示：</p>
<p>∃ t . τ == ∀ u . (∀ t. τ → u ) → u</p>
<p>这意味着如果给定了 (∀ t. τ → u )，也就是存在类型最后的那个 client 我们都当然能构造出 u ，这也是 ∃ 类型用 ∀ 类型 的解释</p>

<h3 id="我们是否要支持-type-上的计算"><a href="#我们是否要支持-type-上的计算">我们是否要支持 type 上的计算？</a></h3>
<p>比如考虑 ⟨ t₁ , t₂ ⟩ . l 似乎它等价于 t₁ 那么 ⟨ t₁ , t₂ ⟩ . l 的表达式也应该具有 t₁ 类型？</p>
<p>需要引入 definational equality of constructor 的概念，并且要求我们设计一个算法看它是否等价（甚至对于太强的类型系统可能遇到图灵完备问题？）</p>
<p>另一种方案：禁止这种 constructors 这样等价就只有完全长得一模一样的概念了
这个方案的问题是会让 substitution 的定义变得困难</p>
<p>这里新书选择了第一种方案，旧书选择了第二种</p>
