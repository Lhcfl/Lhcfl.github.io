析器不打算遵循任何标准。\x3C/p>\n\x3Cp>一个 JSON 的“值” 分为六种可能，也就是\x3C/p>\n\x3Cul>\n\x3Cli>Null: \x3Ccode>null\x3C/code>, 空值\x3C/li>\n\x3Cli>Boolean: 布尔值\x3C/li>\n\x3Cli>Number: 数字\x3C/li>\n\x3Cli>String: 字符串\x3C/li>\n\x3Cli>Array: 数组\x3C/li>\n\x3Cli>Object: key-value 映射\x3C/li>\n\x3C/ul>\n\x3Cp>其中 Array 和 Object 又会存放任何可能的 JSON 值。\x3C/p>\n\x3Cp>\x3Cdel>由于 C++ 显然会比较难写，先来看一下 Rust 大概会怎么写。\x3C/del>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">enum\x3C/span>\x3Cspan style=\"color:#6F42C1\"> JSONNode\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    Null\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    Bool\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">bool\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    Number\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">i64\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    String\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">String\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    Array\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">Vec\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">JSONNode\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#e36209\">)\x <h2 id="结构"><a href="#结构">结构</a></h2>
<p>我们使用 <a href="https://www.json.org/json-en.html">https://www.json.org/json-en.html</a> 作为解析的依据。因为是个玩具，这个解析器不打算遵循任何标准。</p>
<p>一个 JSON 的“值” 分为六种可能，也就是</p>
<ul>
<li>Null: <code>null</code>, 空值</li>
<li>Boolean: 布尔值</li>
<li>Number: 数字</li>
<li>String: 字符串</li>
<li>Array: 数组</li>
<li>Object: key-value 映射</li>
</ul>
<p>其中 Array 和 Object 又会存放任何可能的 JSON 值。</p>
<p><del>由于 C++ 显然会比较难写，先来看一下 Rust 大概会怎么写。</del></p>

<p>因为是指针，可以简单的 cast 到子类，调用子类的方法。</p>
<p>而一个 <code>JSON</code> 对象什么其它的都不存，只存放这个 <code>std::unique_ptr&#x3C;Node></code>，作为一个 <code>unique_ptr&#x3C;Node></code> 的包装器而存在。</p>
