sition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#option-one-of-the-most-simple-monad" class="text-ink-soft hover:text-accent">Option, one of the most simple Monad</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#why-monads" class="text-ink-soft hover:text-accent">Why Monads</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#state-monad" class="text-ink-soft hover:text-accent">State Monad</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#promise-monad" class="text-ink-soft hover:text-accent">Promise Monad</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#总结" class="text-ink-soft hover:text-accent">总结</a></li></ul></nav></aside></div></div></body></html><script>($R[19]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"所以这个 Monads 到底是什么啊之让我学学",date:"2025-03-27T20:04:02",tags:$R[11]=["Functional","PL"],thumbnail:"/images/nishuozhexiewoyebudong.png",copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"所以这个 Monads 到底是什么啊之让我学学",html:"\x3Cp>\x3Cdel>简单的说单子(Monad)就是自函子范畴上的一个幺半群\x3C/del> 👀 你说这个谁懂啊\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/nishuozhexiewoyebudong.png\" alt=\"环彩羽：你跟我讲这些也不懂.png\">\x3C/p>\n\x3C!-- more -->\n\x3Cp>从很久以前就听说了 Monads 这个概念，但是一直都不懂，今天终于花了几个小时去理解（然后还是似懂非懂）\x3C/p>\n\x3Ch2 id=\"option-one-of-the-most-simple-monad\">\x3Ca href=\"#option-one-of-the-most-simple-monad\">Option, one of the most simple Monad\x3C/a>\x3C/h2>\n\x3Cblockquote>\n\x3Cp>monad 可以理解成包了一些其他控制结构/副作用, 用来提供数据的管线\x3C/p>\n\x3C/blockquote>\n\x3Cp>让我们看看 Haskell 和 Lean 4 里分别对 Monad 的定义\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">class\x3C/span>\x3Cspan style=\"color:#D73A49\"> Monad\x3C/span>\x3Cspan style=\"color:#24292E\"> m \x3C/span>\x3Cspan style=\"color:#D73A49\">where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  return\x3C/span>\x3Cspan style=\"color:#D73A49\"> ::\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> m a           \x3C/span>\x3Cspan style=\"color:#6A737D\">-- 也可以叫 pure\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\">=\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">  ::\x3C/span>\x3Cspan style=\"color:#24292E\"> m a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> m b\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> m b\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">class\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Monad\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">m : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#24292E\"> u → \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#24292E\"> v\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  pure : \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#24292E\">α : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#24292E\"> u\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\"> → α → m α\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  bind : \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#24292E\">α β : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#24292E\"> u\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\"> → m α → \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α → m β\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> → m β\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>之后我们 focus on 最经典的 Monads 之一 也就是 \x3Ccode>Option\x3C/code> 或者说 \x3Ccode>Maybe\x3C/code>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">instance\x3C/span>\x3Cspan style=\"color:#D73A49\"> Monad\x3C/span>\x3Cspan style=\"color:#D73A49\"> Maybe\x3C/span>\x3Cspan style=\"color:#D73A49\"> where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  return x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> Just\x3C/span>\x3Cspan style=\"color:#24292E\"> x\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005CC5\">  Just\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> f \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> f x\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005CC5\">  Nothing\x3C/span>\x3Cspan style=\"color:#D73A49\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> _ \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> Nothing\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">-- 真实代码不长这样\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">inductive\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Option\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">α : \x3C/span>\x3Cspan style=\"color:#D73A49\">Type\x3C/span>\x3Cspan style=\"color:#24292E\"> u\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  /-- No value. -/\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | none : Option α\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  /-- Some value of type `α`. -/\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | some \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val : α\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : Option α\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">instance\x3C/span>\x3Cspan style=\"color:#24292E\"> : Monad Option \x3C/span>\x3Cspan style=\"color:#D73A49\">where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  pure x := some x\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  bind opt next :=\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    match\x3C/span>\x3Cspan style=\"color:#24292E\"> opt \x3C/span>\x3Cspan style=\"color:#D73A49\">with\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    | none =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> none\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    | some x =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> next x\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>可以大概地看出一件事：一个 Monad （在这里）是一个\x3Cstrong>类型类\x3C/strong>，得到一种将它们串起来的方法\x3C/p>\n\x3Cp>什么事类型类呢？类型类可以理解为一个接口 / trait 之类的东西，实现了这个接口以后就有这个接口的特征\x3C/p>\n\x3Cp>也就是说，我们给 Option 实现了 Monad 以后，就能用 Monad 来串联 Option 了\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#eval\x3C/span>\x3Cspan style=\"color:#24292E\"> bind \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">some \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> λ x =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> pure $ x + \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#eval\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">some \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">= λ x =\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> pure $ x + \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">-- some \x3C/span>\x3Cspan style=\"color:#005CC5\">5\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>也就是说，我们可以这样直观地去理解一个 Monad：它是一个管子，\x3Ccode>pure\x3C/code> 用来往管子里放东西，\x3Ccode>bind\x3C/code> 用来定义管子里的东西怎么流动。\x3C/p>\n\x3Cp>为了方便非函数式背景的人\x3Cdel>比如我\x3C/del>进一步理解 Monad，我们可以用 C++ 模拟一个半残的 Monad Option：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#include\x3C/span>\x3Cspan style=\"color:#032F62\"> &#x3C;functional>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#include\x3C/span>\x3Cspan style=\"color:#032F62\"> &#x3C;iostream>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#include\x3C/span>\x3Cspan style=\"color:#032F62\"> &#x3C;optional>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">template\x3 /span>\x3Cspan style=\"color:#24292E\">.map fib'\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">-- \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">5\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">8\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">13\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>也就是说，在 State Monad 这个神奇的管道下，只需要传入初始状态，则 \x3Ccode>get\x3C/code> 和 \x3Ccode>set\x3C/code> 就能一路把状态在管道内传递，而无需我们手动维护。有了 State Monads 我们就在 “不可变” 的语言里产生了 “可变”\x3C/p>\n\x3Cp>当然，我们这样费力 Desugar 反而有点适得其反了，其实我们本身就是为了能写 \x3Ccode>do\x3C/code> 记号而引入的 Monads。\x3C/p>\n\x3Ch2 id=\"promise-monad\">\x3Ca href=\"#promise-monad\">\x3Cdel>Promise Monad\x3C/del>\x3C/a>\x3C/h2>\n\x3Cblockquote>\n\x3Cp>什么？这不是 \x3Ccode>Promise\x3C/code>，这是一个异步 Monad 。我们这个异步 Monad 体积小方便携带，拆开一包，放 then 里就变出值，怎么 then 都有值，用来解决回调地狱，做异步都是很好用的。你看打开以后像 Monads 一样的结构，放在事件循环里，你看它遇 resolved 变大变高，可用性很强的。打开以后，是一条加大加厚的 value，你看它怎么玩都玩不坏，不掉毛不掉絮，then 个七八次都没问题，异步函数带上它非常方便，你用它跑个 XMLHTTPRequest，跑个 fs.readFile，干净又卫生。什么？在哪里用？点击键盘 F12，开 Console，敲一行，看一行，还有结果。\x3C/p>\n\x3C/blockquote>\n\x3Cp>当我们写 JavaScript 的时候，应该感谢 Monads 的伟力。显然 Promise （删掉 catch）本质上是一个 Monad：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> monad_promise\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292 <p>从很久以前就听说了 Monads 这个概念，但是一直都不懂，今天终于花了几个小时去理解（然后还是似懂非懂）</p>

</blockquote>
<p>让我们看看 Haskell 和 Lean 4 里分别对 Monad 的定义</p>

<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">class</span><span style="color:#6F42C1"> Monad</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">m : </span><span style="color:#D73A49">Type</span><span style="color:#24292E"> u → </span><span style="color:#D73A49">Type</span><span style="color:#24292E"> v</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">where</span></span>

<span class="line"><span style="color:#D73A49">    match</span><span style="color:#24292E"> opt </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">    | none =</span><span style="color:#24292E">></span><span style="color:#24292E"> none</span></span>
<span class="line"><span style="color:#24292E">    | some x =</span><span style="color:#24292E">></span><span style="color:#24292E"> next x</span></span></code></pre>
<p>可以大概地看出一件事：一个 Monad （在这里）是一个<strong>类型类</strong>，得到一种将它们串起来的方法</p>
<p>什么事类型类呢？类型类可以理解为一个接口 / trait 之类的东西，实现了这个接口以后就有这个接口的特征</p>
<p>也就是说，我们给 Option 实现了 Monad 以后，就能用 Monad 来串联 Option 了</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> bind </span><span style="color:#005cc5">(</span><span style="color:#24292E">some </span><span style="color:#005CC5">2</span><span style="color:#005cc5">)</span><span style="color:#24292E"> λ x =</span><span style="color:#24292E">></span><span style="color:#24292E"> pure $ x + </span><span style="color:#005CC5">3</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">some </span><span style="color:#005CC5">2</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#24292E">></span><span style="color:#24292E">></span><span style="color:#24292E">= λ x =</span><span style="color:#24292E">></span><span style="color:#24292E"> pure $ x + </span><span style="color:#005CC5">3</span></span>
<span class="line"><span style="color:#24292E">-- some </span><span style="color:#005CC5">5</span></span></code></pre>
<p>也就是说，我们可以这样直观地去理解一个 Monad：它是一个管子，<code>pure</code> 用来往管子里放东西，<code>bind</code> 用来定义管子里的东西怎么流动。</p>

<span class="line"><span style="color:#D73A49">    return</span><span style="color:#005CC5"> nil</span><span style="color:#24292E">, err</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#24292E">  _, err </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> task4</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  if</span><span style="color:#24292E"> err </span><span style="color:#D73A49">!=</span><span style="color:#005CC5"> nil</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#005CC5"> nil</span><span style="color:#24292E">, err</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#24292E">  _, err </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> task5</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  if</span><span style="color:#24292E"> err </span><span style="color:#D73A49">!=</span><span style="color:#005CC5"> nil</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#005CC5"> nil</span><span style="color:#24292E">, err</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>人们已经注意到这样的链式行为非常多，以至于在 C#, Kotlin, Javascript 等语言中，有一个 <code>?.</code> 运算符，专门用于链式地在可能为 <code>null</code> 的值上查找属性或调用方法的。如果 <code>?.</code> 前的值为 <code>null</code>，则整个表达式为 <code>null</code>。否则，该非 <code>null</code> 值会被用于使用。像这样链接 <code>null</code> 检查比编写和维护深层嵌套的 if 方便得多。</p>
<h2 id="state-monad"><a href="#state-monad">State Monad</a></h2>
<p>在接触纯函数式语言的时候，我们最先知道的也是最先<del>深受其害</del>大为震撼的，应该是它的不可变。我们不再能方便地使用状态。但是有时候，必须要用到一些状态。</p>
<p>比如，让我们用函数式语言写一个斐波那契数列的计算。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">fib</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> Int</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#D73A49"> Int</span></span>
<span class="line"><span style="color:#24292E">fib </span><span style="color:#005CC5">1</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> 1</span></span>
<span class="line"><span style="color:#24292E">fib </span><span style="color:#005CC5">2</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> 1</span></span>
<span class="line"><span style="color:#24292E">fib n </span><span style="color:#D73A49">=</span><span style="color:#24292E"> fib </span><span style="color:#005cc5">(</span><span style="color:#24292E">n </span><span style="color:#D73A49">-</span><span style="color:#005CC5"> 1</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">+</span><span style="color:#24292E"> fib </span><span style="color:#005cc5">(</span><span style="color:#24292E">n </span><span style="color:#D73A49">-</span><span style="color:#005CC5"> 2</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">main</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> IO</span><span style="color:#005CC5"> </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">main </span><span style="color:#D73A49">=</span><span style="color:#24292E"> print </span><span style="color:#D73A49">$</span><span style="color:#24292E"> fib </span><span style="color:#005CC5">10</span></span>
<span class="line"><span style="color:#6A737D">-- 55</span></span></code></pre>
<p>它很好，但是效率致命的低下，具有指数级的时间复杂度。有很多更加函数式风格的改善，不过让我们考虑 C/C++ 的代码</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">int</span><span style="color:#6F42C1"> fib</span><span style="color:#005cc5">(</span><span style="color:#D73A49">int</span><span style="color:#E36209"> n</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    int</span><span style="color:#24292E"> a </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">, b </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    for</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#D73A49">int</span><span style="color:#24292E"> i </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">; i </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">=</span><span style="color:#24292E"> n; i</span><span style="color:#D73A49">++</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">        int</span><span style="color:#24292E"> c </span><span style="color:#D73A49">=</span><span style="color:#24292E"> a;</span></span>
<span class="line"><span style="color:#24292E">        a </span><span style="color:#D73A49">=</span><span style="color:#24292E"> b;</span></span>
<span class="line"><span style="color:#24292E">        b </span><span style="color:#D73A49">=</span><span style="color:#24292E"> a </span><span style="color:#D73A49">+</span><span style="color:#24292E"> c;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> a;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p><code>a</code> 和 <code>b</code> 是状态，维护了 <code>fib (n - 1)</code> 和 <code>fib (n - 2)</code></p>
<p>如果是函数式语言的话，容易想出一种解决方案：把状态当成参数传入（和传出）。给定状态 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span>, 返回 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>R</mi><mo separator="true">,</mo><msup><mi>S</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(R, S')</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0019em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> 其中 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> 是本来的返回值，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>S</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow><annotation encoding="application/x-tex">S'</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7519em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span> 是修改后的新状态。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">fibHelper</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> Int</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">Int</span><span style="color:#24292E">, </span><span style="color:#D73A49">Int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#D73A49"> Int</span></span>
<span class="line"><span style="color:#24292E">fibHelper </span><span style="color:#005CC5">0</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> a</span></span>
<span class="line"><span style="color:#24292E">fibHelper n </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> fibHelper </span><span style="color:#005cc5">(</span><span style="color:#24292E">n </span><span style="color:#D73A49">-</span><span style="color:#005CC5"> 1</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, a </span><span style="color:#D73A49">+</span><span style="color:#24292E"> b</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">fib</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> Int</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#D73A49"> Int</span></span>
<span class="line"><span style="color:#24292E">fib n </span><span style="color:#D73A49">=</span><span style="color:#24292E"> fibHelper n </span><span style="color:#005cc5">(</span><span style="color:#005CC5">0</span><span style="color:#24292E">, </span><span style="color:#005CC5">1</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">main</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> IO</span><span style="color:#005CC5"> </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">main </span><span style="color:#D73A49">=</span><span style="color:#24292E"> print </span><span style="color:#D73A49">$</span><span style="color:#24292E"> fib </span><span style="color:#005CC5">10</span></span>
<span class="line"><span style="color:#6A737D">-- 55</span></span></code></pre>
<p>这样很好地解决了这个问题。</p>
<p>注意到，因为有了状态，之前理论上可能可以交换的执行顺序变得固定了。在之前，<code>fib (n - 1)</code> 和 <code>fib (n - 2)</code> 完全是独立的，理论上先算哪个都没关系。现在后面的状态总是依赖于前面的状态被计算出。这种关系形成了一个链条，于是有了我们 Monads 的用武之地。</p>
<p>State Monads 通常被实现为一个</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">structure</span><span style="color:#6F42C1"> State</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">σ α : </span><span style="color:#D73A49">Type</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">where</span></span>
<span class="line"><span style="color:#24292E">  run : σ → </span><span style="color:#005cc5">(</span><span style="color:#24292E">α × σ</span><span style="color:#005cc5">)</span></span></code></pre>
<p>容易看出这就是一个对 <code>state -> (val, state)</code> 的包装，</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">instance</span><span style="color:#24292E"> : Monad </span><span style="color:#005cc5">(</span><span style="color:#24292E">State σ</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">where</span></span>
<span class="line"><span style="color:#24292E">  pure x := ⟨</span><span style="color:#D73A49">fun</span><span style="color:#24292E"> s =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">x, s</span><span style="color:#005cc5">)</span><span style="color:#24292E">⟩  -- 直接返回 x，不改变状态</span></span>
<span class="line"><span style="color:#24292E">  bind sa f := ⟨</span><span style="color:#D73A49">fun</span><span style="color:#24292E"> s =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, s'</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := sa.run s  -- 取出当前状态，计算 a</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#005cc5">(</span><span style="color:#24292E">f a</span><span style="color:#005cc5">)</span><span style="color:#24292E">.run s'⟩  -- 用新状态执行 f</span></span></code></pre>
<p>然后在上面经常会实现有 get 和 put 两个很方便的函数</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> get</span><span style="color:#24292E"> : State σ σ :=</span></span>
<span class="line"><span style="color:#24292E">  ⟨</span><span style="color:#D73A49">fun</span><span style="color:#24292E"> s =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">s, s</span><span style="color:#005cc5">)</span><span style="color:#24292E">⟩  -- 直接返回当前状态 s</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> put</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">s' : σ</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : State σ Unit :=</span></span>
<span class="line"><span style="color:#24292E">  ⟨</span><span style="color:#D73A49">fun</span><span style="color:#24292E"> _ =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">, s'</span><span style="color:#005cc5">)</span><span style="color:#24292E">⟩  -- 不关心旧状态，直接设置新状态</span></span></code></pre>
<p>比如之前那个斐波那契数列，可以这样写：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">import</span><span style="color:#24292E"> Std</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fibStep</span><span style="color:#24292E"> : StateM </span><span style="color:#005cc5">(</span><span style="color:#24292E">Nat × Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> Nat := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← get    -- 读取 </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  set </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, a + b</span><span style="color:#005cc5">)</span><span style="color:#24292E">     -- 更新状态为 </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, a+b</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> b</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fib</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">n: Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#005cc5">(</span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  for</span><span style="color:#24292E"> _ </span><span style="color:#D73A49">in</span><span style="color:#24292E"> </span><span style="color:#e36209">[</span><span style="color:#005CC5">0</span><span style="color:#24292E"> : n</span><span style="color:#e36209">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#24292E">    _ </span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">- fibStep</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> </span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">- fibStep</span><span style="color:#005cc5">)</span><span style="color:#24292E">.run' </span><span style="color:#005cc5">(</span><span style="color:#005CC5">0</span><span style="color:#24292E">, </span><span style="color:#005CC5">1</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">2</span><span style="color:#24292E">,</span><span style="color:#005CC5">3</span><span style="color:#24292E">,</span><span style="color:#005CC5">4</span><span style="color:#24292E">,</span><span style="color:#005CC5">5</span><span style="color:#24292E">,</span><span style="color:#005CC5">6</span><span style="color:#005cc5">]</span><span style="color:#24292E">.map fib</span></span>
<span class="line"><span style="color:#24292E">-- </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#24292E">, </span><span style="color:#005CC5">5</span><span style="color:#24292E">, </span><span style="color:#005CC5">8</span><span style="color:#24292E">, </span><span style="color:#005CC5">13</span><span style="color:#005cc5">]</span></span></code></pre>
<p>我们把它 desugar，基本上相当于</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fibStep'</span><span style="color:#24292E"> : StateM </span><span style="color:#005cc5">(</span><span style="color:#24292E">Nat × Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> Nat :=</span></span>
<span class="line"><span style="color:#24292E">  get </span><span style="color:#24292E">></span><span style="color:#24292E">></span><span style="color:#24292E">= </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E">           -- 读取 </span><span style="color:#005cc5">(</span><span style="color:#24292E">a, b</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  set </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, a + b</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#24292E">></span><span style="color:#24292E">></span><span style="color:#24292E">= </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> _ =</span><span style="color:#24292E">></span><span style="color:#24292E">     -- 更新状态为 </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, a+b</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  pure b                          -- 返回 b</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fibrecu</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">step : Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : StateM </span><span style="color:#005cc5">(</span><span style="color:#24292E">Nat × Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> Nat :=</span></span>
<span class="line"><span style="color:#24292E">  fibStep </span><span style="color:#24292E">></span><span style="color:#24292E">></span><span style="color:#24292E">= </span><span style="color:#D73A49">fun</span><span style="color:#24292E"> r =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">match</span><span style="color:#24292E"> step </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">  | .zero =</span><span style="color:#24292E">></span><span style="color:#24292E"> pure r</span></span>
<span class="line"><span style="color:#24292E">  | .succ step' =</span><span style="color:#24292E">></span><span style="color:#24292E"> fibrecu step'</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> fib'</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">n : Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Nat := </span><span style="color:#005cc5">(</span><span style="color:#24292E">fibrecu n</span><span style="color:#005cc5">)</span><span style="color:#24292E">.run' </span><span style="color:#005cc5">(</span><span style="color:#005CC5">0</span><span style="color:#24292E">, </span><span style="color:#005CC5">1</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">2</span><span style="color:#24292E">,</span><span style="color:#005CC5">3</span><span style="color:#24292E">,</span><span style="color:#005CC5">4</span><span style="color:#24292E">,</span><span style="color:#005CC5">5</span><span style="color:#24292E">,</span><span style="color:#005CC5">6</span><span style="color:#005cc5">]</span><span style="color:#24292E">.map fib'</span></span>
<span class="line"><span style="color:#24292E">-- </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#24292E">, </span><span style="color:#005CC5">5</span><span style="color:#24292E">, </span><span style="color:#005CC5">8</span><span style="color:#24292E">, </span><span style="color:#005CC5">13</span><span style="color:#005cc5">]</span></span></code></pre>
<p>也就是说，在 State Monad 这个神奇的管道下，只需要传入初始状态，则 <code>get</code> 和 <code>set</code> 就能一路把状态在管道内传递，而无需我们手动维护。有了 State Monads 我们就在 “不可变” 的语言里产生了 “可变”</p>
<p>当然，我们这样费力 Desugar 反而有点适得其反了，其实我们本身就是为了能写 <code>do</code> 记号而引入的 Monads。</p>
<h2 id="promise-monad"><a href="#promise-monad"><del>Promise Monad</del></a></h2>
<blockquote>
<p>什么？这不是 <code>Promise</code>，这是一个异步 Monad 。我们这个异步 Monad 体积小方便携带，拆开一包，放 then 里就变出值，怎么 then 都有值，用来解决回调地狱，做异步都是很好用的。你看打开以后像 Monads 一样的结构，放在事件循环里，你看它遇 resolved 变大变高，可用性很强的。打开以后，是一条加大加厚的 value，你看它怎么玩都玩不坏，不掉毛不掉絮，then 个七八次都没问题，异步函数带上它非常方便，你用它跑个 XMLHTTPRequest，跑个 fs.readFile，干净又卫生。什么？在哪里用？点击键盘 F12，开 Console，敲一行，看一行，还有结果。</p>
</blockquote>
<p>当我们写 JavaScript 的时候，应该感谢 Monads 的伟力。显然 Promise （删掉 catch）本质上是一个 Monad：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> monad_promise</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  pure: </span><span style="color:#005CC5">Promise</span><span style="color:#24292E">.resolve </span><span style="color:#D73A49">as</span><span style="color:#24292E"> </span><span style="color:#24292E">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:rgba(255, 18, 18, 0.8)">></span><span style="color:#e36209">(</span><span style="color:#E36209">t</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> T</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Promise</span><span style="color:#e36209">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:#e36209">></span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#24292E">  bind: </span><span style="color:#005CC5">Promise</span><span style="color:#24292E">.</span><span style="color:#005CC5">prototype</span><span style="color:#24292E">.then </span><span style="color:#D73A49">as</span><span style="color:#24292E"> </span><span style="color:#24292E">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:#24292E">, </span><span style="color:#6F42C1">U</span><span style="color:rgba(255, 18, 18, 0.8)">></span><span style="color:#e36209">(</span></span>
<span class="line"><span style="color:#005CC5">    this</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> Promise</span><span style="color:#5a32a3">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:#5a32a3">></span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    fn</span><span style="color:#D73A49">:</span><span style="color:#24292E"> </span><span style="color:#5a32a3">(</span><span style="color:#E36209">t</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> T</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Promise</span><span style="color:#5a32a3">&#x3C;</span><span style="color:#6F42C1">U</span><span style="color:#5a32a3">></span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Promise</span><span style="color:#e36209">&#x3C;</span><span style="color:#6F42C1">U</span><span style="color:#e36209">></span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span></code></pre>
<p>有了 Promise Monad，之前的回调地狱就这样变成了</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005CC5">Promise</span><span style="color:#24292E">.</span><span style="color:#6F42C1">resolve</span><span style="color:#005cc5">(</span><span style="color:#005CC5">3</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">x</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> x </span><span style="color:#D73A49">+</span><span style="color:#005CC5"> 4</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">x</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> x </span><span style="color:#D73A49">*</span><span style="color:#005CC5"> 2</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">x</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> some_api</span><span style="color:#e36209">(</span><span style="color:#24292E">x</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>同样的，Javascript 也提供了像 do notation 那样消除显式的 then 的工具，也就是 <code>async</code></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">async</span><span style="color:#D73A49"> function</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> x </span><span style="color:#D73A49">=</span><span style="color:#D73A49"> await</span><span style="color:#005CC5"> Promise</span><span style="color:#24292E">.</span><span style="color:#6F42C1">resolve</span><span style="color:#e36209">(</span><span style="color:#005CC5">3</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  x </span><span style="color:#D73A49">=</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> add4</span><span style="color:#e36209">(</span><span style="color:#24292E">x</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  x </span><span style="color:#D73A49">=</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> somefunc</span><span style="color:#e36209">(</span><span style="color:#24292E">x</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  x </span><span style="color:#D73A49">=</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> some_api</span><span style="color:#e36209">(</span><span style="color:#24292E">x</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> x</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>起到了将异步函数打成看上去像同步一样的效果。</p>
<h2 id="总结"><a href="#总结">总结</a></h2>
<p>所以并非只有函数式语言，我们其实已经应用了许多的 Monads 到实践中。Monads 将链式的控制流封装起来，提供统一的表达方式，从而提高代码的可读性。</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">March 27, 2025</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li><li _hk=0010070c003100036h110><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-03-22-pfpl-note-6"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">PFPL 笔记 - VI Dynamic Types</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-03-30-pop-front-list-compare-vec"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">小数据的时候 <code>std::vector&#x3C;int></code> 删除首元素比 deque 和 list 还快</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent ho
