lass="w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#aliasing-xor-mutability" class="text-ink-soft hover:text-accent">Aliasing XOR mutability</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#编译器优化与-undefined-behavior" class="text-ink-soft hover:text-accent">编译器优化与 Undefined Behavior</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#unsafe-is-really-unsafe" class="text-ink-soft hover:text-accent">unsafe is really unsafe</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#结语" class="text-ink-soft hover:text-accent">结语</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#footnote-label" class="text-ink-soft hover:text-accent">Footnotes</a></li></ul></nav></aside></div></div></body></html><script>($R[19]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"Unsafe Rust 并不和 C 语言一样：从 Aliasing 谈起",date:"2025-07-21T08:24:40",tags:$R[11]=["Code","Rust"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"Unsafe Rust 并不和 C 语言一样：从 Aliasing 谈起",html:"\x3Cp>在社区中你可能听到一种说法：在 \x3Ccode>unsafe\x3C/code> 块里你可以像 C\x3Csup>\x3Ca href=\"#user-content-fn-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85\" id=\"user-content-fnref-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85\" data-footnote-ref aria-describedby=\"footnote-label\">1\x3C/a>\x3C/sup> 语言那样写。然而事实并不是这样，C 语言的约束太差，事实上给了程序员太多“宽松”的东西。而在 Rust 里，unsafe 真的很 unsafe —— 当你要接管编译器为你做的安全保证，危险就暗藏在其中。\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"aliasing-xor-mutability\">\x3Ca href=\"#aliasing-xor-mutability\">Aliasing XOR mutability\x3C/a>\x3C/h2>\n\x3Cp>与 C/C++ 非常不同的是，Rust 要求了 Aliasing XOR mutability. 考虑这样一个函数：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\">, y\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 114\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">y \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 514\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">x;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>对于 C 语言新手程序员而言，这个函数看上去似乎等价于：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#E36209\">x\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#E36209\">y\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 114\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">y \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 514\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">x;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>真的是这样吗？想想看，假如 \x3Ccode>x\x3C/code> 和 \x3Ccode>y\x3C/code> 实际上是指向同一个内存区域的不同名指针怎么办？一个 C 程序员可以很自然的回答： \x3Ccode>x\x3C/code> 被先赋值为 \x3Ccode>114\x3C/code>，然后又被赋值为 \x3Ccode>514\x3C/code>，最后函数整体返回 \x3Ccode>514\x3C/code>。\x3C/p>\n\x3Cp>然而并非如此。实际上，Rust 使用了严格的 aliasing 规则，根据 Rust 的规则，同一个变量永远不能有两个可变引用。这直接导致编译器的优化产生不同的结果。如果没有内联，编译器可以安全的假设，\x3Ccode>x\x3C/code> 和 \x3Ccode>y\x3C/code> 永远指向不同的内存地址。因此，在第 2 行赋值之后，编译器可以知道 \x3Ccode>*x\x3C/code> 一定是 114, 从而直接返回 114.\x3C/p>\n\x3Cp>但如果我们在 \x3Ccode>unsafe\x3C/code> 块中直接违背这个规则呢？这会导致 \x3Cem>Undefined Behavior\x3C/em>（未定义行为）。\x3Cstrong>在 Rust 中，\x3Ccode>unsafe\x3C/code> 块只是允许你绕过编译器的安全检查，但这并不意味着你可以违背 Rust 的 \x3Cem>Invariant\x3C/em>（不变式）假设\x3C/strong>。例如，Rust 的 \x3Ccode>unsafe\x3C/code> 代码仍然需要遵循 Rust 的 aliasing 规则。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">#\x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\">inline\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">never\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\">, y\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 114\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">y \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 514\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">x;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> main\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#D73A49\"> mut\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 42\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#D73A49\"> mut\x3C/span>\x3Cspan style=\"color:#24292E\"> b \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 84\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#24292E\"> ret \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;mut\x3C/span>\x3Cspan style=\"color:#24292E\"> a, \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;mut\x3C/span>\x3Cspan style=\"color:#24292E\"> b\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    println!\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"a: {a}, b: {b}, ret: {ret}\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    unsafe\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#D73A49\"> mut\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 1\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> still_x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">as\x3C/span>\x3Cspan style=\"color:#D73A49\"> *mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">        // undefined behavior!\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> ret \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;mut\x3C/span>\x3Cspan style=\"color:#24292E\"> x, \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;mut\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">still_x\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">        println!\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"x: {x}, ret: {ret}\"\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>在这个例子中，我们在 \x3Ccode>unsafe\x3C/code> 块中创建了一个指向 \x3Ccode>x\x3C/code> 的裸指针 \x3Ccode>still_x\x3C/code>，然后将其作为第二个参数传递给 \x3Ccode>alias_example\x3C/code> 函数。显然这违背了 aliasing 规则，因此产生一个 undefined behavior。严格来说，该程序编译运行的结果是不确定的。但是在 rustc 1.88.0 开启 \x3Ccode>-O\x3C/code> （3 级优化）后，我们可以看到输出如下：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>a: 114, b: 514, ret: 114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>x: 514, ret: 114\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cdiv class=\"text-center\">\x3Csmall>\n\x3Cp>Compiler Explorer 链接： \x3Ca href=\"https://godbolt.org/z/Y6s15h9eP\">https://godbolt.org/z/Y6s15h9eP\x3C/a>\x3C/p>\n\x3Cp>\x3C/small>\x3C/div>\x3C/p>\n\x3Cp>正如我们所料，编译器对 \x3Ccode>alias_example\x3C/code> 函数进行了优化，虽然 \x3Ccode>*x\x3C/code> 在函数中被第二次赋值为 514，但编译器接下来根本没有用到 \x3Ccode>*x\x3C/code> 的值，而是直接返回了 114。生成的汇编代码如下：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">example:\x3C/span>\x3Cspan style=\"color:#24292E\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\">alias_example:\x3C/span>\x3Cspan style=\"color:#24292E\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\">h26925842407e8957:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     dword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     dword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">514\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>而如果去掉 \x3Ccode>-O\x3C/code> 优化选项，编译器就不会进行这样的优化了。将会正确的返回 514。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">example:\x3C/span>\x3Cspan style=\"color:#24292E\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\">alias_example:\x3C/span>\x3Cspan style=\"color:#24292E\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\">h26925842407e8957:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     qword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsp\x3C/span>\x3Cspan style=\"color:#24292E\"> - \x3C/span>\x3Cspan style=\"color:#005CC5\">16\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     qword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsp\x3C/span>\x3Cspan style=\"color:#24292E\"> - \x3C/span>\x3Cspan style=\"color:#005CC5\">8\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     dword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     dword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">514\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">dword\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这说明，如果你的代码中包含 \x3Ccode>unsafe\x3C/code> 块，不同的优化级别下，可能会导致不同的行为。事实上，之前的代码实际上等价于使用了 \x3Ca href=\"https://en.cppreference.com/w/c/language/restrict.html\">\x3Ccode>restrict\x3C/code> 关键字\x3C/a> 的 C 代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">int*\x3C/span>\x3Cspan style=\"color:#D73A49\"> restrict\x3C/span>\x3Cspan style=\"color:#E36209\"> x\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">int*\x3C/span>\x3Cspan style=\"color:#D73A49\"> restrict\x3C/span>\x3Cspan style=\"color:#E36209\"> y\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 114\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">y \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 514\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">x;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>在 \x3Ccode>-O3\x3C/code> 编译选项下，生成如下的汇编：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">alias_example:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">514\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>与 Rust 的行为一致。如果去掉 \x3Ccode>restrict\x3C/code> 关键字，g++ 编译器（和任何一个成熟的编译器）都将默认 \x3Ccode>x\x3C/code> 和 \x3Ccode>y\x3C/code> 是可能 aliasing 的，因此不敢进行激进优化，只能按原样生成汇编代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">alias_example:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">514\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>如果这个函数被大量执行，将会影响到性能。这不是一句玩笑。老练的 C 程序员都应该知道自从 C99 开始 \x3Ccode>memcpy\x3C/code> 函数的类型签名就包含 \x3Ccode>restrict\x3C/code> 关键字：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">void*\x3C/span>\x3Cspan style=\"color:#6F42C1\"> memcpy\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">void\x3C/span>\x3Cspan style=\"color:#D73A49\"> *restrict\x3C/span>\x3Cspan style=\"color:#E36209\"> dest\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#D73A49\"> void\x3C/span>\x3Cspan style=\"color:#D73A49\"> *restrict\x3C/span>\x3Cspan style=\"color:#E36209\"> src\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">size_t\x3C/span>\x3Cspan style=\"color:#E36209\"> count\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cblockquote>\n\x3Cp>The behavior is undefined if access occurs beyond the end of the dest array. If the objects overlap (which is a violation of the restrict contract)(since C99), the behavior is undefined. The behavior is undefined if either dest or src is an invalid or null pointer.\x3C/p>\n\x3C/blockquote>\n\x3Cp>因为任何一个现代机器上，\x3Ccode>memcpy\x3C/code> 都不是像 PDP-11 那样一个一个字节拷贝的，而是使用 SIMD 指令一次性拷贝多个字节。编译器需要知道 \x3Ccode>dest\x3C/code> 和 \x3Ccode>src\x3C/code> 不会 aliasing 才能进行这样的优化。你可以试一试用 Compiler Explorer 手动实现一个 \x3Ccode>memcpy\x3C/code>，比较删掉 \x3Ccode>restrict\x3C/code> 关键字后二者的影响。删掉 \x3Ccode>restrict\x3C/code> 关键字后，编译器必须先比较两个指针是否相差在 \x3Ccode>count\x3C/code> 直接以内（正如 \x3Ccode>restrict\x3C/code> 保证），如果不是，才可以放心使用 SIMD，否则只能分情况讨论。对于 \x3Ccode>memcpy\x3C/code> 这种被大量调用的函数，这一点点比较开销会导致可观察到的性能下降。\x3C/p>\n\x3Cp>而你没法保证写 C 语言的都是顶尖高手程序员，懂得时时刻刻加入 \x3Ccode>restrict\x3C/code> 关键字，承担一旦用错就会出现未定义行为的后果。更多新手甚至连 \x3Ccode>const\x3C/code> 也懒得或者不会使用。还有一些项目，代码质量明显堪忧，undefined behaviour 满天飞（虽然这也与 C/C++ 有一些不应该有的 undefined behaviour 有关），人们甚至总结出“不要开启优化选项，编译器会搞烂你的代码”的建议。——也可以理解，一些项目开出的工资没有办法雇佣能 C 语言期盼的不会犯错程序员。\x3C/p>\n\x3Cp>这也是为什么 Rust 明明比 C 语言抽象程度更高，却可能生成更高效的代码的原因。更多的约束允许编译器获得更多信息，进行更多优化。\x3Cstrong>C 语言不只是不安全。它还慢。\x3C/strong> 事实上，在当今世界，C 语言反而正在拖慢代码的速度。\x3Csup>\x3Ca href=\"#user-content-fn-c-is-not-a-low-level-language\" id=\"user-content-fnref-c-is-not-a-low-level-language\" data-footnote-ref aria-describedby=\"footnote-label\">2\x3C/a>\x3C/sup>\x3C/p>\n\x3Cblockquote>\n\x3Cp>C also requires padding at the end of a structure because it guarantees no padding in arrays. Padding is a particularly complex part of the C specification and interacts poorly with other parts of the language. For example, you must be able to compare two structs using a type-oblivious comparison (e.g., memcmp), so a copy of a struct must retain its padding. In some experimentation, a noticeable amount of total runtime on some workloads was found to be spent in copying padding (which is often awkwardly sized and aligned).\x3C/p>\n\x3C/blockquote>\n\x3Cp>\x3Cstrong>类型系统并不只是一个繁琐的工具，只是用来保证人们想当然“一眼就能看出的”程序的安全性。它还给编译器更多信息，从而自动生成更高效的代码\x3C/strong> ——而对于大多数程序员而言，并不会花费那么多时间在极致的性能优化上。这很反一些程序员的直觉：它们认为越贴近底层、越像汇编、抽象程度越低的语言速度越快。它们会想当然地觉得，写汇编是最最快的，而 C 语言比汇编慢 10%，C++ 比 C 又慢 10%，Rust 又比 C++ 慢 10% ——这来自于错误的“前人经验”，在编译优化还没有那么成熟的时代，作为“稍微抽象了一点的汇编”的 C 语言确实通常能写出很高效的代码，而 C++ 等语言编译器不够聪明，无法进行足够的优化。而当今世界随着编译技术的发展，编译器已经可以进行非常复杂的优化，甚至可以在大多数情况下超越手写的优化代码。例如一些人津津乐道的“位运算加速技巧”在如今已经不是魔法，而是编译器的常规优化。\x3C/p>\n\x3Cdetails class=\"beautiful-details\">\n\x3Csummary>\n扩展阅读：一个 C 语言位运算加速被编译器自动实施的例子\n\x3C/summary>\n\x3Cp>在算法题中，一个完全二叉树指的是叶子结点只能出现在最下层和次下层，且最下层的叶子结点集中在树的左部的二叉树。我们可以用一个数组直接存储完全二叉树，且节点用层次遍历编号，总是有编号为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>i\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">i\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6595em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">i\x3C/span>\x3C/span>\x3C/span>\x3C/span> 的节点，左子节点编号为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmn>2\x3C/mn>\x3Cmi>i\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">2i\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6595em;\">\x3C/span>\x3Cspan class=\"mord\">2\x3C/span>\x3Cspan class=\"mord mathnormal\">i\x3C/span>\x3C/span>\x3C/span>\x3C/span>，右子节点编号为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmn>2\x3C/mn>\x3Cmi>i\x3C/mi>\x3Cmo>+\x3C/mo>\x3Cmn>1\x3C/mn>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">2i + 1\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7429em;vertical-align:-0.0833em;\">\x3C/span>\x3Cspan class=\"mord\">2\x3C/span>\x3Cspan class=\"mord mathnormal\">i\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">+\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6444em;\">\x3C/span>\x3Cspan class=\"mord\">1\x3C/span>\x3C/span>\x3C/span>\x3C/span>。因此我们可以用 \x3Ccode>x * 2\x3C/code> 和 \x3Ccode>x * 2 + 1\x3C/code> 来计算左子节点和右子节点的编号。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">#include\x3C/span>\x3Cspan style=\"color:#032F62\"> &#x3C;stdio.h>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> left_child\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#E36209\"> x\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan s an class=\"line\">\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">L6:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">LC0:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">        .string \"%d %d %d %d\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">main:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        sub\x3C/span>\x3Cspan style=\"color:#005CC5\">     rsp\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">8\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     r8d\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     ecx\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     edx\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     esi\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     edi\x3C/span>\x3Cspan style=\"color:#24292E\">, OFFSET \x3C/span>\x3Cspan style=\"color:#6F42C1\">FLAT:\x3C/span>\x3Cspan style=\"color:#24292E\">.LC0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        call\x3C/span>\x3Cspan style=\"color:#24292E\">    printf\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        add\x3C/span>\x3Cspan style=\"color:#005CC5\">     rsp\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">8\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cdiv class=\"text-center\">\x3Csmall>\n\x3Cp>使用 g++ 15.1, \x3Ccode>-O1\x3C/code> （相对很保守的优化）下的结果。\x3C/p>\n\x3Cp>可以看到，\x3Ccode>xxx_child\x3C/code> 和 \x3Ccode>xxx_child_faster\x3C/code> 生成的代码完全一样。而 \x3Ccode>main\x3C/code> 和 \x3Ccode>get_most_rchild\x3C/code> 函数内直接把函数自动内联，根本没有生成 \x3Ccode>call\x3C/code> 指令，甚至 \x3Ccode>main\x3C/code> 内结果也在编译期给出，没有任何运行时计算。\x3C/p>\n\x3Cp>\x3C/small>\x3C/div>\x3C/p>\n\x3C/details>\n\x3Cp>但编译器优化也同时为 Rust 的 \x3Ccode>unsafe\x3C/code> 块带来了更高风险。因为在 \x3Ccode>unsafe\x3C/code> 块中，编译器不只是不再为你提供安全的保证，它还需要你将 Rust 的所有不变式熟记于心。这是人们随意说出“\x3Ccode>unsafe\x3C/code> 块里像 C 语言一样写就好了”的时候所经常忽略的。\x3C/p>\n\x3Ch2 id=\"编译器优化与-undefined-behavior\">\x3Ca href=\"#编译器优化与-undefined-behavior\">编译器优化与 Undefined Behavior\x3C/a>\x3C/h2>\n\x3Cp>在 C 中一个经常被争论的点是编译器是否应该利用 undefined behavior 来进行激进的优化。C/C++ 语言的标准允许编译器在遇到 undefined behavior 时进行任意行为（比如发射核弹炸毁你的家 :P ），包括假定 undefined behaviour \x3Cstrong>永远不会发生\x3C/strong>。（如果发生了，编译器作者假定程序员将会很乐意看到意外的行为）实际上 GCC 等编译器确实会在高的优化等级下，利用这一点进行优化。一个经典的例子是 signed integer overflow。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> foo\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#E36209\"> x\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">+\x3C/span>\x3Cspan style=\"color:#005CC5\"> 1\x3C/span>\x3Cspan style=\"color:#D73A49\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> x;\x3C/span>\x3Cspan style=\"color:#6A737D\"> // either true or UB due to signed overflow\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>如果一字一句的翻译这段代码，在许多平台，\x3Ccode>int\x3C/code> 上溢时会按补码规则处理，得到一个负数值。因此，写这段代码的人会期望这个函数能“证明”一个整数将在当前架构下溢出。C 语言的前几节课讲到原码、反码、补码的时候，一些老师会用类似的代码作为例子向学生生动阐述溢出的效果（虽然应该不会开优化）。然而，signed integer overflow 实际上是 undefined behavior，因此编译器在激进优化时可以假定它永远不会发生。此时编译器会发现 \x3Ccode>x + 1\x3C/code> 的结果永远不会小于 \x3Ccode>x\x3C/code>，因此可以直接将其优化为 \x3Ccode>return true;\x3C/code>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">foo:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>如果学生不小心打开了优化开关——那它可能会很惊讶的发现代码的行为和老师的例子完全不一样。\x3C/p>\n\x3Cp>类似的例子还有很多。例如被许多人用来证明 “C 语言的优雅” 的著名算法，如《雷神之锤 III 竞技场》源代码中平方根倒数速算法之实例。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">float\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Q_rsqrt\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">float\x3C/span>\x3Cspan style=\"color:#E36209\"> number\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    long\x3C/span>\x3Cspan style=\"color:#24292E\"> i;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    float\x3C/span>\x3Cspan style=\"color:#24292E\"> x2, y;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    const\x3C/span>\x3Cspan style=\"color:#D73A49\"> float\x3C/span>\x3Cspan style=\"color:#24292E\"> threehalfs \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 1.5\x3C/span>\x3Cspan style=\"color:#D73A49\">F\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    x2 \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> number \x3C/span>\x3Cspan style=\"color:#D73A49\">*\x3C/span>\x3Cspan style=\"color:#005CC5\"> 0.5\x3C/span>\x3Cspan style=\"color:#D73A49\">F\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    y  \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> number;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    i  \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">long\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">y;\x3C/span>\x3Cspan style=\"color:#6A737D\">                       // evil floating point bit level hacking（对浮点数的邪恶位元hack）\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    i  \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\"> 0x\x3C/span>\x3Cspan style=\"color:#005CC5\">5f3759df\x3C/span>\x3Cspan style=\"color:#D73A49\"> -\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> i \x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#005CC5\"> 1\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3Cspan style=\"color:#6A737D\">               // what the fuck?（这他妈的是怎么回事？）\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    y  \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">float\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">i;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    y  \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> y \x3C/span>\x3Cspan style=\"color:#D73A49\">*\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> threehalfs \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> x2 \x3C/span>\x3Cspan style=\"color:#D73A49\">*\x3C/span>\x3Cspan style=\"color:#24292E\"> y \x3C/span>\x3Cspan style=\"color:#D73A49\">*\x3C/span>\x3Cspan style=\"color:#24292E\"> y \x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3Cspan style=\"color:#6A737D\">   // 1st iteration （第一次迭代）\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">//  y  = y * ( threehalfs - ( x2 * y * y ) );   // 2nd iteration, this can be removed（第二次迭代，可以删除）\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#24292E\"> y;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>实际上，这个代码是 undefined behaviour。C 的 strict aliasing 规则\x3Csup>\x3Ca href=\"#user-content-fn-https://en.cppreference.com/w/c/language/object.html#strict_aliasing\" id=\"user-content-fnref-https://en.cppreference.com/w/c/language/object.html#strict_aliasing\" data-footnote-ref aria-describedby=\"footnote-label\">3\x3C/a>\x3C/sup>规定：\x3C/p>\n\x3Cblockquote>\n\x3Cp>Given an object with effective type T1, using an lvalue expression (typically, dereferencing a pointer) of a different type T2 is undefined behavior, unless:\x3C/p>\n\x3Cul>\n\x3Cli>T2 and T1 are \x3Ca href=\"https://en.cppreference.com/w/c/language/compatible_type.html#Compatible_types\">compatible types\x3C/a>.\x3C/li>\n\x3Cli>T2 is cvr-qualified version of a type that is compatible with T1.\x3C/li>\n\x3Cli>T2 is a signed or unsigned version of a type that is compatible with T1.\x3C/li>\n\x3Cli>T2 is an aggregate type or union type type that includes one of the aforementioned types among its members (including, recursively, a member of a subaggregate or contained union).\x3C/li>\n\x3Cli>T2 is a character type (char, signed char, or unsigned char).\x3C/li>\n\x3C/ul>\n\x3Cp>These rules control whether when compiling a function that receives two pointers, the compiler must emit code that re-reads one after writing through another:\x3C/p>\n\x3C/blockquote>\n\x3Cp>因此，\x3Ccode>int*\x3C/code> 和 \x3Ccode>float*\x3C/code> 根本不应该指向同一块内存区域。这是 undefined behaviour。对于许多程序员而言这简直是荒谬的事情，因为它极大的限制了作为底层语言的 C 语言的能力。程序员会觉得，\x3Ccode>float\x3C/code> 和 \x3Ccode>int\x3C/code> 都是一样的大小，为什么不能直接将一个数字的位模式转换为另一个数字的位模式？这不是 C 语言的强项吗？\x3C/p>\n\x3Cp>但如果你站在编译器开发和优化者的角度，这个规则就变得非常有意义：当你看到 \x3Ccode>int*\x3C/code> 和 \x3Ccode>float*\x3C/code> 同时出现的时候，假定两者不会指向同一块内存区域，可以让编译器进行更激进的优化。因为如果两者指向同一块内存区域，编译器就必须在每次读取 \x3Ccode>int\x3C/code> 或 \x3Ccode>float\x3C/code> 时都重新从内存中读取，而不能直接使用寄存器中的值。让我们再回到最开始的 aliasing 例子。如果有以下代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#6F42C1\"> alias_example2\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">int\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#E36209\">x\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">float\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#E36209\">y\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 114\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    *\x3C/span>\x3Cspan style=\"color:#24292E\">y \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 514\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">x;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>编译器根本没法揣摩你的心意，尤其是像 C 这样的语言，你编译出来的代码还经常作为动态链接库，你根本不知道用户会传入什么。如果你不按 strict aliasing 就没法优化这段代码，说不定它会被大量调用，成为一个性能下降的节点呢？权衡之下，考虑到对同一块内存区域进行不同类型的解释是很罕见的情况，编译器更应该尝试将它优化成：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">alias_example2:\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rdi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#005CC5\">     eax\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">114\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        mov\x3C/span>\x3Cspan style=\"color:#D73A49\">     DWORD\x3C/span>\x3Cspan style=\"color:#24292E\"> PTR \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">rsi\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">0x44008000\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        ret\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>由于 undefined behaviour 广泛而常见，甚至在一些地方是难以绕开的（例如操作系统，Linux 的编译包含了 \x3Ccode>-fno-strict-aliasing\x3C/code> 规则），有人认为\x3Csup>\x3Ca href=\"#user-content-fn-https://x.com/effectfully/status/1874144090327228518\" id=\"user-content-fnref-https://x.com/effectfully/status/1874144090327228518\" data-footnote-ref aria-describedby=\"footnote-label\">4\x3C/a>\x3C/sup> GCC 等编译器 \"using undefined behaviour in the C Standard as an excuse to fuck up their own compiler is what's beyond demented\" （拿 C 标准中的未定义行为作为借口来搞砸自己的编译器，简直是疯子干得出来的事情）\x3C/p>\n\x3Cp>然而我实际上不那么认为。难听点说，这是非常不负责任的行为。如果你不在乎性能而喜欢非常确定的行为可以用 Python 不是吗？为什么要用 C/C++ 为难自己？如果你在乎性能，就应该知道你在这里觉得无所谓的 5~10% 差异是别人可能刚需的。编译器作者不是只为你服务。这是一个多方权衡的 trade-off。\x3C/p>\n\x3Cp>实际上，我认为这种想法这是倒果为因了，应该说：是写编译器的人需要有足够强的假定来给他们进行优化，因此才将一些行为定义成 undefined behaviour.\x3C/p>\n\x3Cblockquote>\n\x3Cp>Defining a semantics with that property is not a simple task. A naive semantics, such as the one used in \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmsub>\x3Cmi>λ\x3C/mi>\x3Cmtext>Rust\x3C/mtext>\x3C/msub>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\lambda_{\\text{Rust}}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.8444em;vertical-align:-0.15em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\">λ\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t vlist-t2\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.3283em;\">\x3Cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mtight\">\x3Cspan class=\"mord text mtight\">\x3Cspan class=\"mord mtight\">Rust\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"vlist-s\">​\x3C/span>\x3C/span>\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.15em;\">\x3Cspan>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>, will give the example program\x3Csup>\x3Ca href=\"#user-content-fn-example\" id=\"user-content-fnref-example\" data-footnote-ref aria-describedby=\"footnote-label\">5\x3C/a>\x3C/sup> a defined meaning and thus force the compiler to print 13. Compared to such a naive semantics, we have to “add” some undefined behavior to obtain the desired optimizations. But of course we should not add “too much” undefined behavior! We have to be careful that “desired” programs are still well-defined. This includes all safe programs, but should also include enough unsafe programs to still make unsafe Rust a useful language for implementing data structures such as Vec, and to minimize the chances of programmers accidentally running into undefined behavior. \x3Csup>\x3Ca href=\"#user-content-fn-rustbelt\" id=\"user-content-fnref-rustbelt\" data-footnote-ref aria-describedby=\"footnote-label\">6\x3C/a>\x3C/sup>\x3C/p>\n\x3C/blockquote>\n\x3Ch2 id=\"unsafe-is-really-unsafe\">\x3Ca href=\"#unsafe-is-really-unsafe\">\x3Ccode>unsafe\x3C/code> is really unsafe\x3C/a>\x3C/h2>\n\x3Cp>\x3Cstrong>而你必须负起责任来。\x3C/strong>\x3C/p>\n\x3Cp>Rust 与 C/C++ 的一个区别大概是后者有人惯着你。我敢说大部分以为自己会写 C/C++ 语言的人实际上都不懂得 C/C++ 语言的 undefined behavior —— 因此使用各种屎上糊屎的手段解决问题。例如极端地，禁止开优化。\x3C/p>\n\x3Cp>但是 Rust 不会让你这样。一大原因是，Rust debug 模式的产物确实太慢，与 Release 模式可以轻易到达 6 倍差距，人们不得不开优化。另一件事情来自 Rust 的设计哲学：Safe Rust 被期望是永远安全的，即使是初学者也不会写出段错误和未定义行为，如果尝试，那么编译器一定会警告。Safe Rust 的编写者从而能从底层的细节中解脱出来，专注关心业务逻辑，有时候则关心向编译器证明自己是对的。而一旦 Unsafe Rust 的编写者不够负责，信任链条就会在这里断裂，从而可能产生危险的漏洞。\x3C/p>\n\x3Cp>以 \x3Ca href=\"https://zhuanlan.zhihu.com/p/532496013\">Unsafe Rust 随堂小测 - 知乎\x3C/a> 中给出的代码为例子，Unsafe Rust 的编写者必须非常熟练于找出代码可能被传入的多种边缘情况，否则，一不留神，便可能写出看似正确的 unsound 代码。\x3C/p>\n\x3Cp>\x3Cstrong>例如第 1 题，初始化上的未定义行为。\x3C/strong>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">/// !!!unsound!!!\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> bytes_of\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;\x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#6F42C1\">u8\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#24292E\"> len\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> usize\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> core\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">mem\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">size_of\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    let\x3C/span>\x3Cspan style=\"color:#24292E\"> data\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> *const\x3C/span>\x3Cspan style=\"color:#6F42C1\"> u8\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">*const\x3C/span>\x3Cspan style=\"color:#005CC5\"> T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">cast\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    unsafe\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6F42C1\">core\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">slice\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">from_raw_parts\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">data, len\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>编写者必须得想到多种情况：\x3C/p>\n\x3Cul>\n\x3Cli>\x3Ccode>T\x3C/code> 可能是 \x3Ccode>MaybeUninit\x3C/code>，此时得到的 \x3Ccode>&#x26;[u8]\x3C/code> 包含未初始化的内存，而读取未初始化内存是未定义行为\x3C/li>\n\x3Cli>\x3Ccode>T\x3C/code> 可能包含对用户无感知的 padding，但是任何对 padding 的访问，包括读，都是未定义行为\x3C/li>\n\x3Cli>\x3Ccode>T\x3C/code> 可能是包含内部可变性的类型（例如 \x3Ccode>Cell\x3C/code>），此时对 \x3Ccode>&#x26;T\x3C/code> 的访问不能保证指向的内存不变\x3C/li>\n\x3C/ul>\n\x3Cp>\x3Cstrong>第 6 题。对齐上的未定义行为。\x3C/strong>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">/// !!!unsound!!!\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> ffi_static_mut\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;\x3C/span>\x3Cspan style=\"color:#24292E\">'\x3C/span>\x3Cspan style=\"color:#6F42C1\">static\x3C/span>\x3Cspan style=\"color:#D73A49\"> mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    unsafe\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> size\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> usize\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> std\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">mem\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">size_of\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> *mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> libc\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">malloc\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">size\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">cast\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        if\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">is_null\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#5a32a3\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">            std\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">process\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">abort\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">        \x3C/span>\x3Cspan style=\"color:#5a32a3\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">        ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">write\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        &#x26;mut\x3C/span>\x3Cspan style=\"color:#D73A49\"> *\x3C/span>\x3Cspan style=\"color:#24292E\">ptr\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>显然这就是非常经典的在 unsafe rust 中当成 C 写——例如使用 malloc 函数。但是你们有没有想过，为什么 malloc 分配的指针犹如魔法一样，可以给任何类型使用，无需担心什么问题？尤其是对于初学者而言，它们甚至可能没有质疑过，为什么 malloc 可以给所有类型指针使用这件事情。malloc 能给所有类型使用似乎是理所当然的事情。\x3C/p>\n\x3Cp>——然而不是。这个函数体现了 Rust 和 C 不一样的地方，C 保证了所有类型都是由对齐已知的内置类型组合而来，因此 malloc 的规范里保证了得到的指针总是与任意 object type 都能对齐\x3Csup>\x3Ca href=\"#user-content-fn-returns%20a%20pointer%20that%20is%20suitably%20aligned%20for%20any%20object%20type%20with%20fundamental%20alignment.%20https://en.cppreference.com/w/c/memory/malloc\" id=\"user-content-fnref-returns%20a%20pointer%20that%20is%20suitably%20aligned%20for%20any%20object%20type%20with%20fundamental%20alignment.%20https://en.cppreference.com/w/c/memory/malloc\" data-footnote-ref aria-describedby=\"footnote-label\">7\x3C/a>\x3C/sup>。不能对齐有很多危害，例如现代 CPU 经常在 SIMD 指令上要求地址必须对齐。\x3C/p>\n\x3Cp>但是 Rust 没有这个保证。Rust 的类型可能包含更复杂的 align，如果传入的 \x3Ccode>T\x3C/code> 需要更大的对齐，那么 \x3Ccode>malloc\x3C/code> 返回的指针可能无法满足 \x3Ccode>T\x3C/code> 的对齐要求。此时，返回的指针不能被安全的使用，这是未定义行为。\x3C/p>\n\x3Cp>\x3Cstrong>第 7 题，恐慌安全\x3C/strong>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">/// !!!unsound!!!\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> replace_with\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">v\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#24292E\">, f\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> impl\x3C/span>\x3Cspan style=\"color:#6F42C1\"> FnOnce\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    unsafe\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> *mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> v;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">        let\x3C/span>\x3Cspan style=\"color:#24292E\"> val \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">read\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">        ptr\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">write\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">f\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">val\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>编写者必须考虑到 \x3Ccode>f\x3C/code> 可能会 panic 的情况。此时，\x3Ccode>ptr.write\x3C/code> 将会被打断，因此不会对 \x3Ccode>v\x3C/code> 写入正确的值——而 panic 后被从 \x3Ccode>v\x3C/code> 里面 move 出来的 \x3Ccode>val\x3C/code> 将会被析构，因此外部的 \x3Ccode>v\x3C/code> 还保留着 \x3Ccode>val\x3C/code> 的同一个值，这将会导致双重析构，从而导致未定义行为。这通常会导致程序直接 segfault。\x3C/p>\n\x3Cp>这些例子都表明，编写 Unsafe Rust 代码的责任在于开发者，这不止是说说而已。开发者必须充分理解 Rust 的内存模型、计算机底层原理、体系结构、Rust 的各种不变式和内置 trait，以确保代码在任何时候都能保证安全性和正确性——或者产生一个编译错误。\x3C/p>\n\x3Cp>这种心智负担比全是 unsafe，全部要开发者自己承担的 C/C++ 某种意义上还要大。C/C++ 写出 bug 大可以怪调用者没遵守调用约定，但是 unsafe rust 的编写者因为自己的 unsafe 模块考虑不周全出了 bug，所有人都只会怪 unsafe 模块的编写者。\x3C/p>\n\x3Ch2 id=\"结语\">\x3Ca href=\"#结语\">结语\x3C/a>\x3C/h2>\n\x3Cp>经常有人说：对 C++ 和 Rust 极度了解，懂得该怎么驾驭 unsafe，适当的使用 unsafe 可以极大提高数据结构设计的灵活性\x3C/p>\n\x3Cp>那么问题是，谁才是对 C++ 和 Rust 极度了解呢？到底有多少人能做到“极度了解”呢？如果你是一个 C/C++ 程序员，你可能会觉得自己已经很了解了，但是你真的了解吗？大部分写 C/C++ 的人应该都远远称不上了解。尚且不说需要系统学习计算机底层的各种 alignment padding 需要编译原理来理解为什么的 aliasing 还有被誉为只有语言律师才能记得的各种 undefined behavior。就单说代码习惯，大多数人都能习惯性给每一个只要现在不变的类型写成 \x3Ccode>const T &#x26;\x3C/code> 甚至加上 \x3Ccode>__restrict\x3C/code> 吗？能在保证没有 exception 的时候习惯性加上 \x3Ccode>noexcept\x3C/code> 吗？\n这些都可能直接影响到性能，例如移动构造函数不加 \x3Ccode>noexcept\x3C/code>，各种 STL 容器直接给你改成调用拷贝构造，影响性能。\x3C/p>\n\x3Cp>写这一篇文章大概就是为了感叹这样的问题。“在 unsafe 里就像 C 那样写就好”。然而 \x3Ccode>unsafe\x3C/code> 并不是拿来给你在 Rust 的约束中找到一丝自由的 —— 它是允许经验丰富的人，在镣铐中跳舞，在遵守 Rust 的大量假设和不变式的同时，编写类型系统无法表达的那一部分——而你必须熟悉的是这一整套类型系统构筑起的约定、优化和安全边界。这是 Rust 的设计哲学。程序员不可信任，能在熟练掌握 unsafe 的终究是少数人。\x3C/p>\n\x3Cp>如果你没准备好去承担它们，那你也许根本不该碰 unsafe。\x3C/p>\n\x3Csection data-footnotes class=\"footnotes\">\x3Ch2 class=\"sr-only\" id=\"footnote-label\">\x3Ca href=\"#footnote-label\">Footnotes\x3C/a>\x3C/h2>\n\x3Col>\n\x3Cli id=\"user-content-fn-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85\">\n\x3Cp>由于这里不需要特别区分，下文的 C 语言或者 C++ 语言可能说的是这两者 \x3Ca href=\"#user-content-fnref-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85\" data-footnote-backref=\"\" aria-label=\"Back to reference 1\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3Cli id=\"user-content-fn-c-is-not-a-low-level-language\">\n\x3Cp>David Chisnall. 2018. C Is Not a Low-level Language: Your computer is not a fast PDP-11. Queue 16, 2 (March-April 2018), 18–30. \x3Ca href=\"https://doi.org/10.1145/3212477.3212479\">https://doi.org/10.1145/3212477.3212479\x3C/a> \x3Ca href=\"#user-content-fnref-c-is-not-a-low-level-language\" data-footnote-backref=\"\" aria-label=\"Back to reference 2\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3Cli id=\"user-content-fn-https://en.cppreference.com/w/c/language/object.html#strict_aliasing\">\n\x3Cp>\x3Ca href=\"https://en.cppreference.com/w/c/language/object.html#Strict_aliasing\">https://en.cppreference.com/w/c/language/object.html#Strict_aliasing\x3C/a> \x3Ca href=\"#user-content-fnref-https://en.cppreference.com/w/c/language/object.html#strict_aliasing\" data-footnote-backref=\"\" aria-label=\"Back to reference 3\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3Cli id=\"user-content-fn-https://x.com/effectfully/status/1874144090327228518\">\n\x3Cp>\x3Ca href=\"https://x.com/effectfully/status/1874144090327228518\">https://x.com/effectfully/status/1874144090327228518\x3C/a> \x3Ca href=\"#user-content-fnref-https://x.com/effectfully/status/1874144090327228518\" data-footnote-backref=\"\" aria-label=\"Back to reference 4\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3Cli id=\"user-content-fn-example\">\n\x3Cp>该论文中的 example 即本文开头的代码，但是数字有不同\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> example\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#24292E\">, y\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;mut\x3C/span>\x3Cspan style=\"color:#6F42C1\"> i32\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan sty 4%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85" id="user-content-fnref-%E7%94%B1%E4%BA%8E%E8%BF%99%E9%87%8C%E4%B8%8D%E9%9C%80%E8%A6%81%E7%89%B9%E5%88%AB%E5%8C%BA%E5%88%86%EF%BC%8C%E4%B8%8B%E6%96%87%E7%9A%84%20c%20%E8%AF%AD%E8%A8%80%E6%88%96%E8%80%85%20c++%20%E8%AF%AD%E8%A8%80%E5%8F%AF%E8%83%BD%E8%AF%B4%E7%9A%84%E6%98%AF%E8%BF%99%E4%B8%A4%E8%80%85" data-footnote-ref aria-describedby="footnote-label">1</a></sup> 语言那样写。然而事实并不是这样，C 语言的约束太差，事实上给了程序员太多“宽松”的东西。而在 Rust 里，unsafe 真的很 unsafe —— 当你要接管编译器为你做的安全保证，危险就暗藏在其中。</p>

<h2 id="aliasing-xor-mutability"><a href="#aliasing-xor-mutability">Aliasing XOR mutability</a></h2>
<p>与 C/C++ 非常不同的是，Rust 要求了 Aliasing XOR mutability. 考虑这样一个函数：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> alias_example</span><span style="color:#005cc5">(</span><span style="color:#24292E">x</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#6F42C1"> i32</span><span style="color:#24292E">, y</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#6F42C1"> i32</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> i32</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">x </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">y </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 514</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#D73A49"> *</span><span style="color:#24292E">x;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>对于 C 语言新手程序员而言，这个函数看上去似乎等价于：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">int</span><span style="color:#6F42C1"> alias_example</span><span style="color:#005cc5">(</span><span style="color:#D73A49">int</span><span style="color:#D73A49"> *</span><span style="color:#E36209">x</span><span style="color:#24292E">, </span><span style="color:#D73A49">int</span><span style="color:#D73A49"> *</span><span style="color:#E36209">y</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">x </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">y </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 514</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#D73A49"> *</span><span style="color:#24292E">x;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>真的是这样吗？想想看，假如 <code>x</code> 和 <code>y</code> 实际上是指向同一个内存区域的不同名指针怎么办？一个 C 程序员可以很自然的回答： <code>x</code> 被先赋值为 <code>114</code>，然后又被赋值为 <code>514</code>，最后函数整体返回 <code>514</code>。</p>
<p>然而并非如此。实际上，Rust 使用了严格的 aliasing 规则，根据 Rust 的规则，同一个变量永远不能有两个可变引用。这直接导致编译器的优化产生不同的结果。如果没有内联，编译器可以安全的假设，<code>x</code> 和 <code>y</code> 永远指向不同的内存地址。因此，在第 2 行赋值之后，编译器可以知道 <code>*x</code> 一定是 114, 从而直接返回 114.</p>
<p>但如果我们在 <code>unsafe</code> 块中直接违背这个规则呢？这会导致 <em>Undefined Behavior</em>（未定义行为）。<strong>在 Rust 中，<code>unsafe</code> 块只是允许你绕过编译器的安全检查，但这并不意味着你可以违背 Rust 的 <em>Invariant</em>（不变式）假设</strong>。例如，Rust 的 <code>unsafe</code> 代码仍然需要遵循 Rust 的 aliasing 规则。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">#</span><span style="color:#005cc5">[</span><span style="color:#24292E">inline</span><span style="color:#e36209">(</span><span style="color:#24292E">never</span><span style="color:#e36209">)</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> alias_example</span><span style="color:#005cc5">(</span><span style="color:#24292E">x</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#6F42C1"> i32</span><span style="color:#24292E">, y</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#6F42C1"> i32</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> i32</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>

<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">y </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 514</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#D73A49"> *</span><span style="color:#24292E">x;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> fn</span><span style="color:#6F42C1"> main</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#D73A49"> mut</span><span style="color:#24292E"> a </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 42</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#D73A49"> mut</span><span style="color:#24292E"> b </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 84</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> ret </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> alias_example</span><span style="color:#e36209">(</span><span style="color:#D73A49">&#x26;mut</span><span style="color:#24292E"> a, </span><span style="color:#D73A49">&#x26;mut</span><span style="color:#24292E"> b</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">    println!</span><span style="color:#e36209">(</span><span style="color:#032F62">"a: {a}, b: {b}, ret: {ret}"</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">    unsafe</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">        let</span><span style="color:#D73A49"> mut</span><span style="color:#24292E"> x </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">        let</span><span style="color:#24292E"> still_x </span><span style="color:#D73A49">=</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#24292E"> x </span><span style="color:#D73A49">as</span><span style="color:#D73A49"> *mut</span><span style="color:#6F42C1"> i32</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6A737D">        // undefined behavior!</span></span>
<span class="line"><span style="color:#D73A49">        let</span><span style="color:#24292E"> ret </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> alias_example</span><span style="color:#5a32a3">(</span><span style="color:#D73A49">&#x26;mut</span><span style="color:#24292E"> x, </span><span style="color:#D73A49">&#x26;mut</span><span style="color:#D73A49"> *</span><span style="color:#24292E">still_x</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">        println!</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"x: {x}, ret: {ret}"</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>在这个例子中，我们在 <code>unsafe</code> 块中创建了一个指向 <code>x</code> 的裸指针 <code>still_x</code>，然后将其作为第二个参数传递给 <code>alias_example</code> 函数。显然这违背了 aliasing 规则，因此产生一个 undefined behavior。严格来说，该程序编译运行的结果是不确定的。但是在 rustc 1.88.0 开启 <code>-O</code> （3 级优化）后，我们可以看到输出如下：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>a: 114, b: 514, ret: 114</span></span>
<span class="line"><span>x: 514, ret: 114</span></span></code></pre>
<div class="text-center"><small>
<p>Compiler Explorer 链接： <a href="https://godbolt.org/z/Y6s15h9eP">https://godbolt.org/z/Y6s15h9eP</a></p>
<p></small></div></p>
<p>正如我们所料，编译器对 <code>alias_example</code> 函数进行了优化，虽然 <code>*x</code> 在函数中被第二次赋值为 514，但编译器接下来根本没有用到 <code>*x</code> 的值，而是直接返回了 114。生成的汇编代码如下：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">example:</span><span style="color:#24292E">:</span><span style="color:#6F42C1">alias_example:</span><span style="color:#24292E">:</span><span style="color:#6F42C1">h26925842407e8957:</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     dword</span><span style="color:#24292E"> ptr </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rdi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">114</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     dword</span><span style="color:#24292E"> ptr </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rsi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">514</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#005CC5">     eax</span><span style="color:#24292E">, </span><span style="color:#005CC5">114</span></span>
<span class="line"><span style="color:#D73A49">        ret</span></span></code></pre>
<p>而如果去掉 <code>-O</code> 优化选项，编译器就不会进行这样的优化了。将会正确的返回 514。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">example:</span><span style="color:#24292E">:</span><span style="color:#6F42C1">alias_example:</span><span style="color:#24292E">:</span><span style="color:#6F42C1">h26925842407e8957:</span></span>

<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     qword</span><span style="color:#24292E"> ptr </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rsp</span><span style="color:#24292E"> - </span><span style="color:#005CC5">8</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">rsi</span></span>
