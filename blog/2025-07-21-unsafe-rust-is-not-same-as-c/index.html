<p>这说明，如果你的代码中包含 <code>unsafe</code> 块，不同的优化级别下，可能会导致不同的行为。事实上，之前的代码实际上等价于使用了 <a href="https://en.cppreference.com/w/c/language/restrict.html"><code>restrict</code> 关键字</a> 的 C 代码：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">int</span><span style="color:#6F42C1"> alias_example</span><span style="color:#005cc5">(</span><span style="color:#D73A49">int*</span><span style="color:#D73A49"> restrict</span><span style="color:#E36209"> x</span><span style="color:#24292E">, </span><span style="color:#D73A49">int*</span><span style="color:#D73A49"> restrict</span><span style="color:#E36209"> y</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">x </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">y </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 514</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#D73A49"> *</span><span style="color:#24292E">x;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>在 <code>-O3</code> 编译选项下，生成如下的汇编：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">alias_example:</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rdi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">114</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#005CC5">     eax</span><span style="color:#24292E">, </span><span style="color:#005CC5">114</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rsi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">514</span></span>
<span class="line"><span style="color:#D73A49">        ret</span></span></code></pre>
<p>与 Rust 的行为一致。如果去掉 <code>restrict</code> 关键字，g++ 编译器（和任何一个成熟的编译器）都将默认 <code>x</code> 和 <code>y</code> 是可能 aliasing 的，因此不敢进行激进优化，只能按原样生成汇编代码：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">alias_example:</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rdi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">114</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rsi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">514</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#005CC5">     eax</span><span style="color:#24292E">, </span><span style="color:#D73A49">DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rdi</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#D73A49">        ret</span></span></code></pre>
<p>如果这个函数被大量执行，将会影响到性能。这不是一句玩笑。老练的 C 程序员都应该知道自从 C99 开始 <code>memcpy</code> 函数的类型签名就包含 <code>restrict</code> 关键字：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">void*</span><span style="color:#6F42C1"> memcpy</span><span style="color:#005cc5">(</span><span style="color:#24292E"> </span><span style="color:#D73A49">void</span><span style="color:#D73A49"> *restrict</span><span style="color:#E36209"> dest</span><span style="color:#24292E">, </span><span style="color:#D73A49">const</span><span style="color:#D73A49"> void</span><span style="color:#D73A49"> *restrict</span><span style="color:#E36209"> src</span><span style="color:#24292E">, </span><span style="color:#D73A49">size_t</span><span style="color:#E36209"> count</span><span style="color:#24292E"> </span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<blockquote>
<p>The behavior is undefined if access occurs beyond the end of the dest array. If the objects overlap (which is a violation of the restrict contract)(since C99), the behavior is undefined. The behavior is undefined if either dest or src is an invalid or null pointer.</p>
</blockquote>
<p>因为任何一个现代机器上，<code>memcpy</code> 都不是像 PDP-11 那样一个一个字节拷贝的，而是使用 SIMD 指令一次性拷贝多个字节。编译器需要知道 <code>dest</code> 和 <code>src</code> 不会 aliasing 才能进行这样的优化。你可以试一试用 Compiler Explorer 手动实现一个 <code>memcpy</code>，比较删掉 <code>restrict</code> 关键字后二者的影响。删掉 <code>restrict</code> 关键字后，编译器必须先比较两个指针是否相差在 <code>count</code> 直接以内（正如 <code>restrict</code> 保证），如果不是，才可以放心使用 SIMD，否则只能分情况讨论。对于 <code>memcpy</code> 这种被大量调用的函数，这一点点比较开销会导致可观察到的性能下降。</p>
<p>而你没法保证写 C 语言的都是顶尖高手程序员，懂得时时刻刻加入 <code>restrict</code> 关键字，承担一旦用错就会出现未定义行为的后果。更多新手甚至连 <code>const</code> 也懒得或者不会使用。还有一些项目，代码质量明显堪忧，undefined behaviour 满天飞（虽然这也与 C/C++ 有一些不应该有的 undefined behaviour 有关），人们甚至总结出“不要开启优化选项，编译器会搞烂你的代码”的建议。——也可以理解，一些项目开出的工资没有办法雇佣能 C 语言期盼的不会犯错程序员。</p>
<p>这也是为什么 Rust 明明比 C 语言抽象程度更高，却可能生成更高效的代码的原因。更多的约束允许编译器获得更多信息，进行更多优化。<strong>C 语言不只是不安全。它还慢。</strong> 事实上，在当今世界，C 语言反而正在拖慢代码的速度。<sup><a href="#user-content-fn-c-is-not-a-low-level-language" id="user-content-fnref-c-is-not-a-low-level-language" data-footnote-ref aria-describedby="footnote-label">2</a></sup></p>
<blockquote>
<p>C also requires padding at the end of a structure because it guarantees no padding in arrays. Padding is a particularly complex part of the C specification and interacts poorly with other parts of the language. For example, you must be able to compare two structs using a type-oblivious comparison (e.g., memcmp), so a copy of a struct must retain its padding. In some experimentation, a noticeable amount of total runtime on some workloads was found to be spent in copying padding (which is often awkwardly sized and aligned).</p>
</blockquote>
<p><strong>类型系统并不只是一个繁琐的工具，只是用来保证人们想当然“一眼就能看出的”程序的安全性。它还给编译器更多信息，从而自动生成更高效的代码</strong> ——而对于大多数程序员而言，并不会花费那么多时间在极致的性能优化上。这很反一些程序员的直觉：它们认为越贴近底层、越像汇编、抽象程度越低的语言速度越快。它们会想当然地觉得，写汇编是最最快的，而 C 语言比汇编慢 10%，C++ 比 C 又慢 10%，Rust 又比 C++ 慢 10% ——这来自于错误的“前人经验”，在编译优化还没有那么成熟的时代，作为“稍微抽象了一点的汇编”的 C 语言确实通常能写出很高效的代码，而 C++ 等语言编译器不够聪明，无法进行足够的优化。而当今世界随着编译技术的发展，编译器已经可以进行非常复杂的优化，甚至可以在大多数情况下超越手写的优化代码。例如一些人津津乐道的“位运算加速技巧”在如今已经不是魔法，而是编译器的常规优化。</p>

<summary>

</summary>
<p>在算法题中，一个完全二叉树指的是叶子结点只能出现在最下层和次下层，且最下层的叶子结点集中在树的左部的二叉树。我们可以用一个数组直接存储完全二叉树，且节点用层次遍历编号，总是有编号为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> 的节点，左子节点编号为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>i</mi></mrow><annotation encoding="application/x-tex">2i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord">2</span><span class="mord mathnormal">i</span></span></span></span>，右子节点编号为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>i</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2i + 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7429em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>。因此我们可以用 <code>x * 2</code> 和 <code>x * 2 + 1</code> 来计算左子节点和右子节点的编号。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">#include</span><span style="color:#032F62"> &#x3C;stdio.h></span></span>

<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> x </span><span style="color:#D73A49">*</span><span style="color:#005CC5"> 2</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>

<span class="line"><span style="color:#24292E">        rc1 </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> right_child</span><span style="color:#e36209">(</span><span style="color:#24292E">x</span><span style="color:#e36209">)</span><span style="color:#24292E">,</span></span>

<p>在信息学竞赛中，许多人会写 <code>x &#x3C;&#x3C; 1 | 1</code> 来加速完全二叉树叶子节点 index 的计算。然而现在这种技巧已经不再是魔法了。编译器会自动将 <code>x * 2 + 1</code> 优化为 <code>x &#x3C;&#x3C; 1 | 1</code>，你的技巧只不过是让自己读代码变得更困难，实际上对于两个函数，编译器完全会生成一模一样的代码：</p>

<p>但编译器优化也同时为 Rust 的 <code>unsafe</code> 块带来了更高风险。因为在 <code>unsafe</code> 块中，编译器不只是不再为你提供安全的保证，它还需要你将 Rust 的所有不变式熟记于心。这是人们随意说出“<code>unsafe</code> 块里像 C 语言一样写就好了”的时候所经常忽略的。</p>
<h2 id="编译器优化与-undefined-behavior"><a href="#编译器优化与-undefined-behavior">编译器优化与 Undefined Behavior</a></h2>
<p>在 C 中一个经常被争论的点是编译器是否应该利用 undefined behavior 来进行激进的优化。C/C++ 语言的标准允许编译器在遇到 undefined behavior 时进行任意行为（比如发射核弹炸毁你的家 :P ），包括假定 undefined behaviour <strong>永远不会发生</strong>。（如果发生了，编译器作者假定程序员将会很乐意看到意外的行为）实际上 GCC 等编译器确实会在高的优化等级下，利用这一点进行优化。一个经典的例子是 signed integer overflow。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">int</span><span style="color:#6F42C1"> foo</span><span style="color:#005cc5">(</span><span style="color:#D73A49">int</span><span style="color:#E36209"> x</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> x </span><span style="color:#D73A49">+</span><span style="color:#005CC5"> 1</span><span style="color:#D73A49"> </span><span style="color:#D73A49">></span><span style="color:#24292E"> x;</span><span style="color:#6A737D"> // either true or UB due to signed overflow</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>如果一字一句的翻译这段代码，在许多平台，<code>int</code> 上溢时会按补码规则处理，得到一个负数值。因此，写这段代码的人会期望这个函数能“证明”一个整数将在当前架构下溢出。C 语言的前几节课讲到原码、反码、补码的时候，一些老师会用类似的代码作为例子向学生生动阐述溢出的效果（虽然应该不会开优化）。然而，signed integer overflow 实际上是 undefined behavior，因此编译器在激进优化时可以假定它永远不会发生。此时编译器会发现 <code>x + 1</code> 的结果永远不会小于 <code>x</code>，因此可以直接将其优化为 <code>return true;</code></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">foo:</span></span>
<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#005CC5">     eax</span><span style="color:#24292E">, </span><span style="color:#005CC5">1</span></span>
<span class="line"><span style="color:#D73A49">        ret</span></span></code></pre>
<p>如果学生不小心打开了优化开关——那它可能会很惊讶的发现代码的行为和老师的例子完全不一样。</p>

<p>实际上，这个代码是 undefined behaviour。C 的 strict aliasing 规则<sup><a href="#user-content-fn-https://en.cppreference.com/w/c/language/object.html#strict_aliasing" id="user-content-fnref-https://en.cppreference.com/w/c/language/object.html#strict_aliasing" data-footnote-ref aria-describedby="footnote-label">3</a></sup>规定：</p>
<blockquote>
<p>Given an object with effective type T1, using an lvalue expression (typically, dereferencing a pointer) of a different type T2 is undefined behavior, unless:</p>
<ul>
<li>T2 and T1 are <a href="https://en.cppreference.com/w/c/language/compatible_type.html#Compatible_types">compatible types</a>.</li>
<li>T2 is cvr-qualified version of a type that is compatible with T1.</li>
<li>T2 is a signed or unsigned version of a type that is compatible with T1.</li>
<li>T2 is an aggregate type or union type type that includes one of the aforementioned types among its members (including, recursively, a member of a subaggregate or contained union).</li>
<li>T2 is a character type (char, signed char, or unsigned char).</li>
</ul>
<p>These rules control whether when compiling a function that receives two pointers, the compiler must emit code that re-reads one after writing through another:</p>
</blockquote>
<p>因此，<code>int*</code> 和 <code>float*</code> 根本不应该指向同一块内存区域。这是 undefined behaviour。对于许多程序员而言这简直是荒谬的事情，因为它极大的限制了作为底层语言的 C 语言的能力。程序员会觉得，<code>float</code> 和 <code>int</code> 都是一样的大小，为什么不能直接将一个数字的位模式转换为另一个数字的位模式？这不是 C 语言的强项吗？</p>
<p>但如果你站在编译器开发和优化者的角度，这个规则就变得非常有意义：当你看到 <code>int*</code> 和 <code>float*</code> 同时出现的时候，假定两者不会指向同一块内存区域，可以让编译器进行更激进的优化。因为如果两者指向同一块内存区域，编译器就必须在每次读取 <code>int</code> 或 <code>float</code> 时都重新从内存中读取，而不能直接使用寄存器中的值。让我们再回到最开始的 aliasing 例子。如果有以下代码：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">int</span><span style="color:#6F42C1"> alias_example2</span><span style="color:#005cc5">(</span><span style="color:#D73A49">int</span><span style="color:#D73A49"> *</span><span style="color:#E36209">x</span><span style="color:#24292E">, </span><span style="color:#D73A49">float</span><span style="color:#D73A49"> *</span><span style="color:#E36209">y</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    *</span><span style="color:#24292E">x </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114</span><span style="color:#24292E">;</span></span>

<span class="line"><span style="color:#D73A49">    return</span><span style="color:#D73A49"> *</span><span style="color:#24292E">x;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>编译器根本没法揣摩你的心意，尤其是像 C 这样的语言，你编译出来的代码还经常作为动态链接库，你根本不知道用户会传入什么。如果你不按 strict aliasing 就没法优化这段代码，说不定它会被大量调用，成为一个性能下降的节点呢？权衡之下，考虑到对同一块内存区域进行不同类型的解释是很罕见的情况，编译器更应该尝试将它优化成：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">alias_example2:</span></span>

<span class="line"><span style="color:#D73A49">        mov</span><span style="color:#D73A49">     DWORD</span><span style="color:#24292E"> PTR </span><span style="color:#005cc5">[</span><span style="color:#005CC5">rsi</span><span style="color:#005cc5">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">0x44008000</span></span>
<span class="line"><span style="color:#D73A49">        ret</span></span></code></pre>
<p>由于 undefined behaviour 广泛而常见，甚至在一些地方是难以绕开的（例如操作系统，Linux 的编译包含了 <code>-fno-strict-aliasing</code> 规则），有人认为<sup><a href="#user-content-fn-https://x.com/effectfully/status/1874144090327228518" id="user-content-fnref-https://x.com/effectfully/status/1874144090327228518" data-footnote-ref aria-describedby="footnote-label">4</a></sup> GCC 等编译器 "using undefined behaviour in the C Standard as an excuse to fuck up their own compiler is what's beyond demented" （拿 C 标准中的未定义行为作为借口来搞砸自己的编译器，简直是疯子干得出来的事情）</p>
<p>然而我实际上不那么认为。难听点说，这是非常不负责任的行为。如果你不在乎性能而喜欢非常确定的行为可以用 Python 不是吗？为什么要用 C/C++ 为难自己？如果你在乎性能，就应该知道你在这里觉得无所谓的 5~10% 差异是别人可能刚需的。编译器作者不是只为你服务。这是一个多方权衡的 trade-off。</p>
<p>实际上，我认为这种想法这是倒果为因了，应该说：是写编译器的人需要有足够强的假定来给他们进行优化，因此才将一些行为定义成 undefined behaviour.</p>
<blockquote>

<h2 id="unsafe-is-really-unsafe"><a href="#unsafe-is-really-unsafe"><code>unsafe</code> is really unsafe</a></h2>
<p><strong>而你必须负起责任来。</strong></p>
<p>Rust 与 C/C++ 的一个区别大概是后者有人惯着你。我敢说大部分以为自己会写 C/C++ 语言的人实际上都不懂得 C/C++ 语言的 undefined behavior —— 因此使用各种屎上糊屎的手段解决问题。例如极端地，禁止开优化。</p>
<p>但是 Rust 不会让你这样。一大原因是，Rust debug 模式的产物确实太慢，与 Release 模式可以轻易到达 6 倍差距，人们不得不开优化。另一件事情来自 Rust 的设计哲学：Safe Rust 被期望是永远安全的，即使是初学者也不会写出段错误和未定义行为，如果尝试，那么编译器一定会警告。Safe Rust 的编写者从而能从底层的细节中解脱出来，专注关心业务逻辑，有时候则关心向编译器证明自己是对的。而一旦 Unsafe Rust 的编写者不够负责，信任链条就会在这里断裂，从而可能产生危险的漏洞。</p>
<p>以 <a href="https://zhuanlan.zhihu.com/p/532496013">Unsafe Rust 随堂小测 - 知乎</a> 中给出的代码为例子，Unsafe Rust 的编写者必须非常熟练于找出代码可能被传入的多种边缘情况，否则，一不留神，便可能写出看似正确的 unsound 代码。</p>
<p><strong>例如第 1 题，初始化上的未定义行为。</strong></p>

<p>编写者必须得想到多种情况：</p>

<li><code>T</code> 可能是 <code>MaybeUninit</code>，此时得到的 <code>&#x26;[u8]</code> 包含未初始化的内存，而读取未初始化内存是未定义行为</li>

<p><strong>第 6 题。对齐上的未定义行为。</strong></p>

<p>显然这就是非常经典的在 unsafe rust 中当成 C 写——例如使用 malloc 函数。但是你们有没有想过，为什么 malloc 分配的指针犹如魔法一样，可以给任何类型使用，无需担心什么问题？尤其是对于初学者而言，它们甚至可能没有质疑过，为什么 malloc 可以给所有类型指针使用这件事情。malloc 能给所有类型使用似乎是理所当然的事情。</p>
<p>——然而不是。这个函数体现了 Rust 和 C 不一样的地方，C 保证了所有类型都是由对齐已知的内置类型组合而来，因此 malloc 的规范里保证了得到的指针总是与任意 object type 都能对齐<sup><a href="#user-content-fn-returns%20a%20pointer%20that%20is%20suitably%20aligned%20for%20any%20object%20type%20with%20fundamental%20alignment.%20https://en.cppreference.com/w/c/memory/malloc" id="user-content-fnref-returns%20a%20pointer%20that%20is%20suitably%20aligned%20for%20any%20object%20type%20with%20fundamental%20alignment.%20https://en.cppreference.com/w/c/memory/malloc" data-footnote-ref aria-describedby="footnote-label">7</a></sup>。不能对齐有很多危害，例如现代 CPU 经常在 SIMD 指令上要求地址必须对齐。</p>
<p>但是 Rust 没有这个保证。Rust 的类型可能包含更复杂的 align，如果传入的 <code>T</code> 需要更大的对齐，那么 <code>malloc</code> 返回的指针可能无法满足 <code>T</code> 的对齐要求。此时，返回的指针不能被安全的使用，这是未定义行为。</p>
<p><strong>第 7 题，恐慌安全</strong></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6A737D">/// !!!unsound!!!</span></span>
<span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> fn</span><span style="color:#6F42C1"> replace_with</span><span style="color:#24292E">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:#24292E">></span><span style="color:#005cc5">(</span><span style="color:#24292E">v</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> &#x26;mut</span><span style="color:#6F42C1"> T</span><span style="color:#24292E">, f</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> impl</span><span style="color:#6F42C1"> FnOnce</span><span style="color:#e36209">(</span><span style="color:#6F42C1">T</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> T</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">    unsafe</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">        let</span><span style="color:#24292E"> ptr</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> *mut</span><span style="color:#6F42C1"> T</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> v;</span></span>
<span class="line"><span style="color:#D73A49">        let</span><span style="color:#24292E"> val </span><span style="color:#D73A49">=</span><span style="color:#24292E"> ptr</span><span style="color:#D73A49">.</span><span style="color:#6F42C1">read</span><span style="color:#5a32a3">(</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">        ptr</span><span style="color:#D73A49">.</span><span style="color:#6F42C1">write</span><span style="color:#5a32a3">(</span><span style="color:#6F42C1">f</span><span style="color:#005cc5">(</span><span style="color:#24292E">val</span><span style="color:#005cc5">)</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>编写者必须考虑到 <code>f</code> 可能会 panic 的情况。此时，<code>ptr.write</code> 将会被打断，因此不会对 <code>v</code> 写入正确的值——而 panic 后被从 <code>v</code> 里面 move 出来的 <code>val</code> 将会被析构，因此外部的 <code>v</code> 还保留着 <code>val</code> 的同一个值，这将会导致双重析构，从而导致未定义行为。这通常会导致程序直接 segfault。</p>
<p>这些例子都表明，编写 Unsafe Rust 代码的责任在于开发者，这不止是说说而已。开发者必须充分理解 Rust 的内存模型、计算机底层原理、体系结构、Rust 的各种不变式和内置 trait，以确保代码在任何时候都能保证安全性和正确性——或者产生一个编译错误。</p>
<p>这种心智负担比全是 unsafe，全部要开发者自己承担的 C/C++ 某种意义上还要大。C/C++ 写出 bug 大可以怪调用者没遵守调用约定，但是 unsafe rust 的编写者因为自己的 unsafe 模块考虑不周全出了 bug，所有人都只会怪 unsafe 模块的编写者。</p>
<h2 id="结语"><a href="#结语">结语</a></h2>
<p>经常有人说：对 C++ 和 Rust 极度了解，懂得该怎么驾驭 unsafe，适当的使用 unsafe 可以极大提高数据结构设计的灵活性</p>
<p>那么问题是，谁才是对 C++ 和 Rust 极度了解呢？到底有多少人能做到“极度了解”呢？如果你是一个 C/C++ 程序员，你可能会觉得自己已经很了解了，但是你真的了解吗？大部分写 C/C++ 的人应该都远远称不上了解。尚且不说需要系统学习计算机底层的各种 alignment padding 需要编译原理来理解为什么的 aliasing 还有被誉为只有语言律师才能记得的各种 undefined behavior。就单说代码习惯，大多数人都能习惯性给每一个只要现在不变的类型写成 <code>const T &#x26;</code> 甚至加上 <code>__restrict</code> 吗？能在保证没有 exception 的时候习惯性加上 <code>noexcept</code> 吗？
这些都可能直接影响到性能，例如移动构造函数不加 <code>noexcept</code>，各种 STL 容器直接给你改成调用拷贝构造，影响性能。</p>
<p>写这一篇文章大概就是为了感叹这样的问题。“在 unsafe 里就像 C 那样写就好”。然而 <code>unsafe</code> 并不是拿来给你在 Rust 的约束中找到一丝自由的 —— 它是允许经验丰富的人，在镣铐中跳舞，在遵守 Rust 的大量假设和不变式的同时，编写类型系统无法表达的那一部分——而你必须熟悉的是这一整套类型系统构筑起的约定、优化和安全边界。这是 Rust 的设计哲学。程序员不可信任，能在熟练掌握 unsafe 的终究是少数人。</p>
<p>如果你没准备好去承担它们，那你也许根本不该碰 unsafe。</p>
