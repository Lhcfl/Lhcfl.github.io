s\">Chapter 11 Product Types\x3C/a>\x3C/h2>\n\x3Cp>可以参照 C++ 的 sturct 类型\x3C/p>\n\x3Cp>定义 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmsub>\x3Cmi>τ\x3C/mi>\x3Cmn>1\x3C/mn>\x3C/msub>\x3Cmo>×\x3C/mo>\x3Cmsub>\x3Cmi>τ\x3C/mi>\x3Cmn>2\x3C/mn>\x3C/msub>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\tau_1 \\times \\tau_2\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7333em;vertical-align:-0.15em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t vlist-t2\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.3011em;\">\x3Cspan style=\"top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mtight\">1\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"vlist-s\">​\x3C/span>\x3C/span>\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.15em;\">\x3Cspan>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">×\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.5806em;vertical-align:-0.15em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t vlist-t2\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.3011em;\">\x3Cspan style=\"top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mtight\">2\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"vlist-s\">​\x3C/span>\x3C/span>\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.15em;\">\x3Cspan>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span> 为两个类型的 product，这个新类型包含两个类型。\x3Ccode>e = &#x3C;e_1, e_2>\x3C/code> 可以用 \x3Ccode>e.l\x3C/code> \x3Ccode>e.r\x3C/code> 取出 \x3Ccode>e\x3C/code> 的 left 和 right projection\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/nullary_and_binary_products.png\" alt=\"\">\x3C/p>\n\x3Cp>定义了 pair (binary product) 以后，一个 finite product (tuple) 也就很容易了。\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/finite_products.png\" alt=\"\">\x3C/p>\n\x3Cp>在 product 上，我们可以简化第 9 章中定义的原始递归构造，以便只有前一个结果而不是前一个本身的结果被传递给后继分支。将其写为\x3C/p>\n\x3Cp>同时在 product 上我们还能定义两个相互引用的递归函数，这是之前做不到的\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>\\tau_EO :: &#x3C;even :: nat -> nat, odd :: nat -> nat>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>fix this: \\tau_EO is &#x3C;even = e_E, odd = e_O>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>where e_E = \\lambda (x: nat) ifz x { z => s(z) | s(y) => this.odd(y) },\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>      e_O = \\lambda (x: nat) ifz x { z => z | s(y) => this.even(y) }\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch2 id=\"chapter-12-sum-types\">\x3Ca href=\"#chapter-12-sum-types\">Chapter 12 Sum Types\x3C/a>\x3C/h2>\n\x3Cp>可以类比为 Typescript 的 \x3Ccode>|\x3C/code> 类型，或者说 Rust 的 union 类型\x3C/p>\n\x3Cp>(更正：typescript 的 \x3Ccode>|\x3C/code> 类型并不是 sum type，考虑 \x3Ccode>i32 + i32\x3C/code> ，应该有 33 的信息熵，但 Ts 的 \x3Ccode>i32 | i32\x3C/code> 只有 32 )\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/NullaryAndBinarySumTypes.png\" alt=\"\">\x3C/p>\n\x3Cp>从 Sum Types 中我们很容易得到一个 bool 类型：\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/bool_from_sum_types.png\" alt=\"\">\x3C/p>\n\x3Cp>当然，从 sum types 中我们显然能得到 \x3Ccode>Option&#x3C;T>\x3C/code> 类型\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/option_from_sum_types.png\" alt=\"\">\x3C/p>\n\x3Ch2 id=\"chapter-13-pattern-matching\">\x3Ca href=\"#chapter-13-pattern-matching\">Chapter 13 Pattern Matching\x3C/a>\x3C/h2>\n\x3Cp>模式匹配是乘积和和类型的消去形式的自然而方便的推广。例如，与其写\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>let x be e in x.l + x.r\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>来将 pair 的两对加起来，有了 pattern matching 我们可以写出\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>match e { &#x3C;x_1, x_2> => x_1 + x_2 }\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>同样的，pattern matching 可以在 sum type 上，比如\x3C/p>\n\x3Cspan class=\"katex-display\">\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\x3Csemantics>\x3Cmrow>\x3Cmtext>match\x3C/mtext>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmo>&#x3C;\x3C/mo>\x3Cmi>l\x3C/mi>\x3Cmo>⋅\x3C/mo>\x3Cmo>&#x3C;\x3C/mo>\x3Cmo>>\x3C/mo>\x3Cmo separator=\"true\">,\x3C/mo>\x3Cmi>x\x3C/mi>\x3Cmo>>\x3C/mo>\x3Cmo>⇒\x3C/mo>\x3Cmi>x\x3C/mi>\x3Cmo>+\x3C/mo>\x3Cmi>x\x3C/mi>\x3Cmi mathvariant=\"normal\">∣\x3C/mi>\x3Cmo>&#x3C;\x3C/mo>\x3Cmi>r\x3C/mi>\x3Cmo>⋅\x3C/mo>\x3Cmo>&#x3C;\x3C/mo>\x3Cmo>>\x3C/mo>\x3Cmo separator=\"true\">,\x3C/mo>\x3Cmi>y\x3C/mi>\x3Cmo>>\x3C/mo>\x3Cmo>⇒\x3C/mo>\x3Cmi>y\x3C/mi>\x3Cmo>∗\x3C/mo>\x3Cmi>y\x3C/mi>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\text{match} \\{ &#x3C;l \\cdot &#x3C;>, x> \\Rightarrow x + x | &#x3C;r \\cdot &#x3C;>, y> \\Rightarrow y * y \\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord text\">\x3Cspan class=\"mord\">match\x3C/span>\x3C/span>\x3Cspan class=\"mopen\">{\x3C/span>\x3Cspan class=\"mrel\">&#x3C;\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7335em;vertical-align:-0.0391em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l\x3C/span>\x3Cspan class=\"mord\">⋅\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">&#x3C;>\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7335em;vertical-align:-0.1944em;\">\x3C/span>\x3Cspan class=\"mpunct\">,\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">>⇒\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">+\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">x\x3C/span>\x3Cspan class=\"mord\">∣\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">&#x3C;\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.5782em;vertical-align:-0.0391em;\">\x3C/span>\x3Cspan class=\"mord mathnorma <h2 id="chapter-11-product-types"><a href="#chapter-11-product-types">Chapter 11 Product Types</a></h2>
<p>可以参照 C++ 的 sturct 类型</p>
<p>定义 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>τ</mi><mn>1</mn></msub><mo>×</mo><msub><mi>τ</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\tau_1 \times \tau_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 为两个类型的 product，这个新类型包含两个类型。<code>e = &#x3C;e_1, e_2></code> 可以用 <code>e.l</code> <code>e.r</code> 取出 <code>e</code> 的 left 和 right projection</p>
<p><img src="/images/nullary_and_binary_products.png" alt=""></p>
<p>定义了 pair (binary product) 以后，一个 finite product (tuple) 也就很容易了。</p>
<p><img src="/images/finite_products.png" alt=""></p>
<p>在 product 上，我们可以简化第 9 章中定义的原始递归构造，以便只有前一个结果而不是前一个本身的结果被传递给后继分支。将其写为</p>
<p>同时在 product 上我们还能定义两个相互引用的递归函数，这是之前做不到的</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>\tau_EO :: &#x3C;even :: nat -> nat, odd :: nat -> nat></span></span>
<span class="line"><span></span></span>
<span class="line"><span>fix this: \tau_EO is &#x3C;even = e_E, odd = e_O></span></span>
<span class="line"><span></span></span>
<span class="line"><span>where e_E = \lambda (x: nat) ifz x { z => s(z) | s(y) => this.odd(y) },</span></span>
<span class="line"><span>      e_O = \lambda (x: nat) ifz x { z => z | s(y) => this.even(y) }</span></span></code></pre>
<h2 id="chapter-12-sum-types"><a href="#chapter-12-sum-types">Chapter 12 Sum Types</a></h2>
<p>可以类比为 Typescript 的 <code>|</code> 类型，或者说 Rust 的 union 类型</p>
<p>(更正：typescript 的 <code>|</code> 类型并不是 sum type，考虑 <code>i32 + i32</code> ，应该有 33 的信息熵，但 Ts 的 <code>i32 | i32</code> 只有 32 )</p>
<p><img src="/images/NullaryAndBinarySumTypes.png" alt=""></p>
<p>从 Sum Types 中我们很容易得到一个 bool 类型：</p>
<p><img src="/images/bool_from_sum_types.png" alt=""></p>
<p>当然，从 sum types 中我们显然能得到 <code>Option&#x3C;T></code> 类型</p>
<p><img src="/images/option_from_sum_types.png" alt=""></p>
<h2 id="chapter-13-pattern-matching"><a href="#chapter-13-pattern-matching">Chapter 13 Pattern Matching</a></h2>
<p>模式匹配是乘积和和类型的消去形式的自然而方便的推广。例如，与其写</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>let x be e in x.l + x.r</span></span></code></pre>
<p>来将 pair 的两对加起来，有了 pattern matching 我们可以写出</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>match e { &#x3C;x_1, x_2> => x_1 + x_2 }</span></span></code></pre>
<p>同样的，pattern matching 可以在 sum type 上，比如</p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>match</mtext><mo stretchy="false">{</mo><mo>&#x3C;</mo><mi>l</mi><mo>⋅</mo><mo>&#x3C;</mo><mo>></mo><mo separator="true">,</mo><mi>x</mi><mo>></mo><mo>⇒</mo><mi>x</mi><mo>+</mo><mi>x</mi><mi mathvariant="normal">∣</mi><mo>&#x3C;</mo><mi>r</mi><mo>⋅</mo><mo>&#x3C;</mo><mo>></mo><mo separator="true">,</mo><mi>y</mi><mo>></mo><mo>⇒</mo><mi>y</mi><mo>∗</mo><mi>y</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\text{match} \{ &#x3C;l \cdot &#x3C;>, x> \Rightarrow x + x | &#x3C;r \cdot &#x3C;>, y> \Rightarrow y * y \}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">match</span></span><span class="mopen">{</span><span class="mrel">&#x3C;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord">⋅</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&#x3C;></span></span><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">>⇒</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">x</span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&#x3C;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mord">⋅</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&#x3C;></span></span><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">>⇒</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6597em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">∗</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mclose">}</span></span></span></span></span>
