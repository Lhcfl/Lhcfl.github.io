象一个数据类型\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">pub\x3C/span>\x3Cspan style=\"color:#D73A49\"> struct\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Repository\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">    /// .git dir for the repository\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    pub\x3C/span>\x3Cspan style=\"color:#24292E\"> root\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> PathBuf\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这很好。然后你发现，我们需要带着这个 \x3Ccode>Repository\x3C/code> 的引用（指针）到处跑，所有需要从磁盘中读取和保存的场景我们全都需要 \x3Ccode>Repository\x3C/code> 提供的 \x3Ccode>root\x3C/code> 路径。一个不太熟练（ \x3Cdel>不太被腌入味了\x3C/del> ）的人可能会写出\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">impl\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Object\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    fn\x3C/span>\x3Cspan style=\"color:#6F42C1\"> save\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">self\x3C/span>\x3Cspan style=\"color:#24292E\">, repo\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Repository\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> io\x3C/span>\x3Cspan \x3Cp>\x3Ccode>WithRepo\x3C/code> 是一个 \x3Ca href=\"https://www.adit.io/posts/2013-04-17-functors,_applicatives,_and_monads_in_pictures.html\">Functor\x3C/a>，它有一个 map 方法，在 Haskell 里是 \x3Ccode>fmap\x3C/code> ，用来把一个 \x3Ccode>a -> b\x3C/code> 的函数 apply 到 \x3Ccode>WithRepo&#x3C;a>\x3C/code> 上得到一个 \x3Ccode>WithRepo&#x3C;b>\x3C/code>\x3C/p>\n\x3Cp>现在好多了，我们可以直接在 \x3Ccode>WithRepo&#x3C;Object>\x3C/code> 之类的东西上做文章，\x3Ccode>Repository\x3C/code> 的指针在被创建的时候被包了进去作为\x3Cstrong>依赖\x3C/strong>。我们可以写出这样优雅的代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">let\x3C/span>\x3Cspan style=\"color:#24292E\"> repo \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Repository\x3C/span>\x3Cspan style=\"color:#D73A49\">::\x3C/span>\x3Cspan style=\"color:#6F42C1\">load\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">?\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// stage: WithRepo&#x3C;'_, MutableTree>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">let\x3C/span>\x3Cspan style=\"color:#D73A49\"> mut\x3C/span>\x3Cspan style=\"color:#24292E\"> stage \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> repo\x3C/span>\x3Cspan style=\"color:#D73A49\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">stage\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">?.\x3C/span>\x3Cspan style=\"color:#6F42C1\">into_muter\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"lin /span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>问题所在是什么呢？它很难测试。当然你可以直接 \x3Ccode>fs::tmp_dir()\x3C/code> 直接在系统里创一个临时文件夹，然后灌一些临时文件进去，但是这当然不够优雅。更何况，\x3Cstrong>副作用\x3C/strong> 不止有 文件 IO 一种。还有控制台 IO。如果你要测试 \x3Ccode>git commit\x3C/code> 这个命令，希望它产生一个正确的屏幕输出，怎么做到？只能将 \x3Ccode>println!\x3C/code> 又换成自己的宏，也做参数传进去，为了保持完美的可测试性和可组合性，久而久之你的函数可能会变成这样：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">impl\x3C/span>\x3Cspan style=\"color:#6F42C1\"> GitAdd\x3C/span>\x3Cspan style=\"color:#D73A49\"> for\x3C/span>\x3Cspan style=\"color:#6F42C1\"> WithRepo\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">WithFs\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">WithConsole\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">WithService1\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">WithService2\x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">.....\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3Cspan style=\"color:#24292E\">>\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这完全就是地狱……于是人们发明了 DI ： 依赖注入\x3C/p>\n\x3Cp>\x3Cdel>但我们这里不是讲依赖注入，所以请看代数效应\x3C/del>\x3C/p>\n\x3Ch2 id=\"effectside-effect\">\x3Ca href=\"#effectside-effect\">Effect，Side Effect\x3C/a>\x3C/h2>\n\x3Cp>要讲 Algebraic Effect 让我们先讲讲 Haskell 的 IO Monad。写过 Haskell 的人都知道，Haskell 里面的 putStrLn 是\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">putStrLn\x3C/span>\x3Cspan style=\"color:#D73A49\"> ::\x3C/span>\x3Cspan style=\"color:#D73A49\"> String\x3C/span>\x3Cspan style=\"color:#D73A49\"> -\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> IO\x3C/span>\x3Cspan style=\"color:#005CC5\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>你会注意到一个看上去很像 Rust 的 \x3Ccode>io::Result\x3C/code> 的 Monad，也就是 \x3Ccode>IO\x3C/code>。但 Haskell 与 Rust 不一样的一个地方是，IO Monad 并不是“保存”了执行结果，而是“说明”了执行顺序。在 Rust 中，如果你写一个 \x3Ccode>fs::write(...)\x3C/code> 得到了一个 \x3Ccode>io::Result&#x3C;T>\x3C/code>，这个副作用真的已经被执行了，返回的只是成功与否；而 Haskell 中返回的是这个副作用本身。它可能在未来的某一个被某个 \x3Ccode>IO a -> a\x3C/code> 的东西执行，这时候才真正执行了副作用；但在此之前它只是一个顺序。\x3C/p>\n\x3Cp>对于一个完全没有什么函数式经验的人来说这句话可能很难理解。让我们引用一下 \x3Ca href=\"https://zhuanlan.zhihu.com/p/1892390136857228808\">https://zhuanlan.zhihu.com/p/1892390136857228808\x3C/a> \x3Ca href=\"https://entropicthoughts.com/haskell-procedural-programming\">Haskell：优秀的过程式语言\x3C/a>\x3C/p>\n\x3Cblockquote>\n\x3Cp>\x3Cstrong>副作用作为一等公民 (first class values)\x3C/strong>\x3C/p>\n\x3Cp>在 Haskell 中，有副作用的计算被当作一等值。这意味着我们可以将它们存储在变量或数据结构中以备后用。有一个 Haskell 函数：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">randomRIO\x3C/span>\x3Cspan style=\"color:#D73A49\"> ::\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">Int\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#D73A49\">Int\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#D73A49\"> IO\x3C/span>\x3Cspan style=\"color:#D73A49\"> Int\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>当传入两个整数作为参数时，它会在这两个数之间随机选出一个整数。我们可以将对这个函数的调用放入一个列表中，像这样：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">some_dice \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\"> randomRIO\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">6\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, randomRIO\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">6\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这是一个包含两次对 \x3Ccode>randomRIO\x3C/code> 调用的列表。令非 Haskell 程序员感到惊讶的是，当这个列表被创建时，并不会生成任何随机数。来自其他编程语言的我们习惯于副作用（如随机生成）在调用带有副作用的函数时立即执行。[6]\x3C/p>\n\x3Cp>我们可以在列表中加入更多的随机生成操作：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">more_dice \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> some_dice \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#24292E\"> randomRIO\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">6\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>依然不会生成随机数。我们可以任意操作这个列表，依旧不会生成随机数。\x3C/p>\n\x3Cp>需要明确的是，\x3Ccode>randomRIO\x3C/code> 函数确实可能会被调用[7]。而当它被调用时，它返回的值类型是 \x3Ccode>IO Int\x3C/code>。只不过这个值并不是一个整数。如果要说的话，我们可以把它看作是一组最终能获得整数的指令。它并非实际的整数，而是一个封装了副作用的对象。当这个副作用对象执行时，会产生一个随机整数，但这个对象本身仅仅描述了计算过程，并不是一个整数。\x3C/p>\n\x3Cp>换句话说，在 Haskell 中，仅仅调用一个带有副作用的函数是不足以执行其副作用的。当我们调用一个带副作用的函数时，它产生了一个封装了副作用的对象，这个对象可以在未来某个时刻被执行，从而产生副作用的结果[8]。\x3C/p>\n\x3C/blockquote>\n\x3Cp>如果它难以理解，不妨想象一下你在写一个前端项目。—— 是的，\x3Ccode>Promise\x3C/code> 也（几乎）是一个 Monad。关于 Monad 是什么，可以看看我的 \x3Ca href=\"/blog/2025-03-27-learn-monads\">这篇文章\x3C/a>\x3C/p>\n\x3Cp>Promise 和 IO 的共同点是，它们都封装了一个\x3Cstrong>执行顺序\x3C/strong>。有经验的前端开发者一眼就看得出来\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">fetch\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"https://example.com/example-api\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  .\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> res.\x3C/span>\x3Cspan style=\"color:#6F42C1\">json\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  .\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    balabala\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    dosomething\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">    return\x3C/span>\x3Cspan style=\"color:#6F42C1\"> fetch\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">foo\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  .\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">    bar\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  \x3C/span>\x3Cspan style=\"color:#e36209\">}\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>Promise 提供了一套很好的接口，允许我们顺序地写出一些先后发生的事情，而无需关心回调的细节。在这里，所有的 \x3Ccode>.then\x3C/code> 函数都不是马上执行的：它们只有在前一个 Promise fulfilled 的时候才会被自动地回调。因此，你可能会看到这样的代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> runDecorateResult\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">promise\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#24292E\"> promise.\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> foo\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> bar\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> decorated\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#D73A49\"> await\x3C/span>\x3Cspan style=\"color:#6F42C1\"> runDecorateResult\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">  sendSomeApi\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#6F42C1\">then\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#E36209\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> baz\x3C/span>\x3Cspan style=\"color:#5a32a3\">(\x3C/span>\x3Cspan style=\"color:#24292E\">res\x3C/span>\x3Cspan style=\"color:#5a32a3\">)\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这里，\x3Ccode>sendSomeApi().then((res) => baz(res))\x3C/code> 创建了一个\x3Cstrong>顺序\x3C/strong>，先 \x3Ccode>sendSomeApi\x3C/code>，再基于结果 \x3Ccode>baz\x3C/code>。然后 \x3Ccode>runDecorateResult\x3C/code> 又进一步的\x3Cstrong>在顺序上\x3C/strong>而非结果上添加了新的顺序，先 \x3Ccode>foo\x3C/code> 再 \x3Ccode>bar\x3C/code>。这些与值无关，JS 引擎和 Promise 内部跑的循环将会\x3Cstrong>执行这个顺序\x3C/strong>。\x3C/p>\n\x3Cp>或者我们这样说：\x3Cstrong>\x3Ccode>then\x3C/code> 允许我们把顺序组合起来，交给某个特定的无关的执行者。\x3C/strong>\x3C/p>\n\x3Ch2 id=\"algebraic-effect\">\x3Ca href=\"#algebraic-effect\">Algebraic Effect\x3C/a>\x3C/h2>\n\x3Cp>理解了 Monad 如何组合副作用之后，我们就可以理解 Algebraic Effect 了。\x3C/p>\n\x3Cp>代数效应的核心思想是：\x3Cstrong>我们可以把副作用进行传递和组合\x3C/strong>。让我们考察几种最常见的效应：\x3C/p>\n\x3Cul>\n\x3Cli>\x3Ccode>total\x3C/code>: 没有任何效应对应数学意义上的全函数，总是能给定相同输入返回一个相同输出。\x3C/li>\n\x3Cli>\x3Ccode>exception\x3C/code>: （后面在 Koka 中叫 \x3Ccode>exn\x3C/code>） 可能抛出异常\x3C/li>\n\x3Cli>\x3Ccode>div\x3C/code>: 可能不停机，也就是发散 （divergence）\x3C/li>\n\x3Cli>\x3Ccode>ndet\x3C/code>: 非决定性的函数，比如 \x3Ccode>random\x3C/code>，对于相同输入可能返回多个不同的值\x3C/li>\n\x3Cli>\x3Ccode>io\x3C/code>: 这是最差的效应，这意味着程序可以引发异常、不终止、非确定性、读取和写入堆以及执行任何输入/输出作用。\x3C/li>\n\x3C/ul>\n\x3Cp>\x3Ccode>exn\x3C/code> 和 \x3Ccode>div\x3C/code> 的组合是 pure，直接对应于 Haskell 的纯度概念。一个函数可能具有多个效应。比如如下 Koka 代码：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// combine-effects: forall&#x3C;a> () -> &#x3C;pure,ndet> a\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> combine\x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#6F42C1\">effects\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  val\x3C/span>\x3Cspan style=\"color:#24292E\"> i \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> srandom\x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#6A737D\">// non-deterministic\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  throw\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"oops\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">         \x3C/span>\x3Cspan style=\"color:#6A737D\">// exception raising\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  combine\x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#6F42C1\">effects\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">     \x3C/span>\x3Cspan style=\"color:#6A737D\">// and non-terminating\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>分配给 \x3Ccode>combine-effects\x3C/code> 的效应是 \x3Ccode>ndet\x3C/code>、\x3Ccode>div\x3C/code> 和 \x3Ccode>exn\x3C/code>。\x3C/p>\n\x3Cp>algebraic effects 的做法是，我们把副作用抽象为 \x3Cstrong>操作符（operations）\x3C/strong> 和 \x3Cstrong>处理器（handlers）\x3C/strong> 两部分。以最经典的一种 effect 也就是异常为例：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">effect raise\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  ctl \x3C/span>\x3Cspan style=\"color:#6F42C1\">raise\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> msg : \x3C/span>\x3Cspan style=\"color:#6F42C1\">string\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">a\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这定义了一个 effect 类型 raise 和一个 \x3Ccode>(msg : string) -> raise a\x3C/code> 类型的 operation \x3Ccode>raise\x3C/code>。声明 effect 的签名后，我们已经可以使用这些 operations 了：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> safe\x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#6F42C1\">divide\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\"> x : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#24292E\">, y : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">raise\x3C/span>\x3Cspan style=\"color:#6F42C1\"> int\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  if\x3C/span>\x3Cspan style=\"color:#E36209\"> y=\x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3Cspan style=\"color:#24292E\"> then \x3C/span>\x3Cspan style=\"color:#6F42C1\">raise\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"div-by-zero\"\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">else\x3C/span>\x3Cspan style=\"color:#24292E\"> x \x3C/span>\x3Cspan style=\"color:#D73A49\">/\x3C/span>\x3Cspan style=\"color:#24292E\"> y\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>其中我们看到 safe-divide 函数获得了 raise 效应（因为我们在函数体内使用了 raise 操作符）。这样的效应类型意味着我们只能在处理 raise 的上下文中 evaluate 这个函数（换句话说，它是 “动态绑定”的，或者我们 “具有 raise 能力”） 的上下文。\x3C/p>\n\x3Cp>我们可以通过为 raise 给出具体定义来处理这种效果。例如，我们可能总是返回一个默认值：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> raise\x3C/span>\x3Cspan style=\"color:#D73A49\">-const\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  with handler\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">    ctl \x3C/span>\x3Cspan style=\"color:#6F42C1\">raise\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">msg\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005CC5\">42\x3C/span>\x3Cspan style=\"color:#6A737D\"> // 哦，宇宙的终极答案是 42\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005CC5\">  8\x3C/span>\x3Cspan style=\"color:#D73A49\"> +\x3C/span>\x3Cspan style=\"color:#24292E\"> safe\x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#6F42C1\">divide\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">,\x3C/span>\x3Cspan style=\"color:#005CC5\">0\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// 返回 42 而不是 50\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>调用 \x3Ccode>raise-const()\x3C/code> 的计算结果为 42，不是 50。当调用 \x3Ccode>raise\x3C/code> 时（在 \x3Ccode>safe-divide\x3C/code> 中），它将 \x3Ccode>yield\x3C/code> 于其最内层的 handler，展开堆栈，然后才 evaluate 操作符的定义 – 这个例子中，只是从定义 handler 的点直接返回 42。现在我们可以看到为什么它被称为 \x3Ccode>ctl operator\x3C/code> （控制操作符），因为 raise 改变了常规的线性控制流，并从原始调用点直接 yield 到其最内层的处理程序。还要注意 \x3Ccode>raise-const\x3C/code> 现在又是一个 \x3Ccode>total\x3C/code> function 了，handler 抵消了 raise 的效果。\x3C/p>\n\x3Cp>看到 effect 的写法后，我觉得你应该大体就能理解代数效应解决了什么了。\x3C/p>\n\x3Cblockquote>\n\x3Cp>作者：Malcolm Yu\n链接：\x3Ca href=\"https://www.zhihu.com/question/300095154/answer/1744221759\">https://www.zhihu.com/question/300095154/answer/1744221759\x3C/a>\n来源：知乎\x3C/p>\n\x3Cp>假如我们有这样一段代码，其主要目的是进行一大段精妙的运算：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">async\x3C/span>\x3Cspan style=\"color:#D73A49\"> function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> biz\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">id\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> infoId\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> id; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> info\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#D73A49\"> await\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getInfo\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">infoId\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，与 server 通信\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> dataId\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> info.dataId; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> data\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getData\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">dataId\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，非幂等操作\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> data.finalCalcData; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>尽管运算逻辑很优美，但美中不足的是有两段副作用，导致它不能成为一个干净的纯函数被单元测试。而且这里会导致严重的逻辑耦合：『做什么』与『怎么做』没有拆的很干净：\x3C/p>\n\x3Cul>\n\x3Cli>你的一大段计算逻辑是在处理「做什么」；\x3C/li>\n\x3Cli>两个副作用更关心「怎么做」：比如线上是接口调用，单测里是 mock 数据直接怼；\x3C/li>\n\x3Cli>但是由于这两块副作用代码，导致整个糅杂的逻辑都无法复用。\x3C/li>\n\x3C/ul>\n\x3Cp>看到这里你可能会一拍大腿：函数在 JS 里不是一等公民嘛，我直接把两个副作用传进来不就行了？\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">async\x3C/span>\x3Cspan style=\"color:#D73A49\"> function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> biz\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">id\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#E36209\">getInfo\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#E36209\">getData\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> infoId\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> id; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> info\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#D73A49\"> await\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getInfo\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">infoId\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，与 server 通信\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> dataId\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> info.dataId; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  const\x3C/span>\x3Cspan style=\"color:#005CC5\"> data\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getData\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">dataId\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，非幂等操作\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> data.finalCalcData; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>是的，这样确实可以复用，但还有一个叫函数染色的问题没有解决：明明是一大段干净的同步运算逻辑，因为 \x3Ccode>getInfo\x3C/code> 是异步的，导致整个函数都得加个 \x3Ccode>async\x3C/code>。而且很有可能在我单元测试里，这个 \x3Ccode>getInfo\x3C/code> 是直接同步取内存数据，还得因此弄个 \x3Ccode>Promise\x3C/code>……\x3C/p>\n\x3C/blockquote>\n\x3Cp>没错，代数效应就能非常简单的解决这个问题。比如这个 biz，我们把它在 Koka 中写成\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">effect useInfoData\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getInfo\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">id : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">info\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getData\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">id : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">data\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>然后我们就可以在 \x3Ccode>biz\x3C/code> 里面使用 \x3Ccode>getInfo\x3C/code> 和 \x3Ccode>getData\x3C/code> 了：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">fun\x3C/span>\x3Cspan style=\"color:#6F42C1\"> biz\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">id : \x3C/span>\x3Cspan style=\"color:#6F42C1\">int\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : \x3C/span>\x3Cspan style=\"color:#6F42C1\">useInfoData\x3C/span>\x3Cspan style=\"color:#6F42C1\"> data\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  val\x3C/span>\x3Cspan style=\"color:#24292E\"> infoId \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> id; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  val\x3C/span>\x3Cspan style=\"color:#24292E\"> info \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getInfo\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">infoId\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，与 server 通信\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  val\x3C/span>\x3Cspan style=\"color:#24292E\"> dataId \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#6A737D\"> /* do some calc */\x3C/span>\x3Cspan style=\"color:#24292E\"> info.dataId; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  val\x3C/span>\x3Cspan style=\"color:#D73A49\"> data\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> getData\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">dataId\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// 副作用，非幂等操作\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">  /* do some calc */\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  data\x3C/span>\x3Cspan style=\"color:#24292E\">.finalCalcData \x3C/span>\x3Cspan style=\"color:#6A737D\">// 这里可以理解为是一大段计算逻辑\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>你说 getInfo 是 \x3Ccode>async\x3C/code> 的，那咋了？在代数效应里，这种函数染色可以直接被削去：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\ <h2 id="引入"><a href="#引入">引入</a></h2>
<p>本学期的 Rust 课程项目大作业是写一个 git。总而言之，Git 有一个对象存储系统，允许将 <code>Tree</code> 和 <code>Blob</code> 和 <code>Commit</code> 作为三种不同的 <code>Object</code> 存储在 <code>.git/objects/[object hash]</code> 这个文件中。</p>
<p>作为一个浸淫于实践需求中的人，你很容易看出来，git 项目的几乎所有东西都依赖实现计算好的 <code>.git</code> 文件夹的位置，所以我们可以抽象一个数据类型</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">pub</span><span style="color:#D73A49"> struct</span><span style="color:#6F42C1"> Repository</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#6A737D">    /// .git dir for the repository</span></span>
<span class="line"><span style="color:#D73A49">    pub</span><span style="color:#24292E"> root</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> PathBuf</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>这很好。然后你发现，我们需要带着这个 <code>Repository</code> 的引用（指针）到处跑，所有需要从磁盘中读取和保存的场景我们全都需要 <code>Repository</code> 提供的 <code>root</code> 路径。一个不太熟练（ <del>不太被腌入味了</del> ）的人可能会写出</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">impl</span><span style="color:#6F42C1"> Object</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>

<h2 id="effectside-effect"><a href="#effectside-effect">Effect，Side Effect</a></h2>
<p>要讲 Algebraic Effect 让我们先讲讲 Haskell 的 IO Monad。写过 Haskell 的人都知道，Haskell 里面的 putStrLn 是</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">putStrLn</span><span style="color:#D73A49"> ::</span><span style="color:#D73A49"> String</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#D73A49"> IO</span><span style="color:#005CC5"> </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span></code></pre>
<p>你会注意到一个看上去很像 Rust 的 <code>io::Result</code> 的 Monad，也就是 <code>IO</code>。但 Haskell 与 Rust 不一样的一个地方是，IO Monad 并不是“保存”了执行结果，而是“说明”了执行顺序。在 Rust 中，如果你写一个 <code>fs::write(...)</code> 得到了一个 <code>io::Result&#x3C;T></code>，这个副作用真的已经被执行了，返回的只是成功与否；而 Haskell 中返回的是这个副作用本身。它可能在未来的某一个被某个 <code>IO a -> a</code> 的东西执行，这时候才真正执行了副作用；但在此之前它只是一个顺序。</p>
<p>对于一个完全没有什么函数式经验的人来说这句话可能很难理解。让我们引用一下 <a href="https://zhuanlan.zhihu.com/p/1892390136857228808">https://zhuanlan.zhihu.com/p/1892390136857228808</a> <a href="https://entropicthoughts.com/haskell-procedural-programming">Haskell：优秀的过程式语言</a></p>
<blockquote>
<p><strong>副作用作为一等公民 (first class values)</strong></p>
<p>在 Haskell 中，有副作用的计算被当作一等值。这意味着我们可以将它们存储在变量或数据结构中以备后用。有一个 Haskell 函数：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">randomRIO</span><span style="color:#D73A49"> ::</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">Int</span><span style="color:#24292E">, </span><span style="color:#D73A49">Int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#D73A49"> IO</span><span style="color:#D73A49"> Int</span></span></code></pre>
<p>当传入两个整数作为参数时，它会在这两个数之间随机选出一个整数。我们可以将对这个函数的调用放入一个列表中，像这样：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">some_dice </span><span style="color:#D73A49">=</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#24292E"> randomRIO</span><span style="color:#e36209">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">6</span><span style="color:#e36209">)</span><span style="color:#24292E">, randomRIO</span><span style="color:#e36209">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">6</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">]</span></span></code></pre>
<p>这是一个包含两次对 <code>randomRIO</code> 调用的列表。令非 Haskell 程序员感到惊讶的是，当这个列表被创建时，并不会生成任何随机数。来自其他编程语言的我们习惯于副作用（如随机生成）在调用带有副作用的函数时立即执行。[6]</p>
<p>我们可以在列表中加入更多的随机生成操作：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">more_dice </span><span style="color:#D73A49">=</span><span style="color:#24292E"> some_dice </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#24292E"> randomRIO</span><span style="color:#e36209">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">6</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">]</span></span></code></pre>
<p>依然不会生成随机数。我们可以任意操作这个列表，依旧不会生成随机数。</p>
<p>需要明确的是，<code>randomRIO</code> 函数确实可能会被调用[7]。而当它被调用时，它返回的值类型是 <code>IO Int</code>。只不过这个值并不是一个整数。如果要说的话，我们可以把它看作是一组最终能获得整数的指令。它并非实际的整数，而是一个封装了副作用的对象。当这个副作用对象执行时，会产生一个随机整数，但这个对象本身仅仅描述了计算过程，并不是一个整数。</p>
<p>换句话说，在 Haskell 中，仅仅调用一个带有副作用的函数是不足以执行其副作用的。当我们调用一个带副作用的函数时，它产生了一个封装了副作用的对象，这个对象可以在未来某个时刻被执行，从而产生副作用的结果[8]。</p>
</blockquote>
<p>如果它难以理解，不妨想象一下你在写一个前端项目。—— 是的，<code>Promise</code> 也（几乎）是一个 Monad。关于 Monad 是什么，可以看看我的 <a href="/blog/2025-03-27-learn-monads">这篇文章</a></p>
<p>Promise 和 IO 的共同点是，它们都封装了一个<strong>执行顺序</strong>。有经验的前端开发者一眼就看得出来</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">fetch</span><span style="color:#005cc5">(</span><span style="color:#032F62">"https://example.com/example-api"</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">res</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> res.</span><span style="color:#6F42C1">json</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">res</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#6F42C1">    balabala</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">    dosomething</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#6F42C1"> fetch</span><span style="color:#5a32a3">(</span><span style="color:#6F42C1">foo</span><span style="color:#005cc5">(</span><span style="color:#24292E">res</span><span style="color:#005cc5">)</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  .</span><span style="color:#6F42C1">then</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">res</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#6F42C1">    bar</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>Promise 提供了一套很好的接口，允许我们顺序地写出一些先后发生的事情，而无需关心回调的细节。在这里，所有的 <code>.then</code> 函数都不是马上执行的：它们只有在前一个 Promise fulfilled 的时候才会被自动地回调。因此，你可能会看到这样的代码：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> runDecorateResult</span><span style="color:#005cc5">(</span><span style="color:#E36209">promise</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> promise.</span><span style="color:#6F42C1">then</span><span style="color:#e36209">(</span><span style="color:#5a32a3">(</span><span style="color:#E36209">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> foo</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">.</span><span style="color:#6F42C1">then</span><span style="color:#e36209">(</span><span style="color:#5a32a3">(</span><span style="color:#E36209">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> bar</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> decorated</span><span style="color:#D73A49"> =</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> runDecorateResult</span><span style="color:#005cc5">(</span></span>
<span class="line"><span style="color:#6F42C1">  sendSomeApi</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">.</span><span style="color:#6F42C1">then</span><span style="color:#e36209">(</span><span style="color:#5a32a3">(</span><span style="color:#E36209">res</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> baz</span><span style="color:#5a32a3">(</span><span style="color:#24292E">res</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>这里，<code>sendSomeApi().then((res) => baz(res))</code> 创建了一个<strong>顺序</strong>，先 <code>sendSomeApi</code>，再基于结果 <code>baz</code>。然后 <code>runDecorateResult</code> 又进一步的<strong>在顺序上</strong>而非结果上添加了新的顺序，先 <code>foo</code> 再 <code>bar</code>。这些与值无关，JS 引擎和 Promise 内部跑的循环将会<strong>执行这个顺序</strong>。</p>
<p>或者我们这样说：<strong><code>then</code> 允许我们把顺序组合起来，交给某个特定的无关的执行者。</strong></p>
<h2 id="algebraic-effect"><a href="#algebraic-effect">Algebraic Effect</a></h2>
<p>理解了 Monad 如何组合副作用之后，我们就可以理解 Algebraic Effect 了。</p>
<p>代数效应的核心思想是：<strong>我们可以把副作用进行传递和组合</strong>。让我们考察几种最常见的效应：</p>
<ul>
<li><code>total</code>: 没有任何效应对应数学意义上的全函数，总是能给定相同输入返回一个相同输出。</li>
<li><code>exception</code>: （后面在 Koka 中叫 <code>exn</code>） 可能抛出异常</li>
<li><code>div</code>: 可能不停机，也就是发散 （divergence）</li>
<li><code>ndet</code>: 非决定性的函数，比如 <code>random</code>，对于相同输入可能返回多个不同的值</li>
<li><code>io</code>: 这是最差的效应，这意味着程序可以引发异常、不终止、非确定性、读取和写入堆以及执行任何输入/输出作用。</li>
</ul>
<p><code>exn</code> 和 <code>div</code> 的组合是 pure，直接对应于 Haskell 的纯度概念。一个函数可能具有多个效应。比如如下 Koka 代码：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6A737D">// combine-effects: forall&#x3C;a> () -> &#x3C;pure,ndet> a</span></span>
<span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> combine</span><span style="color:#D73A49">-</span><span style="color:#6F42C1">effects</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">  val</span><span style="color:#24292E"> i </span><span style="color:#D73A49">=</span><span style="color:#24292E"> srandom</span><span style="color:#D73A49">-</span><span style="color:#6F42C1">int</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#6A737D">// non-deterministic</span></span>
<span class="line"><span style="color:#D73A49">  throw</span><span style="color:#005cc5">(</span><span style="color:#032F62">"oops"</span><span style="color:#005cc5">)</span><span style="color:#24292E">         </span><span style="color:#6A737D">// exception raising</span></span>
<span class="line"><span style="color:#24292E">  combine</span><span style="color:#D73A49">-</span><span style="color:#6F42C1">effects</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E">     </span><span style="color:#6A737D">// and non-terminating</span></span></code></pre>
<p>分配给 <code>combine-effects</code> 的效应是 <code>ndet</code>、<code>div</code> 和 <code>exn</code>。</p>
<p>algebraic effects 的做法是，我们把副作用抽象为 <strong>操作符（operations）</strong> 和 <strong>处理器（handlers）</strong> 两部分。以最经典的一种 effect 也就是异常为例：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">effect raise</span></span>
<span class="line"><span style="color:#24292E">  ctl </span><span style="color:#6F42C1">raise</span><span style="color:#005cc5">(</span><span style="color:#24292E"> msg : </span><span style="color:#6F42C1">string</span><span style="color:#24292E"> </span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">a</span></span></code></pre>
<p>这定义了一个 effect 类型 raise 和一个 <code>(msg : string) -> raise a</code> 类型的 operation <code>raise</code>。声明 effect 的签名后，我们已经可以使用这些 operations 了：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> safe</span><span style="color:#D73A49">-</span><span style="color:#6F42C1">divide</span><span style="color:#005cc5">(</span><span style="color:#24292E"> x : </span><span style="color:#6F42C1">int</span><span style="color:#24292E">, y : </span><span style="color:#6F42C1">int</span><span style="color:#24292E"> </span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">raise</span><span style="color:#6F42C1"> int</span></span>
<span class="line"><span style="color:#D73A49">  if</span><span style="color:#E36209"> y=</span><span style="color:#D73A49">=</span><span style="color:#005CC5">0</span><span style="color:#24292E"> then </span><span style="color:#6F42C1">raise</span><span style="color:#005cc5">(</span><span style="color:#032F62">"div-by-zero"</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">else</span><span style="color:#24292E"> x </span><span style="color:#D73A49">/</span><span style="color:#24292E"> y</span></span></code></pre>
<p>其中我们看到 safe-divide 函数获得了 raise 效应（因为我们在函数体内使用了 raise 操作符）。这样的效应类型意味着我们只能在处理 raise 的上下文中 evaluate 这个函数（换句话说，它是 “动态绑定”的，或者我们 “具有 raise 能力”） 的上下文。</p>
<p>我们可以通过为 raise 给出具体定义来处理这种效果。例如，我们可能总是返回一个默认值：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> raise</span><span style="color:#D73A49">-const</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">int</span></span>
<span class="line"><span style="color:#24292E">  with handler</span></span>
<span class="line"><span style="color:#24292E">    ctl </span><span style="color:#6F42C1">raise</span><span style="color:#005cc5">(</span><span style="color:#24292E">msg</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005CC5">42</span><span style="color:#6A737D"> // 哦，宇宙的终极答案是 42</span></span>
<span class="line"><span style="color:#005CC5">  8</span><span style="color:#D73A49"> +</span><span style="color:#24292E"> safe</span><span style="color:#D73A49">-</span><span style="color:#6F42C1">divide</span><span style="color:#005cc5">(</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">0</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// 返回 42 而不是 50</span></span></code></pre>
<p>调用 <code>raise-const()</code> 的计算结果为 42，不是 50。当调用 <code>raise</code> 时（在 <code>safe-divide</code> 中），它将 <code>yield</code> 于其最内层的 handler，展开堆栈，然后才 evaluate 操作符的定义 – 这个例子中，只是从定义 handler 的点直接返回 42。现在我们可以看到为什么它被称为 <code>ctl operator</code> （控制操作符），因为 raise 改变了常规的线性控制流，并从原始调用点直接 yield 到其最内层的处理程序。还要注意 <code>raise-const</code> 现在又是一个 <code>total</code> function 了，handler 抵消了 raise 的效果。</p>
<p>看到 effect 的写法后，我觉得你应该大体就能理解代数效应解决了什么了。</p>
<blockquote>
<p>作者：Malcolm Yu
链接：<a href="https://www.zhihu.com/question/300095154/answer/1744221759">https://www.zhihu.com/question/300095154/answer/1744221759</a>
来源：知乎</p>
<p>假如我们有这样一段代码，其主要目的是进行一大段精妙的运算：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">async</span><span style="color:#D73A49"> function</span><span style="color:#6F42C1"> biz</span><span style="color:#005cc5">(</span><span style="color:#E36209">id</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> infoId</span><span style="color:#D73A49"> =</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> id; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> info</span><span style="color:#D73A49"> =</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> getInfo</span><span style="color:#e36209">(</span><span style="color:#24292E">infoId</span><span style="color:#e36209">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，与 server 通信</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> dataId</span><span style="color:#D73A49"> =</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> info.dataId; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> data</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> getData</span><span style="color:#e36209">(</span><span style="color:#24292E">dataId</span><span style="color:#e36209">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，非幂等操作</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> data.finalCalcData; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>尽管运算逻辑很优美，但美中不足的是有两段副作用，导致它不能成为一个干净的纯函数被单元测试。而且这里会导致严重的逻辑耦合：『做什么』与『怎么做』没有拆的很干净：</p>
<ul>
<li>你的一大段计算逻辑是在处理「做什么」；</li>
<li>两个副作用更关心「怎么做」：比如线上是接口调用，单测里是 mock 数据直接怼；</li>
<li>但是由于这两块副作用代码，导致整个糅杂的逻辑都无法复用。</li>
</ul>
<p>看到这里你可能会一拍大腿：函数在 JS 里不是一等公民嘛，我直接把两个副作用传进来不就行了？</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">async</span><span style="color:#D73A49"> function</span><span style="color:#6F42C1"> biz</span><span style="color:#005cc5">(</span><span style="color:#E36209">id</span><span style="color:#24292E">, </span><span style="color:#E36209">getInfo</span><span style="color:#24292E">, </span><span style="color:#E36209">getData</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> infoId</span><span style="color:#D73A49"> =</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> id; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> info</span><span style="color:#D73A49"> =</span><span style="color:#D73A49"> await</span><span style="color:#6F42C1"> getInfo</span><span style="color:#e36209">(</span><span style="color:#24292E">infoId</span><span style="color:#e36209">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，与 server 通信</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> dataId</span><span style="color:#D73A49"> =</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> info.dataId; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> data</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> getData</span><span style="color:#e36209">(</span><span style="color:#24292E">dataId</span><span style="color:#e36209">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，非幂等操作</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> data.finalCalcData; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>是的，这样确实可以复用，但还有一个叫函数染色的问题没有解决：明明是一大段干净的同步运算逻辑，因为 <code>getInfo</code> 是异步的，导致整个函数都得加个 <code>async</code>。而且很有可能在我单元测试里，这个 <code>getInfo</code> 是直接同步取内存数据，还得因此弄个 <code>Promise</code>……</p>
</blockquote>
<p>没错，代数效应就能非常简单的解决这个问题。比如这个 biz，我们把它在 Koka 中写成</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">effect useInfoData</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#6F42C1"> getInfo</span><span style="color:#005cc5">(</span><span style="color:#24292E">id : </span><span style="color:#6F42C1">int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">info</span></span>
<span class="line"><span style="color:#D73A49">  fun</span><span style="color:#6F42C1"> getData</span><span style="color:#005cc5">(</span><span style="color:#24292E">id : </span><span style="color:#6F42C1">int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">data</span></span></code></pre>
<p>然后我们就可以在 <code>biz</code> 里面使用 <code>getInfo</code> 和 <code>getData</code> 了：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> biz</span><span style="color:#005cc5">(</span><span style="color:#24292E">id : </span><span style="color:#6F42C1">int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">useInfoData</span><span style="color:#6F42C1"> data</span></span>
<span class="line"><span style="color:#D73A49">  val</span><span style="color:#24292E"> infoId </span><span style="color:#D73A49">=</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> id; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  val</span><span style="color:#24292E"> info </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> getInfo</span><span style="color:#005cc5">(</span><span style="color:#24292E">infoId</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，与 server 通信</span></span>
<span class="line"><span style="color:#D73A49">  val</span><span style="color:#24292E"> dataId </span><span style="color:#D73A49">=</span><span style="color:#6A737D"> /* do some calc */</span><span style="color:#24292E"> info.dataId; </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span>
<span class="line"><span style="color:#D73A49">  val</span><span style="color:#D73A49"> data</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> getData</span><span style="color:#005cc5">(</span><span style="color:#24292E">dataId</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// 副作用，非幂等操作</span></span>
<span class="line"><span style="color:#6A737D">  /* do some calc */</span></span>
<span class="line"><span style="color:#D73A49">  data</span><span style="color:#24292E">.finalCalcData </span><span style="color:#6A737D">// 这里可以理解为是一大段计算逻辑</span></span></code></pre>
<p>你说 getInfo 是 <code>async</code> 的，那咋了？在代数效应里，这种函数染色可以直接被削去：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> production_run_biz</span><span style="color:#005cc5">(</span><span style="color:#24292E">id: </span><span style="color:#6F42C1">int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">data</span></span>
<span class="line"><span style="color:#24292E">  with handler</span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> getInfo</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">      some_async_task</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#6F42C1">fn</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">res</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#24292E"> </span><span style="color:#6F42C1">resume</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#24292E">res</span><span style="color:#e36209">)</span><span style="color:#24292E">; </span><span style="color:#005cc5">}</span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> getData</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">      some_sync_task</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">  biz</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> test_run_biz</span><span style="color:#005cc5">(</span><span style="color:#24292E">id: </span><span style="color:#6F42C1">int</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : </span><span style="color:#6F42C1">data</span></span>
<span class="line"><span style="color:#24292E">  with handler</span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> getInfo</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">      some_sync_test_task</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> getData</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">      some_sync_test_task</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6F42C1">  biz</span><span style="color:#005cc5">(</span><span style="color:#24292E">id</span><span style="color:#005cc5">)</span></span></code></pre>
<p>这样，我们复用了一大段精妙的逻辑 <code>biz</code>，而且没有函数染色的问题。我们可以在 <code>production_run_biz</code> 里面使用异步的 <code>getInfo</code> 和 <code>getData</code>，而在 <code>test_run_biz</code> 里面使用同步的 <code>getInfo</code> 和 <code>getData</code>。这就是代数效应的魅力所在。</p>
<p>代数效应允许我们把副作用抽象成操作符和处理器，允许我们在不改变函数签名的情况下，使用不同的副作用实现。这样，我们就可以在测试中使用不同的副作用实现，而不需要修改函数本身。</p>
<p>现在回到最初的场景：代数作用如何解决我们之前提到的 <code>WithRepo</code>, <code>fs</code>, <code>console</code> 的问题呢？</p>

<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> warn</span><span style="color:#005cc5">(</span><span style="color:#24292E">msg</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> test.console.</span><span style="color:#6F42C1">warn</span><span style="color:#005cc5">(</span><span style="color:#24292E">msg</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">    fun</span><span style="color:#6F42C1"> info</span><span style="color:#005cc5">(</span><span style="color:#24292E">msg</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#24292E"> test</span></span>
<span class="line"><span style="color:#D73A49">    ..</span><span style="color:#24292E">.</span></span>
<span class="line"><span style="color:#6F42C1">  action</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">..</span><span style="color:#24292E">.</span></span>
<span class="line"></span></code></pre>
<p>最终我们可以非常自然地组合出我们真正需要的 git_add 函数：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"></span>
<span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> some_perfect_git_add_logic</span><span style="color:#005cc5">(</span><span style="color:#24292E">files: </span><span style="color:#6F42C1">List</span><span style="color:#24292E">&#x3C;</span><span style="color:#6F42C1">string</span><span style="color:#24292E">></span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> fs</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#6F42C1">console</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#24292E">repo unit</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">  var</span><span style="color:#24292E"> stage :</span><span style="color:#D73A49">=</span><span style="color:#24292E"> repo.</span><span style="color:#6F42C1">stage</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">  ....</span></span>
<span class="line"><span style="color:#24292E">  stage.</span><span style="color:#6F42C1">save</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> git_add</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  with production</span><span style="color:#D73A49">-</span><span style="color:#24292E">fs</span></span>
<span class="line"><span style="color:#24292E">  with production</span><span style="color:#D73A49">-</span><span style="color:#24292E">console</span></span>
<span class="line"><span style="color:#24292E">  with production</span><span style="color:#D73A49">-</span><span style="color:#24292E">repo</span></span>
<span class="line"><span style="color:#6F42C1">  some_perfect_git_add_logic</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">fun</span><span style="color:#6F42C1"> test_git_add</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  with test</span><span style="color:#D73A49">-</span><span style="color:#24292E">fs</span></span>
<span class="line"><span style="color:#24292E">  with test</span><span style="color:#D73A49">-</span><span style="color:#24292E">console</span></span>
<span class="line"><span style="color:#24292E">  with test</span><span style="color:#D73A49">-</span><span style="color:#24292E">repo</span></span>
<span class="line"><span style="color:#6F42C1">  some_perfect_git_add_logic</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span></code></pre>
<p>同时方便了 production 和 test，也让 git add 的 logic 变得可以充分的复用了起来。</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">May 12, 2025</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c003100036h110><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li><li _hk=0010070c003100036h120><a class="transition-colors hover:text-ink" href="/tags/Algebraic%20Effects">#<!--$-->Algebraic Effects<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-05-07-cpp-blackmagic-memorize"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">C++ 黑魔法习题：memorize</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-05-16-pfpl-note-8"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">PFPL 笔记 - VII Subtyping</span></span></a></div></nav><!--/--><!--$--><!--/-
