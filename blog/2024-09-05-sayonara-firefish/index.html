notification_type_enum 的属主</a></li><li _hk=0010070l190 class="" style="padding-left:12px"><a href="#附录作者修订" class="text-ink-soft hover:text-accent">附录：作者修订</a></li><li _hk=0010070l1a0 class="" style="padding-left:24px"><a href="#用户数和帖子数一直显示-0" class="text-ink-soft hover:text-accent">用户数和帖子数一直显示 0</a></li></ul></nav></aside></div></div></body></html><script>($R[25]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"再见 Firefish (Firefish 迁移 Sharkey 指北)",date:"2024-09-05T22:42:23",tags:$R[11]=["Fediverse","Misskey","Code","Backend"],toc:!0,copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"再见 Firefish (Firefish 迁移 Sharkey 指北)",html:"\x3Cp>我是去年的 11 月知道的 \x3Ca href=\"https://web.archive.org/web/20240102075130/https://joinfirefish.org/\">Firefish\x3C/a>。它是我当时找到的最美丽的联邦宇宙软件，相比于死板的 \x3Ca href=\"https://joinmastodon.org/\">Mastodon\x3C/a>，过于倾向于日语又太娱乐的 \x3Ca href=\"https://misskey-hub.net/en/\">Misskey\x3C/a>，它同时兼具美观大方与功能丰富。管理员可以自由配置最大帖子长度，Nodejs 的后端也让它比 Ruby on Rails 编写的 Mastodon 对性能要求更低。我欣然安装上了它，并把它作为自己的主要联邦宇宙软件。\x3C/p>\n\x3Cp>可惜，当时我还不知道它的状态已经岌岌可危。就在当时，原有的主要贡献者大多已经离开，panos 和 namekuji 离开了这摊烂摊子开启了新项目 \x3Ca href=\"https://codeberg.org/catodon/catodon\">Catodon\x3C/a>。数个月后，Firefish 的 maintainer Kainoa 就直接撒手不管，在没有事先告知的情况下将 maintainer 更改给 naskya。naskya 非常负责且具有热爱，在伊的代理下 Firefish 回光返照了一段时间 —— 我也是那个时候尝试了为 Firefish 进行贡献。\x3C/p>\n\x3Cp>可惜 maintainer 的名头为伊带来了巨大的压力与恶心的网络骚扰者。 naskya 的身体和精神状态都无法负担这样的项目，不到一年之后，\x3Ca href=\"https://info.firefish.dev/notes/9xsukr38m3komd63\">Firefish 再次被抛弃\x3C/a>。这次，大约再也没人能救 Firefish 了。\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"goodbye-firefish\">\x3Ca href=\"#goodbye-firefish\">Goodbye Firefish\x3C/a>\x3C/h2>\n\x3Cp>我很难不把 Kainoa 的行为称为一种残忍，他将一团糟的 Firefish 项目丢给毫无准备的 naskya ，此时伊甚至还没有过什么编程经验。但 naskya 的确是一个非常负责的人。伊接手 Firefish 的时候就知道自己的身体和精神状态糟糕，但还是努力维护了 Firefish 一段时间。\x3C/p>\n\x3Cp>naskya 留给 Firefish 最后的体面。 伊维护了 Firefish 代码库中的 \x3Ca href=\"https://firefish.dev/firefish/firefish/-/blob/develop/docs/downgrade.sql?ref_type=heads\">downgrade.sql\x3C/a> （/docs/downgrade.sql），这份文件提供了 Firefish 从当前版本降级到 Firefish 1.05 rc-1 的能力，也为迁移提供了可能。没有这份文件，目前运营 Firefish 的服务器很可能都会再也无法迁移到其他版本。\x3C/p>\n\x3Cp>这篇笔记也将告诉你如何用这份文件迁移你的 Firefish 到 \x3Ca href=\"https://activitypub.software/TransFem-org/Sharkey/\">Sharkey\x3C/a>.\x3C/p>\n\x3Cp>Sharkey 是基于 Misskey 的另一个 Fork，其功能与 Firefish 相似。\x3C/p>\n\x3Cp>本笔记适用于 Firefish 1.05 （即 v20240206 ）以上。如果您的 Firefish 版本低于 1.05，可以直接按照其他软件的官方说明迁移。\x3Cdel>您完全不升级的吗？那还迁移什么呢？\x3C/del>\x3C/p>\n\x3Ch2 id=\"准备工作\">\x3Ca href=\"#准备工作\">准备工作\x3C/a>\x3C/h2>\n\x3Cp>\x3Cstrong>在接下来的操作前，请务必备份你的数据库。\x3C/strong> 迁移前请务必备份你的数据库，因为这是一个非常非常危险的操作，一旦失误会弄坏你的数据库。\x3C/p>\n\x3Cp>\x3Cstrong>请先在本地测试环境中按该笔记进行操作，再在生产环境操作。\x3C/strong> 原因同上。\x3C/p>\n\x3Cp>本教程基于 Manual 安装而非 Docker 安装，如果你使用的是 Docker 安装，关于数据库的操作很可能有区别。抱歉我无法提供这方面的帮助，请自行将下面的命令翻译为 Docker 上的数据库操作。\x3C/p>\n\x3Ch3 id=\"备份\">\x3Ca href=\"#备份\">备份\x3C/a>\x3C/h3>\n\x3Cp>\x3Cstrong>如果你要正式开始迁移工作，请务必在备份前停止 Firefish。\x3C/strong> 但如果你只是现在本地环境中进行测试，就不必了。\x3C/p>\n\x3Cp>使用 pg_dump 将你的数据库进行备份。命令大约如下：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">pg_dump\x3C/span>\x3Cspan style=\"color:#032F62\"> {your_database_name}\x3C/span>\x3Cspan style=\"color:#005CC5\"> -f\x3C/span>\x3Cspan style=\"color:#032F62\"> {backupname}.sql\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>例如，如果你的数据库名是 firefish，可以这样：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">pg_dump\x3C/span>\x3Cspan style=\"color:#032F62\"> firefish\x3C/span>\x3Cspan style=\"color:#005CC5\"> -f\x3C/span>\x3Cspan style=\"color:#032F62\"> firefish_20240906.sql\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>对于整篇笔记，我们假定您的数据库名是 \x3Ccode>firefish\x3C/code> 。数据库用户名也是 \x3Ccode>firefish\x3C/code>， 密码是 \x3Ccode>firefish_pswd\x3C/code>。请在下文自行替换对应名称。\x3C/p>\n\x3Cp>数据库的用户名和密码可以在 Firefish 目录下的 \x3Ccode>.config/default.yml\x3C/code> 找到\x3C/p>\n\x3Cp>你可以考虑在导出 sql 的时候不导出权限和用户名，这样可以方便迁移到其他用户和其他数据库名上。否则，如果你不是原地迁移。后面的迁移可能会遇到权限问题。如果遇到了这样的问题，你可以看看 \x3Ca href=\"#%E9%99%84%E5%BD%95%EF%BC%9A%E6%9D%83%E9%99%90%E9%94%99%E8%AF%AF%E4%B8%8E%E8%A7%A3%E5%86%B3%E6%96%B9%E6%B3%95\">附录：权限错误与解决方法\x3C/a> 。\x3C/p>\n\x3Cul>\n\x3Cli>\x3Ccode>--no-owner\x3C/code>：不导出对象所有者信息。\x3C/li>\n\x3Cli>\x3Ccode>--no-privileges\x3C/code> 或 \x3Ccode>--no-acl\x3C/code>：不导出对象的权限（访问控制列表）。\x3C/li>\n\x3C/ul>\n\x3Ch3 id=\"还原\">\x3Ca href=\"#还原\">还原\x3C/a>\x3C/h3>\n\x3Cp>如果您在本地测试环境，或者其他服务器中尝试接下来的步骤，您现在已经可以将您的备份文件下载到对应环境了。\x3C/p>\n\x3Cp>或者，如果您的 Firefish 还在使用 Postgres 12 甚至以下，数据库的版本已经过旧，您可以趁机升级一下数据库版本。\x3C/p>\n\x3Cp>您接下来可以使用这样的命令恢复数据库：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#032F62\"> postgres\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>进入 postgres。\x3C/p>\n\x3Cp>如果你是还原备份，此时已经存在 \x3Ccode>firefish\x3C/code> 数据库，请把它删掉：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">DROP\x3C/span>\x3Cspan style=\"color:#D73A49\"> DATABASE\x3C/span>\x3Cspan style=\"color:#24292E\"> firefish;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>此后，执行：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">CREATE\x3C/span>\x3Cspan style=\"color:#D73A49\"> DATABASE\x3C/span>\x3Cspan style=\"color:#6F42C1\"> firefish\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">exit\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>创建 firefish 数据库。\x3C/p>\n\x3Cp>现在，执行这样的命令：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> -U\x3C/span>\x3Cspan style=\"color:#032F62\"> {your_username}\x3C/span>\x3Cspan style=\"color:#005CC5\"> -d\x3C/span>\x3Cspan style=\"color:#032F62\"> {your_database}\x3C/span>\x3Cspan style=\"color:#005CC5\"> -f\x3C/span>\x3Cspan style=\"color:#032F62\"> {your_backup}.sql\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>例如，对 \x3Ccode>firefish\x3C/code> 用户还原 \x3Ccode>firefish\x3C/code> 数据库，你可以：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> -U\x3C/span>\x3Cspan style=\"color:#032F62\"> firefish\x3C/span>\x3Cspan style=\"color:#005CC5\"> -d\x3C/span>\x3Cspan style=\"color:#032F62\"> firefish\x3C/span>\x3Cspan style=\"color:#005CC5\"> -f\x3C/span>\x3Cspan style=\"color:#032F62\"> path/to/backup.sql\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch2 id=\"降级\">\x3Ca href=\"#降级\">降级\x3C/a>\x3C/h2>\n\x3Cp>该内容来自 \x3Ca href=\"https://firefish.dev/firefish/firefish/-/blob/develop/docs/downgrade.md?ref_type=heads\">Firefish 官方降级文档\x3C/a>，有使用自己经验的修改。\x3C/p>\n\x3Cp>\x3Cstrong>不要升级你现在使用的 Firefish 版本。在 firefish 软件的根目录原地进行此操作：\x3C/strong>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --file=docs/downgrade.sql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --user=your_user_name\x3C/span>\x3Cspan style=\"color:#005CC5\"> --dbname=your_database_name\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>例如，本案例中是\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --file=docs/downgrade.sql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --user=firefish\x3C/span>\x3Cspan style=\"color:#005CC5\"> --dbname=firefish\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>If you get the \x3Ccode>FATAL: Peer authentication failed\x3C/code> error, you also need to provide the \x3Ccode>--host\x3C/code> option (you will be asked the password):\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --file=docs/downgrade.sql\x3C/span>\x3Cspan style=\"color:#005CC5\"> --user=your_user_name\x3C/span>\x3Cspan style=\"color:#005CC5\"> --dbname=your_database_name\x3C/span>\x3Cspan style=\"color:#005CC5\"> --host=127.0.0.1\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>因为你是要迁移到 Sharkey，成功执行到这里后就不必按官方降级文档的继续了。到这里，你可以对 Firefish say bye-bye 了，后面不再需要用到它。\x3C/p>\n\x3Ch3 id=\"安装-sharkey-仓库\">\x3Ca href=\"#安装-sharkey-仓库\">安装 Sharkey 仓库\x3C/a>\x3C/h3>\n\x3Cp>选你中意的位置，跳过新建用户的步骤（因为你的 Firefish 已经有用户了！）安装 Sharkey 直到 initialize 数据库的步骤：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">git\x3C/span>\x3Cspan style=\"color:#032F62\"> clone\x3C/span>\x3Cspan style=\"color:#005CC5\"> --recurse-submodules\x3C/span>\x3Cspan style=\"color:#005CC5\"> -b\x3C/span>\x3Cspan style=\"color:#032F62\"> stable\x3C/span>\x3Cspan style=\"color:#032F62\"> https://activitypub.software/TransFem-org/Sharkey.git\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005CC5\">cd\x3C/span>\x3Cspan style=\"color:#032F62\"> Sharkey\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">pnpm\x3C/span>\x3Cspan style=\"color:#032F62\"> install\x3C/span>\x3Cspan style=\"color:#005CC5\"> --frozen-lockfile\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">cp\x3C/span>\x3Cspan style=\"color:#032F62\"> .config/example.yml\x3C/span>\x3Cspan style=\"color:#032F62\"> .config/default.yml\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>编辑 \x3Ccode>.config/default.yml\x3C/code> 使其与你的 Firefish 使用\x3Cstrong>相同的数据库\x3C/strong>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>vim .config/default.yml\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>Build\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">pnpm\x3C/span>\x3Cspan style=\"color:#032F62\"> run\x3C/span>\x3Cspan style=\"color:#032F62\"> build\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>接下来按照\x3Ca href=\"https://docs.joinsharkey.org/docs/install/migrate/\">迁移说明\x3C/a>进行操作，这里为了 Manual install 做了修改：\x3C/p>\n\x3Cp>psql 到你的 firefish 数据库，执行这样的 SQL:\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">-- start a transaction, so we won't leave the db in a halfway state if\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">-- things go wrong\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">BEGIN\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">-- we need to add back some columns that Firefish removed, but that\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">-- Sharkey migrations expect\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"user_profile\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"integrations\"\x3C/span>\x3Cspan style=\"color:#24292E\"> JSONB \x3C/span>\x3Cspan style=\"color:#D73A49\">NOT NULL\x3C/span>\x3Cspan style=\"color:#D73A49\"> DEFAULT\x3C/span>\x3Cspan style=\"color:#032F62\"> '{}'\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"twitterConsumerSecret\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> VARCHAR\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">128\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"twitterConsumerKey\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> VARCHAR\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">128\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"enableTwitterIntegration\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> BOOLEAN\x3C/span>\x3Cspan style=\"color:#D73A49\"> NOT NULL\x3C/span>\x3Cspan style=\"color:#D73A49\"> DEFAULT\x3C/span>\x3Cspan style=\"color:#24292E\"> false;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"enableGithubIntegration\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> BOOLEAN\x3C/span>\x3Cspan style=\"color:#D73A49\"> NOT NULL\x3C/span>\x3Cspan style=\"color:#D73A49\"> DEFAULT\x3C/span>\x3Cspan style=\"color:#24292E\"> false;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"githubClientId\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> VARCHAR\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">128\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"githubClientSecret\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> VARCHAR\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005CC5\">128\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\x3C/span>\x3Cspan style=\"color:#032F62\"> \"meta\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> ADD\x3C/span>\x3Cspan style=\"color:#032F62\"> \"enableDiscordIntegration\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> BOOLEAN\x3C/span>\x3Cspan style=\"color:#D73A49\"> NOT NULL\x3C/span>\x3Cspan style=\"color:#D73A49\"> DEFAULT\x3C/span>\x3Cspan style=\"color:#24292E\"> false;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">ALTER\x3C/span>\x3Cspan style=\"color:#D73A49\"> TABLE\ <p>可惜，当时我还不知道它的状态已经岌岌可危。就在当时，原有的主要贡献者大多已经离开，panos 和 namekuji 离开了这摊烂摊子开启了新项目 <a href="https://codeberg.org/catodon/catodon">Catodon</a>。数个月后，Firefish 的 maintainer Kainoa 就直接撒手不管，在没有事先告知的情况下将 maintainer 更改给 naskya。naskya 非常负责且具有热爱，在伊的代理下 Firefish 回光返照了一段时间 —— 我也是那个时候尝试了为 Firefish 进行贡献。</p>
<p>可惜 maintainer 的名头为伊带来了巨大的压力与恶心的网络骚扰者。 naskya 的身体和精神状态都无法负担这样的项目，不到一年之后，<a href="https://info.firefish.dev/notes/9xsukr38m3komd63">Firefish 再次被抛弃</a>。这次，大约再也没人能救 Firefish 了。</p>
<!-- more -->
<h2 id="goodbye-firefish"><a href="#goodbye-firefish">Goodbye Firefish</a></h2>
<p>我很难不把 Kainoa 的行为称为一种残忍，他将一团糟的 Firefish 项目丢给毫无准备的 naskya ，此时伊甚至还没有过什么编程经验。但 naskya 的确是一个非常负责的人。伊接手 Firefish 的时候就知道自己的身体和精神状态糟糕，但还是努力维护了 Firefish 一段时间。</p>
<p>naskya 留给 Firefish 最后的体面。 伊维护了 Firefish 代码库中的 <a href="https://firefish.dev/firefish/firefish/-/blob/develop/docs/downgrade.sql?ref_type=heads">downgrade.sql</a> （/docs/downgrade.sql），这份文件提供了 Firefish 从当前版本降级到 Firefish 1.05 rc-1 的能力，也为迁移提供了可能。没有这份文件，目前运营 Firefish 的服务器很可能都会再也无法迁移到其他版本。</p>
<p>这篇笔记也将告诉你如何用这份文件迁移你的 Firefish 到 <a href="https://activitypub.software/TransFem-org/Sharkey/">Sharkey</a>.</p>
<p>Sharkey 是基于 Misskey 的另一个 Fork，其功能与 Firefish 相似。</p>
<p>本笔记适用于 Firefish 1.05 （即 v20240206 ）以上。如果您的 Firefish 版本低于 1.05，可以直接按照其他软件的官方说明迁移。<del>您完全不升级的吗？那还迁移什么呢？</del></p>
<h2 id="准备工作"><a href="#准备工作">准备工作</a></h2>
<p><strong>在接下来的操作前，请务必备份你的数据库。</strong> 迁移前请务必备份你的数据库，因为这是一个非常非常危险的操作，一旦失误会弄坏你的数据库。</p>
<p><strong>请先在本地测试环境中按该笔记进行操作，再在生产环境操作。</strong> 原因同上。</p>
<p>本教程基于 Manual 安装而非 Docker 安装，如果你使用的是 Docker 安装，关于数据库的操作很可能有区别。抱歉我无法提供这方面的帮助，请自行将下面的命令翻译为 Docker 上的数据库操作。</p>
<h3 id="备份"><a href="#备份">备份</a></h3>
<p><strong>如果你要正式开始迁移工作，请务必在备份前停止 Firefish。</strong> 但如果你只是现在本地环境中进行测试，就不必了。</p>
<p>使用 pg_dump 将你的数据库进行备份。命令大约如下：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">pg_dump</span><span style="color:#032F62"> {your_database_name}</span><span style="color:#005CC5"> -f</span><span style="color:#032F62"> {backupname}.sql</span></span></code></pre>
<p>例如，如果你的数据库名是 firefish，可以这样：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">pg_dump</span><span style="color:#032F62"> firefish</span><span style="color:#005CC5"> -f</span><span style="color:#032F62"> firefish_20240906.sql</span></span></code></pre>
<p>对于整篇笔记，我们假定您的数据库名是 <code>firefish</code> 。数据库用户名也是 <code>firefish</code>， 密码是 <code>firefish_pswd</code>。请在下文自行替换对应名称。</p>
<p>数据库的用户名和密码可以在 Firefish 目录下的 <code>.config/default.yml</code> 找到</p>
<p>你可以考虑在导出 sql 的时候不导出权限和用户名，这样可以方便迁移到其他用户和其他数据库名上。否则，如果你不是原地迁移。后面的迁移可能会遇到权限问题。如果遇到了这样的问题，你可以看看 <a href="#%E9%99%84%E5%BD%95%EF%BC%9A%E6%9D%83%E9%99%90%E9%94%99%E8%AF%AF%E4%B8%8E%E8%A7%A3%E5%86%B3%E6%96%B9%E6%B3%95">附录：权限错误与解决方法</a> 。</p>
<ul>
<li><code>--no-owner</code>：不导出对象所有者信息。</li>
<li><code>--no-privileges</code> 或 <code>--no-acl</code>：不导出对象的权限（访问控制列表）。</li>
</ul>
<h3 id="还原"><a href="#还原">还原</a></h3>
<p>如果您在本地测试环境，或者其他服务器中尝试接下来的步骤，您现在已经可以将您的备份文件下载到对应环境了。</p>
<p>或者，如果您的 Firefish 还在使用 Postgres 12 甚至以下，数据库的版本已经过旧，您可以趁机升级一下数据库版本。</p>
<p>您接下来可以使用这样的命令恢复数据库：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#032F62"> postgres</span></span></code></pre>
<p>进入 postgres。</p>
<p>如果你是还原备份，此时已经存在 <code>firefish</code> 数据库，请把它删掉：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">DROP</span><span style="color:#D73A49"> DATABASE</span><span style="color:#24292E"> firefish;</span></span></code></pre>
<p>此后，执行：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">CREATE</span><span style="color:#D73A49"> DATABASE</span><span style="color:#6F42C1"> firefish</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">exit</span></span></code></pre>
<p>创建 firefish 数据库。</p>
<p>现在，执行这样的命令：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> -U</span><span style="color:#032F62"> {your_username}</span><span style="color:#005CC5"> -d</span><span style="color:#032F62"> {your_database}</span><span style="color:#005CC5"> -f</span><span style="color:#032F62"> {your_backup}.sql</span></span></code></pre>
<p>例如，对 <code>firefish</code> 用户还原 <code>firefish</code> 数据库，你可以：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> -U</span><span style="color:#032F62"> firefish</span><span style="color:#005CC5"> -d</span><span style="color:#032F62"> firefish</span><span style="color:#005CC5"> -f</span><span style="color:#032F62"> path/to/backup.sql</span></span></code></pre>
<h2 id="降级"><a href="#降级">降级</a></h2>
<p>该内容来自 <a href="https://firefish.dev/firefish/firefish/-/blob/develop/docs/downgrade.md?ref_type=heads">Firefish 官方降级文档</a>，有使用自己经验的修改。</p>
<p><strong>不要升级你现在使用的 Firefish 版本。在 firefish 软件的根目录原地进行此操作：</strong></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> --file=docs/downgrade.sql</span><span style="color:#005CC5"> --user=your_user_name</span><span style="color:#005CC5"> --dbname=your_database_name</span></span></code></pre>
<p>例如，本案例中是</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> --file=docs/downgrade.sql</span><span style="color:#005CC5"> --user=firefish</span><span style="color:#005CC5"> --dbname=firefish</span></span></code></pre>
<p>If you get the <code>FATAL: Peer authentication failed</code> error, you also need to provide the <code>--host</code> option (you will be asked the password):</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> --file=docs/downgrade.sql</span><span style="color:#005CC5"> --user=your_user_name</span><span style="color:#005CC5"> --dbname=your_database_name</span><span style="color:#005CC5"> --host=127.0.0.1</span></span></code></pre>
<p>因为你是要迁移到 Sharkey，成功执行到这里后就不必按官方降级文档的继续了。到这里，你可以对 Firefish say bye-bye 了，后面不再需要用到它。</p>
<h3 id="安装-sharkey-仓库"><a href="#安装-sharkey-仓库">安装 Sharkey 仓库</a></h3>
<p>选你中意的位置，跳过新建用户的步骤（因为你的 Firefish 已经有用户了！）安装 Sharkey 直到 initialize 数据库的步骤：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">git</span><span style="color:#032F62"> clone</span><span style="color:#005CC5"> --recurse-submodules</span><span style="color:#005CC5"> -b</span><span style="color:#032F62"> stable</span><span style="color:#032F62"> https://activitypub.software/TransFem-org/Sharkey.git</span></span>
<span class="line"><span style="color:#005CC5">cd</span><span style="color:#032F62"> Sharkey</span></span>
<span class="line"><span style="color:#6F42C1">pnpm</span><span style="color:#032F62"> install</span><span style="color:#005CC5"> --frozen-lockfile</span></span>
<span class="line"><span style="color:#6F42C1">cp</span><span style="color:#032F62"> .config/example.yml</span><span style="color:#032F62"> .config/default.yml</span></span></code></pre>
<p>编辑 <code>.config/default.yml</code> 使其与你的 Firefish 使用<strong>相同的数据库</strong></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>vim .config/default.yml</span></span></code></pre>
<p>Build</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">pnpm</span><span style="color:#032F62"> run</span><span style="color:#032F62"> build</span></span></code></pre>

<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user"</span><span style="color:#24292E"> RENAME COLUMN </span><span style="color:#032F62">"movedToUri"</span><span style="color:#D73A49"> TO</span><span style="color:#032F62"> "ff_movedToUri"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user"</span><span style="color:#24292E"> RENAME COLUMN </span><span style="color:#032F62">"alsoKnownAs"</span><span style="color:#D73A49"> TO</span><span style="color:#032F62"> "ff_alsoKnownAs"</span><span style="color:#24292E">;</span></span>

<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- this column was added by both Firefish and Misskey, but with</span></span>
<span class="line"><span style="color:#6A737D">-- different names, let's fix it</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "meta"</span><span style="color:#24292E"> RENAME COLUMN </span><span style="color:#032F62">"ToSUrl"</span><span style="color:#D73A49"> TO</span><span style="color:#032F62"> "termsOfServiceUrl"</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- update antenna types, this is only needed on some instances but</span></span>

<span class="line"><span style="color:#6A737D">--</span></span>
<span class="line"><span style="color:#6A737D">-- this *removes* any antennas of types not supported by Sharkey!</span></span>
<span class="line"><span style="color:#D73A49">CREATE</span><span style="color:#D73A49"> TYPE</span><span style="color:#6F42C1"> public</span><span style="color:#24292E">.new_antenna_src_enum </span><span style="color:#D73A49">AS</span><span style="color:#24292E"> ENUM </span><span style="color:#005cc5">(</span><span style="color:#032F62">'home'</span><span style="color:#24292E">, </span><span style="color:#032F62">'all'</span><span style="color:#24292E">, </span><span style="color:#032F62">'list'</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#24292E"> antenna </span><span style="color:#D73A49">ADD</span><span style="color:#24292E"> COLUMN new_src </span><span style="color:#005CC5">public</span><span style="color:#24292E">.</span><span style="color:#005CC5">new_antenna_src_enum</span><span style="color:#24292E">;</span></span>

<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#24292E"> antenna </span><span style="color:#D73A49">DROP</span><span style="color:#24292E"> COLUMN src;</span></span>

<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- optional but recommended: delete all empty moderation log entries</span></span>
<span class="line"><span style="color:#D73A49">DELETE</span><span style="color:#D73A49"> FROM</span><span style="color:#24292E"> moderation_log </span><span style="color:#D73A49">WHERE</span><span style="color:#24292E"> info </span><span style="color:#D73A49">=</span><span style="color:#032F62"> '{}'</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- only needed on some instances, run this if</span></span>
<span class="line"><span style="color:#6A737D">-- `\dT+ user_profile_mutingnotificationtypes_enum`</span></span>
<span class="line"><span style="color:#6A737D">-- does not show `note` in the "elements" section</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TYPE</span><span style="color:#032F62"> "public"</span><span style="color:#24292E">.</span><span style="color:#032F62">"user_profile_mutingnotificationtypes_enum"</span><span style="color:#D73A49"> ADD</span><span style="color:#D73A49"> VALUE</span><span style="color:#032F62"> 'note'</span><span style="color:#24292E">;</span></span></code></pre>
<p>如果有任何报错信息，请停止迁移！除非你真的知道自己在干什么，不要乱动数据库。去 Sharkey 提供的 <a href="https://matrix.to/#/#sharkey-support:shourai.de">Matrix</a> or <a href="https://discord.gg/8hF6pMVWja">Discord</a> 求助。</p>
<p>如果没有报错，你就可以接着输入</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">COMMIT</span><span style="color:#24292E">;</span></span></code></pre>
<p>提交这些变更。</p>
<p>好了，现在你可以启动 Sharkey 的 migrations 了。在 Sharkey 的目录：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>pnpm run migrate</span></span>
<span class="line"><span>pnpm run start</span></span></code></pre>
<p>如果两条命令都没有报错的完成了，并且 Sharkey 说它正在监听端口， Ctrl+C 关闭 Sharkey。现在，还要对数据库进行一些小小的按摩（？）</p>
<p>仍然是</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#032F62"> firefish</span></span></code></pre>
<p>到你的数据库：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">BEGIN</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- all existing users are approved, because Firefish doesn't have a</span></span>
<span class="line"><span style="color:#6A737D">-- concept of approvals</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> SET</span><span style="color:#24292E"> approved </span><span style="color:#D73A49">=</span><span style="color:#24292E"> true;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">-- now we put back the data we moved aside</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "movedToUri"</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> "ff_movedToUri"</span><span style="color:#D73A49"> WHERE</span><span style="color:#032F62"> "ff_movedToUri"</span><span style="color:#D73A49"> IS NOT NULL</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "alsoKnownAs"</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> "ff_alsoKnownAs"</span><span style="color:#D73A49"> WHERE</span><span style="color:#032F62"> "ff_alsoKnownAs"</span><span style="color:#D73A49"> IS NOT NULL</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "noindex"</span><span style="color:#D73A49"> =</span><span style="color:#D73A49"> NOT</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#005CC5">COALESCE</span><span style="color:#e36209">(</span><span style="color:#032F62">"ff_isIndexable"</span><span style="color:#24292E">, true</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "speakAsCat"</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> COALESCE</span><span style="color:#005cc5">(</span><span style="color:#032F62">"ff_speakAsCat"</span><span style="color:#24292E">, false</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "user_profile"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "preventAiLearning"</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> COALESCE</span><span style="color:#005cc5">(</span><span style="color:#032F62">"ff_preventAiLearning"</span><span style="color:#24292E">, true</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">UPDATE</span><span style="color:#032F62"> "meta"</span><span style="color:#D73A49"> SET</span><span style="color:#032F62"> "silencedHosts"</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> COALESCE</span><span style="color:#005cc5">(</span><span style="color:#032F62">"ff_silencedHosts"</span><span style="color:#24292E">,</span><span style="color:#032F62">'{}'</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> DROP</span><span style="color:#24292E"> COLUMN </span><span style="color:#032F62">"ff_movedToUri"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> DROP</span><span style="color:#24292E"> COLUMN </span><span style="color:#032F62">"ff_alsoKnownAs"</span><span style="color:#24292E">;</span></span>

<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user"</span><span style="color:#D73A49"> DROP</span><span style="color:#24292E"> COLUMN </span><span style="color:#032F62">"ff_speakAsCat"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "user_profile"</span><span style="color:#D73A49"> DROP</span><span style="color:#24292E"> COLUMN </span><span style="color:#032F62">"ff_preventAiLearning"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">ALTER</span><span style="color:#D73A49"> TABLE</span><span style="color:#032F62"> "meta"</span><span style="color:#D73A49"> DROP</span><span style="color:#24292E"> COLUMN </span><span style="color:#032F62">"ff_silencedHosts"</span><span style="color:#24292E">;</span></span></code></pre>
<p>如果没有报错，你就可以接着输入</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">COMMIT</span><span style="color:#24292E">;</span></span></code></pre>
<p>提交这些变更。</p>
<p>现在，Sharkey 的迁移已经完成了。你可以继续 Sharkey 的启动，比如<a href="https://docs.joinsharkey.org/docs/install/fresh/#with-systemd">配置 Systemd 项目</a>。如果你之前配了 S3, 请去管理面板查看一下这些设置项，因为可能会迁移出类似这样的 URL： <code>https://https://yourdomain.com</code>, 你可以修复它。</p>
<h2 id="附录权限错误与解决方法"><a href="#附录权限错误与解决方法">附录：权限错误与解决方法</a></h2>
<p>通常发生于备份文件的用户名、数据库名、权限和你的数据库内的设置不一致的时候。</p>
<p>以下 SQL 全部需要 <code>psql firefish</code> （或对应的数据库名）后使用。需要将 <code>your_user</code> 替换成你的用户名。</p>
<h3 id="error-对表-xxx-权限不够"><a href="#error-对表-xxx-权限不够">error: 对表 xxx 权限不够</a></h3>
<p>直接把 firefish 数据库内的所有表格权限授予给你的用户：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">GRANT</span><span style="color:#24292E"> ALL PRIVILEGES </span><span style="color:#D73A49">ON</span><span style="color:#24292E"> ALL TABLES </span><span style="color:#D73A49">IN</span><span style="color:#D73A49"> SCHEMA</span><span style="color:#24292E"> public </span><span style="color:#D73A49">TO</span><span style="color:#24292E"> your_user;</span></span></code></pre>
<p>然后将所有表格的 owner 设置成你的用户</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">DO $$</span></span>
<span class="line"><span style="color:#D73A49">DECLARE</span></span>
<span class="line"><span style="color:#24292E">  r RECORD;</span></span>
<span class="line"><span style="color:#D73A49">BEGIN</span></span>
<span class="line"><span style="color:#D73A49">  FOR</span><span style="color:#24292E"> r </span><span style="color:#D73A49">IN</span></span>
<span class="line"><span style="color:#D73A49">    SELECT</span><span style="color:#24292E"> table_schema, table_name</span></span>
<span class="line"><span style="color:#D73A49">    FROM</span><span style="color:#005CC5"> information_schema</span><span style="color:#24292E">.</span><span style="color:#005CC5">tables</span></span>
<span class="line"><span style="color:#D73A49">    WHERE</span><span style="color:#24292E"> table_schema </span><span style="color:#D73A49">NOT</span><span style="color:#D73A49"> IN</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#032F62">'pg_catalog'</span><span style="color:#24292E">, </span><span style="color:#032F62">'information_schema'</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">AND</span><span style="color:#24292E"> table_type </span><span style="color:#D73A49">=</span><span style="color:#032F62"> 'BASE TABLE'</span></span>
<span class="line"><span style="color:#D73A49">  LOOP</span></span>
<span class="line"><span style="color:#D73A49">    EXECUTE</span><span style="color:#032F62"> 'ALTER TABLE '</span><span style="color:#D73A49"> ||</span><span style="color:#005CC5"> r</span><span style="color:#24292E">.</span><span style="color:#005CC5">table_schema</span><span style="color:#D73A49"> ||</span><span style="color:#032F62"> '.'</span><span style="color:#D73A49"> ||</span><span style="color:#005CC5"> r</span><span style="color:#24292E">.</span><span style="color:#005CC5">table_name</span><span style="color:#D73A49"> ||</span><span style="color:#032F62"> ' OWNER TO your_user'</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  END</span><span style="color:#D73A49"> LOOP</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">END</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">$$;</span></span></code></pre>
<h3 id="必须是类型-notification_type_enum-的属主"><a href="#必须是类型-notification_type_enum-的属主">必须是类型 notification_type_enum 的属主</a></h3>
<p>同样，将数据库中所有自定义类型的所有者更改为你的用户</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">DO $$</span></span>
<span class="line"><span style="color:#D73A49">DECLARE</span></span>
<span class="line"><span style="color:#24292E">  r RECORD;</span></span>
<span class="line"><span style="color:#D73A49">BEGIN</span></span>
<span class="line"><span style="color:#D73A49">  FOR</span><span style="color:#24292E"> r </span><span style="color:#D73A49">IN</span></span>
<span class="line"><span style="color:#D73A49">    SELECT</span><span style="color:#005CC5"> n</span><span style="color:#24292E">.</span><span style="color:#005CC5">nspname</span><span style="color:#D73A49"> AS</span><span style="color:#24292E"> schema_name, </span><span style="color:#005CC5">t</span><span style="color:#24292E">.</span><span style="color:#005CC5">typname</span><span style="color:#D73A49"> AS</span><span style="color:#24292E"> type_name</span></span>
<span class="line"><span style="color:#D73A49">    FROM</span><span style="color:#24292E"> pg_type t</span></span>
<span class="line"><span style="color:#D73A49">    JOIN</span><span style="color:#24292E"> pg_namespace n </span><span style="color:#D73A49">ON</span><span style="color:#005CC5"> n</span><span style="color:#24292E">.</span><span style="color:#005CC5">oid</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> t</span><span style="color:#24292E">.</span><span style="color:#005CC5">typnamespace</span></span>
<span class="line"><span style="color:#D73A49">    WHERE</span><span style="color:#005CC5"> t</span><span style="color:#24292E">.</span><span style="color:#005CC5">typowner</span><span style="color:#D73A49"> </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">SELECT</span><span style="color:#D73A49"> oid</span><span style="color:#D73A49"> FROM</span><span style="color:#24292E"> pg_roles </span><span style="color:#D73A49">WHERE</span><span style="color:#24292E"> rolname </span><span style="color:#D73A49">=</span><span style="color:#032F62"> 'firefish'</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">      AND</span><span style="color:#005CC5"> n</span><span style="color:#24292E">.</span><span style="color:#005CC5">nspname</span><span style="color:#D73A49"> NOT</span><span style="color:#D73A49"> IN</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#032F62">'pg_catalog'</span><span style="color:#24292E">, </span><span style="color:#032F62">'information_schema'</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">      AND</span><span style="color:#005CC5"> t</span><span style="color:#24292E">.</span><span style="color:#005CC5">typtype</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> 'e'</span><span style="color:#6A737D">  -- 仅针对枚举类型（自定义类型）</span></span>
