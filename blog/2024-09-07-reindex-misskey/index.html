le=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"userId\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"channelId\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"cw\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"text\"\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#032F62\">\"tags\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">      FROM\x3C/span>\x3Cspan style=\"color:#032F62\"> \"note\"\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">      WHERE\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"note\"\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#032F62\">\"visibility\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#032F62\"> 'public'\x3C/span>\x3Cspan style=\"color:#D73A49\"> OR\x3C/span>\x3Cspan style=\"color:#032F62\"> \"note\"\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#032F62\">\"visibility\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#032F62\"> 'home'\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">AND\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">      \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"note\"\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#032F62\">\"text\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> IS NOT NULL\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">AND\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">      \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\"note\"\x3C/span>\x3Cspan style=\"color:#24292E\">.\x3C/span>\x3Cspan style=\"color:#032F62\">\"uri\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> IS\x3C/span>\x3Cspan style=\"color:#D73A49\"> NULL\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">      ORDER BY\x3C/span>\x3Cspan style=\"color:#24292E\"> id \x3C/span>\x3Cspan style=\"color:#D73A49\">desc\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> n\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>我们不妨保存它为 \x3Ccode>get_notes.sql\x3C/code>\x3C/p>\n\x3Cp>这个 SQL 的意思很显然，就是从帖子表中找到 \x3Ccode>public\x3C/code> 或 \x3Ccode>home\x3C/code> 可见性的本地帖子 (\x3Ccode>uri is null\x3C/code>) 并输出成 JSON\x3C/p>\n\x3Cp>然后执行它，得到一个 \x3Ccode>notes.json\x3C/code>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">psql\x3C/span>\x3Cspan style=\"color:#005CC5\"> -d\x3C/span>\x3Cspan style=\"color:#032F62\"> {your_db_name}\x3C/span>\x3Cspan style=\"color:#005CC5\"> -t\x3C/span>\x3Cspan style=\"color:#005CC5\"> -f\x3C/span>\x3Cspan style=\"color:#032F62\"> get_notes.sql\x3C/span>\x3Cspan style=\"color:#D73A49\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#032F62\"> notes.json\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>然后创建一个 \x3Ccode>send_notes.mjs\x3C/code>。最前方的 config 请用你的 misskey 的 \x3Ccode>.config/default.yml\x3C/code> 内关于 Meilisearch 的部分替换。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">import\x3C/span>\x3Cspan style=\"color:#24292E\"> fs \x3C/span>\x3Cspan style=\"color:#D73A49\">from\x3C/span>\x3Cspan style=\"color:#032F62\"> \"f <!-- more -->
<p>首先编写这样一个 SQL 文件</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">SELECT</span><span style="color:#24292E"> json_agg</span><span style="color:#005cc5">(</span><span style="color:#24292E">row_to_json</span><span style="color:#e36209">(</span><span style="color:#24292E">n.</span><span style="color:#D73A49">*</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">FROM</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span></span>
<span class="line"><span style="color:#D73A49">      SELECT</span><span style="color:#032F62"> "id"</span><span style="color:#24292E">, </span><span style="color:#032F62">"userId"</span><span style="color:#24292E">, </span><span style="color:#032F62">"channelId"</span><span style="color:#24292E">, </span><span style="color:#032F62">"cw"</span><span style="color:#24292E">, </span><span style="color:#032F62">"text"</span><span style="color:#24292E">, </span><span style="color:#032F62">"tags"</span></span>
<span class="line"><span style="color:#D73A49">      FROM</span><span style="color:#032F62"> "note"</span></span>
<span class="line"><span style="color:#D73A49">      WHERE</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#032F62">"note"</span><span style="color:#24292E">.</span><span style="color:#032F62">"visibility"</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> 'public'</span><span style="color:#D73A49"> OR</span><span style="color:#032F62"> "note"</span><span style="color:#24292E">.</span><span style="color:#032F62">"visibility"</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> 'home'</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">AND</span></span>
<span class="line"><span style="color:#24292E">      </span><span style="color:#e36209">(</span><span style="color:#032F62">"note"</span><span style="color:#24292E">.</span><span style="color:#032F62">"text"</span><span style="color:#D73A49"> IS NOT NULL</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">AND</span></span>
<span class="line"><span style="color:#24292E">      </span><span style="color:#e36209">(</span><span style="color:#032F62">"note"</span><span style="color:#24292E">.</span><span style="color:#032F62">"uri"</span><span style="color:#D73A49"> IS</span><span style="color:#D73A49"> NULL</span><span style="color:#e36209">)</span></span>
<span class="line"><span style="color:#D73A49">      ORDER BY</span><span style="color:#24292E"> id </span><span style="color:#D73A49">desc</span></span>
<span class="line"><span style="color:#005cc5">)</span><span style="color:#24292E"> n</span></span></code></pre>
<p>我们不妨保存它为 <code>get_notes.sql</code></p>
<p>这个 SQL 的意思很显然，就是从帖子表中找到 <code>public</code> 或 <code>home</code> 可见性的本地帖子 (<code>uri is null</code>) 并输出成 JSON</p>
<p>然后执行它，得到一个 <code>notes.json</code></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#6F42C1">psql</span><span style="color:#005CC5"> -d</span><span style="color:#032F62"> {your_db_name}</span><span style="color:#005CC5"> -t</span><span style="color:#005CC5"> -f</span><span style="color:#032F62"> get_notes.sql</span><span style="color:#D73A49"> </span><span style="color:#D73A49">></span><span style="color:#032F62"> notes.json</span></span></code></pre>
<p>然后创建一个 <code>send_notes.mjs</code>。最前方的 config 请用你的 misskey 的 <code>.config/default.yml</code> 内关于 Meilisearch 的部分替换。</p>

<span class="line"></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> config</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  ms_url: </span><span style="color:#032F62">"http://127.0.0.1:7700"</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#24292E">  api_key: </span><span style="color:#032F62">"YOUR_API_KEY"</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#24292E">  index: </span><span style="color:#032F62">"YOUR_INDEX"</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
