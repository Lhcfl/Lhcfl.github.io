-\">Slice \x3Cimg src=\"https://img.shields.io/badge/-extreme-b11b8d\" alt=\"extreme\"> \x3Cimg src=\"https://img.shields.io/badge/-%23array-999%22\" alt=\"array\">\x3C/a>\x3C/h2>\n\x3Cblockquote>\n\x3Cp>by Anthony Fu \x3Ca href=\"https://github.com/antfu\">@antfu\x3C/a>\x3C/p>\n\x3C/blockquote>\n\x3Cp>\x3Ca href=\"https://tsch.js.org/216/play\">\x3Cimg src=\"https://img.shields.io/badge/-Take%20the%20Challenge-3178c6?logo=typescript&#x26;logoColor=white\" alt=\"Take the Challgene\">\x3C/a>\x3C/p>\n\x3Cp>Implement the JavaScript \x3Ccode>Array.slice\x3C/code> function in the type system. \x3Ccode>Slice&#x3C;Arr, Start, End>\x3C/code> takes the three argument. The output should be a subarray of \x3Ccode>Arr\x3C/code> from index \x3Ccode>Start\x3C/code> to \x3Ccode>End\x3C/code>. Indexes with negative numbers should be counted from reversely.\x3C/p>\n\x3Cp>For example\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Arr\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">[\x3C/span>\x3Cspan style=\"color:#005CC5\">1\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">3\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">4\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">5\x3C/span>\x3Cspan style=\"color:#005cc5\">]\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Result\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Slice\x3C/span>\x3Cspan style=\"color:#005cc5\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">Arr\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">2\x3C/span>\x3Cspan style=\"color:#24292E\">, \x3C/span>\x3Cspan style=\"color:#005CC5\">4\x3C/span>\x3Cspan style=\"color:#005cc5\">>\x3C/span>\x3Cspan style=\"color:#24292E\">; \x3C/span>\x3Cspan style=\"color:#6A737D\">// expected to be [3, 4]\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>\n\x3Ca href=\"https://github.com/type-challenges/type-challenges/blob/main/README.md\">\x3Cimg src=\"https://img.shields.io/badge/-Back-grey\" alt=\"Back\">\x3C/a>\n\x3Ca href=\"https://tsch.js.org/216/answer\">\x3Cimg src=\"https://img.shields.io/badge/-Share%20your%20Solutions-teal\" alt=\"Share your Solutions\">\x3C/a> \n\x3Ca href=\"https://tsch.js.org/216/solutions\">\x3Cimg src=\"https://img.shields.io/badge/-Check%20out%20Solutions-de5a77?logo=awesome-lists&logoColor=white\" alt=\"Check out Solutions\">\x3C/a>\n\x3C/p>\n\x3C!-- [![Back](https://img.shields.io/badge/-Back-grey)](https://github.com/type-challenges/type-challenges/blob/main/README.md) [![Share your Solutions](https://img.shields.io/badge/-Share%20your%20Solutions-teal)](https://tsch.js.org/216/answer) [![Check out Solutions](https://img.shields.io/badge/-Check%20out%20Solutions-de5a77?logo=awesome-lists&logoColor=white)](https://tsch.js.org/216/solutions) -->\n\x3Ch2 id=\"思路\">\x3Ca href=\"#思路\">思路\x3C/a>\x3C/h2>\n\x3Cp>看上去很简单？这真的是 Extreme 难度吗？\n难度主要在数字的转换上。TypeScript 不支持直接做类型的加减法，所以需要体操一下获得 \x3Ccode>Add1&#x3C;N>\x3C/code> 和 \x3Ccode>MinusXY&#x3C;X, Y>\x3C/code>\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Push1\x3C/span>\x3Cspan style=\"color:rgba(255, 18, 18, 0.8)\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">X\x3C/span>\x3Cspan style=\"color:#D73A49\"> extends\x3C/span>\x3Cspan style=\"color:#005C <p>Implement the JavaScript <code>Array.slice</code> function in the type system. <code>Slice&#x3C;Arr, Start, End></code> takes the three argument. The output should be a subarray of <code>Arr</code> from index <code>Start</code> to <code>End</code>. Indexes with negative numbers should be counted from reversely.</p>
