tion-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"></aside></div></div></body></html><script>($R[14]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"很难不承认 Lean4 真香 —— 然后写了一个简单的 JSON 解析器",date:"2025-04-08T23:47:07",tags:$R[11]=["Code","Functional","Lean"],copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"很难不承认 Lean4 真香 —— 然后写了一个简单的 JSON 解析器",html:"\x3Cp>在之前的文章中我尝试了一下 Lean4 定理证明器——然后我是在并非干这个方向的所以后面就抛在脑后了\x3C/p>\n\x3Cp>后面因为学习函数式语言于是又捡起了 Lean4 函数式编程，然后……好吧我真的不得不说真香啊\x3C/p>\n\x3C!-- more -->\n\x3Cp>于是我又拿 Lean4 写了一个 JSON parser，说起来我真的好爱写 JSON 解析器啊（？）（毕竟 JSON 是我们平时接触的最实用又最简单的可以拿 LL1 文法表达的东西\x3C/p>\n\x3Cp>首先我们定义一个经典的 JSON 结构。接触了一些 PL 理论以后不难看出这是一个 inductive type 即归纳类型\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">inductive\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Json\x3C/span>\x3Cspan style=\"color:#D73A49\"> where\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | Number \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">n : String\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | Null\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | Bool \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">b : Bool\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">s : String\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | Array \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">a : List Json\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  | Object \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">o : List \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">String × Json\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">deriving\x3C/span>\x3Cspan style=\"color:#24292E\"> Repr\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>为了懒得解析我们不妨直接用 String 存放一个数字。现在我们要开始写一个解析器了！首先这些函数是互相递归的所以我们先来一个 \x3Ccode>mutual\x3C/code> 块。 Lean4 里面互相递归的函数得被 \x3Ccode>mutual\x3C/code> 包起来。\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">mutual\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseJsonString\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str: List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">String × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := \x3C/span>\x3Cspan style=\"color:#D73A49\">do\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#B31D28;font-style:italic\">  sorry\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseJsonObject\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">fuel: Nat\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str: List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">List \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">String × Json\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := \x3C/span>\x3Cspan style=\"color:#D73A49\">do\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#B31D28;font-style:italic\">  sorry\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseJsonArray\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">fuel: Nat\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str: List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">List Json × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := \x3C/span>\x3Cspan style=\"color:#D73A49\">do\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#B31D28;font-style:italic\">  sorry\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseJsonNumber\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str: List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> : Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">String × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> :=\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#B31D28;font-style:italic\">  sorry\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">def\x3C/span>\x3Cspan style=\"color:#6F42C1\"> parseJsonValue\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">fuel: Nat\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">str: List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">: Except String \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">Json × List Char\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> := \x3C/span>\x3Cspan style=\"color:#D73A49\">do\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#B31D2 <p>后面因为学习函数式语言于是又捡起了 Lean4 函数式编程，然后……好吧我真的不得不说真香啊</p>
<!-- more -->
<p>于是我又拿 Lean4 写了一个 JSON parser，说起来我真的好爱写 JSON 解析器啊（？）（毕竟 JSON 是我们平时接触的最实用又最简单的可以拿 LL1 文法表达的东西</p>
<p>首先我们定义一个经典的 JSON 结构。接触了一些 PL 理论以后不难看出这是一个 inductive type 即归纳类型</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">inductive</span><span style="color:#6F42C1"> Json</span><span style="color:#D73A49"> where</span></span>
<span class="line"><span style="color:#24292E">  | Number </span><span style="color:#005cc5">(</span><span style="color:#24292E">n : String</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | Null</span></span>
<span class="line"><span style="color:#24292E">  | Bool </span><span style="color:#005cc5">(</span><span style="color:#24292E">b : Bool</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | String </span><span style="color:#005cc5">(</span><span style="color:#24292E">s : String</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | Array </span><span style="color:#005cc5">(</span><span style="color:#24292E">a : List Json</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | Object </span><span style="color:#005cc5">(</span><span style="color:#24292E">o : List </span><span style="color:#e36209">(</span><span style="color:#24292E">String × Json</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">deriving</span><span style="color:#24292E"> Repr</span></span></code></pre>
<p>为了懒得解析我们不妨直接用 String 存放一个数字。现在我们要开始写一个解析器了！首先这些函数是互相递归的所以我们先来一个 <code>mutual</code> 块。 Lean4 里面互相递归的函数得被 <code>mutual</code> 包起来。</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">mutual</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseJsonString</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">str: List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Except String </span><span style="color:#005cc5">(</span><span style="color:#24292E">String × List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#B31D28;font-style:italic">  sorry</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseJsonObject</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">fuel: Nat</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">str: List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Except String </span><span style="color:#005cc5">(</span><span style="color:#24292E">List </span><span style="color:#e36209">(</span><span style="color:#24292E">String × Json</span><span style="color:#e36209">)</span><span style="color:#24292E"> × List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#D73A49">do</span></span>

<p>fuel 在这里是最大递归层级，如果 fuel 用光了就强制停止 parse 的过程。为什么我们要引入 fuel 呢？答案很简单：</p>
<p><del>因为我不会证明它停机</del></p>
<p>虽然作为一个 JSON 解析器它停机是比较显然的，但是 Lean4 不这样觉得，所以你得向它证明停机。证明这个停机需要一些设计，反正我不会，所以在询问了 GPT 并且得不到正确的答复以后我选择从心：直接丢个最大递归深度进去肯定是停机的，Lean4 也很容易自动证明这一点</p>
<p>（当然你也可以直接使用 <code>partial def</code> 告诉 Lean4 这个函数根本就可能不停机，但是问题不大，何况这个函数明明就是会停机的我们应该坚守原则）</p>

<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.Array inner, next</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | </span><span style="color:#032F62">'{'</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">inner, next</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parseJsonObject fuel xs</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.Object inner, next</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | </span><span style="color:#032F62">'"'</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">str, next</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parseJsonString xs</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.String str, next</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">  | maybe_number =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">num, next</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parseJsonNumber maybe_number</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.Number num, next</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">termination_by</span><span style="color:#24292E"> fuel</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseJson</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">str: String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Except String Json := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">json, next</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parseJsonValue </span><span style="color:#005CC5">999</span><span style="color:#24292E"> str.data</span></span>
<span class="line"><span style="color:#D73A49">  match</span><span style="color:#24292E"> trimList next </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">  | </span><span style="color:#005cc5">[</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E"> json</span></span>
<span class="line"><span style="color:#24292E">  | x =</span><span style="color:#24292E">></span><span style="color:#24292E"> .error $ </span><span style="color:#032F62">"unexpected token after json: "</span><span style="color:#24292E">.append x.toString</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">end</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJsonNumber </span><span style="color:#032F62">"1234abc"</span><span style="color:#24292E">.data</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#032F62"> "123waf32e"</span><span style="color:#24292E">.data.span </span><span style="color:#005cc5">(</span><span style="color:#24292E">·.isDigit</span><span style="color:#005cc5">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> read_and_parse</span><span style="color:#24292E"> : IO </span><span style="color:#005cc5">(</span><span style="color:#24292E">Except String Json</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> json ← IO.FS.readFile </span><span style="color:#032F62">"some.json"</span></span>
<span class="line"><span style="color:#24292E">  IO.println json</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> parseJson json</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> read_and_parse</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#032F62"> "true"</span><span style="color:#24292E">.data</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"true"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"false"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"[true, false]"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"</span><span style="color:#005CC5">\"</span><span style="color:#032F62">hello world</span><span style="color:#005CC5">\"</span><span style="color:#032F62">"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"111"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"[</span><span style="color:#005CC5">\"</span><span style="color:#032F62">hello world</span><span style="color:#005CC5">\"</span><span style="color:#032F62">, true, false, [1,2,3, {</span><span style="color:#005CC5">\"</span><span style="color:#032F62">s</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: null}], null, [</span><span style="color:#005CC5">\"</span><span style="color:#032F62">hello</span><span style="color:#005CC5">\"</span><span style="color:#032F62">]]"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"{</span><span style="color:#005CC5">\"</span><span style="color:#032F62">hello</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: </span><span style="color:#005CC5">\"</span><span style="color:#032F62">world</span><span style="color:#005CC5">\"</span><span style="color:#032F62">, </span><span style="color:#005CC5">\"</span><span style="color:#032F62">foo</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: [1, 2, 3], </span><span style="color:#005CC5">\"</span><span style="color:#032F62">bar</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: {</span><span style="color:#005CC5">\"</span><span style="color:#032F62">baz</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: true}}"</span></span>
<span class="line"><span style="color:#D73A49">#eval</span><span style="color:#24292E"> parseJson </span><span style="color:#032F62">"{</span><span style="color:#005CC5">\"</span><span style="color:#032F62">hello</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: </span><span style="color:#005CC5">\"</span><span style="color:#032F62">world</span><span style="color:#005CC5">\"</span><span style="color:#032F62">, </span><span style="color:#005CC5">\"</span><span style="color:#032F62">foo</span><span style="color:#005CC5">\"</span><span style="color:#032F62">: null}"</span></span></code></pre>
<p>在这份代码中你可以非常直观地看到 Lean4 的优越之处。作为一个 pure 的 functional language 它为你提供了原生的 for 和 while 语法糖。语法糖的底层细节我们懒得讲解，但这是 Lean4 中一个非常甜的地方——显然没人说 for / while 循环就不是纯函数了，那么为什么不使用甜甜的语法糖呢？</p>
<p>所以你可以直接写</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">def</span><span style="color:#6F42C1"> parseJsonString</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">str: List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> : Except String </span><span style="color:#005cc5">(</span><span style="color:#24292E">String × List Char</span><span style="color:#005cc5">)</span><span style="color:#24292E"> := </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#D73A49"> mut</span><span style="color:#24292E"> xs := str</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#D73A49"> mut</span><span style="color:#24292E"> str : List Char := </span><span style="color:#005cc5">[</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#D73A49">  for</span><span style="color:#24292E"> ch </span><span style="color:#D73A49">in</span><span style="color:#24292E"> xs </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">    match</span><span style="color:#24292E"> ch </span><span style="color:#D73A49">with</span></span>
<span class="line"><span style="color:#24292E">    | </span><span style="color:#032F62">'"'</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.mk str, xs.tail</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">    | x =</span><span style="color:#24292E">></span></span>
<span class="line"><span style="color:#24292E">      str := str ++ </span><span style="color:#005cc5">[</span><span style="color:#24292E">x</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#24292E">      xs := xs.tail</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">.mk str, xs</span><span style="color:#005cc5">)</span></span></code></pre>
<p>而在另一些不够甜的纯函数式语言中就不得不</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> read_str</span><span style="color:#005cc5">(</span><span style="color:#E36209">str: </span><span style="color:#6F42C1">String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Result</span><span style="color:#005cc5">(</span><span style="color:#6F42C1">ParseStrResult</span><span style="color:#24292E">, </span><span style="color:#6F42C1">String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  case</span><span style="color:#24292E"> str </span><span style="color:#D73A49">|</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.pop_grapheme </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#6F42C1">    Error</span><span style="color:#5a32a3">(</span><span style="color:#6F42C1">Nil</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Error</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"Unexpected EOF"</span><span style="color:#5a32a3">)</span></span>
<span class="line"><span style="color:#6F42C1">    Ok</span><span style="color:#5a32a3">(</span><span style="color:#24292E">#</span><span style="color:#005cc5">(</span><span style="color:#24292E">first, rest</span><span style="color:#005cc5">)</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span></span>
<span class="line"><span style="color:#D73A49">      case</span><span style="color:#24292E"> first </span><span style="color:#5a32a3">{</span></span>
<span class="line"><span style="color:#032F62">        "</span><span style="color:#005CC5">\"</span><span style="color:#032F62">"</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Ok</span><span style="color:#005cc5">(</span><span style="color:#6F42C1">ParseStrResult</span><span style="color:#e36209">(</span><span style="color:#032F62">""</span><span style="color:#24292E">, rest</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#6A737D">        _</span><span style="color:#D73A49"> -</span><span style="color:#D73A49">></span></span>
<span class="line"><span style="color:#6F42C1">          read_str</span><span style="color:#005cc5">(</span><span style="color:#24292E">rest</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#D73A49">          |</span><span style="color:#D73A49">></span><span style="color:#24292E"> result.</span><span style="color:#6F42C1">map</span><span style="color:#005cc5">(</span><span style="color:#D73A49">fn</span><span style="color:#e36209">(</span><span style="color:#24292E">res</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#6F42C1">            ParseStrResult</span><span style="color:#5a32a3">(</span><span style="color:#24292E">first </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> res.result, res.rest</span><span style="color:#5a32a3">)</span></span>
<span class="line"><span style="color:#24292E">          </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span></span>
<span class="line"><span style="color:#24292E">      </span><span style="color:#5a32a3">}</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">fn</span><span style="color:#6F42C1"> parse_str</span><span style="color:#005cc5">(</span><span style="color:#E36209">str: </span><span style="color:#6F42C1">String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Result</span><span style="color:#005cc5">(</span><span style="color:#6F42C1">ParseStrResult</span><span style="color:#24292E">, </span><span style="color:#6F42C1">String</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> str </span><span style="color:#D73A49">=</span><span style="color:#24292E"> str </span><span style="color:#D73A49">|</span><span style="color:#D73A49">></span><span style="color:#24292E"> string.trim_start</span></span>
<span class="line"><span style="color:#D73A49">  case</span><span style="color:#24292E"> str </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#032F62">    "</span><span style="color:#005CC5">\"</span><span style="color:#032F62">"</span><span style="color:#D73A49"> </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> content </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> read_str</span><span style="color:#5a32a3">(</span><span style="color:#24292E">content</span><span style="color:#5a32a3">)</span></span>
<span class="line"><span style="color:#24292E">    x </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> Error</span><span style="color:#5a32a3">(</span><span style="color:#032F62">"unexpected token "</span><span style="color:#D73A49"> </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">></span><span style="color:#24292E"> x</span><span style="color:#5a32a3">)</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>一点也不直观，蠢蠢的</p>
<p>同时，你可以在这份代码中直观地看到 monads 的魅力。Except 显然也是一个 monad，所以可以使用 do 记号完美完成“不出错则继续，出错则跳出”的逻辑。不得不说，看到</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">  | </span><span style="color:#032F62">'['</span><span style="color:#24292E"> :: xs =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">do</span></span>
<span class="line"><span style="color:#D73A49">    let</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">inner, next</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ← parseJsonArray fuel xs</span></span>
<span class="line"><span style="color:#D73A49">    return</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#24292E">Json.Array inner, next</span><span style="color:#005cc5">)</span></span></code></pre>
<p>这样的代码，又直观又好看，这才是函数式语言优美的地方</p>
<p>总而言之，Lean4 真香，uwu</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">April 8, 2025</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/Code">#<!--$-->Code<!--/--></a></li><li _hk=0010070c003100036h110><a class="transition-colors hover:text-ink" href="/tags/Functional">#<!--$-->Functional<!--/--></a></li><li _hk=0010070c003100036h120><a class="transition-colors hover:text-ink" href="/tags/Lean">#<!--$-->Lean<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-04-07-strong-typed"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">一千个计算机人有一千个强类型</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-04-13-lean4-parser-combinator"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">学习在 Lean4 中使用 Parser Combinator</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[14]($R[3],!0);</script>
