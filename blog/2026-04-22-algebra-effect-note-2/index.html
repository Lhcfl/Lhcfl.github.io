 href="/assets/Layout-DgnKrTKS.js"><link rel="modulepreload" href="/assets/RenderHTML-DSRG-qOh.js"><link rel="modulepreload" href="/assets/Comment-CagAvPCO.js"><link rel="modulepreload" href="/assets/PostTags-DKwO4KeQ.js"><link rel="modulepreload" href="/assets/format-DFJQmLUz.js"><script type="module" src="/assets/virtual_solid-ssr-entry-client-BSrm4xPG.js" async></script></head><body><div _hk=00100701 class="min-h-screen"><!--$--><!--/--><div class="_layout_zrvho_2"><!--$--><aside _hk=00100703 class="_col_zrvho_13 _left_zrvho_40"><nav class="grid gap-2.5 italic"><a _hk=0010070400 href="/" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Home</a><a _hk=0010070410 href="/archives" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Archives</a><a _hk=0010070420 href="/notes" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Notes</a><a _hk=0010070430 href="/tags" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Tags</a><a _hk=0010070440 href="/categories" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Categories</a><a _hk=0010070450 href="/about" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">About</a><a _hk=0010070460 href="/links" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Friends</a><a _hk=0010070470 href="/search" class="w-fit transition-colors text-base text-ink-soft hover:text-ink">Search</a></nav></aside><!--/--><div class="min-w-0"><!--$--><header _hk=00100706 class="sticky top-0 z-10 -mx-5 border-b border-rule bg-[color:var(--paper)]/92 px-5 py-3 backdrop-blur-sm md:-mx-6 md:px-6 mb-4 _header_zrvho_19"><nav class="flex gap-2.5 font-sans text-sm items-center"><!--$--><a _hk=0010070700 href="/" class="w-fit transition-colors text-ink-soft hover:text-ink">Home</a><a _hk=0010070710 href="/notes" class="w-fit transition-colors text-ink-soft hover:text-ink">Notes</a><a _hk=0010070720 href="/about" class="w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"></aside></div></div></body></html><script>($R[33]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={date:"2026-04-22T07:58:47",updatedDate:"2026-04-22T07:58:47",title:"Algebraic theories 笔记 2",tags:$R[11]=["PL"],categories:$R[12]=["Algebraic Effects"],category:"",toc:!1,incomplete:!1,hidden:!1,thumbnail:"",displayThumbnail:!1,copyright:"CC BY-SA 4.0"},titleHtml:"Algebraic theories 笔记 2",html:"\x3Cp>Andrej Bauer 的 Lecture 2 的笔记。\x3C/p>\n\x3Cp>视频和资料: \x3Ca href=\"https://www.cs.uoregon.edu/research/summerschool/summer18/topics.php#Bauer\">https://www.cs.uoregon.edu/research/summerschool/summer18/topics.php#Bauer\x3C/a>\x3C/p>\n\x3Cp>简介：本次讲座介绍数学（Algebraic theories），可参考文章 \x3Ca href=\"https://arxiv.org/abs/1807.05923\">What is algebraic about algebraic effects and handlers?\x3C/a>\x3C/p>\n\x3C!-- more -->\n\x3Cp>Q1: artiy 是什么\x3C/p>\n\x3Cp>在 \x3Cstrong>Algebraic effects\x3C/strong> 里，**arity（元数）**指的是：\x3Cbr>\n👉 一个 \x3Cem>effect operation\x3C/em> 接受多少“输入参数”，以及这些参数的结构是什么。\x3C/p>\n\x3Cp>但它比普通函数的“几个参数”要稍微多一层含义。\x3C/p>\n\x3Chr>\n\x3Ch2 id=\"1️⃣-最直观的理解像函数参数个数\">\x3Ca href=\"#1️⃣-最直观的理解像函数参数个数\">1️⃣ 最直观的理解（像函数参数个数）\x3C/a>\x3C/h2>\n\x3Cp>在最简单的情况下，arity 就是：\x3C/p>\n\x3Cblockquote>\n\x3Cp>一个操作接受几个参数\x3C/p>\n\x3C/blockquote>\n\x3Cp>比如：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Ccode>read : unit → string\x3C/code>\x3Cbr>\n👉 arity = 0（不需要输入）\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Ccode>write : string → unit\x3C/code>\x3Cbr>\n👉 arity = 1（需要一个字符串）\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>这和普通函数的 arity 是一样的。\x3C/p>\n\x3Chr>\n\x3Ch2 id=\"2️⃣-在-algebraic-effects-里的完整版含义\">\x3Ca href=\"#2️⃣-在-algebraic-effects-里的完整版含义\">2️⃣ 在 algebraic effects 里的“完整版含义”\x3C/a>\x3C/h2>\n\x3Cp>在 algebraic effects 中，一个 operation 通常写成：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>op : A → B\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这里：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Ccode>A\x3C/code> = 参数类型（input）\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Ccode>B\x3C/code> = continuation 的返回类型\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>👉 所以 \x3Cstrong>arity 本质上是 A 的结构\x3C/strong>\x3C/p>\n\x3Cp>也就是说：\x3C/p>\n\x3Cblockquote>\n\x3Cp>arity = operation 接受的“参数形状”（type signature 的输入部分）\x3C/p>\n\x3C/blockquote>\n\x3Chr>\n\x3Ch2 id=\"3️⃣-更关键的一点它隐含-continuation\">\x3Ca href=\"#3️⃣-更关键的一点它隐含-continuation\">3️⃣ 更关键的一点：它隐含 continuation\x3C/a>\x3C/h2>\n\x3Cp>在 effect 理论里，一个 operation 实际上是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>op(a, k)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Ccode>a : A\x3C/code>（参数）\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Ccode>k : B → ...\x3C/code>（continuation）\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>👉 所以更完整地说：\x3C/p>\n\x3Cblockquote>\n\x3Cp>arity 描述的是 operation 在触发时，传入的“参数部分”，不包括 continuation\x3C/p>\n\x3C/blockquote>\n\x3Chr>\n\x3Ch2 id=\"4️⃣-举个更贴近-effect-的例子\">\x3Ca href=\"#4️⃣-举个更贴近-effect-的例子\">4️⃣ 举个更贴近 effect 的例子\x3C/a>\x3C/h2>\n\x3Cp>比如 nondeterminism：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>choose : unit → bool\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>看起来 arity 是 0，但实际运行时：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>choose((), k)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>handler 可能这样用：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>k(true)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>k(false)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>👉 所以：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>arity = \x3Ccode>unit\x3C/code>\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>continuation 是隐含的，不算在 arity 里\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Chr>\n\x3Ch2 id=\"5️⃣-在代数理论algebraic-theory里的本源定义\">\x3Ca href=\"#5️⃣-在代数理论algebraic-theory里的本源定义\">5️⃣ 在代数理论（algebraic theory）里的本源定义\x3C/a>\x3C/h2>\n\x3Cp>从更数学的角度（universal algebra）：\x3C/p>\n\x3Cblockquote>\n\x3Cp>arity = operation symbol 对应的参数个数（或参数类型）\x3C/p>\n\x3C/blockquote>\n\x3Cp>例如：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Ccode>+\x3C/code> 是二元（arity 2）\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Ccode>0\x3C/code> 是零元（arity 0）\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>而 algebraic effects 只是把它推广到了：\x3C/p>\n\x3Cp>👉 \x3Cstrong>typed + 带 continuation 的版本\x3C/strong>\x3C/p>\n\x3Chr>\n\x3Ch2 id=\"️-一句话总结\">\x3Ca href=\"#️-一句话总结\">✔️ 一句话总结\x3C/a>\x3C/h2>\n\x3Cblockquote>\n\x3Cp>在 algebraic effects 中，\x3Cstrong>arity 指的是一个 effect operation 的输入参数类型（不包含 continuation）\x3C/strong>，也就是它“需要多少、什么样的输入”。\x3C/p>\n\x3C/blockquote>\n\x3Chr>\n\x3Cp>如果你是在看 PL 课（比如 algebraic effects + handlers），我可以帮你把：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>arity\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>signature\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>handler clause\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>三者之间的关系画一张结构图，这样会更清晰。\x3C/p>\n\x3Chr>\n\x3Cp>带参数的 op：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>op: P × |I|^A -> |I|\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>其中 P 是参数，A 是元数 （arity)\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>signature \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi mathvariant=\"normal\">Σ\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\Sigma\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord\">Σ\x3C/span>\x3C/span>\x3C/span>\x3C/span> =  \x3Ccode>{ op_i : P ~> A_i }\x3C/code>\x3C/p>\n\x3Chr>\n\x3Cp>The free model \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>F\x3C/mi>\x3Cmi>r\x3C/mi>\x3Cmi>e\x3C/mi>\x3Cmsub>\x3Cmi>e\x3C/mi>\x3Cmi>T\x3C/mi>\x3C/msub>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>V\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">Free_T(V)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">F\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r\x3C/span>\x3Cspan class=\"mord mathnormal\">e\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\">e\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t vlist-t2\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.3283em;\">\x3Cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mathnormal mtight\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"vlist-s\">​\x3C/span>\x3C/span>\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.15em;\">\x3Cspan>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> is the set of compitations with effects described by theory T and returing values from set V\x3C/p>\n\x3Cp>这是在用 \x3Cstrong>代数理论（algebraic theory）/ 自由模型（free model）\x3C/strong> 的语言，形式化地定义一个 algebraic effect handler。\x3C/p>\n\x3Cp>你看到的：\x3C/p>\n\x3Cul>\n\x3Cli>一个操作解释\n[\n[![\\mathrm{op}]!]_M\n]\x3C/li>\n\x3Cli>和一个返回子句\n[\nr : V \\to |Free_{T'}(V')|\n]\x3C/li>\n\x3C/ul>\n\x3Cp>本质上是在说：\x3C/p>\n\x3Cblockquote>\n\x3Cp>“一个 handler 如何处理 effect operation，以及如何处理普通 return 值。”\x3C/p>\n\x3C/blockquote>\n\x3Cp>我一步一步拆开。\x3C/p>\n\x3Chr>\n\x3Ch1 id=\"1-整个背景\">\x3Ca href=\"#1-整个背景\">1. 整个背景\x3C/a>\x3C/h1>\n\x3Cp>通常：\x3C/p>\n\x3Cul>\n\x3Cli>(T) 是源 effect signature/theory\x3C/li>\n\x3Cli>(T') 是目标 theory\x3C/li>\n\x3C/ul>\n\x3Cp>handler 会把：\x3C/p>\n\x3Cp>[\nFree_T(V)\n]\x3C/p>\n\x3Cp>中的 computation，转换成：\x3C/p>\n\x3Cp>[\nFree_{T'}(V')\n]\x3C/p>\n\x3Cp>中的 computation。\x3C/p>\n\x3Cp>也就是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>带有效果 T 的程序\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>        ↓ handler\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>带有效果 T' 的程序\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>例如：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>State effect\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>   ↓ handler\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>纯 computation\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>或者：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>NonDet\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>   ↓ handler\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>List effect\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Chr>\n\x3Ch1 id=\"2-free_tv-是什么\">\x3Ca href=\"#2-free_tv-是什么\">2. Free_T(V) 是什么\x3C/a>\x3C/h1>\n\x3Cp>它表示：\x3C/p>\n\x3Cblockquote>\n\x3Cp>“使用 effect theory (T) 构造的自由 computation”\x3C/p>\n\x3C/blockquote>\n\x3Cp>里面可以有：\x3C/p>\n\x3Cul>\n\x3Cli>return value\x3C/li>\n\x3Cli>effect operations\x3C/li>\n\x3Cli>continuation\x3C/li>\n\x3C/ul>\n\x3Cp>比如：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">return 3\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>或者：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">choose\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x,y\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>或者：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">get\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>等等。\x3C/p>\n\x3Chr>\n\x3Ch1 id=\"3-handler-需要定义两件事\">\x3Ca href=\"#3-handler-需要定义两件事\">3. handler 需要定义两件事\x3C/a>\x3C/h1>\n\x3Cp>handler 要告诉我们：\x3C/p>\n\x3Chr>\n\x3Ch2 id=\"1return-怎么处理\">\x3Ca href=\"#1return-怎么处理\">（1）return 怎么处理\x3C/a>\x3C/h2>\n\x3Cp>这就是：\x3C/p>\n\x3Cp>[\nr : V \\to |Free_{T'}(V')|\n]\x3C/p>\n\x3Cp>意思：\x3C/p>\n\x3Cblockquote>\n\x3Cp>一个纯返回值 (v \\in V)，应该被变成什么 computation。\x3C/p>\n\x3C/blockquote>\n\x3Cp>例如：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">return x  ↦  return x\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>那对应：\x3C/p>\n\x3Cp>[\nr(v)=\\eta(v)\n]\x3C/p>\n\x3Cp>这里 (\\eta) 是 monad unit。\x3C/p>\n\x3Chr>\n\x3Cp>例如 state handler 可能：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">return x ↦ return \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x,s\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>于是：\x3C/p>\n\x3Cp>[\nr(v)=\\text{return }(v,s)\n]\x3C/p>\n\x3Chr>\n\x3Ch1 id=\"4-operation-怎么处理\">\x3Ca href=\"#4-operation-怎么处理\">4. operation 怎么处理\x3C/a>\x3C/h1>\n\x3Cp>这是：\x3C/p>\n\x3Cp>[\n[![\\mathrm{op}]!]_M\n]\x3C/p>\n\x3Cp>这里最容易迷糊。\x3C/p>\n\x3Chr>\n\x3Cp>先看 operation 的一般形式：\x3C/p>\n\x3Cp>在 algebraic effects 里，一个 operation 通常长这样：\x3C/p>\n\x3Cp>[\n\\mathrm{op}: P \\rightsquigarrow A\n]\x3C/p>\n\x3Cp>意思：\x3C/p>\n\x3Cul>\n\x3Cli>参数集 (P)\x3C/li>\n\x3Cli>返回值集合 (A)\x3C/li>\n\x3C/ul>\n\x3Cp>例如：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>choose : 1 → Bool\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>没有参数，返回 bool。\x3C/p>\n\x3Cp>或者：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>read : 1 → String\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Chr>\n\x3Cp>而 operation 在 free model 中，会被解释成：\x3C/p>\n\x3Cp>[\n[![\\mathrm{op}]!]_M :\nP \\times |M|^A \\to |M|\n]\x3C/p>\n\x3Cp>这里：\x3C/p>\n\x3Cul>\n\x3Cli>(M) 是某个 model\x3C/li>\n\x3Cli>(|M|) 是底层 carrier set\x3C/li>\n\x3C/ul>\n\x3Chr>\n\x3Ch1 id=\"5-为什么有-continuation\">\x3Ca href=\"#5-为什么有-continuation\">5. 为什么有 continuation\x3C/a>\x3C/h1>\n\x3Cp>这最关键。\x3C/p>\n\x3Cp>effect operation 不只是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">op\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">arg\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>它还有：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">之后要做什么\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>也就是 continuation。\x3C/p>\n\x3Cp>因此：\x3C/p>\n\x3Cp>[\n|M|^A\n]\x3C/p>\n\x3Cp>表示：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>operation 的每个可能返回值\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan>↦ 后续 computation\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>即：\x3C/p>\n\x3Cp>[\nk : A \\to |M|\n]\x3C/p>\n\x3Chr>\n\x3Cp>例如：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">x \x3C/span>\x3Cspan style=\"color:#24292E\">&#x3C;\x3C/span>\x3Cspan style=\"color:#24292E\">- choose\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">k\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">x\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>continuation 是：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>Bool → computation\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Chr>\n\x3Ch1 id=\"6-所以-handler-的-operation-clause-是什么\">\x3Ca href=\"#6-所以-handler-的-operation-clause-是什么\">6. 所以 handler 的 operation clause 是什么\x3C/a>\x3C/h1>\n\x3Cp>handler 必须告诉你：\x3C/p>\n\x3Cblockquote>\n\x3Cp>当遇到 op 时，如何处理它和 continuation。\x3C/p>\n\x3C/blockquote>\n\x3Cp>即：\x3C/p>\n\x3Cp>[\n[![\\mathrm{op}]!]_M\n]\x3C/p>\n\x3Cp>实际上是在定义：\x3C/p>\n\x3Cp>[\nP \\times |Free_{T'}(V')|^A\n\\to\n|Free_{T'}(V')|\n]\x3C/p>\n\x3Chr>\n\x3Cp>也就是：\x3C/p>\n\x3Cp>给定：\x3C/p>\n\x3Cul>\n\x3Cli>operation 参数\x3C/li>\n\x3Cli>continuation\x3C/li>\n\x3C/ul>\n\x3Cp>产生：\x3C/p>\n\x3Cul>\n\x3Cli>新 computation\x3C/li>\n\x3C/ul>\n\x3Chr>\n\x3Ch1 id=\"7-举个-nondeterminism-handler-例子\">\x3Ca href=\"#7-举个-nondeterminism-handler-例子\">7. 举个 nondeterminism handler 例子\x3C/a>\x3C/h1>\n\x3Cp>operation：\x3C/p>\n\x3Cp>[\nchoose : 1 \\rightsquigarrow Bool\n]\x3C/p>\n\x3Cp>handler：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">choose\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">k\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> ↦\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  append\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">k\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">true\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">, k\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#24292E\">false\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这里：\x3C/p>\n\x3Cul>\n\x3Cli>continuation:\n[\nk : Bool \\to Free_{T'}(V')\n]\x3C/li>\n\x3C/ul>\n\x3Cp>handler 手动调用 continuation 两次：\x3C/p>\n\x3Cul>\n\x3Cli>(k(true))\x3C/li>\n\x3Cli>(k(false))\x3C/li>\n\x3C/ul>\n\x3Cp>再组合。\x3C/p>\n\x3Chr>\n\x3Ch1 id=\"8-数学上整体是什么意思\">\x3Ca href=\"#8-数学上整体是什么意思\">8. 数学上整体是什么意思\x3C/a>\x3C/h1>\n\x3Cp>所以：\x3C/p>\n\x3Chr>\n\x3Ch2 id=\"return-clause\">\x3Ca href=\"#return-clause\">return clause\x3C/a>\x3C/h2>\n\x3Cp>[\nr : V \\to |Free_{T'}(V')|\n]\x3C/p>\n\x3Cp>定义：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>return value 如何翻译\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Chr>\n\x3Ch2 id=\"operation-clause\">\x3Ca href=\"#operation-clause\">operation clause\x3C/a>\x3C/h2>\n\x3Cp>[\n[![op]!]_M\n]\x3C/p>\n\x3Cp>定义：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>effect operation 如何翻译\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>包括：\x3C/p>\n\x3Cul>\n\x3Cli>operation 参数\x3C/li>\n\x3Cli>continuation 的控制方式\x3C/li>\n\x3C/ul>\n\x3Chr>\n\x3Ch1 id=\"9-为什么只定义这些就够了\">\x3Ca href=\"#9-为什么只定义这些就够了\">9. 为什么只定义这些就够了\x3C/a>\x3C/h1>\n\x3Cp>这是自由模型（free model）的 universal property。\x3C/p>\n\x3Cp>因为：\x3C/p>\n\x3Cp>[\nFree_T(V)\n]\x3C/p>\n\x3Cp>是“由”\x3C/p>\n\x3Cul>\n\x3Cli>return\x3C/li>\n\x3Cli>operations\x3C/li>\n\x3C/ul>\n\x3Cp>自由生成的。\x3C/p>\n\x3Cp>所以：\x3C/p>\n\x3Cblockquote>\n\x3Cp>只要定义 generators 如何映射，\n整个 homomorphism 自动唯一扩展。\x3C/p>\n\x3C/blockquote>\n\x3Cp>也就是说：\x3C/p>\n\x3Cp>handler 本质是一个 model homomorphism：\x3C/p>\n\x3Cp>[\nFree_T(V)\n\\to\nFree_{T'}(V')\n]\x3C/p>\n\x3Cp>而：\x3C/p>\n\x3Cul>\n\x3Cli>(r)\x3C/li>\n\x3Cli>([![op]!]_M)\x3C/li>\n\x3C/ul>\n\x3Cp>就是定义这个 homomorphism 所需的数据。\x3C/p>\n\x3Chr>\n\x3Ch1 id=\"10-最直观理解\">\x3Ca href=\"#10-最直观理解\">10. 最直观理解\x3C/a>\x3C/h1>\n\x3Cp>你可以把：\x3C/p>\n\x3Cp>[\n[![op]!]_M\n]\x3C/p>\n\x3Cp>理解成：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>handler 的 op clause\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>而：\x3C/p>\n\x3Cp>[\nr\n]\x3C/p>\n\x3Cp>理解成：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan>handler 的 return clause\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>整个 handler 就是在递归解释 syntax tree。\x3C/p>",headings:$R[13]=[$R[14]={depth:2,slug:"1️⃣-最直观的理解像函数参数个数",text:"1️⃣ 最直观的理解（像函数参数个数）"},$R[15]={depth:2,slug:"2️⃣-在-algebraic-effects-里的完整版含义",text:"2️⃣ 在 algebraic effects 里的“完整版含义”"},$R[16]={depth:2,slug:"3️⃣-更关键的一点它隐含-continuation",text:"3️⃣ 更关键的一点：它隐含 continuation"},$R[17]={depth:2,slug:"4️⃣-举个更贴近-effect-的例子",text:"4️⃣ 举个更贴近 effect 的例子"},$R[18]={depth:2,slug:"5️⃣-在代数理论algebraic-theory里的本源定义",text:"5️⃣ 在代数理论（algebraic theory）里的本源定义"},$R[19]={depth:2,slug:"️-一句话总结",text:"✔️ 一句话总结"},$R[20]={depth:1,slug:"1-整个背景",text:"1. 整个背景"},$R[21]={depth:1,slug:"2-free_tv-是什么",text:"2. Free_T(V) 是什么"},$R[22]={depth:1,slug:"3-handler-需要定义两件事",text:"3. handler 需要定义两件事"},$R[23]={depth:2,slug:"1return-怎么处理",text:"（1）return 怎么处理"},$R[24]={depth:1,slug:"4-operation-怎么处理",text:"4. operation 怎么处理"},$R[25]={depth:1,slug:"5-为什么有-continuation",text:"5. 为什么有 continuation"},$R[26]={depth:1,slug:"6-所以-handler-的-operation-clause-是什么",text:"6. 所以 handler 的 operation clause 是什么"},$R[27]={depth:1,slug:"7-举个-nondeterminism-handler-例子",text:"7. 举个 nondeterminism handler 例子"},$R[28]={depth:1,slug:"8-数学上整体是什么意思",text:"8. 数学上整体是什么意思"},$R[29]={depth:2,slug:"return-clause",text:"return clause"},$R[30]={depth:2,slug:"operation-clause",text:"operation clause"},$R[31]={depth:1,slug:"9-为什么只定义这些就够了",text:"9. 为什么只定义这些就够了"},$R[32]={depth:1,slug:"10-最直观理解",text:"10. 最直观理解"}]});$R[33]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[34]={"0010070c0031000":"/assets/_slug_-CchUurNE.js"});function $dha(o,i,e,n){for(i=0;i<o.length;i++)e=o[i],"t"==e[0]?((n=document.query <p>视频和资料: <a href="https://www.cs.uoregon.edu/research/summerschool/summer18/topics.php#Bauer">https://www.cs.uoregon.edu/research/summerschool/summer18/topics.php#Bauer</a></p>
<p>简介：本次讲座介绍数学（Algebraic theories），可参考文章 <a href="https://arxiv.org/abs/1807.05923">What is algebraic about algebraic effects and handlers?</a></p>
<!-- more -->
<p>Q1: artiy 是什么</p>
<p>在 <strong>Algebraic effects</strong> 里，**arity（元数）**指的是：<br>
👉 一个 <em>effect operation</em> 接受多少“输入参数”，以及这些参数的结构是什么。</p>
<p>但它比普通函数的“几个参数”要稍微多一层含义。</p>
<hr>
<h2 id="1️⃣-最直观的理解像函数参数个数"><a href="#1️⃣-最直观的理解像函数参数个数">1️⃣ 最直观的理解（像函数参数个数）</a></h2>
<p>在最简单的情况下，arity 就是：</p>
<blockquote>
<p>一个操作接受几个参数</p>
</blockquote>
<p>比如：</p>
<ul>
<li>
<p><code>read : unit → string</code><br>
👉 arity = 0（不需要输入）</p>
</li>
<li>
<p><code>write : string → unit</code><br>
👉 arity = 1（需要一个字符串）</p>
</li>
</ul>
<p>这和普通函数的 arity 是一样的。</p>
<hr>
<h2 id="2️⃣-在-algebraic-effects-里的完整版含义"><a href="#2️⃣-在-algebraic-effects-里的完整版含义">2️⃣ 在 algebraic effects 里的“完整版含义”</a></h2>
<p>在 algebraic effects 中，一个 operation 通常写成：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>op : A → B</span></span></code></pre>
<p>这里：</p>
<ul>
<li>
<p><code>A</code> = 参数类型（input）</p>
</li>
<li>
<p><code>B</code> = continuation 的返回类型</p>
</li>
</ul>
<p>👉 所以 <strong>arity 本质上是 A 的结构</strong></p>
<p>也就是说：</p>
<blockquote>
<p>arity = operation 接受的“参数形状”（type signature 的输入部分）</p>
</blockquote>
<hr>
<h2 id="3️⃣-更关键的一点它隐含-continuation"><a href="#3️⃣-更关键的一点它隐含-continuation">3️⃣ 更关键的一点：它隐含 continuation</a></h2>
<p>在 effect 理论里，一个 operation 实际上是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>op(a, k)</span></span></code></pre>
<ul>
<li>
<p><code>a : A</code>（参数）</p>
</li>
<li>
<p><code>k : B → ...</code>（continuation）</p>
</li>
</ul>
<p>👉 所以更完整地说：</p>
<blockquote>
<p>arity 描述的是 operation 在触发时，传入的“参数部分”，不包括 continuation</p>
</blockquote>
<hr>
<h2 id="4️⃣-举个更贴近-effect-的例子"><a href="#4️⃣-举个更贴近-effect-的例子">4️⃣ 举个更贴近 effect 的例子</a></h2>
<p>比如 nondeterminism：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>choose : unit → bool</span></span></code></pre>
<p>看起来 arity 是 0，但实际运行时：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>choose((), k)</span></span></code></pre>
<p>handler 可能这样用：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>k(true)</span></span>
<span class="line"><span>k(false)</span></span></code></pre>
<p>👉 所以：</p>
<ul>
<li>
<p>arity = <code>unit</code></p>
</li>
<li>
<p>continuation 是隐含的，不算在 arity 里</p>
</li>
</ul>
<hr>
<h2 id="5️⃣-在代数理论algebraic-theory里的本源定义"><a href="#5️⃣-在代数理论algebraic-theory里的本源定义">5️⃣ 在代数理论（algebraic theory）里的本源定义</a></h2>
<p>从更数学的角度（universal algebra）：</p>
<blockquote>
<p>arity = operation symbol 对应的参数个数（或参数类型）</p>
</blockquote>
<p>例如：</p>
<ul>
<li>
<p><code>+</code> 是二元（arity 2）</p>
</li>
<li>
<p><code>0</code> 是零元（arity 0）</p>
</li>
</ul>
<p>而 algebraic effects 只是把它推广到了：</p>
<p>👉 <strong>typed + 带 continuation 的版本</strong></p>
<hr>
<h2 id="️-一句话总结"><a href="#️-一句话总结">✔️ 一句话总结</a></h2>
<blockquote>
<p>在 algebraic effects 中，<strong>arity 指的是一个 effect operation 的输入参数类型（不包含 continuation）</strong>，也就是它“需要多少、什么样的输入”。</p>
</blockquote>
<hr>
<p>如果你是在看 PL 课（比如 algebraic effects + handlers），我可以帮你把：</p>
<ul>
<li>
<p>arity</p>
</li>
<li>
<p>signature</p>
</li>
<li>
<p>handler clause</p>
</li>
</ul>
<p>三者之间的关系画一张结构图，这样会更清晰。</p>
<hr>
<p>带参数的 op：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span></span></span>
<span class="line"><span>op: P × |I|^A -> |I|</span></span>
<span class="line"><span></span></span>
<span class="line"><span>其中 P 是参数，A 是元数 （arity)</span></span>
<span class="line"><span></span></span></code></pre>
<p>signature <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Σ</mi></mrow><annotation encoding="application/x-tex">\Sigma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Σ</span></span></span></span> =  <code>{ op_i : P ~> A_i }</code></p>
<hr>
<p>The free model <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>F</mi><mi>r</mi><mi>e</mi><msub><mi>e</mi><mi>T</mi></msub><mo stretchy="false">(</mo><mi>V</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">Free_T(V)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mord mathnormal">e</span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">T</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mclose">)</span></span></span></span> is the set of compitations with effects described by theory T and returing values from set V</p>
<p>这是在用 <strong>代数理论（algebraic theory）/ 自由模型（free model）</strong> 的语言，形式化地定义一个 algebraic effect handler。</p>
<p>你看到的：</p>
<ul>
<li>一个操作解释
[
[![\mathrm{op}]!]_M
]</li>
<li>和一个返回子句
[
r : V \to |Free_{T'}(V')|
]</li>
</ul>
<p>本质上是在说：</p>
<blockquote>
<p>“一个 handler 如何处理 effect operation，以及如何处理普通 return 值。”</p>
</blockquote>
<p>我一步一步拆开。</p>
<hr>
<h1 id="1-整个背景"><a href="#1-整个背景">1. 整个背景</a></h1>
<p>通常：</p>
<ul>
<li>(T) 是源 effect signature/theory</li>
<li>(T') 是目标 theory</li>
</ul>
<p>handler 会把：</p>
<p>[
Free_T(V)
]</p>
<p>中的 computation，转换成：</p>
<p>[
Free_{T'}(V')
]</p>
<p>中的 computation。</p>
<p>也就是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>带有效果 T 的程序</span></span>
<span class="line"><span>        ↓ handler</span></span>
<span class="line"><span>带有效果 T' 的程序</span></span></code></pre>
<p>例如：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>State effect</span></span>
<span class="line"><span>   ↓ handler</span></span>
<span class="line"><span>纯 computation</span></span></code></pre>
<p>或者：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>NonDet</span></span>
<span class="line"><span>   ↓ handler</span></span>
<span class="line"><span>List effect</span></span></code></pre>
<hr>
<h1 id="2-free_tv-是什么"><a href="#2-free_tv-是什么">2. Free_T(V) 是什么</a></h1>
<p>它表示：</p>
<blockquote>
<p>“使用 effect theory (T) 构造的自由 computation”</p>
</blockquote>
<p>里面可以有：</p>
<ul>
<li>return value</li>
<li>effect operations</li>
<li>continuation</li>
</ul>
<p>比如：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">return 3</span></span></code></pre>
<p>或者：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">choose</span><span style="color:#005cc5">(</span><span style="color:#24292E">x,y</span><span style="color:#005cc5">)</span></span></code></pre>
<p>或者：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">get</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span></span></code></pre>
<p>等等。</p>
<hr>
<h1 id="3-handler-需要定义两件事"><a href="#3-handler-需要定义两件事">3. handler 需要定义两件事</a></h1>
<p>handler 要告诉我们：</p>
<hr>
<h2 id="1return-怎么处理"><a href="#1return-怎么处理">（1）return 怎么处理</a></h2>
<p>这就是：</p>
<p>[
r : V \to |Free_{T'}(V')|
]</p>
<p>意思：</p>
<blockquote>
<p>一个纯返回值 (v \in V)，应该被变成什么 computation。</p>
</blockquote>
<p>例如：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">return x  ↦  return x</span></span></code></pre>
<p>那对应：</p>
<p>[
r(v)=\eta(v)
]</p>
<p>这里 (\eta) 是 monad unit。</p>
<hr>
<p>例如 state handler 可能：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">return x ↦ return </span><span style="color:#005cc5">(</span><span style="color:#24292E">x,s</span><span style="color:#005cc5">)</span></span></code></pre>
<p>于是：</p>
<p>[
r(v)=\text{return }(v,s)
]</p>
<hr>
<h1 id="4-operation-怎么处理"><a href="#4-operation-怎么处理">4. operation 怎么处理</a></h1>
<p>这是：</p>
<p>[
[![\mathrm{op}]!]_M
]</p>
<p>这里最容易迷糊。</p>
<hr>
<p>先看 operation 的一般形式：</p>
<p>在 algebraic effects 里，一个 operation 通常长这样：</p>
<p>[
\mathrm{op}: P \rightsquigarrow A
]</p>
<p>意思：</p>
<ul>
<li>参数集 (P)</li>
<li>返回值集合 (A)</li>
</ul>
<p>例如：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>choose : 1 → Bool</span></span></code></pre>
<p>没有参数，返回 bool。</p>
<p>或者：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>read : 1 → String</span></span></code></pre>
<hr>
<p>而 operation 在 free model 中，会被解释成：</p>
<p>[
[![\mathrm{op}]!]_M :
P \times |M|^A \to |M|
]</p>
<p>这里：</p>
<ul>
<li>(M) 是某个 model</li>
<li>(|M|) 是底层 carrier set</li>
</ul>
<hr>
<h1 id="5-为什么有-continuation"><a href="#5-为什么有-continuation">5. 为什么有 continuation</a></h1>
<p>这最关键。</p>
<p>effect operation 不只是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">op</span><span style="color:#005cc5">(</span><span style="color:#24292E">arg</span><span style="color:#005cc5">)</span></span></code></pre>
<p>它还有：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">之后要做什么</span></span></code></pre>
<p>也就是 continuation。</p>
<p>因此：</p>
<p>[
|M|^A
]</p>
<p>表示：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>operation 的每个可能返回值</span></span>
<span class="line"><span>↦ 后续 computation</span></span></code></pre>
<p>即：</p>
<p>[
k : A \to |M|
]</p>
<hr>
<p>例如：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">x </span><span style="color:#24292E">&#x3C;</span><span style="color:#24292E">- choose</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">k</span><span style="color:#005cc5">(</span><span style="color:#24292E">x</span><span style="color:#005cc5">)</span></span></code></pre>
<p>continuation 是：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>Bool → computation</span></span></code></pre>
<hr>
<h1 id="6-所以-handler-的-operation-clause-是什么"><a href="#6-所以-handler-的-operation-clause-是什么">6. 所以 handler 的 operation clause 是什么</a></h1>
<p>handler 必须告诉你：</p>
<blockquote>
<p>当遇到 op 时，如何处理它和 continuation。</p>
</blockquote>
<p>即：</p>
<p>[
[![\mathrm{op}]!]_M
]</p>
<p>实际上是在定义：</p>
<p>[
P \times |Free_{T'}(V')|^A
\to
|Free_{T'}(V')|
]</p>
<hr>
<p>也就是：</p>
<p>给定：</p>
<ul>
<li>operation 参数</li>
<li>continuation</li>
</ul>
<p>产生：</p>
<ul>
<li>新 computation</li>
</ul>
<hr>
<h1 id="7-举个-nondeterminism-handler-例子"><a href="#7-举个-nondeterminism-handler-例子">7. 举个 nondeterminism handler 例子</a></h1>
<p>operation：</p>
<p>[
choose : 1 \rightsquigarrow Bool
]</p>
<p>handler：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">choose</span><span style="color:#005cc5">(</span><span style="color:#24292E">k</span><span style="color:#005cc5">)</span><span style="color:#24292E"> ↦</span></span>
<span class="line"><span style="color:#24292E">  append</span><span style="color:#005cc5">(</span><span style="color:#24292E">k</span><span style="color:#e36209">(</span><span style="color:#24292E">true</span><span style="color:#e36209">)</span><span style="color:#24292E">, k</span><span style="color:#e36209">(</span><span style="color:#24292E">false</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span></span></code></pre>
<p>这里：</p>
<ul>
<li>continuation:
[
k : Bool \to Free_{T'}(V')
]</li>
</ul>
<p>handler 手动调用 continuation 两次：</p>
<ul>
<li>(k(true))</li>
<li>(k(false))</li>
</ul>
<p>再组合。</p>
<hr>
<h1 id="8-数学上整体是什么意思"><a href="#8-数学上整体是什么意思">8. 数学上整体是什么意思</a></h1>
<p>所以：</p>
<hr>
<h2 id="return-clause"><a href="#return-clause">return clause</a></h2>
<p>[
r : V \to |Free_{T'}(V')|
]</p>
<p>定义：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>return value 如何翻译</span></span></code></pre>
<hr>
<h2 id="operation-clause"><a href="#operation-clause">operation clause</a></h2>
<p>[
[![op]!]_M
]</p>
<p>定义：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>effect operation 如何翻译</span></span></code></pre>
<p>包括：</p>
<ul>
<li>operation 参数</li>
<li>continuation 的控制方式</li>
</ul>
<hr>
<h1 id="9-为什么只定义这些就够了"><a href="#9-为什么只定义这些就够了">9. 为什么只定义这些就够了</a></h1>
<p>这是自由模型（free model）的 universal property。</p>
<p>因为：</p>
<p>[
Free_T(V)
]</p>
<p>是“由”</p>
<ul>
<li>return</li>
<li>operations</li>
</ul>
<p>自由生成的。</p>
<p>所以：</p>
<blockquote>
<p>只要定义 generators 如何映射，
整个 homomorphism 自动唯一扩展。</p>
</blockquote>
<p>也就是说：</p>
<p>handler 本质是一个 model homomorphism：</p>
<p>[
Free_T(V)
\to
Free_{T'}(V')
]</p>
<p>而：</p>
<ul>
<li>(r)</li>
<li>([![op]!]_M)</li>
</ul>
<p>就是定义这个 homomorphism 所需的数据。</p>
<hr>
<h1 id="10-最直观理解"><a href="#10-最直观理解">10. 最直观理解</a></h1>
<p>你可以把：</p>
<p>[
[![op]!]_M
]</p>
<p>理解成：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>handler 的 op clause</span></span></code></pre>
<p>而：</p>
<p>[
r
]</p>
<p>理解成：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span>handler 的 return clause</span></span></code></pre>
<p>整个 handler 就是在递归解释 syntax tree。</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">April 22, 2026</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/PL">#<!--$-->PL<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2026-04-01-algebra-effect-note"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">Algebraic theories 笔记</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2026-06-22-%E4%BB%8E%E5%8D%9A%E5%AE%A2%E7%BE%8E%E5%8C%96%E5%BC%80%E5%A7%8B%E7%9A%84%E6%8E%92%E7%89%88%E5%AD%A6%E7%AC%94%E8%AE%B0"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">从博客美化开始的排版学笔记</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[33]($R[3],!0);</script>
