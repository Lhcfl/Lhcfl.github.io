e</code> 和盘古之白</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>前置閱讀：<a href="https://stblog.penclub.club/posts/StopPanguing/">移除盘古：为什么你应该停止在中西文间使用空格</a></p>
<div class="tip">

</div>
<!-- more -->
<blockquote>
<p>漢學家稱這個空白字元為「盤古之白」，因為它劈開了全形字和半形字之間的混沌。另有研究顯示，打字的時候不喜歡在中文和英文之間加空格的人，感情路都走得很辛苦，有七成的比例會在 34 歲的時候跟自己不愛的人結婚，而其餘三成的人最後只能把遺產留給自己的貓。畢竟愛情跟書寫都需要適時地留白。</p>
</blockquote>
<p>許多人會認爲，在中文和英文之間加空格可以讓文本更易讀，或者單純的是爲了美觀。「盤古之白」是在這一背景下誕生的一個著名工具，用於自動給中文和英文中添加空格。</p>
<p>然而，我覺得應該從根本上質疑這個問題：在中英文之間的空格到底是純粹的作爲排版作用，還是兼具語義作用？</p>
<p>讓我們考慮一個句子：</p>
<blockquote>
<p>超声B型扫描成像检测（以下简称B超）是当前临床应用最为广泛的医学影像学检查技术之一。</p>
</blockquote>
<p>在這個句子中，B超是一個專有名詞。如果我們在B和超之間添加空格，會變成「B 超」，這樣就會讓人誤以爲B和超是兩個獨立的詞語，反而降低了可讀性。相反，如果我們不添加空白，B超作爲一個整體的專有名詞就會更清晰。</p>
<p>但是，「超聲B型」則是一個複合詞，B 相當於是外來成分。理論上，如果沒有約定俗成，我們也可以將類似的東西命名爲「超聲あ型」,「超聲II型」，「超聲2型」。因此，在這種情況下，區分B和中文之間的空白是有意義的，因爲它可以幫助讀者更好地理解這個詞語的結構。</p>
<p>我們可以寫下不同的版本：</p>
<div style="text-autospace: normal">
<p>自動空格：超声B型扫描成像检测（以下简称B超）是当前临床应用最为广泛的医学影像学检查技术之一。</p>
</div>
<div style="text-autospace: no-autospace">
<p>沒有空格：超声B型扫描成像检测（以下简称B超）是当前临床应用最为广泛的医学影像学检查技术之一。</p>
</div>
<div style="text-autospace: no-autospace">
<p>手動空格：超声 B 型扫描成像检测（以下简称 B 超）是当前临床应用最为广泛的医学影像学检查技术之一。</p>
</div>
<div style="text-autospace: no-autospace">
<p>手動一半：超声 B 型扫描成像检测（以下简称B超）是当前临床应用最为广泛的医学影像学检查技术之一。</p>
</div>
<p>这些版本哪个更好应该是一个主观的、见仁见智的话题。当然我们也可以注意到，自动空格也没有智能到能对B和超之间的关系进行语义分析，所以它也会在一些不合适的地方添加空格。</p>
<p>儘管存在這樣的缺陷，自動化的空白添加肯定是比手動的更好的。</p></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">March 30, 2026</time><!--$--><ul _hk=0010070c003100036h0 class="flex flex-wrap gap-x-3 gap-y-1 text-sm text-accent text-xs"><li _hk=0010070c003100036h100><a class="transition-colors hover:text-ink" href="/tags/%E6%8E%92%E7%89%88">#<!--$-->排版<!--/--></a></li></ul><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2026-03-29-411-diary"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">上海 411 医院 SRS 游记</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2026-04-01-algebra-effect-note"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">Algebraic theories 笔记</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accent hover:underline" href="/">← Back to home</a></p></article></template><script>$R[14]($R[3],!0);</script>
