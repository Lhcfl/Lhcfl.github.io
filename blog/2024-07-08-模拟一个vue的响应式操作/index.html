k-soft hover:text-ink">Notes</a><a _hk=0010070720 href="/about" class="w-fit transition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#关于-computed" class="text-ink-soft hover:text-accent">关于 computed</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#复杂度分析" class="text-ink-soft hover:text-accent">复杂度分析</a></li><li _hk=0010070l120 class="" style="padding-left:24px"><a href="#朴素写法复杂度分析" class="text-ink-soft hover:text-accent">朴素写法复杂度分析</a></li><li _hk=0010070l130 class="" style="padding-left:24px"><a href="#优化" class="text-ink-soft hover:text-accent">优化</a></li></ul></nav></aside></div></div></body></html><script>($R[18]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"试着复刻一个vue的计算属性",date:"2024-07-08T23:30:45",tags:$R[11]=["Frontend","Javascript","Algorithm","Code","Vue"],copyright:"CC BY-SA 4.0",categories:$R[12]=[]},titleHtml:"试着复刻一个vue的计算属性",html:"\x3Cp>之前对于 Vue 的响应式封装（这里主要思考的是 computed），主要是用用，其实是懒得思考背后的原理的。毕竟原理其实可以用一句话说明：计算属性对别的属性产生有向的依赖关系，这个依赖关系构成一个有向无环图（DAG），图上的某个节点更新后重新计算其所有后置节点即可。\x3C/p>\n\x3Cp>但是仔细想来，内部其实有一些时间复杂度的问题。显然，我们不能暴力调用回调函数（会卡出指数级时间复杂度 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>O\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmsup>\x3Cmn>2\x3C/mn>\x3Cmi>n\x3C/mi>\x3C/msup>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">O(2^n)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">O\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord\">2\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.6644em;\">\x3Cspan style=\"top:-3.063em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mathnormal mtight\">n\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 下面会详细解释）。同时朴素的做法很难解决这样的问题：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> a\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> ref\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">[\x3C/span>\x3Cspan style=\"color:#e36209\">]\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">const\x3C/span>\x3Cspan style=\"color:#005CC5\"> b\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#6F42C1\"> computed\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> a.\x3C/span>\x3Cspan style=\"color:#6F42C1\">join\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#032F62\">\",\"\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">for\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#D73A49\">let\x3C/span>\x3Cspan style=\"color:#24292E\"> i \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#005CC5\"> 1\x3C/span>\x3Cspan style=\"color:#24292E\">; i \x3C/span>\x3Cspan style=\"color:#D73A49\">&#x3C;\x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> n; i\x3C/span>\x3Cspan style=\"color:#D73A49\">++\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">  a.value \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#24292E\"> a.value.\x3C/span>\x3Cspan style=\"color:#6F42C1\">concat\x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#5a32a3\">[\x3C/span>\x3Cspan style=\"color:#24292E\">i\x3C/span>\x3Cspan style=\"color:#5a32a3\">]\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>注意到对于一个网页而言，我们实际上期望 \x3Ccode>b\x3C/code> 能在整个宏任务跑完以后才更新。所以实际上\x3Ccode>a.value\x3C/code> 的 setter 触发的更新必须要进行推迟。\x3C/p>\n\x3Cp>这篇文章讲讲我怎么在思考这些的过程中试着复刻一个 vue 的计算属性 \x3Ccode>computed\x3C/code> 的\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"关于-computed\">\x3Ca href=\"#关于-computed\">关于 \x3Ccode>computed\x3C/code>\x3C/a>\x3C/h2>\n\x3Cp>Vue 的 \x3Ccode>computed\x3C/code> 有多种，不过为了简化问题，这里我们只讨论最经典的那种：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> computed\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#6F42C1\">fn\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#e36209\">(\x3C/span>\x3Cspan style=\"color:#e36209\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#D73A49\">=\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#6F42C1\"> T\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> ComputedRef\x3C/span>\x3Cspan style=\"color:#005cc5\">&#x3C;\x3C/span>\x3Cspan style=\"color:#6F42C1\">T\x3C/span>\x3Cspan style=\"color:#005cc5\">>\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这个 \x3Ccode>computed\x3C/code> 函数接受一个 \x3Ccode>callback\x3C/code>， 每当 \x3Ccode>callback\x3C/code> 涉及到的其他响应式变量发生变化时，重新计算。具体请自行参考 vue 的文档。\x3C/p>\n\x3Cp>如果我们希望构建一个高性能的\x3Ccode>computed\x3C/code>，就必须进行复杂度分析。\x3C/p>\n\x3Ch2 id=\"复杂度分析\">\x3Ca href=\"#复杂度分析\">复杂度分析\x3C/a>\x3C/h2>\n\x3Cp>现在假设我们有 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>n\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">n\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">n\x3C/span>\x3C/span>\x3C/span>\x3C/span> 个响应式状态，彼此之间总共有 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>m\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">m\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">m\x3C/span>\x3C/span>\x3C/span>\x3C/span> 的依赖关系。它们可以构成一个 DAG \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>G\x3C/mi>\x3Cmo>=\x3C/mo>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>V\x3C/mi>\x3Cmo separator=\"true\">,\x3C/mo>\x3Cmi>E\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">G = (V, E)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">G\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">=\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V\x3C/span>\x3Cspan class=\"mpunct\">,\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span>。 其中， \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>E\x3C/mi>\x3Cmo>=\x3C/mo>\x3Cmo stretchy=\"false\">{\x3C/mo>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>u\x3C/mi>\x3Cmo separator=\"true\">,\x3C/mo>\x3Cmi>v\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3Cmi mathvariant=\"normal\">∣\x3C/mi>\x3Cmi>u\x3C/mi>\x3Cmtext>的计算依赖于\x3C/mtext>\x3Cmi>v\x3C/mi>\x3Cmo stretchy=\"false\">}\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">E = \\{(u, v) | u 的计算依赖于v \\}\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">=\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mopen\">{(\x3C/span>\x3Cspan class=\"mord mathnormal\">u\x3C/span>\x3Cspan class=\"mpunct\">,\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3Cspan class=\"mord\">∣\x3C/span>\x3Cspan class=\"mord mathnormal\">u\x3C/span>\x3Cspan class=\"mord cjk_fallback\">的计算依赖于\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v\x3C/span>\x3Cspan class=\"mclose\">}\x3C/span>\x3C/span>\x3C/span>\x3C/span>。显然出度为 0 的点是可写的 \x3Ccode>Ref\x3C/code>，其余点是 \x3Ccode>ComputedRef\x3C/code>.\x3C/p>\n\x3Cp>这里必须是 DAG，因为一旦计算属性出现环，那就会出现死循环。\x3C/p>\n\x3Cp>我们把 \x3Ccode>ComputedRef\x3C/code> 的平均计算时间记为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>T\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">T\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>第一次尝试获得 \x3Ccode>.value\x3C/code> 的时候，我们在 res 的 context 下跑一次 \x3Ccode>fn\x3C/code>。 跑 fn 的过程中，每个响应式属性 .value 都会尝试把 context 设为自己的 children （也就是构建 u,v 边）\x3C/p>\n\x3Cp>容易发现，跑完第一次的 \x3Ccode>fn\x3C/code> 以后再调用 \x3Ccode>.value\x3C/code> 是 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>O\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmn>1\x3C/mn>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">O(1)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">O\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord\">1\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 的。也就是说，计算全图的所有属性只需要挨个计算一次，即为 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>O\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>n\x3C/mi>\x3Cmi>T\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">O(nT)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">O\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">n\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>但是考虑更新。最坏条件下，我们会发现有类似这样的依赖关系：\x3C/p>\n\x3Cpre class=\"shiki github-light\" ="stylesheet" href="/assets/GitalkComments-L-_uAc3p.css" onload="$dfc('0010070c')" onerror="$dfc('0010070c')"><template id="0010070c"><!--!$--><p _hk=0010070c0031000320 class="mb-2 flex flex-wrap items-baseline font-sans text-xs text-ink-faint"><!--!$--><a _hk=0010070c0031000321030 class="transition-colors hover:text-accent" href="/blog">Blog</a></p><article _hk=0010070c0031000361><header class="mb-8 border-b border-rule pb-7"><!--$--><!--/--><h1 class="text-2xl font-bold leading-snug text-balance md:text-3xl"><span _hk=0010070c00310003670 class="">试着复刻一个vue的计算属性</span></h1></header><!--$--><div _hk=0010070c003100036a0 class="markdown-body"><p>之前对于 Vue 的响应式封装（这里主要思考的是 computed），主要是用用，其实是懒得思考背后的原理的。毕竟原理其实可以用一句话说明：计算属性对别的属性产生有向的依赖关系，这个依赖关系构成一个有向无环图（DAG），图上的某个节点更新后重新计算其所有后置节点即可。</p>
<p>但是仔细想来，内部其实有一些时间复杂度的问题。显然，我们不能暴力调用回调函数（会卡出指数级时间复杂度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mi>n</mi></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(2^n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> 下面会详细解释）。同时朴素的做法很难解决这样的问题：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> a</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> ref</span><span style="color:#005cc5">(</span><span style="color:#e36209">[</span><span style="color:#e36209">]</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> b</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> computed</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> a.</span><span style="color:#6F42C1">join</span><span style="color:#e36209">(</span><span style="color:#032F62">","</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">for</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">let</span><span style="color:#24292E"> i </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">; i </span><span style="color:#D73A49">&#x3C;</span><span style="color:#D73A49">=</span><span style="color:#24292E"> n; i</span><span style="color:#D73A49">++</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">  a.value </span><span style="color:#D73A49">=</span><span style="color:#24292E"> a.value.</span><span style="color:#6F42C1">concat</span><span style="color:#e36209">(</span><span style="color:#5a32a3">[</span><span style="color:#24292E">i</span><span style="color:#5a32a3">]</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>注意到对于一个网页而言，我们实际上期望 <code>b</code> 能在整个宏任务跑完以后才更新。所以实际上<code>a.value</code> 的 setter 触发的更新必须要进行推迟。</p>
<p>这篇文章讲讲我怎么在思考这些的过程中试着复刻一个 vue 的计算属性 <code>computed</code> 的</p>
<!-- more -->
<h2 id="关于-computed"><a href="#关于-computed">关于 <code>computed</code></a></h2>
<p>Vue 的 <code>computed</code> 有多种，不过为了简化问题，这里我们只讨论最经典的那种：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> computed</span><span style="color:#005cc5">(</span><span style="color:#6F42C1">fn</span><span style="color:#D73A49">:</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> T</span><span style="color:#005cc5">)</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> ComputedRef</span><span style="color:#005cc5">&#x3C;</span><span style="color:#6F42C1">T</span><span style="color:#005cc5">></span><span style="color:#24292E">;</span></span></code></pre>
<p>这个 <code>computed</code> 函数接受一个 <code>callback</code>， 每当 <code>callback</code> 涉及到的其他响应式变量发生变化时，重新计算。具体请自行参考 vue 的文档。</p>
<p>如果我们希望构建一个高性能的<code>computed</code>，就必须进行复杂度分析。</p>
<h2 id="复杂度分析"><a href="#复杂度分析">复杂度分析</a></h2>
<p>现在假设我们有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> 个响应式状态，彼此之间总共有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span> 的依赖关系。它们可以构成一个 DAG <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo>=</mo><mo stretchy="false">(</mo><mi>V</mi><mo separator="true">,</mo><mi>E</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G = (V, E)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">G</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mclose">)</span></span></span></span>。 其中， <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo>=</mo><mo stretchy="false">{</mo><mo stretchy="false">(</mo><mi>u</mi><mo separator="true">,</mo><mi>v</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi>u</mi><mtext>的计算依赖于</mtext><mi>v</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">E = \{(u, v) | u 的计算依赖于v \}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{(</span><span class="mord mathnormal">u</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">)</span><span class="mord">∣</span><span class="mord mathnormal">u</span><span class="mord cjk_fallback">的计算依赖于</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mclose">}</span></span></span></span>。显然出度为 0 的点是可写的 <code>Ref</code>，其余点是 <code>ComputedRef</code>.</p>
<p>这里必须是 DAG，因为一旦计算属性出现环，那就会出现死循环。</p>
<p>我们把 <code>ComputedRef</code> 的平均计算时间记为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span></p>
<h3 id="朴素写法复杂度分析"><a href="#朴素写法复杂度分析">朴素写法复杂度分析</a></h3>
<p>考虑一个这样的朴素 <code>computed</code> 实现：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> computed</span><span style="color:#005cc5">(</span><span style="color:#E36209">fn</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> cached </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> false</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> val;</span></span>
<span class="line"><span style="color:#D73A49">  let</span><span style="color:#24292E"> children </span><span style="color:#D73A49">=</span><span style="color:#24292E"> </span><span style="color:#e36209">[</span><span style="color:#e36209">]</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">  const</span><span style="color:#005CC5"> res</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">    get</span><span style="color:#6F42C1"> value</span><span style="color:#5a32a3">(</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#5a32a3">{</span></span>
<span class="line"><span style="color:#24292E">      children.</span><span style="color:#6F42C1">push</span><span style="color:#005cc5">(</span><span style="color:#6F42C1">useContext</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">      inContext</span><span style="color:#005cc5">(</span><span style="color:#24292E">res, </span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#e36209">{</span></span>
<span class="line"><span style="color:#D73A49">        if</span><span style="color:#24292E"> </span><span style="color:#5a32a3">(</span><span style="color:#D73A49">!</span><span style="color:#24292E">cached</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> val </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> fn</span><span style="color:#5a32a3">(</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">        cached </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> true</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">      </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">      return</span><span style="color:#24292E"> val;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#5a32a3">}</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#6F42C1">    update</span><span style="color:#5a32a3">(</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#5a32a3">{</span></span>
<span class="line"><span style="color:#24292E">      val </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> fn</span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">      children.</span><span style="color:#6F42C1">forEach</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">c</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> c.</span><span style="color:#6F42C1">update</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#5a32a3">}</span><span style="color:#24292E">,</span></span>
<span class="line"><span style="color:#24292E">  </span><span style="color:#e36209">}</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span></code></pre>
<p>第一次尝试获得 <code>.value</code> 的时候，我们在 res 的 context 下跑一次 <code>fn</code>。 跑 fn 的过程中，每个响应式属性 .value 都会尝试把 context 设为自己的 children （也就是构建 u,v 边）</p>
<p>容易发现，跑完第一次的 <code>fn</code> 以后再调用 <code>.value</code> 是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span></span></span></span> 的。也就是说，计算全图的所有属性只需要挨个计算一次，即为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(nT)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mclose">)</span></span></span></span></p>
<p>但是考虑更新。最坏条件下，我们会发现有类似这样的依赖关系：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">graph</span><span style="color:#6F42C1"> LR</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#E36209">E </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> D </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> C </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> B </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> A</span></span>
<span class="line"><span style="color:#E36209">E </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> C </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> A</span></span>
<span class="line"><span style="color:#E36209">D </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> B</span></span>
<span class="line"><span style="color:#E36209">E </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> B</span></span>
<span class="line"><span style="color:#E36209">D </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> A</span></span>
<span class="line"><span style="color:#E36209">E </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> A</span></span></code></pre>
<p>现在假设我们更新了 <code>A</code> 。A 的孩子是 <code>[D, C, B]</code>，我们发现递归树是这样的：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">graph</span><span style="color:#6F42C1"> TD</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#E36209">A </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> AB </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ABC </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> ABCD </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ABCDE</span></span>
<span class="line"><span style="color:#E36209">ABC </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ABCE</span></span>
<span class="line"><span style="color:#E36209">AB </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> ABD </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ABDE</span></span>
<span class="line"><span style="color:#E36209">AB </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ABE</span></span>
<span class="line"><span style="color:#E36209">A </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> AC </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ACD </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ACDE</span></span>
<span class="line"><span style="color:#E36209">AC </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ACE</span></span>
<span class="line"><span style="color:#E36209">A </span><span style="color:#D73A49">--</span><span style="color:#032F62">></span><span style="color:#032F62"> AD </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> ADE</span></span>
<span class="line"><span style="color:#E36209">A </span><span style="color:#D73A49">--</span><span style="color:#D73A49">></span><span style="color:#E36209"> AE</span></span></code></pre>
<p>这里的问题在于 A 可能先用错误的 B,C,D 数据触发了对 E 的更新；然后对 D 更新时 D 又引起了依赖 D 的 E 的更新。E 在这个递归树中整整被计算了 8 次！</p>
<p>显然树的叶子数即为 ABCDE 的全部以 A 开头 E 结尾的子串数。也就是说，如果我们有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> 个计算属性依次依赖前面的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> 个计算属性 （第一个计算属性依赖于 A）。最后再有一个计算属性 E 依赖于这 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> 个计算属性，那么我们会得到 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">2^n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6644em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span> 个不同的以 A 开头 E 结尾的子串。 更新 A 会导致整整 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mi>n</mi></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(2^n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> 次 E 的计算！</p>
<h3 id="优化"><a href="#优化">优化</a></h3>
<p>很容易想到一个优化算法。既然依赖关系是 DAG，那么我们可以在 DAG 上跑一个拓扑排序，按照拓扑序更新不就好了？</p>
<p>但问题来了，在这个隐形的有向图上优雅地跑拓扑排序呢？我们知道对于 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> 个简单节点我们可以这样跑拓扑排序：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> sorted</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005cc5">]</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> topo_sort</span><span style="color:#005cc5">(</span><span style="color:#E36209">node</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  if</span><span style="color:#24292E"> </span><span style="color:#e36209">(</span><span style="color:#24292E">n.vis</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  n.vis </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> true</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  node.parents.</span><span style="color:#6F42C1">forEach</span><span style="color:#e36209">(</span><span style="color:#5a32a3">(</span><span style="color:#E36209">n</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> topo_sort</span><span style="color:#5a32a3">(</span><span style="color:#24292E">n</span><span style="color:#5a32a3">)</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">  sorted.</span><span style="color:#6F42C1">push</span><span style="color:#e36209">(</span><span style="color:#24292E">node</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"><span style="color:#24292E">nodes.</span><span style="color:#6F42C1">forEach</span><span style="color:#005cc5">(</span><span style="color:#e36209">(</span><span style="color:#E36209">n</span><span style="color:#e36209">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#6F42C1"> topo_sort</span><span style="color:#e36209">(</span><span style="color:#24292E">n</span><span style="color:#e36209">)</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span></code></pre>
<p>由于每个顶点只访问了一遍，复杂度显然为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></p>
<p>再考虑拓补排序回溯的过程本身已经求出了该点的前置，因此可以把 fn 放在这里计算。 <code>computed</code> 伪代码如下：</p>

<span class="line"><span style="color:#6F42C1">    in_context</span><span style="color:#5a32a3">(</span><span style="color:#24292E">closure, </span><span style="color:#005cc5">(</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#D73A49">></span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#24292E">      cached_val </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> fn</span><span style="color:#e36209">(</span><span style="color:#e36209">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">    </span><span style="color:#005cc5">}</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>

<span class="line"><span style="color:#D73A49">    get</span><span style="color:#6F42C1"> value</span><span style="color:#5a32a3">(</span><span style="color:#5a32a3">)</span><span style="color:#24292E"> </span><span style="color:#5a32a3">{</span></span>

<span class="line"><span style="color:#D73A49">      if</span><span style="color:#24292E"> </span><span style="color:#005cc5">(</span><span style="color:#D73A49">!</span><span style="color:#24292E">cached</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#D73A49">return</span><span style="color:#24292E">;</span></span>

<p>这里的关键在于我们把整个得到的 <code>ComputedRef</code> 变成了静态的：上游更新某个节点以后，调用 <code>recursiveUncache</code> 递归地把其按拓扑序的所有子节点全部设为缓存失效状态，但不进行 <code>fn</code> 的计算。由于一个处于缓存失效状态的节点，其子节点必然已经先行被缓存失效，因此每个节点只会 <code>uncache</code> 一次。也就是说，更改的最坏时间复杂度为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span> 没有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span>。</p>
<p>此时，某个元素可以进行多次更改；由于都是懒计算的，多次更改也不会触发计算属性的计算。这一点我们可以用如下的 vue 代码证实：</p>

<span class="line"><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"></span>

<span class="line"><span style="color:#24292E">a.value </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 11451</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">a.value </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114514</span><span style="color:#24292E">;</span></span>
<span class="line"></span>

<span class="line"><span style="color:#24292E">a.value </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 11451</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">a.value </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 1145</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#24292E">a.value </span><span style="color:#D73A49">=</span><span style="color:#005CC5"> 114</span><span style="color:#24292E">;</span></span>

<p>这样我们就初步写好了一个 <code>computed</code>。其时间复杂度是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mi>T</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(nT)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mclose">)</span></span></span></span></p>
