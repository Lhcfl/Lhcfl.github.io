ition-colors text-ink-soft hover:text-ink">About</a><!--/--><button class="w-fit transition-colors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#subtyping" class="text-ink-soft hover:text-accent">Subtyping</a></li><li _hk=0010070l110 class="" style="padding-left:24px"><a href="#prod-and-sum-type" class="text-ink-soft hover:text-accent">Prod and Sum type</a></li><li _hk=0010070l120 class="" style="padding-left:24px"><a href="#function-type" class="text-ink-soft hover:text-accent">Function Type</a></li><li _hk=0010070l130 class="" style="padding-left:24px"><a href="#quantified-type" class="text-ink-soft hover:text-accent">Quantified Type</a></li><li _hk=0010070l140 class="" style="padding-left:12px"><a href="#singleton-kinds" class="text-ink-soft hover:text-accent">Singleton Kinds</a></li><li _hk=0010070l150 class="" style="padding-left:24px"><a href="#dependent-kinds" class="text-ink-soft hover:text-accent">Dependent Kinds</a></li><li _hk=0010070l160 class="" style="padding-left:24px"><a href="#higher-singletons" class="text-ink-soft hover:text-accent">Higher Singletons</a></li></ul></nav></aside></div></div></body></html><script>($R[21]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"PFPL 笔记 - VII Subtyping",date:"2025-05-16T16:14:45",tags:$R[11]=[],categories:$R[12]=["Practical Foundations for Programming Languages"],copyright:"CC BY-NC-SA 4.0"},titleHtml:"PFPL 笔记 - VII Subtyping",html:"\x3Cp>笔记 8 子类型\x3C/p>\n\x3C!-- more -->\n\x3Ch2 id=\"subtyping\">\x3Ca href=\"#subtyping\">Subtyping\x3C/a>\x3C/h2>\n\x3Cp>子类型是大家用的很多的东西，简单来说，\x3Cdel>里氏替换原则\x3C/del> 如果 τ₁ &#x3C;: τ 则 任何需要 τ 类型的地方都可能在任何时候被 provide 一个 τ₁ 的值\x3C/p>\n\x3Cp>子类型是一个 pre-order. 显然不是一个 total order. 但是为什么不是一个 partial order?\x3C/p>\n\x3Cp>（可能是因为存在 \x3Ccode>class T1 &#x3C; T {}\x3C/code> 这种东西，在 norminal type 的情况下二者不等但是理论上可以互相替换吧，我们这章节似乎没有对 eq 做一个很好的定义）\x3C/p>\n\x3Cp>比如 int &#x3C;: rat &#x3C;: real\x3C/p>\n\x3Ch3 id=\"prod-and-sum-type\">\x3Ca href=\"#prod-and-sum-type\">Prod and Sum type\x3C/a>\x3C/h3>\n\x3Cp>\x3Cimg src=\"/images/sum_prod_type_variance.png\" alt=\"\">\x3C/p>\n\x3Cp>这里看上去 prod type 是“逆变”的而 sum type 是“协变” 的，为什么？（虽然我不觉得在这里下标集合算逆变/协变性）\x3C/p>\n\x3Cp>因为 sum type 是只有其中的某一个，那么大的下标集合会包含小的那个下标集合的所有可能取值，所以小的 I 产生的是大的 J 产生的子类型\x3C/p>\n\x3Cp>prod type 是包含所有的，那么大的集合会包含小的那个集合的所有信息，所以大的集合是小集合的子类型\x3C/p>\n\x3Cp>（很难不吐槽一下子类型是十分复杂的东西）\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/prod_and_sum_type_variance_2.png\" alt=\"\">\x3C/p>\n\x3Cp>这是当类型的分量是子类型的时候的子类型关系，可以看出这显然是协变的，很符合直觉\x3C/p>\n\x3Ch3 id=\"function-type\">\x3Ca href=\"#function-type\">Function Type\x3C/a>\x3C/h3>\n\x3Cp>函数类型的子类型的两条基本规则比较显然，我们以 Nat 和 Int 为例子\x3C/p>\n\x3Cp>假如有 \x3Ccode>f : Int -> Int\x3C/code> ，考虑将定义域缩小， \x3Ccode>f': Nat -> Int\x3C/code> ，注意到 \x3Ccode>f'(-1)\x3C/code> 没有定义，所以 \x3Ccode>f'\x3C/code> 并不 &#x3C;: \x3Ccode>f\x3C/code>\x3C/p>\n\x3Cp>考虑将定义域扩大， \x3Ccode>f': Real -> Int\x3C/code> ，注意到 \x3Ccode>f'\x3C/code> 对所有 \x3Ccode>f\x3C/code> 可接受的输入产生合适的输出，所以 \x3Ccode>f' &#x3C;: f\x3C/code>\x3C/p>\n\x3Cp>\x3Ccode>Int &#x3C;: Real\x3C/code>，同时 \x3Ccode>Real -> Int &#x3C;: Int -> Int\x3C/code>\x3C/p>\n\x3Cp>同理，将值域扩大和缩小也能推出类似的规则，综上所述， function type 在定义域上逆变，在值域上协变。\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/function_types_variance.png\" alt=\"\">\x3C/p>\n\x3Ch3 id=\"quantified-type\">\x3Ca href=\"#quantified-type\">Quantified Type\x3C/a>\x3C/h3>\n\x3Cp>\x3Cimg src=\"/images/quantified_type_variance.png\" alt=\"\">\x3C/p>\n\x3Cp>这两条规则都比较直白，很好看懂\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/quantified_type_variance_2.png\" alt=\"\">\x3C/p>\n\x3Cp>这两条关系要抽象很多，而且 23.11 作者还写错了呃呃，第二个 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmsup>\x3Cmi>τ\x3C/mi>\x3Cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\x3C/mo>\x3C/msup>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\tau'\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7519em;\">\x3C/span>\x3Cspan class=\"mord\">\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3Cspan class=\"msupsub\">\x3Cspan class=\"vlist-t\">\x3Cspan class=\"vlist-r\">\x3Cspan class=\"vlist\" style=\"height:0.7519em;\">\x3Cspan style=\"top:-3.063em;margin-right:0.05em;\">\x3Cspan class=\"pstrut\" style=\"height:2.7em;\">\x3C/span>\x3Cspan class=\"sizing reset-size6 size3 mtight\">\x3Cspan class=\"mord mtight\">\x3Cspan class=\"mord mtight\">′\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/span> 应该是 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>τ\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\tau\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>总而言之，首先让我们看看 universal type 的 contravariant 性质，让我们写一坨 ts 代码方便理解：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#E36209\">a\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#005CC5\"> number\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> B\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#E36209\">b\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#005CC5\"> string\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// 注意 typescript 是 structural type，可以认为这里自带一个 forall\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// ∀ t : A, t -> A | undefined\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> id_a\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">a\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> |\x3C/span>\x3Cspan style=\"color:#005CC5\"> undefined\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#24292E\"> a;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// ∀ t : A | B, t -> A | undefined\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> id_a_or_b\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">a\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> |\x3C/span>\x3Cspan style=\"color:#6F42C1\"> B\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> |\x3C/span>\x3Cspan style=\"color:#005CC5\"> undefined\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#005CC5\"> undefined\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// ∀ t : A &#x26; B, t -> A | undefined\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> id_a_and_b\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">a\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> &#x26;\x3C/span>\x3Cspan style=\"color:#6F42C1\"> B\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#6F42C1\"> A\x3C/span>\x3Cspan style=\"color:#D73A49\"> |\x3C/span>\x3Cspan style=\"color:#005CC5\"> undefined\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">  return\x3C/span>\x3Cspan style=\"color:#24292E\"> a;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// A is a subtype of A | B\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// A &#x26; B is a subtype of A\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// so id_a_or_b is a subtype of id_a\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// and id_a is a subtype of id_a_and_b\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6A737D\">// universal quantification is contravariant\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">function\x3C/span>\x3Cspan style=\"color:#6F42C1\"> test\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#E36209\">fn\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#D73A49\"> typeof\x3C/span>\x3Cspan style=\"color:#24292E\"> id_a\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#6F42C1\">test\x3C/span>\x3Cspan style=\"color:#005cc5\">(\x3C/span>\x3Cspan style=\"color:#24292E\">id_a\x3C/span>\x3Cspan style=\"color:#005cc5\">)\x3C/span>\x3Cspan style=\"color:# class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">in\x3C/span>\x3Cspan class=\"mord mathnormal\">t\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 这样的东西，接受一个类型返回一个类型的构造子\x3C/p>\n\x3Cp>但没法非常 exactly 地表达 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>i\x3C/mi>\x3Cmi>d\x3C/mi>\x3Cmo>:\x3C/mo>\x3Cmi>T\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmi>T\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">id: T \\to T\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">i\x3C/span>\x3Cspan class=\"mord mathnormal\">d\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">:\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3C/span>\x3C/span>\x3C/span> 或者 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>H\x3C/mi>\x3Cmi>P\x3C/mi>\x3Cmo>:\x3C/mo>\x3Cmi>T\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmi>T\x3C/mi>\x3Cmo>×\x3C/mo>\x3Cmi>T\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">HP: T \\to T \\times T\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0813em;\">H\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">:\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">×\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>（应该说）\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">id \x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#D73A49\">-\x3C/span>\x3Cspan style=\"color:#D73A49\">>\x3C/span>\x3Cspan style=\"color:#24292E\"> a\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Cp>这样的东西的准确的性质，因为没法表达出这些 T 相同。你确实能构造出一个 id 来但没法表达出它是 id 的那个相等的性质。\x3C/p>\n\x3Cp>（也就是说，直接用 universal type 的表达力不够）\x3C/p>\n\x3Cp>引入 dependent kinds，\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/dependent_kinds.png\" alt=\"\">\x3C/p>\n\x3Cp>为什么要用 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmo>∑\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\sum\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">∑\x3C/span>\x3C/span>\x3C/span>\x3C/span> 表示 prod，用 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmo>∏\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\prod\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">∏\x3C/span>\x3C/span>\x3C/span>\x3C/span> 表示 arrow 呢？这确实有点呃抽象。但写都这么写了也就这样吧。\x3C/p>\n\x3Cp>或许我们能从信息论的角度去理解，\x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>a\x3C/mi>\x3Cmo separator=\"true\">,\x3C/mo>\x3Cmi>b\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">(a, b)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3Cspan class=\"mpunct\">,\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 的信息实际上是两个东西信息的和 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>a\x3C/mi>\x3Cmo>+\x3C/mo>\x3Cmi>b\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">a + b\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">+\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3C/span>\x3C/span>\x3C/span> 而 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>a\x3C/mi>\x3Cmo>→\x3C/mo>\x3Cmi>b\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">a \\to b\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">→\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3C/span>\x3C/span>\x3C/span> 的信息量实际上是 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>a\x3C/mi>\x3Cmo>×\x3C/mo>\x3Cmi>b\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">a \\times b\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">a\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3Cspan class=\"mbin\">×\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.6944em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">b\x3C/span>\x3C/span>\x3C/span>\x3C/span> （列表就知道）\x3C/p>\n\x3Cp>（同学观点：实际上是 dependent sum 和 dependent prod：）\x3C/p>\n\x3Cp>考虑一个 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmo>∑\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">\\sum\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">∑\x3C/span>\x3C/span>\x3C/span>\x3C/span> 它实际上给定了第一个参数 第二个就被确定了 这实际上是 sum 的性质，虽然有很多种可能性但是给定了第一个只能唯一的是第二个\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/Pasted%20image%2020250523164844.png\" alt=\"\">\x3C/p>\n\x3Cp>有了这个 dependent kinds 我们就能表达出像上面这样的函数的类型，它接受一个 pair 返回它们的交换（和下面这个差不多）\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#24292E\">swap_pair \x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#24292E\"> a \x3C/span>\x3Cspan style=\"color:#D73A49\">×\x3C/span>\x3Cspan style=\"color:#24292E\"> b \x3C/span>\x3Cspan style=\"color:#D73A49\">→\x3C/span>\x3Cspan style=\"color:#24292E\"> b \x3C/span>\x3Cspan style=\"color:#D73A49\">×\x3C/span>\x3Cspan style=\"color:#24292E\"> a\x3C/span>\x3C/span>\x3C/code>\x3C/pre>\n\x3Ch3 id=\"higher-singletons\">\x3Ca href=\"#higher-singletons\">Higher Singletons\x3C/a>\x3C/h3>\n\x3Cp>我们 require c :: T 来构造 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>S\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>c\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S(c)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">c\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 所以现在我们引入 higher kinds 来让 \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>S\x3C/mi>\x3Cmo stretchy=\"false\">(\x3C/mo>\x3Cmi>c\x3C/mi>\x3Cmo>:\x3C/mo>\x3Cmo>:\x3C/mo>\x3Cmi>κ\x3C/mi>\x3Cmo stretchy=\"false\">)\x3C/mo>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">S(c::\\kappa)\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S\x3C/span>\x3Cspan class=\"mopen\">(\x3C/span>\x3Cspan class=\"mord mathnormal\">c\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3Cspan class=\"mrel\">::\x3C/span>\x3Cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\x3C/span>\x3C/span>\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">κ\x3C/span>\x3Cspan class=\"mclose\">)\x3C/span>\x3C/span>\x3C/span>\x3C/span> 也能 equivalent to \x3Cspan class=\"katex\">\x3Cspan class=\"katex-mathml\">\x3Cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\x3Csemantics>\x3Cmrow>\x3Cmi>c\x3C/mi>\x3C/mrow>\x3Cannotation encoding=\"application/x-tex\">c\x3C/annotation>\x3C/semantics>\x3C/math>\x3C/span>\x3Cspan class=\"katex-html\" aria-hidden=\"true\">\x3Cspan class=\"base\">\x3Cspan class=\"strut\" style=\"height:0.4306em;\">\x3C/span>\x3Cspan class=\"mord mathnormal\">c\x3C/span>\x3C/span>\x3C/span>\x3C/span>\x3C/p>\n\x3Cp>\x3Cimg src=\"/images/Pasted%20image%2020250523170626.png\" alt=\"\">\x3C/p>\n\x3Cp>24.13b 和 24.13c 是两条分配律\x3C/p>\n\x3Cp>dependent kind 的一个实际应用可以用 TypeScript 举例子：\x3C/p>\n\x3Cpre class=\"shiki github-light\" style=\"background-color:#fff;color:#24292e\" tabindex=\"0\">\x3Ccode>\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> Shape\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#032F62\"> \"circle\"\x3C/span>\x3Cspan style=\"color:#D73A49\"> |\x3C/span>\x3Cspan style=\"color:#032F62\"> \"square\"\x3C/span>\x3Cspan style=\"color:#24292E\">;\x3C/span>\x3C/span>\n\x3Cspan class=\"line\">\x3Cspan style=\"color:#D73A49\">type\x3C/span>\x3Cspan style=\"color:#6F42C1\"> CircleConfig\x3C/span>\x3Cspan style=\"color:#D73A49\"> =\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">{\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#E36209\">radius\x3C/span>\x3Cspan style=\"color:#D73A49\">:\x3C/span>\x3Cspan style=\"color:#005CC5\"> number\x3C/span>\x3Cspan style=\"color:#24292E\"> \x3C/span>\x3Cspan style=\"color:#005cc5\">}\x3C/span>\x3Cspan style=\"color:#24 <!-- more -->
<h2 id="subtyping"><a href="#subtyping">Subtyping</a></h2>
<p>子类型是大家用的很多的东西，简单来说，<del>里氏替换原则</del> 如果 τ₁ &#x3C;: τ 则 任何需要 τ 类型的地方都可能在任何时候被 provide 一个 τ₁ 的值</p>
<p>子类型是一个 pre-order. 显然不是一个 total order. 但是为什么不是一个 partial order?</p>
<p>（可能是因为存在 <code>class T1 &#x3C; T {}</code> 这种东西，在 norminal type 的情况下二者不等但是理论上可以互相替换吧，我们这章节似乎没有对 eq 做一个很好的定义）</p>
<p>比如 int &#x3C;: rat &#x3C;: real</p>
<h3 id="prod-and-sum-type"><a href="#prod-and-sum-type">Prod and Sum type</a></h3>
<p><img src="/images/sum_prod_type_variance.png" alt=""></p>
<p>这里看上去 prod type 是“逆变”的而 sum type 是“协变” 的，为什么？（虽然我不觉得在这里下标集合算逆变/协变性）</p>
<p>因为 sum type 是只有其中的某一个，那么大的下标集合会包含小的那个下标集合的所有可能取值，所以小的 I 产生的是大的 J 产生的子类型</p>
<p>prod type 是包含所有的，那么大的集合会包含小的那个集合的所有信息，所以大的集合是小集合的子类型</p>
<p>（很难不吐槽一下子类型是十分复杂的东西）</p>
<p><img src="/images/prod_and_sum_type_variance_2.png" alt=""></p>
<p>这是当类型的分量是子类型的时候的子类型关系，可以看出这显然是协变的，很符合直觉</p>
<h3 id="function-type"><a href="#function-type">Function Type</a></h3>
<p>函数类型的子类型的两条基本规则比较显然，我们以 Nat 和 Int 为例子</p>
<p>假如有 <code>f : Int -> Int</code> ，考虑将定义域缩小， <code>f': Nat -> Int</code> ，注意到 <code>f'(-1)</code> 没有定义，所以 <code>f'</code> 并不 &#x3C;: <code>f</code></p>
<p>考虑将定义域扩大， <code>f': Real -> Int</code> ，注意到 <code>f'</code> 对所有 <code>f</code> 可接受的输入产生合适的输出，所以 <code>f' &#x3C;: f</code></p>
<p><code>Int &#x3C;: Real</code>，同时 <code>Real -> Int &#x3C;: Int -> Int</code></p>
<p>同理，将值域扩大和缩小也能推出类似的规则，综上所述， function type 在定义域上逆变，在值域上协变。</p>
<p><img src="/images/function_types_variance.png" alt=""></p>
<h3 id="quantified-type"><a href="#quantified-type">Quantified Type</a></h3>
<p><img src="/images/quantified_type_variance.png" alt=""></p>
<p>这两条规则都比较直白，很好看懂</p>
<p><img src="/images/quantified_type_variance_2.png" alt=""></p>
<p>这两条关系要抽象很多，而且 23.11 作者还写错了呃呃，第二个 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>τ</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow><annotation encoding="application/x-tex">\tau'</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7519em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span> 应该是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>τ</mi></mrow><annotation encoding="application/x-tex">\tau</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span></span></span></span></p>
<p>总而言之，首先让我们看看 universal type 的 contravariant 性质，让我们写一坨 ts 代码方便理解：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#24292E"> </span><span style="color:#E36209">a</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> number</span><span style="color:#24292E"> </span><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> B</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#24292E"> </span><span style="color:#E36209">b</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> string</span><span style="color:#24292E"> </span><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// 注意 typescript 是 structural type，可以认为这里自带一个 forall</span></span>
<span class="line"><span style="color:#6A737D">// ∀ t : A, t -> A | undefined</span></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> id_a</span><span style="color:#005cc5">(</span><span style="color:#E36209">a</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#005cc5">)</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> |</span><span style="color:#005CC5"> undefined</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> a;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// ∀ t : A | B, t -> A | undefined</span></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> id_a_or_b</span><span style="color:#005cc5">(</span><span style="color:#E36209">a</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> |</span><span style="color:#6F42C1"> B</span><span style="color:#005cc5">)</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> |</span><span style="color:#005CC5"> undefined</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#005CC5"> undefined</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// ∀ t : A &#x26; B, t -> A | undefined</span></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> id_a_and_b</span><span style="color:#005cc5">(</span><span style="color:#E36209">a</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> &#x26;</span><span style="color:#6F42C1"> B</span><span style="color:#005cc5">)</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> A</span><span style="color:#D73A49"> |</span><span style="color:#005CC5"> undefined</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#D73A49">  return</span><span style="color:#24292E"> a;</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// A is a subtype of A | B</span></span>
<span class="line"><span style="color:#6A737D">// A &#x26; B is a subtype of A</span></span>
<span class="line"><span style="color:#6A737D">// so id_a_or_b is a subtype of id_a</span></span>
<span class="line"><span style="color:#6A737D">// and id_a is a subtype of id_a_and_b</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6A737D">// universal quantification is contravariant</span></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> test</span><span style="color:#005cc5">(</span><span style="color:#E36209">fn</span><span style="color:#D73A49">:</span><span style="color:#D73A49"> typeof</span><span style="color:#24292E"> id_a</span><span style="color:#005cc5">)</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">test</span><span style="color:#005cc5">(</span><span style="color:#24292E">id_a</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// ok</span></span>
<span class="line"><span style="color:#6F42C1">test</span><span style="color:#005cc5">(</span><span style="color:#24292E">id_a_or_b</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// ok</span></span>
<span class="line"><span style="color:#6F42C1">test</span><span style="color:#005cc5">(</span><span style="color:#24292E">id_a_and_b</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// error</span></span>
<span class="line"><span style="color:#6A737D">// 类型“(a: A &#x26; B) => A | undefined”的参数不能赋给类型“(a: A) => A | undefined”的参数。</span></span>
<span class="line"><span style="color:#6A737D">//   参数“a”和“a” 的类型不兼容。</span></span>
<span class="line"><span style="color:#6A737D">//     不能将类型“A”分配给类型“A &#x26; B”。</span></span>
<span class="line"><span style="color:#6A737D">//       类型 "A" 中缺少属性 "b"，但类型 "B" 中需要该属性。ts(2345)</span></span></code></pre>
<p>存在类型的协变性质可以用它的 universal type 表示法解释，</p>
<p>因为 ∃ t . τ == ∀ u . (∀ t . τ → u) → u</p>
<p>所以两次逆变（ ∀ t . τ → u 的 t 逆变一次，它作为 → 的定义域逆变一次 ），我们可以知道 extensial type 是协变的</p>
<h2 id="singleton-kinds"><a href="#singleton-kinds">Singleton Kinds</a></h2>
<p>其实我没很明白这里的 Singleton 和 design patterns 的 singleton 有什么关系。或许它的意义是一个集合中只有一个元素吧。</p>
<p>Singleton Kind： 我们可以把所有和 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>τ</mi></mrow><annotation encoding="application/x-tex">\tau</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span></span></span></span> 相等的东西记做 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">S(\tau)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.1132em;">τ</span><span class="mclose">)</span></span></span></span></p>
<p>Subkinding: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>κ</mi><mn>1</mn></msub><mo>:</mo><mo>&#x3C;</mo><mo>:</mo><msub><mi>κ</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\kappa_1 :&#x3C;: \kappa_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6891em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">κ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:&#x3C;:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">κ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></p>
<p>我们现在在这里就给 type 配备了一个相等性 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>≡</mo></mrow><annotation encoding="application/x-tex">\equiv</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4637em;"></span><span class="mrel">≡</span></span></span></span></p>
<span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle scriptlevel="0" displaystyle="true"><mfrac><mrow><mi mathvariant="normal">Δ</mi><mo>⊢</mo><mi>c</mi><mo>:</mo><mo>:</mo><mi>S</mi><mo stretchy="false">(</mo><mi>d</mi><mo stretchy="false">)</mo></mrow><mrow><mi mathvariant="normal">Δ</mi><mo>⊢</mo><mi>c</mi><mo>≡</mo><mi>d</mi><mo>:</mo><mo>:</mo><mtext>Type</mtext></mrow></mfrac></mstyle></mrow><annotation encoding="application/x-tex">\dfrac{\Delta \vdash c :: S(d)}
{\Delta \vdash c \equiv d :: \text{Type}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:2.3074em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">Δ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⊢</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≡</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">::</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord text"><span class="mord">Type</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">Δ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⊢</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">::</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal">d</span><span class="mclose">)</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span>
<p>详细规则见</p>
<p><img src="/images/Pasted%20image%2020250523163255.png" alt=""></p>
<h3 id="dependent-kinds"><a href="#dependent-kinds">Dependent Kinds</a></h3>
<p>higher kinds 可以表达一个 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>→</mo><mi>S</mi><mo stretchy="false">(</mo><mi>i</mi><mi>n</mi><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">T \to S(int)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal">in</span><span class="mord mathnormal">t</span><span class="mclose">)</span></span></span></span> 这样的东西，接受一个类型返回一个类型的构造子</p>
<p>但没法非常 exactly 地表达 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi><mi>d</mi><mo>:</mo><mi>T</mi><mo>→</mo><mi>T</mi></mrow><annotation encoding="application/x-tex">id: T \to T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">i</span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 或者 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>H</mi><mi>P</mi><mo>:</mo><mi>T</mi><mo>→</mo><mi>T</mi><mo>×</mo><mi>T</mi></mrow><annotation encoding="application/x-tex">HP: T \to T \times T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span></p>
<p>（应该说）</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">id </span><span style="color:#D73A49">:</span><span style="color:#24292E"> a </span><span style="color:#D73A49">-</span><span style="color:#D73A49">></span><span style="color:#24292E"> a</span></span></code></pre>
<p>这样的东西的准确的性质，因为没法表达出这些 T 相同。你确实能构造出一个 id 来但没法表达出它是 id 的那个相等的性质。</p>
<p>（也就是说，直接用 universal type 的表达力不够）</p>
<p>引入 dependent kinds，</p>
<p><img src="/images/dependent_kinds.png" alt=""></p>
<p>为什么要用 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∑</mo></mrow><annotation encoding="application/x-tex">\sum</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span></span></span></span> 表示 prod，用 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∏</mo></mrow><annotation encoding="application/x-tex">\prod</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop op-symbol small-op" style="position:relative;top:0em;">∏</span></span></span></span> 表示 arrow 呢？这确实有点呃抽象。但写都这么写了也就这样吧。</p>
<p>或许我们能从信息论的角度去理解，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>a</mi><mo separator="true">,</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(a, b)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">b</span><span class="mclose">)</span></span></span></span> 的信息实际上是两个东西信息的和 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">a + b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span> 而 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mo>→</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">a \to b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span> 的信息量实际上是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mo>×</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">a \times b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span> （列表就知道）</p>
<p>（同学观点：实际上是 dependent sum 和 dependent prod：）</p>
<p>考虑一个 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∑</mo></mrow><annotation encoding="application/x-tex">\sum</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span></span></span></span> 它实际上给定了第一个参数 第二个就被确定了 这实际上是 sum 的性质，虽然有很多种可能性但是给定了第一个只能唯一的是第二个</p>
<p><img src="/images/Pasted%20image%2020250523164844.png" alt=""></p>
<p>有了这个 dependent kinds 我们就能表达出像上面这样的函数的类型，它接受一个 pair 返回它们的交换（和下面这个差不多）</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">swap_pair </span><span style="color:#D73A49">:</span><span style="color:#24292E"> a </span><span style="color:#D73A49">×</span><span style="color:#24292E"> b </span><span style="color:#D73A49">→</span><span style="color:#24292E"> b </span><span style="color:#D73A49">×</span><span style="color:#24292E"> a</span></span></code></pre>
<h3 id="higher-singletons"><a href="#higher-singletons">Higher Singletons</a></h3>
<p>我们 require c :: T 来构造 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">S(c)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mclose">)</span></span></span></span> 所以现在我们引入 higher kinds 来让 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>c</mi><mo>:</mo><mo>:</mo><mi>κ</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">S(c::\kappa)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">::</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">κ</span><span class="mclose">)</span></span></span></span> 也能 equivalent to <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></p>
<p><img src="/images/Pasted%20image%2020250523170626.png" alt=""></p>
<p>24.13b 和 24.13c 是两条分配律</p>
<p>dependent kind 的一个实际应用可以用 TypeScript 举例子：</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> Shape</span><span style="color:#D73A49"> =</span><span style="color:#032F62"> "circle"</span><span style="color:#D73A49"> |</span><span style="color:#032F62"> "square"</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> CircleConfig</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#24292E"> </span><span style="color:#E36209">radius</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> number</span><span style="color:#24292E"> </span><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> SquareConfig</span><span style="color:#D73A49"> =</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span><span style="color:#24292E"> </span><span style="color:#E36209">sideLength</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> number</span><span style="color:#24292E"> </span><span style="color:#005cc5">}</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#D73A49">type</span><span style="color:#6F42C1"> Config</span><span style="color:#005cc5">&#x3C;</span><span style="color:#6F42C1">S</span><span style="color:#D73A49"> extends</span><span style="color:#6F42C1"> Shape</span><span style="color:#005cc5">></span><span style="color:#24292E"> </span><span style="color:#D73A49">=</span><span style="color:#6F42C1"> S</span><span style="color:#D73A49"> extends</span><span style="color:#032F62"> "circle"</span></span>
<span class="line"><span style="color:#D73A49">  ?</span><span style="color:#6F42C1"> CircleConfig</span></span>
<span class="line"><span style="color:#D73A49">  :</span><span style="color:#6F42C1"> S</span><span style="color:#D73A49"> extends</span><span style="color:#032F62"> "square"</span></span>
<span class="line"><span style="color:#D73A49">  ?</span><span style="color:#6F42C1"> SquareConfig</span></span>
<span class="line"><span style="color:#D73A49">  :</span><span style="color:#005CC5"> never</span><span style="color:#24292E">;</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D73A49">function</span><span style="color:#6F42C1"> createShape</span><span style="color:#005cc5">&#x3C;</span><span style="color:#6F42C1">S</span><span style="color:#D73A49"> extends</span><span style="color:#6F42C1"> Shape</span><span style="color:#005cc5">></span><span style="color:#005cc5">(</span><span style="color:#E36209">shapeType</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> S</span><span style="color:#24292E">, </span><span style="color:#E36209">config</span><span style="color:#D73A49">:</span><span style="color:#6F42C1"> Config</span><span style="color:#e36209">&#x3C;</span><span style="color:#6F42C1">S</span><span style="color:#e36209">></span><span style="color:#005cc5">)</span><span style="color:#D73A49">:</span><span style="color:#005CC5"> void</span><span style="color:#24292E"> </span><span style="color:#005cc5">{</span></span>
<span class="line"><span style="color:#6A737D">  // ....</span></span>
<span class="line"><span style="color:#005cc5">}</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">createShape</span><span style="color:#005cc5">(</span><span style="color:#032F62">"circle"</span><span style="color:#24292E">, </span><span style="color:#e36209">{</span><span style="color:#24292E"> radius: </span><span style="color:#005CC5">10</span><span style="color:#24292E"> </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">createShape</span><span style="color:#005cc5">(</span><span style="color:#032F62">"square"</span><span style="color:#24292E">, </span><span style="color:#e36209">{</span><span style="color:#24292E"> sideLength: </span><span style="color:#005CC5">5</span><span style="color:#24292E"> </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
<span class="line"><span style="color:#6F42C1">createShape</span><span style="color:#005cc5">(</span><span style="color:#032F62">"circle"</span><span style="color:#24292E">, </span><span style="color:#e36209">{</span><span style="color:#24292E"> sideLength: </span><span style="color:#005CC5">5</span><span style="color:#24292E"> </span><span style="color:#e36209">}</span><span style="color:#005cc5">)</span><span style="color:#24292E">; </span><span style="color:#6A737D">// fail~~~~</span></span></code></pre></div><!--/--><div class="mt-10 flex flex-wrap items-baseline gap-x-6 gap-y-2 border-t border-rule pt-4 font-sans text-xs text-ink-faint"><!--$--><span _hk=0010070c003100036d0 class="inline-flex items-center gap-1.5"><span class="i-lucide-creative-commons inline-block shrink-0" aria-hidden="true"></span><!--$--><a _hk=0010070c003100036d30 class="transition-colors hover:text-accent" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en">CC BY-NC-SA 4.0</a><!--/--></span><!--/--><div class="ml-auto flex flex-wrap items-baseline gap-x-4 gap-y-1"><time class="tabular-nums">May 16, 2025</time><!--$--><!--/--></div></div><!--$--><nav _hk=0010070c003100036j class="mt-10 grid gap-4 sm:grid-cols-2 sm:gap-8"><div><a _hk=0010070c003100036m0 class="group block" href="/blog/2025-05-12-algebraic-effect"><span class="font-sans text-xs text-ink-faint">Previous</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036m30 class="">简单接触 Algebraic Effects</span></span></a></div><div class="sm:text-right"><a _hk=0010070c003100036p0 class="group block" href="/blog/2025-05-21-suisuinian"><span class="font-sans text-xs text-ink-faint">Next</span><span class="mt-1 block leading-snug font-bold text-ink-soft transition-colors group-hover:text-accent"><span _hk=0010070c003100036p30 class="">碎碎念</span></span></a></div></nav><!--/--><!--$--><!--/--><p class="mt-10 text-center text-sm"><a class="text-accen
