lors text-ink-soft hover:text-ink" type="button">More</button><div class="shrink-1 grow-1"></div><a class="i-lucide-search" href="/search"></a></nav><!--$--><!--/--></header><!--/--><main class="pb-20 pt-16"><template id="pl-0010070c"></template><p _hk=0010070c0 class="py-20 text-center text-ink-faint">Loading…</p><!--pl-0010070c--></main><!--$--><footer _hk=0010070d class="border-t border-rule py-10 text-center text-xs text-ink-faint"><p><!--$-->Linca<!--/--> · <!--$-->Zero Calorie Drink Shop<!--/--></p></footer><!--/--></div><aside class="_col_zrvho_13 _right_zrvho_51"><nav _hk=0010070l0 class="text-base"><p class="mb-3 font-sans text-ink-faint">Contents</p><ul class="grid gap-1"><li _hk=0010070l100 class="" style="padding-left:12px"><a href="#welcome-to-chelationland" class="text-ink-soft hover:text-accent">Welcome to Chelationland</a></li><li _hk=0010070l110 class="" style="padding-left:12px"><a href="#about-this-blog" class="text-ink-soft hover:text-accent">About This Blog</a></li><li _hk=0010070l120 class="" style="padding-left:12px"><a href="#copyright" class="text-ink-soft hover:text-accent">Copyright</a></li><li _hk=0010070l130 class="" style="padding-left:12px"><a href="#footnote-label" class="text-ink-soft hover:text-accent">Footnotes</a></li></ul></nav></aside></div></div></body></html><script>($R[18]=(e,r)=>{e.s(r),e.p.s=1,e.p.v=r})($R[6],$R[9]={frontmatter:$R[10]={title:"About",thumbnail:"/images/welcome_to_chelationland.png",description:"Welcome to Chelationland",icon:"i-mingcute:user-3-line",tags:$R[11]=[],categories:$R[12]=[]},titleHtml:"About",html:"\x3Ch2 id=\"welcome-to-chelationland\">\x3Ca href=\"#welcome-to-chelationland\">Welcome to \x3Ca href=\"https://magireco.moe/wiki/Chelationland%E4%B9%8B%E8%B0%A3\">Chelationland\x3C/a>\x3C/a>\x3C/h2>\n\x3Cstyle>.about-ly p { margin: 0.35em 0; }\x3C/style>\n\x3Cdiv class=\"about-ly grid grid-cols-2 text-center font-lxgw\">\n\x3Cp>アラもう聞いた？誰から聞いた？\x3Cbr>\nキレーションランドのそのウワサ\x3C/p>\n\x3Cp>啊啦已经听说了？从谁那里听说的？\nChelationland的那个谣\x3C/p>\n\x3Cp>ノンビリ、ダラーッとハッピーになれちゃう\x3C/p>\n\x3Cp>让人变得悠然自得的\x3C/p>\n\x3Cp>ストレスフリーなテーマパークが\nグランドオープン♪\x3C/p>\n\x3Cp>没有压力的主题公园\n正式开业♪\x3C/p>\n\x3Cp>帰りたくなくなること間違いナシで\x3C/p>\n\x3Cp>你一定会变得不想回去\x3C/p>\n\x3Cp>いつまでもずーっといられちゃう！\x3C/p>\n\x3Cp>能够永远留在那里！\x3C/p>\n\x3Cp>だけど満員のときはアテンションプリーズ\x3C/p>\n\x3Cp>但是满员的时候请注意\x3C/p>\n\x3Cp>出たくない人はこの世から退場させられるって\n神浜市の人の間ではもっぱらのウワサ\x3C/p>\n\x3Cp>不想出去的人会被从人世间退场\n这是在神滨市里广为流传的传言\x3C/p>\n\x3Cp>まぁイイジャーン！\x3C/p>\n\x3Cp>不也挺好吗！\x3C/p>\n\x3C/div>\n\x3Cp>总而言之，你好，你可以叫我 Linca. 还有一个中文名字，你也可以叫我锦心。\x3C/p>\n\x3Cul>\n\x3Cli>🐱 childless \x3Cruby>azukisan\x3Crt>cat\x3C/rt>\x3C/ruby> girl.\x3C/li>\n\x3Cli>💻 你当然可以猜出来我在计算机方向。\x3C/li>\n\x3Cli>👻️ 幽灵一样活着。不知道何时变为鬼。\x3C/li>\n\x3C/ul>\n\x3Cp>我曾经会在这里说一些什么。然而，再开口，只剩下词穷。\x3C/p>\n\x3Cp>宇宙自诞生到现在已经过去了约 138 亿年。我们的太阳系诞生于约 46 亿年前。地球诞生于约 45 亿年前。生命诞生于约 38 亿年前。人类诞生于约 20 万年前。文明诞生于约 1 万年前。如果看到这个页面的你是人类，假如你能活到 100 岁，你大概能经历这个宇宙目前年龄的 0.000000725%。我们在之前的 138 亿年里没有活着。也在之后的 10¹⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰ 年继续死去。\x3C/p>\n\x3Cp>无论经历了什么，都会被时间抹去。爱与恨与痛苦，喜怒哀乐，思维和想法。存在是命运最残酷的玩笑。\x3C/p>\n\x3Cp>于是，我便没有什么可说的了。\x3C/p>\n\x3Cblockquote>\n\x3Cp>陋室空堂，当年笏满床；衰草枯杨，曾为歌舞场。\x3C/p>\n\x3C/blockquote>\n\x3Ch2 id=\"about-this-blog\">\x3Ca href=\"#about-this-blog\">About This Blog\x3C/a>\x3C/h2>\n\x3Cp>该博客曾经由 \x3Ca href=\"https://hexo.io/\">Hexo\x3C/a> 驱动，在 2025 年迁移到了 \x3Ca href=\"https://astro.build\">Astro\x3C/a>。现在仍在由 Astro 驱动。\x3C/p>\n\x3Cp>这个博客使用的主题在 \x3Ca href=\"https://github.com/Lhcfl/astro-theme-krypton2\">Krypton\x3C/a> 仓库公开。然而，由于 Astro 的工作方式，主题和博客内容是耦合的。主题仓库可能无法体现出博客内容的最新版本。\x3C/p>\n\x3Ch2 id=\"copyright\">\x3Ca href=\"#copyright\">Copyright\x3C/a>\x3C/h2>\n\x3Cp>如页脚所示。如果没有特别声明\x3Csup>\x3Ca href=\"#user-content-fn-note-1\" id=\"user-content-fnref-note-1\" data-footnote-ref aria-describedby=\"footnote-label\">1\x3C/a>\x3C/sup>，整个博客的内容均保留所有权利。\x3C/p>\n\x3Cp>特别地，在尊重下列条件的情况下：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Cstrong>署名\x3C/strong> — 您必须给出适当的署名，提供指向本许可协议的链接，同时标明是否（对原始作品）作了修改。您可以用任何合理的方式来署名，但是不得以任何方式暗示许可人为您或您的使用背书。\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Cstrong>非商业性使用\x3C/strong> — 您不得将本作品用于商业目的。\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Cstrong>禁止原样收录\x3C/strong> — 不允许在没有我的明确许可情况下，将指向我的博客的链接和/或博客内容收录于任意聚合页面、站点，除了以下白名单：\x3C/p>\n\x3Cul>\n\x3Cli>\x3Ca href=\"https://web.archive.org/\">https://web.archive.org/\x3C/a>\x3C/li>\n\x3C/ul>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Cstrong>尊重遗忘权\x3C/strong> — 我保留随时要求删除和撤下被使用的我的博客内容、以及相关链接的权利。\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Cp>允许任何人将我没有特别声明版权的博客内容：\x3C/p>\n\x3Cul>\n\x3Cli>\n\x3Cp>\x3Cstrong>不公开共享\x3C/strong> — 在不广泛可见\x3Csup>\x3Ca href=\"#user-content-fn-note-2\" id=\"user-content-fnref-note-2\" data-footnote-ref aria-describedby=\"footnote-label\">2\x3C/a>\x3C/sup>的区域复制、发行本作品\x3C/p>\n\x3C/li>\n\x3Cli>\n\x3Cp>\x3Cstrong>翻译\x3C/strong> — 将作品的片段或全部翻译成其他语言\x3C/p>\n\x3C/li>\n\x3C/ul>\n\x3Chr>\n\x3Csection data-footnotes class=\"footnotes\">\x3Ch2 class=\"sr-only\" id=\"footnote-label\">\x3Ca href=\"#footnote-label\">Footnotes\x3C/a>\x3C/h2>\n\x3Col>\n\x3Cli id=\"user-content-fn-note-1\">\n\x3Cp>有时，我会在某些博客内容上声明特别的版权信息，例如 CC BY-SA 4.0 等许可证。特别声明的版权信息会覆盖本节中描述的版权信息。 \x3Ca href=\"#user-content-fnref-note-1\" data-footnote-backref=\"\" aria-label=\"Back to reference 1\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3Cli id=\"user-content-fn-note-2\">\n\x3Cp>不广泛可见的区域指的是仅限特定人群访问的区域，例如私人群组、内部网络等。随机挑选一个人应该不能通过链接访问到这些区域。 \x3Ca href=\"#user-content-fnref-note-2\" data-footnote-backref=\"\" aria-label=\"Back to reference 2\" class=\"data-footnote-backref\">↩\x3C/a>\x3C/p>\n\x3C/li>\n\x3C/ol>\n\x3C/section>",headings:$R[13]=[$R[14]={depth:2,slug:"welcome-to-chelationland",text:"Welcome to Chelationland"},$R[15]={depth:2,slug:"about-this-blog",text:"About This Blog"},$R[16]={depth:2,slug:"copyright",text:"Copyright"},$R[17]={depth:2,slug:"footnote-label",text:"Footnotes"}]});$R[18]($R[8],$R[9]);</script><link rel="modulepreload" href="/assets/GitalkComments-KlTFna9p.js"><link rel="modulepreload" href="/assets/rolldown-runtime-hePW80VL.js"><script>_$HY.r["0010070c_assets"]=($R[19]={"0010070c0031000":"/asse "></span><!--$-->Email<!--/--></a></li></ul><!--$--><!--/--></header><div _hk=0010070c00310003660 class="markdown-body"><h2 id="welcome-to-chelationland"><a href="#welcome-to-chelationland">Welcome to <a href="https://magireco.moe/wiki/Chelationland%E4%B9%8B%E8%B0%A3">Chelationland</a></a></h2>
<style>.about-ly p { margin: 0.35em 0; }</style>
<div class="about-ly grid grid-cols-2 text-center font-lxgw">
<p>アラもう聞いた？誰から聞いた？<br>
キレーションランドのそのウワサ</p>
<p>啊啦已经听说了？从谁那里听说的？
Chelationland的那个谣</p>
<p>ノンビリ、ダラーッとハッピーになれちゃう</p>
<p>让人变得悠然自得的</p>
<p>ストレスフリーなテーマパークが
グランドオープン♪</p>
<p>没有压力的主题公园
正式开业♪</p>
<p>帰りたくなくなること間違いナシで</p>
<p>你一定会变得不想回去</p>
<p>いつまでもずーっといられちゃう！</p>
<p>能够永远留在那里！</p>
<p>だけど満員のときはアテンションプリーズ</p>
<p>但是满员的时候请注意</p>
<p>出たくない人はこの世から退場させられるって
神浜市の人の間ではもっぱらのウワサ</p>
<p>不想出去的人会被从人世间退场
这是在神滨市里广为流传的传言</p>
<p>まぁイイジャーン！</p>
<p>不也挺好吗！</p>
</div>
<p>总而言之，你好，你可以叫我 Linca. 还有一个中文名字，你也可以叫我锦心。</p>
<ul>
<li>🐱 childless <ruby>azukisan<rt>cat</rt></ruby> girl.</li>
<li>💻 你当然可以猜出来我在计算机方向。</li>
<li>👻️ 幽灵一样活着。不知道何时变为鬼。</li>
</ul>
<p>我曾经会在这里说一些什么。然而，再开口，只剩下词穷。</p>
<p>宇宙自诞生到现在已经过去了约 138 亿年。我们的太阳系诞生于约 46 亿年前。地球诞生于约 45 亿年前。生命诞生于约 38 亿年前。人类诞生于约 20 万年前。文明诞生于约 1 万年前。如果看到这个页面的你是人类，假如你能活到 100 岁，你大概能经历这个宇宙目前年龄的 0.000000725%。我们在之前的 138 亿年里没有活着。也在之后的 10¹⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰⁰ 年继续死去。</p>
<p>无论经历了什么，都会被时间抹去。爱与恨与痛苦，喜怒哀乐，思维和想法。存在是命运最残酷的玩笑。</p>
<p>于是，我便没有什么可说的了。</p>
<blockquote>
<p>陋室空堂，当年笏满床；衰草枯杨，曾为歌舞场。</p>
</blockquote>
