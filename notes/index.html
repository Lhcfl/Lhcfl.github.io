<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#E36209">result</span><span style="color:#D73A49"> =</span><span style="color:#6F42C1"> viewable_by</span><span style="color:#005cc5">(</span><span style="color:#24292E">user, </span><span style="color:#005CC5">order:</span><span style="color:#24292E"> order, </span><span style="color:#005CC5">preload:</span><span style="color:#24292E"> preload</span><span style="color:#005cc5">)</span></span>

<p>很好的运用了重绑定的做法，允许根据上下文动态调整查询条件。</p>

<ul>
<li>
<p>基础</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">a, b </span><span style="color:#D73A49">=</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = 2</span></span></code></pre>
</li>
<li>
<p>复杂的基础</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">a, </span><span style="color:#005cc5">(</span><span style="color:#24292E">b, c</span><span style="color:#005cc5">)</span><span style="color:#24292E">, d </span><span style="color:#D73A49">=</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#e36209">[</span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#e36209">]</span><span style="color:#24292E">, </span><span style="color:#005CC5">4</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = 2 ; c = 3 ; d = 4</span></span></code></pre>
</li>
<li>
<p>解构数组</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#24292E">a, </span><span style="color:#D73A49">*</span><span style="color:#24292E">b </span><span style="color:#D73A49">=</span><span style="color:#24292E"> </span><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#24292E">, </span><span style="color:#005CC5">4</span><span style="color:#005cc5">]</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = [2, 3, 4]</span></span></code></pre>
</li>
<li>
<p><code>in</code> 关键字</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#005cc5">]</span><span style="color:#24292E"> </span><span style="color:#D73A49">in</span><span style="color:#24292E"> a, b, c</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = 2 ; c = 3</span></span></code></pre>
</li>
<li>
<p><code>=></code></p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">, </span><span style="color:#005CC5">2</span><span style="color:#24292E">, </span><span style="color:#005CC5">3</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> a, b, c</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = 2 ; c = 3</span></span></code></pre>
<p>似乎只有右边放变量才能解构哈希</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">{</span><span style="color:#005CC5">a:</span><span style="color:#005CC5"> 1</span><span style="color:#24292E">, </span><span style="color:#005CC5">b:</span><span style="color:#005CC5"> 2</span><span style="color:#005cc5">}</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#005CC5">a:</span><span style="color:#24292E">, </span><span style="color:#005CC5">b:</span></span>
<span class="line"><span style="color:#6A737D"># a = 1 ; b = 2</span></span></code></pre>
</li>
<li>
<p>更奇怪的解构</p>
<p>通过类型来解构</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">2</span><span style="color:#24292E">,</span><span style="color:#005CC5">3</span><span style="color:#24292E">,</span><span style="color:#032F62">"str"</span><span style="color:#24292E">,</span><span style="color:#005CC5">4</span><span style="color:#24292E">,</span><span style="color:#005CC5">5</span><span style="color:#24292E">,</span><span style="color:#005CC5">6</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">*</span><span style="color:#24292E">a, </span><span style="color:#005CC5">String</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> b, </span><span style="color:#D73A49">*</span><span style="color:#24292E">c</span></span>
<span class="line"><span style="color:#6A737D"># a = [1, 2, 3] ; b = "str" ; c = [4, 5, 6]</span></span></code></pre>
<p>通过值来解构</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">2</span><span style="color:#24292E">,</span><span style="color:#005CC5">3</span><span style="color:#24292E">,</span><span style="color:#032F62">"str"</span><span style="color:#24292E">,</span><span style="color:#005CC5">4</span><span style="color:#24292E">,</span><span style="color:#005CC5">5</span><span style="color:#24292E">,</span><span style="color:#005CC5">6</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">*</span><span style="color:#24292E">a, </span><span style="color:#005CC5">4</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> b, </span><span style="color:#D73A49">*</span><span style="color:#24292E">c</span></span>
<span class="line"><span style="color:#6A737D"># a = [1, 2, 3, "str"] ; b = 4 ; c = [5, 6]</span></span></code></pre>
<p>但是类型不能是值……？</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#005cc5">[</span><span style="color:#005CC5">1</span><span style="color:#24292E">,</span><span style="color:#005CC5">2</span><span style="color:#24292E">,</span><span style="color:#005CC5">3</span><span style="color:#24292E">,</span><span style="color:#005CC5">String</span><span style="color:#24292E">,</span><span style="color:#005CC5">4</span><span style="color:#24292E">,</span><span style="color:#005CC5">5</span><span style="color:#24292E">,</span><span style="color:#005CC5">6</span><span style="color:#005cc5">]</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> </span><span style="color:#D73A49">*</span><span style="color:#24292E">a, </span><span style="color:#005CC5">String</span><span style="color:#24292E"> =</span><span style="color:#24292E">></span><span style="color:#24292E"> b, </span><span style="color:#D73A49">*</span><span style="color:#24292E">c</span></span>
<span class="line"><span style="color:#6A737D">#  [1, 2, 3, String, 4, 5, 6] does not match to find pattern (NoMatchingPatternError)</span></span></code></pre>
</li>
<li>
<p>还能类似 Elixir 那样 pin 一个值</p>
<pre class="shiki github-light" style="background-color:#fff;color:#24292e" tabindex="0"><code><span class="line"><span style="color:#E36209">b</span><span style="color:#D73A49"> =</span><span style="color:#005CC5"> 3</span></span>

<span class="line"><span style="color:#6F42C1">    setTimeout</span><span style="color:#5a32a3">(</span><span style="color:#24292E">resolve, time</span><span style="color:#5a32a3">)</span><span style="color:#24292E">;</span></span>

<span class="line"><span style="color:#D73A49">const</span><span style="color:#005CC5"> scheduler</span><span style="color:#D73A49"> =</span><span style="color:#D73A49"> new</span><span style="color:#6F42C1"> Scheduler</span><span style="color:#005cc5">(</span><span style="color:#005CC5">MAX_LENGTH</span><span style="color:#005cc5">)</span><span style="color:#24292E">;</span></span>
